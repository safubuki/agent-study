<text x="46" y="629" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">指示ファイルが重なるほど、AI が一度に読む約束が増え、矛盾も起きやすくなる（04 章）。どの範囲で何が効くかは which-rules.js で確かめる。</text>
