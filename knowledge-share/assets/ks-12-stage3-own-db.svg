<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-label="段階3：アプリの送り先を社内のAPIに変え、記録をDBに保存する構成と流れ。GitHubはアプリのコードとスキルだけを置く">
  <defs>
    <marker id="ks12Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ks12Amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="ks12Gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="680" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, Yu Gothic UI, sans-serif">段階 3：記録の受け口を DB に置き換える（社内 API ＋ DB）</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#475569" font-family="BIZ UDPGothic, Yu Gothic UI, sans-serif">アプリの送り先を社内の API に変える。GitHub は、アプリのコードとスキルだけを置く場所になる</text>

  <!-- ===== 左：利用者の PC ===== -->
  <rect x="24" y="80" width="256" height="370" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="152" y="103" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e3a8a" font-family="BIZ UDPGothic, sans-serif">💻 利用者の PC（各自）</text>

  <rect x="40" y="118" width="224" height="62" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  <text x="52" y="138" font-size="10.5" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">① アプリ（my-cad-ai-app）を取得</text>
  <text x="52" y="156" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">clone（2 回目からは git pull）</text>
  <text x="52" y="172" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">→ 環境を作って動かせる状態に</text>
  <line x1="152" y1="180" x2="152" y2="194" stroke="#64748b" stroke-width="2" marker-end="url(#ks12Gray)"/>
  <rect x="40" y="196" width="224" height="52" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  <text x="52" y="216" font-size="10.5" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">② アプリを実行</text>
  <text x="52" y="236" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">AI が CAD を操作し、手順ごとに記録</text>
  <line x1="152" y1="248" x2="152" y2="262" stroke="#64748b" stroke-width="2" marker-end="url(#ks12Gray)"/>
  <rect x="40" y="264" width="224" height="96" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  <text x="52" y="284" font-size="10.5" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">③ 出力（手元にできる）</text>
  <text x="52" y="302" font-size="9.5" fill="#334155" font-family="Consolas, monospace">runs-local/20261128-…/</text>
  <text x="52" y="318" font-size="9.5" fill="#334155" font-family="Consolas, BIZ UDPGothic, monospace">├ run.json（要約）</text>
  <text x="52" y="334" font-size="9.5" fill="#334155" font-family="Consolas, BIZ UDPGothic, monospace">└ steps.jsonl（途中ログ）</text>
  <text x="52" y="351" font-size="9.5" font-weight="700" fill="#b45309" font-family="BIZ UDPGothic, sans-serif">bracket.step → Box・社内 NAS へ</text>
  <line x1="152" y1="360" x2="152" y2="376" stroke="#64748b" stroke-width="2" marker-end="url(#ks12Gray)"/>
  <rect x="40" y="378" width="224" height="58" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="208" y="384" width="48" height="18" rx="9" fill="#f59e0b"/>
  <text x="232" y="397" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">変更</text>
  <text x="52" y="400" font-size="10.5" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">📤 ④ 共有ボタン</text>
  <text x="52" y="420" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">伏せ字 → 社内の API に送る</text>

  <!-- ===== 中央：保存先 ===== -->
  <rect x="344" y="80" width="272" height="372" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="480" y="102" text-anchor="middle" font-size="12.5" font-weight="800" fill="#334155" font-family="BIZ UDPGothic, sans-serif">保存先（GitHub ＋ 社内サーバー）</text>

  <rect x="356" y="114" width="248" height="122" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="356" y="114" width="248" height="28" rx="10" fill="#1d4ed8"/>
  <rect x="356" y="130" width="248" height="12" fill="#1d4ed8"/>
  <text x="480" y="133" text-anchor="middle" font-size="11.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">📦 GitHub：① アプリ用リポ</text>
  <text x="368" y="160" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">my-cad-ai-app（コード・スキル）</text>
  <text x="368" y="177" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">PR レビューは今までどおり</text>
  <rect x="366" y="194" width="112" height="28" rx="14" fill="#dcfce7"/>
  <text x="422" y="212" text-anchor="middle" font-size="9.5" font-weight="800" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">開発者：Write</text>
  <rect x="484" y="194" width="110" height="28" rx="14" fill="#dbeafe"/>
  <text x="539" y="212" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1e3a8a" font-family="BIZ UDPGothic, sans-serif">利用者：Read</text>

  <rect x="356" y="250" width="248" height="194" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <rect x="356" y="250" width="248" height="28" rx="10" fill="#d97706"/>
  <rect x="356" y="266" width="248" height="12" fill="#d97706"/>
  <text x="480" y="269" text-anchor="middle" font-size="11.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">🏢 社内サーバー（新しく作る）</text>

  <rect x="368" y="288" width="224" height="66" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="380" y="307" font-size="10.5" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">🗄️ DB（PostgreSQL など）</text>
  <text x="380" y="325" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">runs 表（1 実行 1 行）・steps 表</text>
  <text x="380" y="342" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">元の JSON もまるごと保存（jsonb）</text>

  <line x1="480" y1="374" x2="480" y2="358" stroke="#b45309" stroke-width="2" marker-end="url(#ks12Amber)"/>

  <rect x="368" y="374" width="224" height="62" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="380" y="393" font-size="10.5" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">🔌 API（記録の受け口）</text>
  <text x="380" y="411" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">社内アカウントで認証・中身を確認</text>
  <text x="380" y="427" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">「送るだけ」の権限にできる</text>

  <!-- ===== 右：分析する人 ===== -->
  <rect x="680" y="80" width="256" height="370" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="808" y="103" text-anchor="middle" font-size="12.5" font-weight="800" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">🔍 分析する人（開発者）の PC</text>

  <rect x="696" y="118" width="224" height="82" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="708" y="138" font-size="10.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">⑥ スキルを直す</text>
  <text x="708" y="156" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">Gotchas に 1 項目足す／scripts 化</text>
  <text x="708" y="172" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">→ ① に PR → レビュー → マージ</text>
  <text x="708" y="190" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">（skill の版が上がる）</text>
  <line x1="808" y1="218" x2="808" y2="202" stroke="#64748b" stroke-width="2" marker-end="url(#ks12Gray)"/>

  <rect x="696" y="218" width="224" height="62" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="708" y="238" font-size="10.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">集計 → AI に改善案</text>
  <text x="708" y="256" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">「どこで・何回・なぜ」を SQL で</text>
  <text x="708" y="272" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">上位の失敗は steps を読む</text>
  <line x1="808" y1="298" x2="808" y2="282" stroke="#64748b" stroke-width="2" marker-end="url(#ks12Gray)"/>

  <rect x="696" y="298" width="224" height="68" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="864" y="304" width="48" height="18" rx="9" fill="#f59e0b"/>
  <text x="888" y="317" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">変更</text>
  <text x="708" y="318" font-size="10.5" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">⑤ DB を直接見る</text>
  <text x="708" y="338" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">SQL・ダッシュボードで見る</text>
  <text x="708" y="355" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">（clone は要らない）</text>

  <rect x="696" y="380" width="224" height="58" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="808" y="403" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">※ 送る人は「書くだけ」</text>
  <text x="808" y="421" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">分析する人だけが「読む」</text>

  <!-- ===== 列をまたぐ矢印 ===== -->
  <line x1="354" y1="150" x2="268" y2="150" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ks12Blue)"/>
  <text x="310" y="142" text-anchor="middle" font-size="10" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">① clone</text>
  <text x="310" y="168" text-anchor="middle" font-size="10" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">⑦ pull</text>
  <line x1="264" y1="406" x2="364" y2="406" stroke="#b45309" stroke-width="2.4" marker-end="url(#ks12Amber)"/>
  <text x="310" y="398" text-anchor="middle" font-size="10" font-weight="800" fill="#b45309" font-family="BIZ UDPGothic, sans-serif">④ 社内の</text>
  <text x="310" y="424" text-anchor="middle" font-size="10" font-weight="800" fill="#b45309" font-family="BIZ UDPGothic, sans-serif">API へ</text>
  <line x1="596" y1="322" x2="692" y2="322" stroke="#b45309" stroke-width="2.4" marker-end="url(#ks12Amber)"/>
  <text x="648" y="314" text-anchor="middle" font-size="10" font-weight="800" fill="#b45309" font-family="BIZ UDPGothic, sans-serif">⑤ SQL</text>
  <line x1="696" y1="160" x2="608" y2="160" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ks12Blue)"/>
  <text x="652" y="152" text-anchor="middle" font-size="10" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">⑥ PR</text>

  <!-- ===== 一連の流れ ===== -->
  <rect x="24" y="464" width="912" height="118" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="486" font-size="11.5" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">🔢 一連の流れ（変わるのは ④ と ⑤）</text>
  <text x="40" y="508" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">① 利用者：① を clone（2 回目からは git pull）</text>
  <text x="40" y="527" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">② アプリを動かす：AI が CAD を操作し、手順ごとに自動で記録</text>
  <text x="40" y="546" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">③ 出力：run.json・steps.jsonl が手元にできる（CAD 実体は Box・NAS へ）</text>
  <text x="40" y="565" font-size="10" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">④ 共有ボタン：伏せ字 → 社内 API に送る（API が DB に書き込む）</text>
  <text x="490" y="508" font-size="10" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">⑤ 分析する人：DB を SQL・ダッシュボードで直接見る</text>
  <text x="490" y="527" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">⑥ AI に改善案を出させ、人が SKILL.md を直して ① に PR</text>
  <text x="490" y="546" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">⑦ 利用者：① を git pull すると、新しいスキルで動く</text>
  <text x="490" y="565" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">→ 過去の runs/ は、スクリプトで DB に一括で取り込める</text>

  <rect x="24" y="594" width="912" height="32" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="615" text-anchor="middle" font-size="11" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">🔄 変わるところ：記録の受け口と置き場が GitHub → 社内 API ＋ DB に。アプリ側は送り先を差し替えるだけ</text>

  <rect x="24" y="636" width="912" height="30" rx="10" fill="#0f172a"/>
  <text x="480" y="655" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">💡 API を挟むので、各 PC に DB のパスワードを置かずに済み、「送るだけで読めない」権限も作れる</text>
</svg>
