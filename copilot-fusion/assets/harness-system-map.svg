<rect x="1" y="1" width="1198" height="840" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">AI モデルが考え、ハーネスが道具の実行につなぐ</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">モデル＝考える AI。ツール＝呼び出せる操作。ハーネス＝会話と実行をつなぐプログラム。</text>
<rect x="28" y="132" width="280" height="124" rx="11" fill="#eff6ff" stroke="#2563eb"/>
