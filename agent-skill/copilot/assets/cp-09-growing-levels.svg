<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">最初から 3 階層を作らない。違いが出てきた所にだけ、パス別の指示・ポリシー・スキルを足す。足すのは「ファイル」で、上の階層は書き換えない。</text>
