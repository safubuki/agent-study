<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">大容量データの混入を止める 4 つの関所</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">お願い（指示）・手元（pre-commit）・PR（必須チェック）・GitHub の上限の順に重ねる。履歴に入ってからでは遅いので、手前ほど大事。</text>
