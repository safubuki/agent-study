<text x="266" y="220" font-size="16.5" font-weight="700" fill="#9a3412" text-anchor="start">ソフトウェアの設計</text>
<text x="266" y="244" font-size="14" font-weight="400" fill="#334155" text-anchor="start">アプリ・業務システムの中身</text>
<rect x="716" y="190" width="456" height="70" rx="10" fill="#fff" stroke="#a5f3fc" stroke-width="1.4"/>
<rect x="716" y="202" width="5" height="46" rx="2.5" fill="#0e7490" stroke="none"/>
<text x="738" y="220" font-size="16.5" font-weight="700" fill="#155e75" text-anchor="start">システム全体の設計</text>
<text x="738" y="244" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ハード・ソフト・人・環境を含む</text>
<rect x="28" y="270" width="200" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="128" y="311" font-size="16.5" font-weight="700" fill="#334155" text-anchor="middle">基本の部品</text>
<rect x="244" y="270" width="456" height="70" rx="10" fill="#fff" stroke="#fed7aa" stroke-width="1.4"/>
<rect x="244" y="282" width="5" height="46" rx="2.5" fill="#c2410c" stroke="none"/>
<text x="266" y="300" font-size="16.5" font-weight="700" fill="#9a3412" text-anchor="start">クラス（属性と操作）</text>
<text x="266" y="324" font-size="14" font-weight="400" fill="#334155" text-anchor="start">プログラムの型にほぼ対応</text>
<rect x="716" y="270" width="456" height="70" rx="10" fill="#fff" stroke="#a5f3fc" stroke-width="1.4"/>
<rect x="716" y="282" width="5" height="46" rx="2.5" fill="#0e7490" stroke="none"/>
<text x="738" y="300" font-size="16.5" font-weight="700" fill="#155e75" text-anchor="start">ブロック</text>
<text x="738" y="324" font-size="14" font-weight="400" fill="#334155" text-anchor="start">部品・装置・人・ソフトを同じ箱で表す</text>
<rect x="28" y="350" width="200" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
