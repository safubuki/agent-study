<title id="title">スキルの立ち位置：常時ルール・スキル・フックの違い</title><desc id="desc">「いつ読まれるか」と「どれだけ確実か」がまったく違う。スキルは “必要なときに呼ばれる手順書” で、強制の仕組みではない。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="726" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">スキルの立ち位置：常時ルール・スキル・フックの違い</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「いつ読まれるか」と「どれだけ確実か」がまったく違う。スキルは “必要なときに呼ばれる手順書” で、強制の仕組みではない。</text>
<rect x="216" y="126" width="312" height="70" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
<text x="372" y="156" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">常時ルール</text>
<text x="372" y="180" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">AGENTS.md・copilot-instructions.md 等</text>
<rect x="538" y="126" width="312" height="70" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="694" y="156" font-size="18" font-weight="700" fill="#5b21b6" text-anchor="middle">スキル</text>
<text x="694" y="180" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">.github/skills/〇〇/SKILL.md など</text>
<rect x="860" y="126" width="312" height="70" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="1016" y="156" font-size="18" font-weight="700" fill="#9f1239" text-anchor="middle">フック・権限</text>
<text x="1016" y="180" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">.github/hooks/*.json・settings.json</text>
<rect x="28" y="212" width="176" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="116" y="260" font-size="15.5" font-weight="700" fill="#334155" text-anchor="middle">いつ読まれる</text>
<rect x="216" y="212" width="312" height="84" rx="10" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="372" y="248" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">毎回の会話の最初から</text>
<text x="372" y="274" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">ずっと文脈に入っている</text>
<rect x="538" y="212" width="312" height="84" rx="10" fill="#fff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="694" y="248" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">説明文が依頼に合ったとき</text>
<text x="694" y="274" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">（または人が /名前 で呼んだとき）</text>
<rect x="860" y="212" width="312" height="84" rx="10" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="1016" y="248" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">決めたイベントで必ず動く</text>
<text x="1016" y="274" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">（編集の前後・終了時など）</text>
<rect x="28" y="308" width="176" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="116" y="356" font-size="15.5" font-weight="700" fill="#334155" text-anchor="middle">文脈のコスト</text>
<rect x="216" y="308" width="312" height="84" rx="10" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="372" y="344" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">全文が毎回かかる</text>
<text x="372" y="370" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">→ 短く保つ（200 行以内目安）</text>
<rect x="538" y="308" width="312" height="84" rx="10" fill="#fff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="694" y="344" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">普段は説明文だけ</text>
<text x="694" y="370" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">→ 本文は使うときだけ</text>
<rect x="860" y="308" width="312" height="84" rx="10" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="1016" y="344" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">ほぼゼロ</text>
<text x="1016" y="370" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">（AI の外で動くため）</text>
<rect x="28" y="404" width="176" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="116" y="452" font-size="15.5" font-weight="700" fill="#334155" text-anchor="middle">確実さ</text>
<rect x="216" y="404" width="312" height="84" rx="10" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="372" y="440" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">よく守られるが保証はない</text>
<text x="372" y="466" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">（長い会話・矛盾で漏れる）</text>
<rect x="538" y="404" width="312" height="84" rx="10" fill="#fff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="694" y="440" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">確率的に発火</text>
<text x="694" y="466" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">（呼ばれないこと・誤発火あり）</text>
<rect x="860" y="404" width="312" height="84" rx="10" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="1016" y="440" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">決定的</text>
<text x="1016" y="466" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">（AI の判断を通らない）</text>
<rect x="28" y="500" width="176" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="116" y="548" font-size="15.5" font-weight="700" fill="#334155" text-anchor="middle">向いている内容</text>
<rect x="216" y="500" width="312" height="84" rx="10" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="372" y="536" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">毎回知るべき事実と約束</text>
<text x="372" y="562" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">ビルド方法・禁止事項の理由</text>
<rect x="538" y="500" width="312" height="84" rx="10" fill="#fff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="694" y="536" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">複数手順の作業・知識の塊</text>
<text x="694" y="562" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">レビュー手順・API の落とし穴</text>
<rect x="860" y="500" width="312" height="84" rx="10" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="1016" y="536" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">破ったら事故になること</text>
<text x="1016" y="562" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">秘密ファイルの編集禁止など</text>
<rect x="28" y="626" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="654" font-size="16" font-weight="400" fill="#475569" text-anchor="start">公式も「常時の指示は強制ではなく文脈」「毎回必ず守らせたいならフック」としている（Claude Code Docs・GitHub の早見表）。</text>
<text x="44" y="681" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スキル自身にフックを持たせることもできる（hooks 欄）。ただしそのフックが有効になるのは、スキルが呼ばれてから。</text>
</svg>
