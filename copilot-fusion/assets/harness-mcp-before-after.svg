<title id="title">同じ MCP サーバーでも、切り替え後に道具が見えないのはなぜ？</title><desc id="desc">入力ダイアログで API キーを渡していた定義の例。サーバーの故障ではなく、定義と認証を届ける経路が変わる。</desc><defs>
