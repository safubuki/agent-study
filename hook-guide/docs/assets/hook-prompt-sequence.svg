<text x="110" y="153" font-size="18" font-weight="700" fill="#475569" text-anchor="middle">ユーザー</text>
<text x="110" y="180" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">チャットで依頼</text>
</g>
<g data-participant="host">
