<title id="title">強制力のはしご：「必ず」の強さで、置く仕組みを変える</title><desc id="desc">上ほど確実。スキルの自動発火は下から 2 段目。「毎回必ず」をスキルの説明文だけに頼るのは、いちばん弱い置き方の 1 つ。</desc><defs>
</defs>
