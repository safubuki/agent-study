<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ah-hook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .h{font-size:13.5px;font-weight:700}
      .b{font-size:11.5px;fill:#374151}
      .s{font-size:11px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="499" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#111827">AI が仕事をする1本の流れ（左→右）と、フックが割り込む4つの瞬間</text>
  <text x="30" y="62" class="s" font-size="13">上段が「普段の AI の作業順序（時系列）」、下段が「その瞬間に裏で自動発火するフック」です</text>

  <!-- Top Band: Straight Left-to-Right Timeline of AI's work -->
  <rect x="30" y="80" width="840" height="106" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="102" font-size="12" font-weight="700" fill="#334155">【上段：AI の作業の流れ（左から右へ順番に進む）】</text>

  <!-- Step 1 -->
  <rect x="44" y="114" width="182" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="137" text-anchor="middle" class="h" fill="#1e293b">STEP 1：指示を送る</text>
  <text x="135" y="157" text-anchor="middle" class="s">あなたがチャットを入力</text>
  <line x1="226" y1="143" x2="250" y2="143" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Step 2 -->
  <rect x="254" y="114" width="182" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="345" y="137" text-anchor="middle" class="h" fill="#1e293b">STEP 2：道具を使う前</text>
  <text x="345" y="157" text-anchor="middle" class="s">AI が保存やコマンドを準備</text>
  <line x1="436" y1="143" x2="460" y2="143" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Step 3 -->
  <rect x="464" y="114" width="182" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="555" y="137" text-anchor="middle" class="h" fill="#1e293b">STEP 3：道具を使った後</text>
  <text x="555" y="157" text-anchor="middle" class="s">ファイルの保存・実行が完了</text>
  <line x1="646" y1="143" x2="670" y2="143" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Step 4 -->
  <rect x="674" y="114" width="182" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="765" y="137" text-anchor="middle" class="h" fill="#1e293b">STEP 4：作業完了・停止</text>
  <text x="765" y="157" text-anchor="middle" class="s">AI が返答を終えて止まる</text>

  <!-- Loop note between Step 2 & Step 3 -->
  <path d="M 555 114 C 555 94, 345 94, 345 114" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="372" y="88" width="156" height="18" rx="9" fill="#f1f5f9"/>
  <text x="450" y="101" text-anchor="middle" font-size="10.5" fill="#475569">作業中は 2⇔3 を繰り返す</text>

  <!-- Vertical Trigger Arrows down to the 4 Hooks -->
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#ah-hook)">
    <line x1="135" y1="172" x2="135" y2="218"/>
    <line x1="345" y1="172" x2="345" y2="218"/>
    <line x1="555" y1="172" x2="555" y2="218"/>
    <line x1="765" y1="172" x2="765" y2="218"/>
  </g>
  <text x="143" y="202" font-size="11" font-weight="700" fill="#2563eb">自動発火</text>
  <text x="353" y="202" font-size="11" font-weight="700" fill="#dc2626">直前に介入</text>
  <text x="563" y="202" font-size="11" font-weight="700" fill="#059669">直後に発火</text>
  <text x="773" y="202" font-size="11" font-weight="700" fill="#2563eb">停止時に発火</text>

  <!-- Hook Card 1: UserPromptSubmit -->
  <rect x="36" y="222" width="198" height="186" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <rect x="46" y="234" width="178" height="28" rx="6" fill="#ede9fe"/>
  <text x="135" y="253" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">① UserPromptSubmit</text>
  <text x="135" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">【指示を送った直後】</text>
  <text x="48" y="304" class="b">・Git ブランチ名や日時を</text>
  <text x="48" y="322" class="b">　自動で添付する</text>
  <text x="48" y="346" class="b">・API キー誤送信を検知して</text>
  <text x="48" y="364" class="b">　送信前にストップする</text>
  <rect x="46" y="376" width="178" height="22" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="135" y="391" text-anchor="middle" class="s" fill="#5b21b6">役割：前提情報の自動添付</text>

  <!-- Hook Card 2: PreToolUse -->
  <rect x="246" y="222" width="198" height="186" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="256" y="234" width="178" height="28" rx="6" fill="#fee2e2"/>
  <text x="345" y="253" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">② PreToolUse ★最重要</text>
  <text x="345" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">【実行する「直前」の関所】</text>
  <text x="256" y="304" class="b">・.env や本番設定の</text>
  <text x="256" y="322" class="b">　書き換えを実行前に阻止</text>
  <text x="256" y="346" class="b">・rm -rf 等の危険操作を</text>
  <text x="256" y="364" class="b">　実行される前に止める</text>
  <rect x="256" y="376" width="178" height="22" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="345" y="391" text-anchor="middle" class="s" fill="#b91c1c">役割：危険操作の確実な阻止</text>

  <!-- Hook Card 3: PostToolUse -->
  <rect x="456" y="222" width="198" height="186" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <rect x="466" y="234" width="178" height="28" rx="6" fill="#d1fae5"/>
  <text x="555" y="253" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">③ PostToolUse ★重要</text>
  <text x="555" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">【実行した「直後」の手入れ】</text>
  <text x="466" y="304" class="b">・保存したファイルに即座に</text>
  <text x="468" y="322" class="b">　Prettier 整形を自動実行</text>
  <text x="468" y="346" class="b">・構文エラーや規約違反を</text>
  <text x="468" y="364" class="b">　その場で AI に知らせる</text>
  <rect x="466" y="376" width="178" height="22" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="555" y="391" text-anchor="middle" class="s" fill="#065f46">役割：自動整形・ログ記録</text>

  <!-- Hook Card 4: Stop & Notification -->
  <rect x="666" y="222" width="198" height="186" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="676" y="234" width="178" height="28" rx="6" fill="#dbeafe"/>
  <text x="765" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">④ Stop / Notification</text>
  <text x="765" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">【完了時・確認待ちの瞬間】</text>
  <text x="676" y="304" class="b">・テストを実行し、不合格なら</text>
  <text x="678" y="322" class="b">　AI に作業をやり直させる</text>
  <text x="678" y="346" class="b">・作業完了や確認待ちを</text>
  <text x="678" y="364" class="b">　音・PC通知・Slack で通知</text>
  <rect x="676" y="376" width="178" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="765" y="391" text-anchor="middle" class="s" fill="#1e40af">役割：完了テスト・完了通知</text>

  <!-- Bottom note bar -->
  <rect x="36" y="424" width="742" height="48" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="52" y="444" font-size="12" font-weight="700" fill="#92400e">その他の補助タイミング：SessionStart（起動時）／ SessionEnd（終了時）／ SubagentStop（部下の完了時）</text>
  <text x="52" y="463" class="s" fill="#78350f">まずは ② PreToolUse（事前阻止）、③ PostToolUse（自動整形）、④ Stop / Notification（完了検査・通知）の3つで十分</text>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 414) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
