<title id="title">applyTo を使うのは「あり」か：公式の仕組み。ただし「場所で分けられるルール」専用</title><desc id="desc">部署・係・製品・部品のように「どのフォルダのファイルか」で分けられるなら本命。人・時期・必須の守りは、別の仕組みと組み合わせる。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="856" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">applyTo を使うのは「あり」か：公式の仕組み。ただし「場所で分けられるルール」専用</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">部署・係・製品・部品のように「どのフォルダのファイルか」で分けられるなら本命。人・時期・必須の守りは、別の仕組みと組み合わせる。</text>
<rect x="28" y="128" width="1144" height="64" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="48" y="156" font-size="15.5" font-weight="700" fill="#065f46" text-anchor="start">結論：あり。パス別の指示（.instructions.md の applyTo）は、GitHub が用意している正式な仕組み。</text>
<text x="48" y="178" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Copilot cloud agent・code review・VS Code・CLI などで使われる。ただし向き・不向きと、画面による違いがある。</text>
<rect x="28" y="216" width="470" height="300" rx="12" fill="#fff" stroke="none"/>
<path d="M28 260 V228 Q28 216 40 216 H486 Q498 216 498 228 V260 Z" fill="#ecfdf5" stroke="none"/>
<path d="M28 260 H498" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="216" width="470" height="300" rx="12" fill="none" stroke="#059669" stroke-width="1.6"/>
<text x="46" y="244.5" font-size="15.5" font-weight="700" fill="#065f46" text-anchor="start">向いている：場所で決まるルール</text>
<text x="46" y="288" font-size="13" font-weight="700" fill="#334155" text-anchor="start">フォルダ＝担当領域</text>
<text x="46" y="313" font-size="13" font-weight="400" fill="#334155" text-anchor="start">　departments/qa/**（部署）・…/inspection/**（係）</text>
<text x="46" y="338" font-size="13" font-weight="700" fill="#334155" text-anchor="start">製品・部品のフォルダ</text>
<text x="46" y="363" font-size="13" font-weight="400" fill="#334155" text-anchor="start">　products/industrial/**・parts/power-unit/**</text>
<text x="46" y="388" font-size="13" font-weight="700" fill="#334155" text-anchor="start">成果物の種類</text>
<text x="46" y="413" font-size="13" font-weight="400" fill="#334155" text-anchor="start">　parts/*/electrical/**・**/*.py（言語ごと）</text>
<text x="46" y="442" font-size="13" font-weight="700" fill="#065f46" text-anchor="start">→ 担当外の人の作業に混ざらない</text>
<rect x="522" y="216" width="650" height="300" rx="12" fill="#fff" stroke="none"/>
<path d="M522 260 V228 Q522 216 534 216 H1160 Q1172 216 1172 228 V260 Z" fill="#fff1f2" stroke="none"/>
<path d="M522 260 H1172" fill="none" stroke="#fecdd3" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="522" y="216" width="650" height="300" rx="12" fill="none" stroke="#be123c" stroke-width="1.6"/>
<text x="540" y="244.5" font-size="15.5" font-weight="700" fill="#9f1239" text-anchor="start">向いていない → 代わりの仕組み</text>
<text x="542" y="292" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">人・役割で分けたい</text>
<text x="542" y="312" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">「検査担当として作業する」</text>
<path d="M760 296 L800 296" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M792 300.4 L800 296 L792 291.6 Z" fill="#94a3b8" stroke="none"/>
<rect x="808" y="284" width="92" height="24" rx="6" fill="#0e7490" stroke="none"/>
<text x="854" y="300.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">エージェント</text>
<text x="911.4" y="301" font-size="13" font-weight="400" fill="#334155" text-anchor="start">エージェント（*.agent.md）</text>
<text x="542" y="350" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">案件・時期で分けたい</text>
<text x="542" y="370" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">「ACME 社の案件として」</text>
<path d="M760 354 L800 354" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M792 358.4 L800 354 L792 349.6 Z" fill="#94a3b8" stroke="none"/>
<rect x="808" y="342" width="80" height="24" rx="6" fill="#7c3aed" stroke="none"/>
<text x="848" y="358.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">手動の指示</text>
<text x="899.2" y="359" font-size="13" font-weight="400" fill="#334155" text-anchor="start">手動のスキル（/case-context）</text>
<text x="542" y="408" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">必ず守らせたい</text>
<text x="542" y="428" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">「署名済みは絶対に直さない」</text>
<path d="M760 412 L800 412" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M792 416.4 L800 412 L792 407.6 Z" fill="#94a3b8" stroke="none"/>
<rect x="808" y="400" width="43" height="24" rx="6" fill="#be123c" stroke="none"/>
<text x="829.5" y="416.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">強制</text>
<text x="862.5" y="417" font-size="13" font-weight="400" fill="#334155" text-anchor="start">フック・必須チェック</text>
<text x="542" y="466" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">どの画面でも効かせたい</text>
<text x="542" y="486" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">「社外秘を扱わない」</text>
<path d="M760 470 L800 470" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M792 474.4 L800 470 L792 465.6 Z" fill="#94a3b8" stroke="none"/>
<rect x="808" y="458" width="80" height="24" rx="6" fill="#b45309" stroke="none"/>
<text x="848" y="474.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">常時の指示</text>
<text x="899.2" y="475" font-size="13" font-weight="400" fill="#334155" text-anchor="start">AGENTS.md にも書く</text>
<rect x="28" y="540" width="1144" height="186" rx="12" fill="#fff" stroke="none"/>
<path d="M28 584 V552 Q28 540 40 540 H1160 Q1172 540 1172 552 V584 Z" fill="#f8fafc" stroke="none"/>
<path d="M28 584 H1172" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="540" width="1144" height="186" rx="12" fill="none" stroke="#475569" stroke-width="1.6"/>
<text x="46" y="568.5" font-size="15.5" font-weight="700" fill="#334155" text-anchor="start">使うときの注意 4 つ</text>
<rect x="46" y="590" width="80" height="24" rx="6" fill="#475569" stroke="none"/>
<text x="86" y="606.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">画面による</text>
<text x="137.2" y="607" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">GitHub.com の Chat では使われない（cloud agent と code review は使う）。VS Code の code review も使わない。</text>
<rect x="46" y="620" width="153" height="24" rx="6" fill="#475569" stroke="none"/>
<text x="122.5" y="636.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">順位なしで全部つながる</text>
<text x="210.6" y="637" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">一致した指示ファイルは全部読まれる。上下で矛盾させず、既定値には「下の指定に従う」と書く。</text>
<rect x="46" y="650" width="92" height="24" rx="6" fill="#475569" stroke="none"/>
<text x="92" y="666.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">除外もできる</text>
<text x="149.4" y="667" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">frontmatter の excludeAgent: &quot;code-review&quot; または &quot;cloud-agent&quot; で、その仕組みからだけ外せる。</text>
<rect x="46" y="680" width="116" height="24" rx="6" fill="#475569" stroke="none"/>
<text x="104" y="696.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">効いたか確かめる</text>
<text x="173.9" y="697" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">VS Code は回答の「参照（References）」で、読まれた指示ファイルを確認できる（守ったかどうかは別）。</text>
<rect x="28" y="756" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="784" font-size="16" font-weight="400" fill="#475569" text-anchor="start">サンプルが applyTo を多く使うのは、部署・係・製品・部品がフォルダで分けられる題材だから。人や案件は別の仕組みにしている。</text>
<text x="44" y="811" font-size="16" font-weight="400" fill="#475569" text-anchor="start">出典：GitHub Docs（Adding repository custom instructions ほか）、VS Code Docs（2026-11-19 確認）。</text>
</svg>
