<text x="718" y="430.5" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">に集中する</text>
<text x="48" y="480" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">形式・順序・丸め方がいつも同じ。テストもできる。作る手間は最初の 1 回だけ。</text>
