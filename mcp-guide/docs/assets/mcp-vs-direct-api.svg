<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif" role="img" aria-label="普通のWeb APIをAIに直接使わせる場合と、MCPサーバーを挟む場合の比較：在庫を確かめて注文する作業を例に、使い方の伝え方、呼び出し方、手順、鍵、安全の柵、ほかのAIアプリでの使い回しを比べた図">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:11.5px;fill:#374151}
      .s{font-size:11px;fill:#6b7280}
      .k{font-size:12px;font-weight:700;fill:#334155}
      .m{font-size:11px;fill:#1f2937;font-family:Consolas, 'Courier New', monospace}
      .bx{font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="679" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">普通の API と何が違う？「在庫を確かめて注文する」で比べる</text>
  <text x="30" y="64" class="s" font-size="12.5">MCP は API の代わりではなく、API を AI が使いやすい形に包む層。中では同じ API を呼んでいる</text>

  <!-- 見出し：左 -->
  <rect x="156" y="84" width="356" height="92" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="334" y="106" text-anchor="middle" class="h" fill="#991b1b">MCP なし：AI に Web API を直接使わせる</text>
  <rect x="172" y="120" width="100" height="40" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="222" y="145" text-anchor="middle" class="bx" fill="#1e3a8a">🤖 AI アプリ</text>
  <line x1="272" y1="140" x2="392" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <text x="332" y="132" text-anchor="middle" font-size="9.5" fill="#991b1b">URL・キー・JSON</text>
  <rect x="396" y="120" width="100" height="40" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="446" y="145" text-anchor="middle" class="bx" fill="#9a3412">🏪 注文アプリ</text>

  <!-- 見出し：右 -->
  <rect x="520" y="84" width="356" height="92" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="698" y="106" text-anchor="middle" class="h" fill="#065f46">MCP あり：MCP サーバーを挟む</text>
  <rect x="530" y="120" width="92" height="40" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="576" y="145" text-anchor="middle" class="bx" fill="#1e3a8a">🤖 AI アプリ</text>
  <line x1="622" y1="140" x2="650" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="654" y="120" width="96" height="40" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="702" y="145" text-anchor="middle" class="bx" fill="#065f46">🔌 MCP</text>
  <line x1="750" y1="140" x2="772" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="776" y="120" width="92" height="40" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="822" y="145" text-anchor="middle" class="bx" fill="#9a3412">🏪 注文アプリ</text>
  <text x="636" y="170" text-anchor="middle" font-size="9.5" fill="#065f46">道具名と引数</text>
  <text x="761" y="170" text-anchor="middle" font-size="9.5" fill="#065f46">HTTP</text>

  <!-- 比較表 -->
  <rect x="24" y="188" width="126" height="56" rx="8" fill="#f1f5f9"/>
  <text x="87" y="221" text-anchor="middle" class="k">使い方の伝え方</text>
  <rect x="156" y="188" width="356" height="56" rx="8" fill="#fff5f5" stroke="#fecaca"/>
  <text x="168" y="210" class="b">仕様書（URL・引数・JSON の形）を</text>
  <text x="168" y="230" class="b">プロンプトに貼って説明する</text>
  <rect x="520" y="188" width="356" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="532" y="210" class="b">つないだ瞬間、tools/list で道具の名前・説明・</text>
  <text x="532" y="230" class="b">引数の形が届く（説明書が自動で付いてくる）</text>

  <rect x="24" y="252" width="126" height="56" rx="8" fill="#f1f5f9"/>
  <text x="87" y="285" text-anchor="middle" class="k">呼び出し方</text>
  <rect x="156" y="252" width="356" height="56" rx="8" fill="#fff5f5" stroke="#fecaca"/>
  <text x="168" y="274" class="b">AI が URL・ヘッダー・JSON を組み立てる</text>
  <text x="168" y="294" class="b">（パスや引数の名前を間違えやすい）</text>
  <rect x="520" y="252" width="356" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="532" y="274" class="b">道具の名前と引数だけ</text>
  <text x="532" y="294" class="m">place_order { itemId: "SW-003", qty: 2 }</text>

  <rect x="24" y="316" width="126" height="56" rx="8" fill="#f1f5f9"/>
  <text x="87" y="349" text-anchor="middle" class="k">手順</text>
  <rect x="156" y="316" width="356" height="56" rx="8" fill="#fff5f5" stroke="#fecaca"/>
  <text x="168" y="338" class="b">「在庫確認 → 注文」の 2 回を、AI が</text>
  <text x="168" y="358" class="b">正しい順番で呼ぶ必要がある</text>
  <rect x="520" y="316" width="356" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="532" y="338" class="b">サーバーが 1 つの道具にまとめる</text>
  <text x="532" y="358" class="b">（在庫がなければ、注文しない）</text>

  <rect x="24" y="380" width="126" height="56" rx="8" fill="#f1f5f9"/>
  <text x="87" y="413" text-anchor="middle" class="k">鍵（API キー）</text>
  <rect x="156" y="380" width="356" height="56" rx="8" fill="#fff5f5" stroke="#fecaca"/>
  <text x="168" y="402" class="b">AI アプリの設定や会話に、キーを</text>
  <text x="168" y="422" class="b">渡すことになる</text>
  <rect x="520" y="380" width="356" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="532" y="402" class="b">キーは MCP サーバーの中だけ</text>
  <text x="532" y="422" class="b">（AI は URL もキーも知らない）</text>

  <rect x="24" y="444" width="126" height="56" rx="8" fill="#f1f5f9"/>
  <text x="87" y="477" text-anchor="middle" class="k">安全の柵</text>
  <rect x="156" y="444" width="356" height="56" rx="8" fill="#fff5f5" stroke="#fecaca"/>
  <text x="168" y="466" class="b">「999 個」のような頼み間違いも、</text>
  <text x="168" y="486" class="b">そのままアプリに送られうる</text>
  <rect x="520" y="444" width="356" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="532" y="466" class="b">サーバーで範囲を確かめる（1〜10 個）</text>
  <text x="532" y="486" class="b">アプリに届く前に止められる</text>

  <rect x="24" y="508" width="126" height="56" rx="8" fill="#f1f5f9"/>
  <text x="87" y="541" text-anchor="middle" class="k">ほかの AI アプリ</text>
  <rect x="156" y="508" width="356" height="56" rx="8" fill="#fff5f5" stroke="#fecaca"/>
  <text x="168" y="530" class="b">Claude Code・Copilot・自作アプリごとに、</text>
  <text x="168" y="550" class="b">つなぎ方を作り直す</text>
  <rect x="520" y="508" width="356" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="532" y="530" class="b">設定 1 つで、どの AI アプリからも</text>
  <text x="532" y="550" class="b">同じ道具が使える</text>

  <rect x="24" y="576" width="760" height="44" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="40" y="595" class="b" font-weight="700" fill="#92400e">MCP が要らないとき：</text>
  <text x="40" y="612" class="b">自作アプリから 1 つの API を呼ぶだけ → 普通の関数呼び出し ／ gh・git などの CLI がある → CLI ／ 手順の知識 → スキル</text>

  <text x="30" y="642" class="s">出典：本リポジトリの samples/06（注文アプリと MCP サーバー）、Anthropic（2024）をもとに筆者作成</text>
  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 614) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
