<text x="1063" y="214" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">GitHub の上限</text>
<text x="1063" y="238" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">100 MiB で拒否</text>
<text x="1063" y="262" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">（ここでは遅い）</text>
<rect x="28" y="322" width="1144" height="150" rx="12" fill="#fff" stroke="none"/>
<path d="M28 368 V334 Q28 322 40 322 H1160 Q1172 322 1172 334 V368 Z" fill="#eff6ff" stroke="none"/>
<path d="M28 368 H1172" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="322" width="1144" height="150" rx="12" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="46" y="351.5" font-size="17.5" font-weight="700" fill="#1e40af" text-anchor="start">AI のフックで止めないのはなぜか</text>
<text x="46" y="396" font-size="14" font-weight="400" fill="#334155" text-anchor="start">AI がファイルを作る時点では、中身の大きさや形式が分からないことが多い。コミット・PR の時点なら、人が置いたファイルも含めて確実に調べられる。</text>
<text x="46" y="423" font-size="14" font-weight="400" fill="#334155" text-anchor="start">AI 向けには「お願い（①）」とスキルで正しい手順を示し、強制は ③④ に任せる。同じスクリプトを pre-commit と CI の両方で使う。</text>
<text x="46" y="450" font-size="14" font-weight="400" fill="#334155" text-anchor="start">cloud agent の変更も PR を通るので、④ の必須チェックでそろって止まる。</text>
<rect x="28" y="502" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="530" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スクリプトとワークフローの例は shared/external-assets/（check-large-files.js・workflows/check-large-files.yml）。</text>
<text x="44" y="557" font-size="16" font-weight="400" fill="#475569" text-anchor="start">既定の上限は 5 MiB。CAD・動画・画像編集データなどは大きさに関係なく拡張子で止める（--allow で例外を指定できる）。</text>
</svg>
