<text x="946" y="671.5" font-size="17.5" font-weight="700" fill="#3730a3" text-anchor="start">抜け漏れなく</text>
<text x="916" y="716" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">子を全部満たせば</text>
<text x="916" y="739" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">親を満たせるかを</text>
<text x="916" y="762" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">確かめる</text>
<rect x="28" y="832" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="860" font-size="16" font-weight="400" fill="#475569" text-anchor="start">粒度の「正解」は 1 つではないが、兄弟を同じ主語・同じ確認の場・同じ抽象度に揃えると、レビューと試験計画が立てやすい。</text>
<text x="44" y="887" font-size="16" font-weight="400" fill="#475569" text-anchor="start">解決策（DC5V・型番など）は、上の階層では書かない。下の階層の要求か、仕様・設計の側で決める。</text>
