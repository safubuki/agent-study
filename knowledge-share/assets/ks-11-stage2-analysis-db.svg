  <text x="652" y="152" text-anchor="middle" font-size="10" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">⑥ PR</text>

  <!-- ===== 一連の流れ ===== -->
  <rect x="24" y="464" width="912" height="118" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="486" font-size="11.5" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">🔢 一連の流れ（変わるのは ⑤ と ⑥ の集計だけ）</text>
  <text x="40" y="508" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">① 利用者：① を clone（2 回目からは git pull）</text>
  <text x="40" y="527" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">② アプリを動かす：AI が CAD を操作し、手順ごとに自動で記録</text>
  <text x="40" y="546" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">③ 出力：run.json・steps.jsonl が手元にできる（CAD 実体は Box へ）</text>
  <text x="40" y="565" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">④ 共有ボタン：GitHub API で ② の runs/ に直接書き込む</text>
  <text x="490" y="508" font-size="10" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">⑤ 分析する人：② の runs/ を集計用 DB に取り込む</text>
  <text x="490" y="527" font-size="10" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">⑥ SQL・ダッシュボードで「どこで・何回・なぜ」→ ① に PR</text>
  <text x="490" y="546" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">⑦ 利用者：① を git pull すると、新しいスキルで動く</text>
  <text x="490" y="565" font-size="10" fill="#334155" font-family="BIZ UDPGothic, sans-serif">→ 手元の DuckDB なら、サーバーなしで今日から試せる</text>

  <rect x="24" y="594" width="912" height="32" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="615" text-anchor="middle" font-size="11" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">🔄 変わるところ：集計がスクリプト → SQL・ダッシュボードに。利用者のアプリと送り方はそのまま</text>

  <rect x="24" y="636" width="912" height="30" rx="10" fill="#0f172a"/>
  <text x="480" y="655" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">💡 いちばん小さく試せる発展。DB は「写し」なので、壊れても GitHub の記録から作り直せる</text>
