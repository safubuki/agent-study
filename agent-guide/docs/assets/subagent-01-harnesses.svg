<text x="770" y="436" font-size="12.5" font-weight="700" fill="#059669" text-anchor="middle">共通基盤</text>
<rect x="842" y="528" width="310" height="116" rx="11" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
