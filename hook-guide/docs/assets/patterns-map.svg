<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:12.5px;fill:#374151}
      .s{font-size:11.5px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="559" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">どのフックパターンを使うか（早見図）</text>
  <text x="30" y="64" class="s" font-size="13">「プロンプトでお願いしても守られない／毎回手でやるのが面倒」な場所に合わせて選ぶ（筆者の整理）</text>

  <rect x="220" y="84" width="460" height="50" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="450" y="114" text-anchor="middle" class="h" fill="#111827">AI エージェントに仕事を任せるとき、困っていることは？</text>
  <line x1="450" y1="134" x2="450" y2="166" stroke="#6b7280" stroke-width="1.6"/>
  <text x="462" y="156" class="s">タイミング別の5パターン</text>
  <line x1="108" y1="168" x2="792" y2="168" stroke="#6b7280" stroke-width="1.6"/>
  <g stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)">
    <line x1="108" y1="168" x2="108" y2="194"/><line x1="279" y1="168" x2="279" y2="194"/>
    <line x1="450" y1="168" x2="450" y2="194"/><line x1="621" y1="168" x2="621" y2="194"/>
    <line x1="792" y1="168" x2="792" y2="194"/>
  </g>

  <!-- 1 -->
  <rect x="30" y="196" width="156" height="172" rx="10" fill="#fee2e2" fill-opacity="0.55" stroke="#ef4444"/>
  <text x="108" y="222" text-anchor="middle" class="h" fill="#b91c1c">① 関所ガード</text>
  <text x="108" y="250" text-anchor="middle" class="b">危険なコマンドや</text>
  <text x="108" y="270" text-anchor="middle" class="b">触ってはいけない</text>
  <text x="108" y="290" text-anchor="middle" class="b">ファイルを止めたい</text>
  <rect x="48" y="312" width="120" height="22" rx="11" fill="#ffffff" stroke="#ef4444"/>
  <text x="108" y="327" text-anchor="middle" class="s" style="fill:#b91c1c">PreToolUse</text>
  <text x="108" y="354" text-anchor="middle" class="s">実行前に100%阻止</text>

  <!-- 2 -->
  <rect x="201" y="196" width="156" height="172" rx="10" fill="#d1fae5" fill-opacity="0.55" stroke="#10b981"/>
  <text x="279" y="222" text-anchor="middle" class="h" fill="#047857">② 自動整形・検査</text>
  <text x="279" y="250" text-anchor="middle" class="b">ファイルを書き換えた</text>
  <text x="279" y="270" text-anchor="middle" class="b">直後に Prettier や</text>
  <text x="279" y="290" text-anchor="middle" class="b">構文検査を走らせたい</text>
  <rect x="219" y="312" width="120" height="22" rx="11" fill="#ffffff" stroke="#10b981"/>
  <text x="279" y="327" text-anchor="middle" class="s" style="fill:#047857">PostToolUse</text>
  <text x="279" y="354" text-anchor="middle" class="s">トークン消費ゼロで整形</text>

  <!-- 3 -->
  <rect x="372" y="196" width="156" height="172" rx="10" fill="#dbeafe" fill-opacity="0.6" stroke="#3b82f6"/>
  <text x="450" y="222" text-anchor="middle" class="h" fill="#1d4ed8">③ 完了ゲート</text>
  <text x="450" y="250" text-anchor="middle" class="b">テストや条件がまだ</text>
  <text x="450" y="270" text-anchor="middle" class="b">通っていないのに</text>
  <text x="450" y="290" text-anchor="middle" class="b">「完了」と止まる</text>
  <rect x="382" y="312" width="136" height="22" rx="11" fill="#ffffff" stroke="#3b82f6"/>
  <text x="450" y="327" text-anchor="middle" class="s" style="fill:#1d4ed8">Stop（完了検査）</text>
  <text x="450" y="354" text-anchor="middle" class="s">合格まで自動差し戻し</text>

  <!-- 4 -->
  <rect x="543" y="196" width="156" height="172" rx="10" fill="#ede9fe" fill-opacity="0.6" stroke="#8b5cf6"/>
  <text x="621" y="222" text-anchor="middle" class="h" fill="#6d28d9">④ 文脈の自動注入</text>
  <text x="621" y="250" text-anchor="middle" class="b">ブランチ名や規約を</text>
  <text x="621" y="270" text-anchor="middle" class="b">毎回書かずに自動で</text>
  <text x="621" y="290" text-anchor="middle" class="b">添付したい</text>
  <rect x="549" y="312" width="144" height="22" rx="11" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="621" y="327" text-anchor="middle" class="s" style="fill:#6d28d9">UserPromptSubmit</text>
  <text x="621" y="354" text-anchor="middle" class="s">忘れても自動で伝わる</text>

  <!-- 5 -->
  <rect x="714" y="196" width="156" height="172" rx="10" fill="#fef3c7" fill-opacity="0.7" stroke="#f59e0b"/>
  <text x="792" y="222" text-anchor="middle" class="h" fill="#b45309">⑤ 監査ログ・通知</text>
  <text x="792" y="250" text-anchor="middle" class="b">作業履歴を残したい／</text>
  <text x="792" y="270" text-anchor="middle" class="b">確認待ちや完了を</text>
  <text x="792" y="290" text-anchor="middle" class="b">音・通知で知りたい</text>
  <rect x="720" y="312" width="144" height="22" rx="11" fill="#ffffff" stroke="#f59e0b"/>
  <text x="792" y="327" text-anchor="middle" class="s" style="fill:#b45309">Notification 等</text>
  <text x="792" y="354" text-anchor="middle" class="s">目を離しても安心</text>

  <rect x="30" y="392" width="750" height="72" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="48" y="419" class="h" fill="#9a3412">状況によって例外がある／文脈を読んで判断してほしい方針 → フックにせず CLAUDE.md に書く</text>
  <text x="48" y="444" class="b">フックは融通が利かない「機械の関所」です。100%強制する規則だけをフックにし、設計方針はプロンプトに任せます</text>
  <text x="30" y="494" class="s">鮮度：2026年11月時点の Claude Code / GitHub Copilot 公式仕様とベストプラクティスに基づく</text>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 494) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
