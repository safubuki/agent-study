<title id="title">「AI に勝手に育てさせれば良い」は本当か：研究が示すこと</title><desc id="desc">スキルは効く。ただし人が整えたものに限る傾向がある。自動で書き換え続けると、要約に寄って詳細が消えることも報告されている。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="678" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">「AI に勝手に育てさせれば良い」は本当か：研究が示すこと</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スキルは効く。ただし人が整えたものに限る傾向がある。自動で書き換え続けると、要約に寄って詳細が消えることも報告されている。</text>
<rect x="28" y="128" width="560" height="420" rx="12" fill="#fff" stroke="none"/>
<path d="M28 190 V140 Q28 128 40 128 H576 Q588 128 588 140 V190 Z" fill="#ecfeff" stroke="none"/>
<path d="M28 190 H588" fill="none" stroke="#a5f3fc" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="128" width="560" height="420" rx="12" fill="none" stroke="#0e7490" stroke-width="1.6"/>
<text x="46" y="156" font-size="17.5" font-weight="700" fill="#155e75" text-anchor="start">SkillsBench（arXiv 2602.12670, 2026）</text>
<text x="46" y="178" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">84 課題 × 7 構成、約 7,300 回の試行で比較</text>
<rect x="48" y="214" width="520" height="68" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="64" y="240" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">人が整えたスキル</text>
<text x="64" y="266" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">領域で差が大きい（+4.5〜+51.9）</text>
<text x="552" y="256" font-size="16.5" font-weight="700" fill="#065f46" text-anchor="end">平均 +16.2 ポイント</text>
<rect x="48" y="294" width="520" height="68" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.6"/>
<text x="64" y="320" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">AI が自分で書いたスキル</text>
<text x="64" y="346" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">使う力はあっても、書く力は別</text>
<text x="552" y="336" font-size="16.5" font-weight="700" fill="#9f1239" text-anchor="end">平均では効果なし</text>
<rect x="48" y="374" width="520" height="68" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="64" y="400" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">逆効果になった課題</text>
<text x="64" y="426" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">入れれば必ず良くなるわけではない</text>
<text x="552" y="416" font-size="16.5" font-weight="700" fill="#92400e" text-anchor="end">84 課題中 16 課題</text>
<rect x="48" y="454" width="520" height="68" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="64" y="480" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">焦点を絞ったスキル</text>
<text x="64" y="506" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">大全集より、要点だけの小さなスキル</text>
<text x="552" y="496" font-size="16.5" font-weight="700" fill="#5b21b6" text-anchor="end">2〜3 部品が網羅型より良い</text>
<rect x="612" y="128" width="560" height="420" rx="12" fill="#fff" stroke="none"/>
<path d="M612 190 V140 Q612 128 624 128 H1160 Q1172 128 1172 140 V190 Z" fill="#eff6ff" stroke="none"/>
<path d="M612 190 H1172" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="612" y="128" width="560" height="420" rx="12" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="630" y="156" font-size="17.5" font-weight="700" fill="#1e40af" text-anchor="start">ACE（arXiv 2510.04618, 2025）</text>
<text x="630" y="178" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">文脈を「育つ手引き書」として扱う研究</text>
<rect x="636" y="218" width="238" height="150" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.7"/>
<text x="755" y="254" font-size="15.5" font-weight="700" fill="#9f1239" text-anchor="middle">丸ごと書き直す</text>
<text x="755" y="276" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">毎回全文を要約し直す</text>
<text x="755" y="298" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">→ 短さに偏る</text>
<text x="755" y="320" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">→ 細かい知見が消える</text>
<text x="755" y="342" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">（context collapse）</text>
<rect x="910" y="218" width="238" height="150" rx="10" fill="#fff" stroke="#059669" stroke-width="1.7"/>
<text x="1029" y="254" font-size="15.5" font-weight="700" fill="#065f46" text-anchor="middle">項目ごとに差分を足す</text>
<text x="1029" y="276" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">生成 → 振り返り →</text>
<text x="1029" y="298" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">整理役（curator）が</text>
<text x="1029" y="320" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">1 項目ずつ追加・統合</text>
<text x="1029" y="342" font-size="13.5" font-weight="400" fill="#334155" text-anchor="middle">→ 詳細が残る</text>
<path d="M876 293 L908 293" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M896 299.6 L908 293 L896 286.4 Z" fill="#2563eb" stroke="none"/>
<rect x="636" y="390" width="512" height="136" rx="12" fill="#fff" stroke="none"/>
<path d="M636 430 V402 Q636 390 648 390 H1136 Q1148 390 1148 402 V430 Z" fill="#f8fafc" stroke="none"/>
<path d="M636 430 H1148" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="636" y="390" width="512" height="136" rx="12" fill="none" stroke="#475569" stroke-width="1.6"/>
<text x="654" y="416.5" font-size="15.5" font-weight="700" fill="#334155" text-anchor="start">スキル運用への読み替え</text>
<text x="654" y="456" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">落とし穴は 1 項目ずつ追記し、全文の書き直しは避ける</text>
<text x="654" y="481" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">追記は「提案」として出し、評価と人のレビューで採否</text>
<text x="654" y="506" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">古い項目は棚卸しで消す（増え続けると逆効果）</text>
<rect x="28" y="578" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="606" font-size="16" font-weight="400" fill="#475569" text-anchor="start">どちらも査読前を含む研究で、課題・モデルの条件付きの結果。数値は各論文の本文（2026-11-18 確認）による。</text>
<text x="44" y="633" font-size="16" font-weight="400" fill="#475569" text-anchor="start">技能を図書館のように貯める研究の代表例は Voyager（2023）：実行できるコードとして技能を貯め、自己検証してから追加していた。</text>
</svg>
