<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">Local から Copilot へ変わることを、3つの場面で見る</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">主に変わるのは、画面と作業の結び付き、共有する実行管理、設定と道具を取り込む経路。</text>
