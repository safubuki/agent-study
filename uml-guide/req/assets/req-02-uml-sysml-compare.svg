<text x="128" y="231" font-size="16.5" font-weight="700" fill="#334155" text-anchor="middle">得意な対象</text>
<rect x="244" y="190" width="456" height="70" rx="10" fill="#fff" stroke="#fed7aa" stroke-width="1.4"/>
