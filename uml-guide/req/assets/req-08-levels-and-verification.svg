<text x="46" y="714" font-size="17.5" font-weight="700" fill="#92400e" text-anchor="start">検査</text>
<text x="46" y="736" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Inspection</text>
<text x="46" y="776" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">見て・触って確かめる</text>
<text x="46" y="799" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">例）銘板・寸法を見る</text>
