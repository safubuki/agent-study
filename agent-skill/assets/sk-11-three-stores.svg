<text x="521" y="180" font-size="17.5" font-weight="700" fill="#92400e" text-anchor="start">② 利用ログ</text>
<text x="521" y="206" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">JSONL / SQLite / OpenTelemetry</text>
<text x="443" y="264" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">いつ・誰が・どのスキルを</text>
<text x="443" y="292" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">フックで自動記録する</text>
<text x="443" y="320" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">呼ばれないスキルを見つける</text>
<text x="443" y="348" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">（発火不足・不要の発見）</text>
