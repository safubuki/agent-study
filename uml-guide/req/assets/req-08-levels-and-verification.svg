<text x="60" y="600" font-size="15" font-weight="700" fill="#334155" text-anchor="start">↓ 左側：要求を詳しくする</text>
<text x="60" y="624" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">（分解・導出）</text>
<text x="1140" y="600" font-size="15" font-weight="700" fill="#334155" text-anchor="end">右側：作った物を確かめる ↑</text>
<text x="1140" y="624" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="end">（部品 → システム → 受入れ）</text>
<text x="28" y="668" font-size="17" font-weight="700" fill="#92400e" text-anchor="start">確かめ方は 4 種類（IADT）── 要求ごとに、どれで確かめるかを決めておく</text>
