<text x="48" y="1908" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Stop / agentStop は返答終了の節目。成果物の成功判定とは別で、turn_ended は通知用に自分で付ける状態名。</text>
<text x="48" y="1935" font-size="16" font-weight="400" fill="#475569" text-anchor="start">開始やツール実行なども、対応イベントを登録すれば同じ受信口へ送れる。検査と組み合わせる場合は例4を参照。</text>
<text x="48" y="1962" font-size="16" font-weight="400" fill="#475569" text-anchor="start">返答表示は途中から順次進む場合もある。図では、返答を表示する流れとターンの停止を分けて示している。</text>
