<text x="912" y="180" font-size="17.5" font-weight="700" fill="#155e75" text-anchor="start">③ 評価結果</text>
<text x="912" y="206" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">evals/ と iteration-N/</text>
<text x="834" y="264" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">evals.json：試験の依頼</text>
<text x="834" y="292" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">grading.json：合否と根拠</text>
<text x="834" y="320" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">benchmark.json：差分の集計</text>
<text x="834" y="348" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">feedback.json：人の感想</text>
<rect x="826" y="396" width="330" height="92" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.6"/>
<text x="991" y="430" font-size="12.5" font-weight="700" fill="#155e75" text-anchor="middle">答える問い</text>
<text x="991" y="462" font-size="16" font-weight="700" fill="#155e75" text-anchor="middle">直したら本当に良くなったか</text>
