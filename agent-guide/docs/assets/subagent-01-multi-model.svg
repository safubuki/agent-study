<text x="28" y="80" font-size="15.5" font-weight="400" fill="#475569" text-anchor="start">Claude Code は Claude 系列のみ。Copilot は会社で有効な他社モデルを子ごとに指定できる（割り当て例は筆者の設定）。</text>
