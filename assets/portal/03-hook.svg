  <text x="305" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#9f1239" font-family="BIZ UDPGothic, sans-serif">🛑 危険</text>
  <text x="305" y="144" text-anchor="middle" font-size="9.5" fill="#be123c" font-family="BIZ UDPGothic, sans-serif">.env 等を阻止</text>

  <text x="180" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">「お願い」ではなく、自動改札で確実に止める</text>
