<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-label="パターン2 Canvas Artifact Workspace の本格画面イメージ：左のチャット欄で指示し、右に店頭POP成果物を固定表示して版管理・Undo・直接編集">
  <defs>
    <marker id="p2Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="840" height="440" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="26" y="32" font-size="15" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">② Canvas / Artifact Workspace（成果物並列編集型）の画面イメージ</text>
  <rect x="618" y="14" width="198" height="24" rx="12" fill="#059669"/>
  <text x="717" y="30" text-anchor="middle" font-size="9.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">出典：NN/g・Canvas / Artifacts</text>

  <!-- ブラウザウィンドウ -->
  <rect x="24" y="48" width="792" height="334" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="24" y="48" width="792" height="32" rx="14" fill="#e2e8f0"/>
  <rect x="24" y="66" width="792" height="14" fill="#e2e8f0"/>
  <circle cx="44" cy="64" r="5" fill="#ef4444"/>
  <circle cx="60" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="64" r="5" fill="#22c55e"/>
  <rect x="96" y="54" width="380" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="108" y="68" font-size="10.5" fill="#475569" font-family="Cascadia Code, monospace">🔒 https://studio.kame-cafe.jp/canvas/matcha-pop</text>

  <!-- アプリヘッダー -->
  <rect x="25" y="80" width="790" height="40" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="38" y="89" width="24" height="22" rx="6" fill="#15803d"/>
  <text x="50" y="104" text-anchor="middle" font-size="12" font-family="sans-serif">📑</text>
  <text x="70" y="105" font-size="12.5" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">Kame Canvas</text>
  <rect x="166" y="90" width="150" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="241" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#334155" font-family="BIZ UDPGothic, sans-serif">春の宇治抹茶ラテ_店頭POP</text>

  <rect x="526" y="89" width="52" height="22" rx="11" fill="#dcfce7"/>
  <text x="552" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#166534" font-family="BIZ UDPGothic, sans-serif">第 2 版</text>
  <rect x="586" y="88" width="102" height="24" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="637" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">↩ 1つ前に戻す</text>
  <rect x="696" y="88" width="104" height="24" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="748" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857" font-family="BIZ UDPGothic, sans-serif">✏️ 直接編集</text>

