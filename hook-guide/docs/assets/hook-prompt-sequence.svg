<marker id="arrow-app" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="1715" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="47" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">例2：チャット送信時に処理し、その後 AI が返答する</text>
<text x="28" y="80" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ユーザーが送信した直後にフックが動く。通知先アプリを使わず、手元で記録や前提情報の収集を行う例。</text>
<text x="28" y="107" font-size="13" font-weight="400" fill="#475569" text-anchor="start">全シーケンス図で列順と色を固定　上→下が時間　矢印の色＝送り手　実線＝依頼・通知　横破線＝結果・応答</text>
<g data-participant="user">
