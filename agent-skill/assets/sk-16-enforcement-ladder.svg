<text x="28" y="660" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">↑ 上ほど強い（AI の判断を通らない）　　↓ 下ほど柔らかい（AI が状況で判断する・人が呼ぶ）</text>
<rect x="28" y="698" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="726" font-size="16" font-weight="400" fill="#475569" text-anchor="start">4 段目までは「文脈に入れて AI に従ってもらう」仕組み。守られやすいが、長い会話や指示どうしの矛盾で漏れることがある。</text>
<text x="44" y="753" font-size="16" font-weight="400" fill="#475569" text-anchor="start">5 段目にしたら、その理由を 4 段目に 1 行書く（止められたとき AI が理由を理解して別の方法を探せる）。</text>
