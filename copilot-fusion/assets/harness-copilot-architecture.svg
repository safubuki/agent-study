<title id="title">Copilot：実行ランタイムが AI モデルと接続する</title><desc id="desc">Agent Host・Copilot SDK・実行ランタイムは役割が異なり、AI モデルとは最下段の「実行ランタイム」が直接つながる。</desc><defs>
