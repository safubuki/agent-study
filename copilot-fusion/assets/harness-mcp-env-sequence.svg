<text x="454" y="640" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">対象＝Copilot。teamDocs の表示を確認する</text>
<line x1="164" y1="660" x2="744" y2="660" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
