<title id="title">全体マップ：要求図の外にある「要望・仕様・設計・試験」とのつながり</title><desc id="desc">要求と要件は要求図に、仕様は仕様書やアクティビティ図などに、部品はブロック定義図に書き、関係線で要件に結ぶ。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="1006" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">全体マップ：要求図の外にある「要望・仕様・設計・試験」とのつながり</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">要求と要件は要求図に、仕様は仕様書やアクティビティ図などに、部品はブロック定義図に書き、関係線で要件に結ぶ。</text>
<rect x="330" y="120" width="440" height="520" rx="4" fill="#fff" stroke="#475569" stroke-width="1.6"/>
<path d="M330 150 H610 L626 134 V120" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="342" y="141" font-size="13" font-weight="700" fill="#334155" text-anchor="start">req [パッケージ] 自動水やり機の要求図</text>
<rect x="380" y="170" width="340" height="96" rx="10" fill="#fff" stroke="none"/>
<rect x="380" y="170" width="340" height="44" rx="10" fill="#f5f3ff" stroke="none"/>
<path d="M380 214 H720" fill="none" stroke="#ddd6fe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="380" y="170" width="340" height="96" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="392" y="180" width="46" height="24" rx="6" fill="#7c3aed" stroke="none"/>
<text x="415" y="196.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">要求</text>
<text x="446" y="197" font-size="13.5" font-weight="700" fill="#7c3aed" text-anchor="start">REQ-1</text>
<text x="489.8" y="197" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="start">留守中も植物を枯らさない</text>
<text x="394" y="236" font-size="13" font-weight="400" fill="#334155" text-anchor="start">本機は、利用者が最大7日間留守にしても、</text>
<text x="394" y="256" font-size="13" font-weight="400" fill="#334155" text-anchor="start">植物を水不足で枯らさないこと</text>
<rect x="380" y="330" width="340" height="96" rx="10" fill="#fff" stroke="none"/>
<rect x="380" y="330" width="340" height="44" rx="10" fill="#eff6ff" stroke="none"/>
<path d="M380 374 H720" fill="none" stroke="#bfdbfe" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="380" y="330" width="340" height="96" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<rect x="392" y="340" width="46" height="24" rx="6" fill="#2563eb" stroke="none"/>
<text x="415" y="356.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="446" y="357" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="start">REQ-1.2</text>
<text x="504.9" y="357" font-size="15" font-weight="700" fill="#1e40af" text-anchor="start">自動で給水する</text>
<text x="394" y="396" font-size="13" font-weight="400" fill="#334155" text-anchor="start">本機は、土の水分量が30%未満になってから</text>
<text x="394" y="416" font-size="13" font-weight="400" fill="#334155" text-anchor="start">10分以内に、鉢への給水を始めること</text>
<rect x="380" y="500" width="340" height="76" rx="10" fill="#fff" stroke="none"/>
<rect x="380" y="500" width="340" height="44" rx="10" fill="#ecfeff" stroke="none"/>
<path d="M380 544 H720" fill="none" stroke="#a5f3fc" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="380" y="500" width="340" height="76" rx="10" fill="none" stroke="#0e7490" stroke-width="1.8"/>
<rect x="392" y="510" width="46" height="24" rx="6" fill="#2563eb" stroke="none"/>
<text x="415" y="526.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="446" y="527" font-size="13.5" font-weight="700" fill="#0e7490" text-anchor="start">PMP-1</text>
<text x="489.8" y="527" font-size="15" font-weight="700" fill="#155e75" text-anchor="start">1回の送水量</text>
<text x="394" y="566" font-size="13" font-weight="400" fill="#334155" text-anchor="start">ポンプは、1回の給水で約50mLを送ること</text>
