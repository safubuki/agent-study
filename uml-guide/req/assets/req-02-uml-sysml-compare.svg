<rect x="244" y="350" width="456" height="70" rx="10" fill="#fff" stroke="#fed7aa" stroke-width="1.4"/>
<rect x="244" y="362" width="5" height="46" rx="2.5" fill="#c2410c" stroke="none"/>
<text x="266" y="380" font-size="16.5" font-weight="700" fill="#9a3412" text-anchor="start">専用の図はない</text>
<text x="266" y="404" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ユースケース図で機能を表すのが一般的</text>
<rect x="716" y="350" width="456" height="70" rx="10" fill="#fff" stroke="#a5f3fc" stroke-width="1.4"/>
<rect x="716" y="362" width="5" height="46" rx="2.5" fill="#0e7490" stroke="none"/>
<text x="738" y="380" font-size="16.5" font-weight="700" fill="#155e75" text-anchor="start">要求図（req）</text>
<text x="738" y="404" font-size="14" font-weight="400" fill="#334155" text-anchor="start">要求と設計・試験を関係線でつなぐ</text>
<rect x="28" y="430" width="200" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="128" y="471" font-size="16.5" font-weight="700" fill="#334155" text-anchor="middle">物理量・式</text>
<rect x="244" y="430" width="456" height="70" rx="10" fill="#fff" stroke="#fed7aa" stroke-width="1.4"/>
<rect x="244" y="442" width="5" height="46" rx="2.5" fill="#c2410c" stroke="none"/>
<text x="266" y="460" font-size="16.5" font-weight="700" fill="#9a3412" text-anchor="start">標準の仕組みはない</text>
<text x="266" y="484" font-size="14" font-weight="400" fill="#334155" text-anchor="start">必要なら型を自分で定義する</text>
<rect x="716" y="430" width="456" height="70" rx="10" fill="#fff" stroke="#a5f3fc" stroke-width="1.4"/>
<rect x="716" y="442" width="5" height="46" rx="2.5" fill="#0e7490" stroke="none"/>
<text x="738" y="460" font-size="16.5" font-weight="700" fill="#155e75" text-anchor="start">単位つきの値・パラメトリック図</text>
<text x="738" y="484" font-size="14" font-weight="400" fill="#334155" text-anchor="start">重さ・電力などの制約式を扱える</text>
