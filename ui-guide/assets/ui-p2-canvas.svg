  <rect x="108" y="317" width="70" height="18" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="143" y="330" text-anchor="middle" font-size="9" font-weight="700" fill="#0f766e" font-family="BIZ UDPGothic, sans-serif">🎉 SNS風に</text>
  <rect x="184" y="317" width="58" height="18" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="213" y="330" text-anchor="middle" font-size="9" font-weight="700" fill="#0f766e" font-family="BIZ UDPGothic, sans-serif">✂️ 短く</text>
  <rect x="248" y="317" width="76" height="18" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="286" y="330" text-anchor="middle" font-size="9" font-weight="700" fill="#0f766e" font-family="BIZ UDPGothic, sans-serif">🍰 割引追記</text>

  <rect x="36" y="342" width="234" height="30" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="361" font-size="10.5" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">AI に修正をチャットで伝える...</text>
  <rect x="276" y="342" width="60" height="30" rx="8" fill="#0f766e"/>
  <text x="306" y="361" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">送信 ▶</text>

  <!-- 右ペイン：Canvas 成果物 -->
  <rect x="347" y="120" width="468" height="261" fill="#f1f5f9"/>
  <text x="372" y="142" font-size="11.5" font-weight="800" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">📄 右：Canvas 成果物エリア（会話が長くなっても最新版が常にここに固定）</text>

  <!-- 矢印：左から右へ反映 -->
  <path d="M 338 228 L 372 228" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#p2Arr)"/>

  <!-- 店頭POPカード本体 -->
  <rect x="380" y="156" width="412" height="206" rx="16" fill="#ffffff" stroke="#4ade80" stroke-width="2.2"/>
  <rect x="400" y="174" width="206" height="22" rx="11" fill="#15803d"/>
  <text x="503" y="189" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">🌸 SEASONAL LIMITED — 春限定</text>
  <text x="400" y="226" font-size="18" font-weight="800" fill="#14532d" font-family="BIZ UDPGothic, sans-serif">京都産一番茶が香る、春の宇治抹茶ラテ</text>
  <text x="400" y="254" font-size="12" fill="#334155" font-family="BIZ UDPGothic, sans-serif">仕事の合間のリフレッシュに。京都産一番茶を丁寧に点てた、</text>
  <text x="400" y="274" font-size="12" fill="#334155" font-family="BIZ UDPGothic, sans-serif">香り高い「春の宇治抹茶ラテ」をご用意いたしました。</text>
  <line x1="400" y1="306" x2="772" y2="306" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="400" y="338" font-size="17" font-weight="800" fill="#15803d" font-family="BIZ UDPGothic, sans-serif">¥580（税込）</text>
  <text x="772" y="338" text-anchor="end" font-size="11.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">☕ Kame Cafe 店長おすすめ</text>

  <!-- 下部ポイント解説帯 -->
  <rect x="24" y="394" width="792" height="34" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="40" y="415" font-size="10" font-weight="700" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">📌 ポイント：左のチャットで初期案→修正を繰り返し、右に最新版を固定。「↩ 戻す」と「✏️ 直接編集」で最後の 5 点を人間が仕上げる。</text>
</svg>
