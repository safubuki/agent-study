<text x="44" y="639" font-size="15" font-weight="400" fill="#475569" text-anchor="start">どのモデルがどの作業に強いかは公式の保証ではないため、上図は品質・速度を比べてみるための筆者による設定例。</text>
<text x="44" y="665" font-size="15" font-weight="400" fill="#475569" text-anchor="start">会社環境では管理者が有効にしたモデルのみ使える（エディタで model: を入力して出る補完候補に合わせて書き換える）。</text>
<text x="44" y="691" font-size="15" font-weight="400" fill="#475569" text-anchor="start">VS Code 版は「表示名 (copilot)」形式、CLI 版は CLI のモデル ID（ローカルモデルは 提供元/ID）を指定する。</text>
