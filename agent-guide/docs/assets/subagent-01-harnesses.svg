<text x="28" y="48" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">GitHub Copilot の実行先とハーネス（どこで動かすか）</text>
<text x="28" y="80" font-size="15.5" font-weight="400" fill="#475569" text-anchor="start">同じ .github/agents/*.agent.md を読み込みつつ、VS Code（旧 Local／推奨 Copilot）と CLI・クラウドで経路が分かれる。</text>
