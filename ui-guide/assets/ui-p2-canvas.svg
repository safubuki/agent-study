  <text x="140" y="257" font-size="10" font-weight="700" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">② もっと上品な敬語に直して！</text>

  <rect x="38" y="274" width="246" height="26" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="48" y="291" font-size="10" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">🤖 右の POP を第 2 版へ更新しました。</text>

