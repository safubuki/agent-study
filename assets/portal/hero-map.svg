<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 218" role="img" aria-label="agent-study 学習マップ全体図：AIの仕組みから安全な運用、UI設計・超高速試作まで8つのテーマをつなぐ">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <marker id="hArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="218" rx="20" fill="url(#heroBg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="380" y="30" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">🗺️ 8つの学びのつながり（どこから読んでも OK！気になるカードをクリック）</text>

  <!-- グループ1：AI を動かす -->
  <rect x="20" y="48" width="224" height="150" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="32" y="56" width="124" height="22" rx="11" fill="#dbeafe"/>
  <text x="94" y="71" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">① AI を賢く動かす</text>

  <rect x="32" y="90" width="200" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="44" y="108" font-size="11" font-weight="700" fill="#1e3a8a" font-family="BIZ UDPGothic, sans-serif">1. サブエージェント</text>
  <text x="44" y="124" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">仕事を専門AIへ分担して速く正確に</text>

  <rect x="32" y="142" width="200" height="44" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="44" y="160" font-size="11" font-weight="700" fill="#312e81" font-family="BIZ UDPGothic, sans-serif">2. Copilot Fusion</text>
  <text x="44" y="176" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">複数モデルが協調・批評して質を上げる</text>

  <path d="M 246 122 L 264 122" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#hArr)"/>

  <!-- グループ2：守り・つなぎ・育てる -->
  <rect x="270" y="48" width="228" height="150" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <rect x="282" y="56" width="154" height="22" rx="11" fill="#d1fae5"/>
  <text x="359" y="71" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857" font-family="BIZ UDPGothic, sans-serif">② 守る・つなぐ・育てる</text>

  <rect x="282" y="88" width="204" height="30" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="292" y="107" font-size="10" font-weight="700" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">3. フック：危険操作を自動ブロック</text>

  <rect x="282" y="124" width="204" height="30" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="292" y="143" font-size="10" font-weight="700" fill="#0c4a6e" font-family="BIZ UDPGothic, sans-serif">4. MCP：本物のDB・計算と接続</text>

  <rect x="282" y="160" width="204" height="30" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="292" y="179" font-size="10" font-weight="700" fill="#5b21b6" font-family="BIZ UDPGothic, sans-serif">6. スキル：ルール階層と道具箱</text>

  <path d="M 500 122 L 518 122" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#hArr)"/>

  <!-- グループ3：人に届ける設計・試作 -->
  <rect x="524" y="48" width="216" height="150" rx="14" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <rect x="536" y="56" width="156" height="22" rx="11" fill="#ffedd5"/>
  <text x="614" y="71" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c" font-family="BIZ UDPGothic, sans-serif">③ 人に伝わる設計・試作</text>

  <rect x="536" y="88" width="192" height="30" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="546" y="107" font-size="10" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">5. UML・要求図：設計図まで整理</text>

  <rect x="536" y="124" width="192" height="30" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="546" y="143" font-size="10" font-weight="700" fill="#115e59" font-family="BIZ UDPGothic, sans-serif">7. AI・UI 設計：7型とUD基礎</text>

  <rect x="536" y="160" width="192" height="30" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="546" y="179" font-size="10" font-weight="700" fill="#9a3412" font-family="BIZ UDPGothic, sans-serif">8. リアルライトモック：高速試作</text>
</svg>
