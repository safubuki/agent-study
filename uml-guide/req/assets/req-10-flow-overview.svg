<text x="312" y="197.5" font-size="17.5" font-weight="700" fill="#1e40af" text-anchor="start">要求図</text>
<text x="282" y="242" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">何を満たすべき？</text>
<text x="282" y="270" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">成果物</text>
<text x="282" y="290" font-size="14" font-weight="400" fill="#334155" text-anchor="start">要求と要件（確かめ</text>
<text x="282" y="311" font-size="14" font-weight="400" fill="#334155" text-anchor="start">られる「〜こと」）</text>
<text x="282" y="342" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">例</text>
<text x="282" y="362" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">REQ-1.2 本機は乾いて</text>
<text x="282" y="383" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">から10分以内に給水</text>
