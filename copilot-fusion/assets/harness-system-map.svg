<text x="168" y="196" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">ユーザーの依頼を受け取り</text>
<text x="168" y="223" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">返答と進み具合を表示する</text>
<rect x="420" y="132" width="360" height="250" rx="11" fill="#ecfdf5" stroke="#059669"/>
<text x="600" y="164" font-size="24" font-weight="700" fill="#059669" text-anchor="middle">ハーネス</text>
<text x="600" y="196" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">AI に渡す情報を用意する</text>
<text x="600" y="223" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">使える道具を AI に知らせる</text>
<text x="600" y="250" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">要求された操作を管理する</text>
<text x="600" y="277" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">操作結果を AI に返す</text>
