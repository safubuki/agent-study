<text x="336" y="218.5" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">«trace»</text>
<rect x="40" y="316" width="250" height="120" rx="10" fill="#fff" stroke="none"/>
<path d="M40 370 V326 Q40 316 50 316 H280 Q290 316 290 326 V370 Z" fill="#fffbeb" stroke="none"/>
<path d="M40 370 H290" fill="none" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="316" width="250" height="120" rx="10" fill="none" stroke="#b45309" stroke-width="1.8"/>
<text x="165" y="336" font-size="12.5" font-weight="400" fill="#b45309" text-anchor="middle">«testCase»</text>
<text x="165" y="358" font-size="16.5" font-weight="700" fill="#92400e" text-anchor="middle">TC-2 給水開始時間の試験</text>
<text x="54" y="394" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">乾いた土で、給水が始まる</text>
<text x="54" y="415" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">までの時間を計る</text>
<path d="M290 362 L380 362" fill="none" stroke="#b45309" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/>
<path d="M368 368.6 L380 362 L368 355.4" fill="none" stroke="#b45309" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="290" y="349.5" width="92" height="25" rx="12.5" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="336" y="366.5" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">«verify»</text>
<text x="40" y="462" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">要望は «trace» で出どころとして、</text>
<text x="40" y="482" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">試験は «verify» で要件に結ぶ</text>
<rect x="820" y="300" width="352" height="150" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<rect x="836" y="314" width="47" height="24" rx="6" fill="#4f46e5" stroke="none"/>
<text x="859.5" y="330.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">仕様</text>
<text x="890" y="331" font-size="15" font-weight="700" fill="#3730a3" text-anchor="start">S-1〜S-5 給水の制御仕様</text>
<text x="836" y="360" font-size="13" font-weight="700" fill="#334155" text-anchor="start">S-1 5分ごとに水分量を測る</text>
<text x="836" y="381" font-size="13" font-weight="700" fill="#334155" text-anchor="start">S-2 30%未満ならポンプを10秒動かす</text>
<text x="836" y="402" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">置き場所：仕様書の表・文章、または</text>
<text x="836" y="423" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">アクティビティ図・ステートマシン図</text>
<path d="M820 374 L720 374" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/>
<path d="M732 367.4 L720 374 L732 380.6" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="724" y="361.5" width="92" height="25" rx="12.5" fill="#fff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="770" y="378.5" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">«refine»</text>
<path d="M820 478 H1158 L1172 492 V564 H820 Z" fill="#fff" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1158 478 V492 H1172" fill="none" stroke="#be123c" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="834" y="502" font-size="13.5" font-weight="700" fill="#9f1239" text-anchor="start">«rationale»（導出の根拠）</text>
<text x="834" y="523" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">S-2 で「10秒 × 約5mL/s ＝ 約50mL」と決めた</text>
<text x="834" y="544" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">→ ポンプが守る条件 PMP-1 として導出</text>
