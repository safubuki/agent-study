<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <rect x="0.5" y="0.5" width="899" height="639" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">エージェント定義ファイルの解剖図</text>
  <text x="30" y="64" font-size="13" fill="#6b7280">1つの .md ファイルの「どこが」「何に使われるか」</text>

  <!-- editor panel -->
  <rect x="30" y="82" width="420" height="380" rx="10" fill="#1e293b"/>
  <rect x="30" y="82" width="420" height="30" rx="10" fill="#334155"/>
  <rect x="30" y="100" width="420" height="12" fill="#334155"/>
  <circle cx="48" cy="97" r="5" fill="#f87171"/><circle cx="64" cy="97" r="5" fill="#fbbf24"/><circle cx="80" cy="97" r="5" fill="#34d399"/>
  <text x="96" y="102" font-size="12.5" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace">.claude/agents/style-builder.md</text>

  <!-- frontmatter band -->
  <rect x="42" y="122" width="396" height="178" rx="6" fill="#3b82f6" fill-opacity="0.16"/>
  <!-- body band -->
  <rect x="42" y="312" width="396" height="138" rx="6" fill="#10b981" fill-opacity="0.16"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e2e8f0">
    <text x="56" y="146" fill="#94a3b8">---</text>
    <text x="56" y="176"><tspan fill="#93c5fd">name</tspan>: style-builder</text>
    <text x="56" y="206"><tspan fill="#93c5fd">description</tspan>: CSS担当の職人…</text>
    <text x="56" y="236"><tspan fill="#93c5fd">tools</tspan>: Read, Write, Edit</text>
    <text x="56" y="266"><tspan fill="#93c5fd">model</tspan>: sonnet</text>
    <text x="56" y="292" fill="#94a3b8">---</text>
    <text x="56" y="340" fill="#a7f3d0">あなたは CSS 担当の職人です。</text>
    <text x="56" y="370" fill="#a7f3d0">1. 最初に work/spec.md を読む</text>
    <text x="56" y="400" fill="#a7f3d0">2. style.css だけを作る</text>
    <text x="56" y="430" fill="#a7f3d0">3. 終わったら短く報告する</text>
  </g>
  <text x="430" y="138" font-size="11" fill="#93c5fd" text-anchor="end">設定（frontmatter）</text>
  <text x="430" y="328" font-size="11" fill="#6ee7b7" text-anchor="end">本文</text>

  <!-- connectors -->
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <path d="M 330 171 L 520 147"/>
    <path d="M 330 201 L 520 205"/>
    <path d="M 330 231 L 520 263"/>
    <path d="M 330 261 L 520 321"/>
    <path d="M 438 381 L 520 395"/>
  </g>
  <g fill="#9ca3af"><circle cx="520" cy="147" r="3"/><circle cx="520" cy="205" r="3"/><circle cx="520" cy="263" r="3"/><circle cx="520" cy="321" r="3"/><circle cx="520" cy="395" r="3"/></g>

  <!-- cards -->
  <g>
    <rect x="524" y="122" width="346" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="538" y="143" font-size="15" font-weight="700" fill="#1e3a8a">name ─ 呼び出すときの名前</text>
    <text x="538" y="162" font-size="12.5" fill="#374151">親はこの名前を指定して子を呼ぶ</text>

    <rect x="524" y="180" width="346" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="538" y="201" font-size="15" font-weight="700" fill="#1e3a8a">description ─ 親の判断材料</text>
    <text x="538" y="220" font-size="12.5" fill="#374151">「この仕事は誰に頼むか」を決めるのに使われる</text>

    <rect x="524" y="238" width="346" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="538" y="259" font-size="15" font-weight="700" fill="#1e3a8a">tools ─ 使える道具（強制）</text>
    <text x="538" y="278" font-size="12.5" fill="#374151">ここに書いていない道具は物理的に使えない</text>

    <rect x="524" y="296" width="346" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="538" y="317" font-size="15" font-weight="700" fill="#1e3a8a">model ─ 頭脳になる AI モデル</text>
    <text x="538" y="336" font-size="12.5" fill="#374151">opus / sonnet / haiku / fable / inherit など</text>

    <rect x="524" y="362" width="346" height="66" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="538" y="384" font-size="15" font-weight="700" fill="#065f46">本文 ─ システムプロンプト</text>
    <text x="538" y="403" font-size="12.5" fill="#374151">呼ばれるたびに必ず守る役割・手順・禁止事項</text>
    <text x="538" y="420" font-size="12.5" fill="#374151">（毎回同じ内容が子に渡される）</text>
  </g>

  <!-- runtime band -->
  <text x="30" y="494" font-size="13" font-weight="700" fill="#6b7280">ファイルには書かないが、呼び出しのたびにやり取りされるもの</text>
  <rect x="30" y="506" width="412" height="56" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="44" y="528" font-size="14" font-weight="700" fill="#9a3412">親 → 子：依頼文（prompt）</text>
  <text x="44" y="548" font-size="12.5" fill="#374151">子にとっての最初のメッセージ。呼ぶたびに変わる</text>
  <rect x="458" y="506" width="412" height="56" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="472" y="528" font-size="14" font-weight="700" fill="#9a3412">子 → 親：最後の返答（報告）</text>
  <text x="472" y="548" font-size="12.5" fill="#374151">途中の作業は親に見えず、これだけが返る</text>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 574) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <!-- soft ground shadow -->
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <!-- far legs, tail -->
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- neck -->
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <!-- near legs (chubby) -->
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <!-- shell -->
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <!-- rim -->
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <!-- head: gazing up-left at the figure -->
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <!-- toes -->
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
