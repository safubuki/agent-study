<text x="1090" y="153" font-size="18" font-weight="700" fill="#b45309" text-anchor="middle">通知先アプリ</text>
<text x="1090" y="180" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">状態の受信・表示</text>
</g>
<rect x="24" y="224" width="1152" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="249" font-size="17" font-weight="700" fill="#334155" text-anchor="start">① ユーザーがチャットで依頼する</text>
<rect x="22" y="286" width="176" height="47" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="110" y="314" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">指示を入力する</text>
<rect x="118" y="354" width="180" height="58" rx="4" fill="#fff" stroke="none"/>
<text x="208" y="377" font-size="17" font-weight="500" fill="#475569" text-anchor="middle">チャットで依頼</text>
<text x="208" y="404" font-size="17" font-weight="500" fill="#475569" text-anchor="middle">「この変更を調べて」</text>
<line x1="110" y1="423" x2="306" y2="423" stroke="#475569" stroke-width="2" marker-end="url(#arrow-user)"/>
<rect x="24" y="447" width="1152" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="472" font-size="17" font-weight="700" fill="#334155" text-anchor="start">② AI に渡す前に、送信時フックを呼び出す</text>
<rect x="314" y="508" width="376" height="58" rx="4" fill="#fff" stroke="none"/>
<text x="502" y="531" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">Claude: UserPromptSubmit</text>
<text x="502" y="558" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">Copilot: userPromptSubmitted</text>
<line x1="306" y1="577" x2="698" y2="577" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-host)"/>
<rect x="610" y="601" width="176" height="74" rx="8" fill="#ecfdf5" stroke="#059669"/>
<text x="698" y="629" font-size="16" font-weight="500" fill="#059669" text-anchor="middle">ログを記録する</text>
<text x="698" y="656" font-size="16" font-weight="500" fill="#059669" text-anchor="middle">前提情報を集める</text>
<rect x="24" y="697" width="1152" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="722" font-size="17" font-weight="700" fill="#334155" text-anchor="start">分岐 A：Claude Code の場合</text>
<rect x="314" y="758" width="376" height="58" rx="4" fill="#fff" stroke="none"/>
<text x="502" y="781" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">additionalContext を返す</text>
<text x="502" y="808" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">検査で送信を止めることも可能</text>
<line x1="698" y1="827" x2="306" y2="827" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-hook)"/>
<rect x="314" y="850" width="180" height="58" rx="4" fill="#fff" stroke="none"/>
<text x="404" y="873" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">許可された場合</text>
<text x="404" y="900" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">指示＋追加情報を渡す</text>
<line x1="306" y1="919" x2="502" y2="919" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-host)"/>
<rect x="24" y="943" width="1152" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="968" font-size="17" font-weight="700" fill="#334155" text-anchor="start">分岐 B：Copilot の設定ファイルの command フックの場合</text>
<rect x="314" y="1004" width="376" height="58" rx="4" fill="#fff" stroke="none"/>
<text x="502" y="1027" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">処理を終了する</text>
<text x="502" y="1054" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">返した本文は採用されない</text>
<line x1="698" y1="1073" x2="306" y2="1073" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-hook)"/>
<rect x="314" y="1096" width="180" height="31" rx="4" fill="#fff" stroke="none"/>
<text x="404" y="1119" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">元の指示を渡す</text>
<line x1="306" y1="1138" x2="502" y2="1138" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-host)"/>
<rect x="24" y="1162" width="1152" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="1187" font-size="17" font-weight="700" fill="#334155" text-anchor="start">③ ここからは A・B 共通：AI が処理し、ユーザーに返答する</text>
<rect x="20" y="1214" width="180" height="34" rx="6" fill="#f8fafc" stroke="#475569"/>
<text x="110" y="1238" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">ユーザー</text>
<rect x="216" y="1214" width="180" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="306" y="1238" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">AI アプリ</text>
<rect x="412" y="1214" width="180" height="34" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="502" y="1238" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">AI モデル</text>
<rect x="608" y="1214" width="180" height="34" rx="6" fill="#ecfdf5" stroke="#059669"/>
<text x="698" y="1238" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">フック</text>
<rect x="804" y="1214" width="180" height="34" rx="6" fill="#ecfeff" stroke="#0e7490"/>
<text x="894" y="1238" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">作業・検査ツール</text>
<rect x="1000" y="1214" width="180" height="34" rx="6" fill="#fffbeb" stroke="#b45309"/>
<text x="1090" y="1238" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">通知先アプリ</text>
<rect x="414" y="1272" width="176" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="502" y="1300" font-size="16" font-weight="500" fill="#7c3aed" text-anchor="middle">依頼を解釈する</text>
<text x="502" y="1327" font-size="16" font-weight="500" fill="#7c3aed" text-anchor="middle">必要な内容を考える</text>
<rect x="314" y="1367" width="180" height="31" rx="4" fill="#fff" stroke="none"/>
<text x="404" y="1390" font-size="17" font-weight="500" fill="#7c3aed" text-anchor="middle">返答内容を返す</text>
<line x1="502" y1="1409" x2="306" y2="1409" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-model)"/>
<rect x="118" y="1432" width="180" height="31" rx="4" fill="#fff" stroke="none"/>
<text x="208" y="1455" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">調査結果を表示する</text>
<line x1="306" y1="1474" x2="110" y2="1474" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-host)"/>
<rect x="22" y="1498" width="176" height="74" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="110" y="1526" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">返答を読む</text>
<text x="110" y="1553" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">必要なら次を質問</text>
<rect x="34" y="1600" width="1132" height="99" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="48" y="1627" font-size="16" font-weight="400" fill="#475569" text-anchor="start">A と B は環境別の分岐で、連続して実行される処理ではない。Claude 側で送信を止めた場合は AI には渡さない。</text>
<text x="48" y="1654" font-size="16" font-weight="400" fill="#475569" text-anchor="start">この例では作業・検査ツールと通知先アプリは使わない。全図で同じ列順を保つため、列を残している。</text>
<text x="48" y="1681" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Copilot の sessionStart で開始時の情報を追加できるが、送信のたびに前提を更新する代用にはならない。</text>
</svg>
