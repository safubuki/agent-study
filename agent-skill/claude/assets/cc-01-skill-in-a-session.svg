<text x="44" y="620" font-size="16" font-weight="400" fill="#475569" text-anchor="start">数値は Claude Code 公式ドキュメント「Extend Claude with skills」（2026-11-18 確認）。版で変わるので運用時は最新を確認。</text>
<text x="44" y="647" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「最初は守ったのに途中から守らない」は、多くがこの仕組みで説明できる。必ず守らせたいことはスキルではなくフックに移す。</text>
