<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:12px;fill:#374151}
      .s{font-size:11px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="579" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#111827">MCP とは何か？ — 共通プロトコルと Web API との関係</text>
  <text x="30" y="60" class="s" font-size="12.5">AI アプリと外部ツールをつなぐ「共通の言葉（USB-C 規格）」であり、バラバラな Web API を統一手順で包むアダプター</text>

  <!-- Upper Left: Before MCP -->
  <rect x="26" y="78" width="412" height="214" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="44" y="104" class="h" fill="#9f1239">【MCP 以前】アプリごとに連携がバラバラ（N×M 問題）</text>

  <rect x="44" y="120" width="114" height="36" rx="6" fill="#ffffff" stroke="#fda4af"/>
  <text x="101" y="143" text-anchor="middle" class="b" font-weight="700">Claude</text>
  <rect x="44" y="166" width="114" height="36" rx="6" fill="#ffffff" stroke="#fda4af"/>
  <text x="101" y="189" text-anchor="middle" class="b" font-weight="700">VS Code</text>
  <rect x="44" y="212" width="114" height="36" rx="6" fill="#ffffff" stroke="#fda4af"/>
  <text x="101" y="235" text-anchor="middle" class="b" font-weight="700">Cursor 等</text>

  <rect x="186" y="120" width="116" height="36" rx="6" fill="#ffe4e6" stroke="#fb7185"/>
  <text x="244" y="143" text-anchor="middle" class="s" fill="#9f1239">独自プラグイン A</text>
  <rect x="186" y="166" width="116" height="36" rx="6" fill="#ffe4e6" stroke="#fb7185"/>
  <text x="244" y="189" text-anchor="middle" class="s" fill="#9f1239">独自拡張機能 B</text>
  <rect x="186" y="212" width="116" height="36" rx="6" fill="#ffe4e6" stroke="#fb7185"/>
  <text x="244" y="235" text-anchor="middle" class="s" fill="#9f1239">独自スクリプト C</text>

  <rect x="328" y="120" width="94" height="128" rx="6" fill="#ffffff" stroke="#fda4af"/>
  <text x="375" y="156" text-anchor="middle" class="s" font-weight="700">外部ツール</text>
  <text x="375" y="178" text-anchor="middle" class="s">Notion</text>
  <text x="375" y="196" text-anchor="middle" class="s">Figma</text>
  <text x="375" y="214" text-anchor="middle" class="s">Sentry</text>
  <text x="375" y="232" text-anchor="middle" class="s">社内 DB</text>

  <line x1="158" y1="138" x2="184" y2="138" stroke="#e11d48" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="158" y1="184" x2="184" y2="184" stroke="#e11d48" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="158" y1="230" x2="184" y2="230" stroke="#e11d48" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="302" y1="138" x2="326" y2="158" stroke="#e11d48" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="302" y1="184" x2="326" y2="184" stroke="#e11d48" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="302" y1="230" x2="326" y2="210" stroke="#e11d48" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="44" y="274" class="s" fill="#9f1239">× 同じ社内ツールでも AI アプリごとに別々の開発が必要</text>

  <!-- Upper Right: After MCP -->
  <rect x="458" y="78" width="416" height="214" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="476" y="104" class="h" fill="#065f46">【MCP 以降】共通プロトコル（USB-C）で1つに統一</text>

  <rect x="476" y="120" width="114" height="36" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="533" y="143" text-anchor="middle" class="b" font-weight="700">Claude Code</text>
  <rect x="476" y="166" width="114" height="36" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="533" y="189" text-anchor="middle" class="b" font-weight="700">VS Code</text>
  <rect x="476" y="212" width="114" height="36" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="533" y="235" text-anchor="middle" class="b" font-weight="700">Desktop 等</text>

  <rect x="618" y="132" width="124" height="104" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="680" y="164" text-anchor="middle" class="h" fill="#065f46">MCP サーバー</text>
  <text x="680" y="186" text-anchor="middle" class="s" fill="#047857">共通プロトコルで</text>
  <text x="680" y="204" text-anchor="middle" class="s" fill="#047857">1つだけ作ればOK</text>

  <rect x="766" y="120" width="92" height="128" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="812" y="156" text-anchor="middle" class="s" font-weight="700">外部ツール</text>
  <text x="812" y="178" text-anchor="middle" class="s">Notion</text>
  <text x="812" y="196" text-anchor="middle" class="s">Figma</text>
  <text x="812" y="214" text-anchor="middle" class="s">Sentry</text>
  <text x="812" y="232" text-anchor="middle" class="s">社内 DB</text>

  <line x1="590" y1="138" x2="616" y2="164" stroke="#059669" stroke-width="1.6" marker-end="url(#ah-g)"/>
  <line x1="590" y1="184" x2="616" y2="184" stroke="#059669" stroke-width="1.6" marker-end="url(#ah-g)"/>
  <line x1="590" y1="230" x2="616" y2="204" stroke="#059669" stroke-width="1.6" marker-end="url(#ah-g)"/>
  <line x1="742" y1="184" x2="764" y2="184" stroke="#059669" stroke-width="1.6" marker-end="url(#ah-g)"/>

  <text x="476" y="274" class="s" fill="#065f46">◎ どの AI アプリからでも設定1つでそのまま使い回せる</text>

  <!-- Lower Section: Web API vs MCP Relationship -->
  <rect x="26" y="310" width="848" height="196" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="338" class="h" fill="#1e3a8a">「従来の Web API（REST API 等）」と「MCP」はどう違う？（競合ではなく変換アダプター）</text>

  <rect x="44" y="356" width="210" height="130" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="149" y="382" text-anchor="middle" class="h" fill="#1d4ed8">AI アプリ（Host）</text>
  <text x="149" y="406" text-anchor="middle" class="b">Claude Code / VS Code</text>
  <text x="149" y="432" text-anchor="middle" class="s">相手が誰であっても</text>
  <text x="149" y="450" text-anchor="middle" class="s" font-weight="700" fill="#1e40af">常に同じ3ステップの言葉</text>
  <text x="149" y="468" text-anchor="middle" class="s">で話しかけるだけでよい</text>

  <line x1="254" y1="404" x2="346" y2="404" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
  <text x="300" y="394" text-anchor="middle" class="s" font-weight="700" fill="#1d4ed8">① tools/list</text>
  <line x1="346" y1="438" x2="254" y2="438" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
  <text x="300" y="456" text-anchor="middle" class="s" font-weight="700" fill="#1d4ed8">② tools/call</text>

  <rect x="348" y="356" width="234" height="130" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="465" y="382" text-anchor="middle" class="h" fill="#1e40af">MCP サーバー（変換窓口）</text>
  <text x="465" y="406" text-anchor="middle" class="b">・使える関数名と引数の型を</text>
  <text x="465" y="424" text-anchor="middle" class="b">　AI に自動説明（自己記述）</text>
  <text x="465" y="446" text-anchor="middle" class="b">・裏側で各社 API や DB を呼び</text>
  <text x="465" y="464" text-anchor="middle" class="b">　共通形式で結果を返す</text>

  <line x1="582" y1="392" x2="634" y2="378" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="582" y1="421" x2="634" y2="421" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="582" y1="450" x2="634" y2="464" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="636" y="356" width="220" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="746" y="380" text-anchor="middle" class="s">各社で URL・引数が違う REST API</text>
  <rect x="636" y="402" width="220" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="746" y="426" text-anchor="middle" class="s">社内データベース（SQL）・JSON</text>
  <rect x="636" y="448" width="220" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="746" y="472" text-anchor="middle" class="s">開いたまま操作するブラウザ画面</text>

  <text x="30" y="544" class="s">出典：Anthropic (2024) および MCP 公式仕様をもとに筆者作成</text>

