<title id="title">定型処理をスクリプトに逃がすと、何が減るのか</title><desc id="desc">AI が毎回コードを考えて書くと、その分の出力トークン・時間・揺れが毎回かかる。スクリプトなら中身は読まず、結果だけが文脈に入る。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="626" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">定型処理をスクリプトに逃がすと、何が減るのか</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">AI が毎回コードを考えて書くと、その分の出力トークン・時間・揺れが毎回かかる。スクリプトなら中身は読まず、結果だけが文脈に入る。</text>
<rect x="28" y="128" width="800" height="172" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="48" y="160" font-size="16.5" font-weight="700" fill="#1e40af" text-anchor="start">A：毎回 AI が手順を組み立てる</text>
