<text x="44" y="708" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「足すもの」はどれも新しいファイル。上の階層は書き換えないので既存の部署・顧客に影響しない（変えるのは L1 の表だけ）。</text>
<text x="44" y="735" font-size="16" font-weight="400" fill="#475569" text-anchor="start">CODEOWNERS は 2 階層目から入れる。階層ごとに「ルールを変えてよい人」を決め、ルールセットでレビュー必須にする。</text>
