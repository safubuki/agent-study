<title id="title">AI から Box の実データにどう届くか：4 つの経路</title><desc id="desc">ローカル（VS Code・CLI）なら Box Drive の同期フォルダが一番簡単。GitHub 上の cloud agent からは手元のフォルダは見えない。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="644" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">AI から Box の実データにどう届くか：4 つの経路</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ローカル（VS Code・CLI）なら Box Drive の同期フォルダが一番簡単。GitHub 上の cloud agent からは手元のフォルダは見えない。</text>
<rect x="28" y="128" width="274" height="244" rx="12" fill="#fff" stroke="none"/>
<path d="M28 190 V140 Q28 128 40 128 H290 Q302 128 302 140 V190 Z" fill="#ecfdf5" stroke="none"/>
<path d="M28 190 H302" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="128" width="274" height="244" rx="12" fill="none" stroke="#059669" stroke-width="1.6"/>
<circle cx="58" cy="159" r="13" fill="#059669"/>
<text x="58" y="163.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="76" y="156" font-size="15.5" font-weight="700" fill="#065f46" text-anchor="start">Box Drive ＋ 照合</text>
<text x="76" y="178" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">VS Code・CLI（ローカル）</text>
<text x="46" y="222" font-size="14" font-weight="400" fill="#334155" text-anchor="start">Box を PC のフォルダとして同期</text>
<text x="46" y="249" font-size="14" font-weight="400" fill="#334155" text-anchor="start">assets-check.js が目録と照合し</text>
<text x="46" y="276" font-size="14" font-weight="400" fill="#334155" text-anchor="start">フルパスだけを AI に渡す</text>
<text x="46" y="303" font-size="14" font-weight="400" fill="#334155" text-anchor="start">通信設定もトークンも要らない</text>
<rect x="126" y="331" width="78" height="26" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="165" y="348.7" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">おすすめ</text>
<rect x="318" y="128" width="274" height="244" rx="12" fill="#fff" stroke="none"/>
<path d="M318 190 V140 Q318 128 330 128 H580 Q592 128 592 140 V190 Z" fill="#eff6ff" stroke="none"/>
<path d="M318 190 H592" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="318" y="128" width="274" height="244" rx="12" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="348" cy="159" r="13" fill="#2563eb"/>
<text x="348" y="163.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="366" y="156" font-size="15.5" font-weight="700" fill="#1e40af" text-anchor="start">Box の MCP サーバー</text>
<text x="366" y="178" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">MCP に対応した画面</text>
<text x="336" y="222" font-size="14" font-weight="400" fill="#334155" text-anchor="start">公式のリモートサーバー</text>
<text x="336" y="249" font-size="14" font-weight="400" fill="#334155" text-anchor="start">（mcp.box.com）を接続</text>
<text x="336" y="276" font-size="14" font-weight="400" fill="#334155" text-anchor="start">利用者の権限で検索・取得</text>
<text x="336" y="303" font-size="14" font-weight="400" fill="#334155" text-anchor="start">管理者の有効化が必要</text>
<rect x="396.5" y="331" width="117" height="26" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="455" y="348.7" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">検索が多いなら</text>
<rect x="608" y="128" width="274" height="244" rx="12" fill="#fff" stroke="none"/>
<path d="M608 190 V140 Q608 128 620 128 H870 Q882 128 882 140 V190 Z" fill="#fff7ed" stroke="none"/>
<path d="M608 190 H882" fill="none" stroke="#fed7aa" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="608" y="128" width="274" height="244" rx="12" fill="none" stroke="#c2410c" stroke-width="1.6"/>
<circle cx="638" cy="159" r="13" fill="#c2410c"/>
<text x="638" y="163.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="656" y="156" font-size="15.5" font-weight="700" fill="#9a3412" text-anchor="start">Box CLI</text>
<text x="656" y="178" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">端末を使えるエージェント</text>
<text x="626" y="222" font-size="14" font-weight="400" fill="#334155" text-anchor="start">OAuth でログインし</text>
<text x="626" y="249" font-size="14" font-weight="400" fill="#334155" text-anchor="start">コマンドで取得</text>
<text x="626" y="276" font-size="14" font-weight="400" fill="#334155" text-anchor="start">スクリプトに組み込みやすい</text>
<text x="626" y="303" font-size="14" font-weight="400" fill="#334155" text-anchor="start">認証情報の管理に注意</text>
<rect x="693" y="331" width="104" height="26" rx="13" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="745" y="348.7" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">定型の取得に</text>
<rect x="898" y="128" width="274" height="244" rx="12" fill="#fff" stroke="none"/>
<path d="M898 190 V140 Q898 128 910 128 H1160 Q1172 128 1172 140 V190 Z" fill="#fff1f2" stroke="none"/>
<path d="M898 190 H1172" fill="none" stroke="#fecdd3" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="898" y="128" width="274" height="244" rx="12" fill="none" stroke="#be123c" stroke-width="1.6"/>
<circle cx="928" cy="159" r="13" fill="#be123c"/>
<text x="928" y="163.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="946" y="156" font-size="15.5" font-weight="700" fill="#9f1239" text-anchor="start">cloud agent（GitHub 上）</text>
<text x="946" y="178" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">GitHub の実行環境</text>
<text x="916" y="222" font-size="14" font-weight="400" fill="#334155" text-anchor="start">手元の Box Drive は見えない</text>
<text x="916" y="249" font-size="14" font-weight="400" fill="#334155" text-anchor="start">MCP や API を使うなら</text>
<text x="916" y="276" font-size="14" font-weight="400" fill="#334155" text-anchor="start">通信の許可とシークレットが要る</text>
<text x="916" y="303" font-size="14" font-weight="400" fill="#334155" text-anchor="start">まずは目録だけで判断させる</text>
<rect x="1003" y="331" width="64" height="26" rx="13" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="1035" y="348.7" font-size="13" font-weight="700" fill="#9f1239" text-anchor="middle">慎重に</text>
<rect x="28" y="394" width="1144" height="120" rx="12" fill="#fff" stroke="none"/>
<path d="M28 440 V406 Q28 394 40 394 H1160 Q1172 394 1172 406 V440 Z" fill="#f8fafc" stroke="none"/>
<path d="M28 440 H1172" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="394" width="1144" height="120" rx="12" fill="none" stroke="#475569" stroke-width="1.6"/>
<text x="46" y="423.5" font-size="17.5" font-weight="700" fill="#334155" text-anchor="start">どの経路でも同じ約束（スキル asset-lookup に書く）</text>
<text x="46" y="468" font-size="14" font-weight="400" fill="#334155" text-anchor="start">実体をリポジトリにコピー・コミットしない／目録を AI の判断で書き換えない／見つからない・不一致なら box.url を示して人に頼む</text>
<text x="46" y="494" font-size="14" font-weight="400" fill="#334155" text-anchor="start">CAD のように AI が直接読めない形式は推測しない。寸法の正は図面 PDF などで人に用意してもらう</text>
<rect x="28" y="544" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="572" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Box の MCP サーバーと CLI は Box Developer Docs による（自前ホストの旧版は非推奨）。cloud agent の通信制限は GitHub Docs。</text>
<text x="44" y="599" font-size="16" font-weight="400" fill="#475569" text-anchor="start">どの経路でも、AI が触れられるのはログインした人が見られるファイルだけ。権限は Box 側で管理する。</text>
</svg>
