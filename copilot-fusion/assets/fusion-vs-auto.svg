<text x="42" y="678" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">サブエージェント</text>
<text x="236" y="660" font-size="17" font-weight="400" fill="#475569" text-anchor="start">作業の一部を</text>
<text x="236" y="691" font-size="17" font-weight="400" fill="#475569" text-anchor="start">別の担当へ分担する</text>
