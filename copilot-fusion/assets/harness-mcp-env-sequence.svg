<text x="309" y="399" font-size="21" font-weight="700" fill="#2563eb" text-anchor="middle">② 実行先へキーを用意する</text>
<text x="309" y="428" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">DOCS_API_KEY を起動環境へ注入</text>
<line x1="164" y1="448" x2="454" y2="448" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
