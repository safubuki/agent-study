<text x="602" y="440.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="620" y="442.5" font-size="16" font-weight="700" fill="#1e40af" text-anchor="start">既定値は「下の指定に従う」と書く</text>
<text x="590" y="480" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Copilot は指示を順位なしで結合するので、矛盾させない</text>
