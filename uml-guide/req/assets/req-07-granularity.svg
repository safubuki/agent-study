<text x="366" y="671.5" font-size="17.5" font-weight="700" fill="#3730a3" text-anchor="start">確認の場を揃える</text>
<text x="336" y="716" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">同じ試験段階</text>
<text x="336" y="739" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">（システム試験など）で</text>
<text x="336" y="762" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">合否を判定できる</text>
