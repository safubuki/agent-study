<title id="title">仕様 → クラス図：文の名詞と動詞から、静的な構造を作る</title><desc id="desc">名詞はクラスや属性の候補、動詞は操作の候補、「〜から」「〜へ」は関連の候補。システム全体ならブロック定義図で同じことをする。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="806" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">仕様 → クラス図：文の名詞と動詞から、静的な構造を作る</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">名詞はクラスや属性の候補、動詞は操作の候補、「〜から」「〜へ」は関連の候補。システム全体ならブロック定義図で同じことをする。</text>
