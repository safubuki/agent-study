<text x="44" y="366" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">自分では決めない</text>
<text x="44" y="389" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">（L3 に書いてある）</text>
