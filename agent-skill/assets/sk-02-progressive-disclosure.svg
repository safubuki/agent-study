<title id="title">段階的な読み込み：必要になった分だけ文脈に入る</title><desc id="desc">スキルを 100 個入れても、普段 AI が見ているのは「名前と説明文」だけ。本文や資料は、使うと決めてから読む。</desc><defs>
</defs>
