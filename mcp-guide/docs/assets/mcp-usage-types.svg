<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:12px;fill:#374151}
      .s{font-size:11px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="579" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#111827">MCP サーバーの3つの使い方（ローカル vs クラウド）</text>
  <text x="30" y="62" class="s" font-size="12.5">「自分の PC の中で裏方として動かす」か、「Web 越しに URL でつなぐ」かの違い</text>

  <!-- Column 1: Local Off-the-shelf -->
  <rect x="26" y="82" width="272" height="394" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="42" y="96" width="240" height="30" rx="15" fill="#2563eb"/>
  <text x="162" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">① ローカル既製品（自分のPC）</text>
  <text x="162" y="144" text-anchor="middle" class="b" font-weight="700" fill="#1e3a8a">公開ツールを自分のPCで動かす</text>

  <rect x="42" y="158" width="240" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="162" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">AI アプリ（Claude / VS Code）</text>
  <text x="162" y="196" text-anchor="middle" class="s">使うときだけ裏で自動起動・自動終了</text>

  <line x1="162" y1="204" x2="162" y2="234" stroke="#4b5563" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="172" y="223" class="s">stdio（PC内通信）</text>

  <rect x="42" y="236" width="240" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="162" y="258" text-anchor="middle" class="h" fill="#1e40af">公開 MCP サーバー</text>
  <text x="162" y="278" text-anchor="middle" class="s">npx @playwright/mcp など</text>

  <rect x="42" y="304" width="240" height="156" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="56" y="326" class="b" font-weight="700" fill="#1e3a8a">特徴と設定イメージ</text>
  <text x="56" y="348" class="b">・自分で起動しなくてOK</text>
  <text x="56" y="368" class="b">・AI が裏で勝手に立ち上げる</text>
  <text x="56" y="388" class="b">・設定には起動コマンドを書く</text>
  <text x="56" y="412" class="s">例：ブラウザ操作（Playwright）、</text>
  <text x="56" y="430" class="s">　　ローカルDB（SQLite）など</text>
  <text x="56" y="448" class="s">通信：stdio（標準入出力）</text>

  <!-- Column 2: Local Custom -->
  <rect x="314" y="82" width="272" height="394" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="330" y="96" width="240" height="30" rx="15" fill="#059669"/>
  <text x="450" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">② ローカル自作（自分のPC）</text>
  <text x="450" y="144" text-anchor="middle" class="b" font-weight="700" fill="#065f46">自作スクリプトをPC内で動かす</text>

  <rect x="330" y="158" width="240" height="46" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="450" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">AI アプリ（Claude / VS Code）</text>
  <text x="450" y="196" text-anchor="middle" class="s">使うときだけ裏で自動起動・自動終了</text>

  <line x1="450" y1="204" x2="450" y2="234" stroke="#4b5563" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="460" y="223" class="s">stdio（PC内通信）</text>

  <rect x="330" y="236" width="240" height="54" rx="8" fill="#d1fae5" stroke="#10b981"/>
  <text x="450" y="258" text-anchor="middle" class="h" fill="#065f46">自作の小さなスクリプト</text>
  <text x="450" y="278" text-anchor="middle" class="s">node cafe-catalog-mcp.js</text>

  <rect x="330" y="304" width="240" height="156" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="344" y="326" class="b" font-weight="700" fill="#065f46">特徴と設定イメージ</text>
  <text x="344" y="348" class="b">・60行ほどのJSやPythonで自作</text>
  <text x="344" y="368" class="b">・手元のJSONや社内ルールを</text>
  <text x="344" y="388" class="b">　正確に検索・計算して返す</text>
  <text x="344" y="412" class="s">例：このフォルダの実験サーバー</text>
  <text x="344" y="430" class="s">　　（メニュー検索・原価計算）</text>
  <text x="344" y="448" class="s">通信：stdio（標準入出力）</text>

  <!-- Column 3: Remote / Cloud -->
  <rect x="602" y="82" width="272" height="394" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="618" y="96" width="240" height="30" rx="15" fill="#7c3aed"/>
  <text x="738" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">③ クラウド・Web経由（URL）</text>
  <text x="738" y="144" text-anchor="middle" class="b" font-weight="700" fill="#5b21b6">外部や社内サーバーへWeb接続</text>

  <rect x="618" y="158" width="240" height="46" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="738" y="178" text-anchor="middle" class="h" fill="#6d28d9">AI アプリ（自分のPC）</text>
  <text x="738" y="196" text-anchor="middle" class="s">PCへのソフト導入は不要</text>

  <line x1="738" y1="204" x2="738" y2="234" stroke="#4b5563" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="748" y="223" class="s">HTTPS（Web通信）</text>

  <rect x="618" y="236" width="240" height="54" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="738" y="258" text-anchor="middle" class="h" fill="#5b21b6">クラウド上の MCP サーバー</text>
  <text x="738" y="278" text-anchor="middle" class="s">https://mcp.example.com/mcp</text>

  <rect x="618" y="304" width="240" height="156" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="632" y="326" class="b" font-weight="700" fill="#5b21b6">特徴と設定イメージ</text>
  <text x="632" y="348" class="b">・設定に URL を1行書くだけ</text>
  <text x="632" y="368" class="b">・OAuthログイン等で安全に認証</text>
  <text x="632" y="388" class="b">・社内サーバーに立てれば</text>
  <text x="632" y="408" class="b">　チーム全員にURLで配れる</text>
  <text x="632" y="430" class="s">例：Notion / Sentry / 社内共通DB</text>
  <text x="632" y="448" class="s">通信：Streamable HTTP</text>

  <!-- Bottom Banner -->
  <rect x="26" y="492" width="752" height="58" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="44" y="516" class="h" fill="#9a3412">初心者が安心すべきポイント：①・②（ローカル）は「自分でサーバーを立ち上げっぱなし」にしない！</text>
  <text x="44" y="538" class="b">設定ファイルに書いておけば、AI アプリが質問を受けたときに裏で自動起動し、終われば自動で閉じます。</text>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 514) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
