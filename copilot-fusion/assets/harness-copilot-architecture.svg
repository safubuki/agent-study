<title id="title">Copilot：セッションの持ち主、接続用の部品、実行の中核を分ける</title><desc id="desc">Agent Host・Copilot SDK・実行ランタイムは役割が異なる。Copilot ハーネスの実装を、部品ごとに拡大する。</desc><defs>
