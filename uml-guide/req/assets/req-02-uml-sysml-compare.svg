<text x="420" y="774.7" font-size="13" font-weight="700" fill="#155e75" text-anchor="middle">はい</text>
<rect x="701.5" y="757" width="157" height="26" rx="13" fill="#fff" stroke="#c2410c" stroke-width="1.4"/>
<text x="780" y="774.7" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">いいえ（ソフトだけ）</text>
