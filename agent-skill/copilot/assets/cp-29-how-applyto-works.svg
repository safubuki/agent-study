<title id="title">applyTo の動き方：AI が扱うファイルの場所で、読むマニュアルが決まる</title><desc id="desc">公式の説明は「Copilot が作業しているファイルと一致したら、その指示を使う」。依頼の文面ではなく、扱うファイルの場所で決まる。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="818" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">applyTo の動き方：AI が扱うファイルの場所で、読むマニュアルが決まる</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">公式の説明は「Copilot が作業しているファイルと一致したら、その指示を使う」。依頼の文面ではなく、扱うファイルの場所で決まる。</text>
<rect x="28" y="128" width="562" height="560" rx="12" fill="#fff" stroke="none"/>
<path d="M28 174 V140 Q28 128 40 128 H578 Q590 128 590 140 V174 Z" fill="#ecfdf5" stroke="none"/>
<path d="M28 174 H590" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="128" width="562" height="560" rx="12" fill="none" stroke="#059669" stroke-width="1.6"/>
<text x="46" y="157.5" font-size="15.5" font-weight="700" fill="#065f46" text-anchor="start">A：ファイルを扱う依頼 → 部署の指示が加わる</text>
<rect x="610" y="128" width="562" height="560" rx="12" fill="#fff" stroke="none"/>
<path d="M610 174 V140 Q610 128 622 128 H1160 Q1172 128 1172 140 V174 Z" fill="#fff1f2" stroke="none"/>
<path d="M610 174 H1172" fill="none" stroke="#fecdd3" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="610" y="128" width="562" height="560" rx="12" fill="none" stroke="#be123c" stroke-width="1.6"/>
<text x="628" y="157.5" font-size="15.5" font-weight="700" fill="#9f1239" text-anchor="start">B：ファイルに触れない質問 → 加わらないことがある</text>
<rect x="46" y="194" width="526" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="72" cy="222" r="14" fill="#2563eb"/>
<text x="72" y="226.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="96" y="227" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="start">依頼「lot-002.md に今日の検査結果を追加して」</text>
<text x="96" y="251" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">対象のファイルがはっきりしている</text>
<path d="M72 240 L72 290" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M68.2 283 L72 290 L75.9 283 Z" fill="#94a3b8" stroke="none"/>
<rect x="46" y="292" width="526" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="72" cy="320" r="14" fill="#2563eb"/>
<text x="72" y="324.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="96" y="325" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="start">AI が departments/qa/inspection/lot-002.md を扱う</text>
<text x="96" y="349" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">このパスで、各指示ファイルの applyTo と照合</text>
<path d="M72 338 L72 388" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M68.2 381 L72 388 L75.9 381 Z" fill="#94a3b8" stroke="none"/>
<rect x="46" y="390" width="526" height="84" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="72" cy="418" r="14" fill="#059669"/>
<text x="72" y="422.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="96" y="423" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="start">一致：l2-dept-qa（departments/qa/**）</text>
<text x="96" y="447" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">一致：l3-team-qa-inspection（…/inspection/**）</text>
<text x="96" y="467" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">不一致：l2-dept-sales（departments/sales/**）</text>
<path d="M72 436 L72 486" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M68.2 479 L72 486 L75.9 479 Z" fill="#94a3b8" stroke="none"/>
<rect x="46" y="488" width="526" height="84" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="72" cy="516" r="14" fill="#059669"/>
<text x="72" y="520.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="96" y="521" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="start">L1＋L2 品証＋L3 検査係の指示で作業する</text>
<text x="96" y="545" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">VS Code では回答の「参照（References）」で確認できる</text>
<path d="M72 534 L72 584" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M68.2 577 L72 584 L75.9 577 Z" fill="#94a3b8" stroke="none"/>
<rect x="46" y="586" width="526" height="84" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<circle cx="72" cy="614" r="14" fill="#475569"/>
<text x="72" y="618.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="96" y="619" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">結果：検査係の様式（1 ロット 1 ファイル）で書く</text>
<text x="96" y="643" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">署名済み signed/ はフックが止める（別の仕組み）</text>
<rect x="628" y="194" width="526" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="654" cy="222" r="14" fill="#2563eb"/>
<text x="654" y="226.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="678" y="227" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="start">依頼「品証部の不具合報告の書き方は？」</text>
<text x="678" y="251" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">どのファイルの話か決まっていない</text>
<path d="M654 240 L654 290" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M650.2 283 L654 290 L657.9 283 Z" fill="#94a3b8" stroke="none"/>
<rect x="628" y="292" width="526" height="84" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
<circle cx="654" cy="320" r="14" fill="#be123c"/>
<text x="654" y="324.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="678" y="325" font-size="14.5" font-weight="700" fill="#9f1239" text-anchor="start">AI がどのファイルも扱っていない</text>
<text x="678" y="349" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">照合する「場所」が無い</text>
<path d="M654 338 L654 388" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M650.2 381 L654 388 L657.9 381 Z" fill="#94a3b8" stroke="none"/>
<rect x="628" y="390" width="526" height="84" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
<circle cx="654" cy="418" r="14" fill="#be123c"/>
<text x="654" y="422.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="678" y="423" font-size="14.5" font-weight="700" fill="#9f1239" text-anchor="start">l2-dept-qa の applyTo と一致しない</text>
<text x="678" y="447" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">→ 部署の指示が読まれないことがある</text>
<path d="M654 436 L654 486" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M650.2 479 L654 486 L657.9 479 Z" fill="#94a3b8" stroke="none"/>
<rect x="628" y="488" width="526" height="84" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="654" cy="516" r="14" fill="#059669"/>
<text x="654" y="520.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="678" y="521" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="start">対策 1：AGENTS.md に索引を書いておく</text>
<text x="678" y="545" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">「不具合報告 → qa-defect-report スキル」と道案内</text>
<path d="M654 534 L654 584" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M650.2 577 L654 584 L657.9 577 Z" fill="#94a3b8" stroke="none"/>
<rect x="628" y="586" width="526" height="84" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="654" cy="614" r="14" fill="#059669"/>
<text x="654" y="618.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="678" y="619" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="start">対策 2：対象のファイルを添付して頼む</text>
<text x="678" y="643" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">または部署のエージェント（qa-assistant）を選ぶ</text>
<rect x="28" y="718" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="746" font-size="16" font-weight="400" fill="#475569" text-anchor="start">applyTo のパターンはリポジトリのルートから書く。「departments/qa/**」は departments/qa/ の下の全ファイル（深い階層も）に一致する。</text>
<text x="44" y="773" font-size="16" font-weight="400" fill="#475569" text-anchor="start">出典：GitHub Docs「Adding repository custom instructions」、VS Code Docs「Custom instructions」（2026-11-19 確認）。</text>
</svg>
