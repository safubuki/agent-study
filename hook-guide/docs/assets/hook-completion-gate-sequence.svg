<line x1="306" y1="1105" x2="110" y2="1105" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-host)"/>
<rect x="24" y="1129" width="1152" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="1154" font-size="17" font-weight="700" fill="#334155" text-anchor="start">③ このターンを終える節目で、検査フックを呼び出す</text>
