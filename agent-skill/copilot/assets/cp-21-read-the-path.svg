<text x="44" y="634" font-size="16" font-weight="400" fill="#475569" text-anchor="start">つまり、この 1 枚には自動で 4 つのルールが重なる：L1 全体＋L2 部品（値）＋L2 ドメイン（書き方）＋L3 電源係（手順）。</text>
<text x="44" y="661" font-size="16" font-weight="400" fill="#475569" text-anchor="start">カードの文章は、実際のサンプルのファイルの中身の要約。ファイルを開かなくても、何が書いてあるかが分かるようにしてある。</text>
