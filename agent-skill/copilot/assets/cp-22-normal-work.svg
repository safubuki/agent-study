<text x="74.5" y="286.1" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">L2 部品</text>
<text x="44" y="320" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">part.json を読む</text>
