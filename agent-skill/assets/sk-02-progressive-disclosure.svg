<text x="212" y="526" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">社内 API の呼び方と落とし穴。API を呼ぶコードを書くときに使う</text>
<rect x="28" y="598" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="626" font-size="16" font-weight="400" fill="#475569" text-anchor="start">説明文（description）は「いつ使うか」を AI に伝える唯一の手がかり。曖昧だと呼ばれず、広すぎると関係ない場面で呼ばれる。</text>
<text x="44" y="653" font-size="16" font-weight="400" fill="#475569" text-anchor="start">副作用のある手順は disable-model-invocation: true で「人が /名前 で呼んだときだけ」にできる（Claude Code・VS Code とも対応）。</text>
