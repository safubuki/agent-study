<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868" role="img" aria-labelledby="overview-title overview-desc" font-family="'Noto Sans JP', 'Yu Gothic UI', Meiryo, sans-serif">
  <title id="overview-title">サブエージェント・フック・MCP の役割と使い分け</title>
  <desc id="overview-desc">メインエージェントを支える3つの仕組み。サブエージェントは作業の分担、フックはイベントに応じた自動処理、MCP は外部ツールやデータへの接続に使う。</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .card-title { font-size: 24px; font-weight: 700; }
      .guide { font-size: 14px; fill: #64748b; }
      .lead { font-size: 20px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; fill: #475569; }
      .body { font-size: 17px; fill: #334155; }
      .note { font-size: 15.5px; fill: #475569; }
      .branch { font-size: 16px; fill: #475569; }
      .choice { font-size: 18px; font-weight: 700; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="866" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="36" y="55" font-size="28" font-weight="700" fill="#0f172a">サブエージェント・フック・MCP の役割と使い分け</text>
  <text x="36" y="88" font-size="17" fill="#64748b">AI コーディングエージェント（Claude Code / GitHub Copilot）を拡張する3つの仕組み</text>

  <!-- Main agent -->
  <rect x="360" y="116" width="480" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="600" y="150" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">メインエージェント</text>
  <text x="600" y="178" text-anchor="middle" font-size="16" fill="#475569">あなたと会話し、計画・判断・コード編集を担う</text>

  <!-- Branch labels share the same baseline and stay clear of the cards. -->
  <g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)">
    <path d="M420 200 L216 270"/>
    <path d="M600 200 V270"/>
    <path d="M780 200 L984 270"/>
  </g>
  <rect x="222" y="220" width="180" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="312" y="245" text-anchor="middle" class="branch">作業を分担・委任</text>
  <rect x="505" y="220" width="190" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="245" text-anchor="middle" class="branch">イベントで自動実行</text>
  <rect x="798" y="220" width="180" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="888" y="245" text-anchor="middle" class="branch">共通規格で接続</text>

  <!-- Each card uses the same hierarchy, padding, and explicit line breaks. -->
  <g id="subagents-card" data-card="subagents">
    <rect x="36" y="282" width="360" height="430" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/>
    <rect x="54" y="300" width="324" height="72" rx="9" fill="#ede9fe"/>
    <circle cx="80" cy="327" r="16" fill="#7c3aed"/>
    <text x="80" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
    <text x="108" y="333" class="card-title" fill="#5b21b6">サブエージェント</text>
    <text x="108" y="361" class="guide">agent-guide</text>
    <text x="60" y="406" class="lead" fill="#5b21b6">調査・レビューを分担する</text>
    <text x="60" y="442" class="label">仕組み・動くタイミング</text>
    <text x="60" y="468" class="body">独立した文脈で動く AI に委任。</text>
    <text x="60" y="496" class="body">親の判断やユーザーの指示で起動。</text>
    <rect x="56" y="516" width="320" height="90" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="72" y="539" font-size="15" font-weight="700" fill="#5b21b6">使う場面</text>
    <text x="72" y="566" class="body">・大量の資料やコードを調べる</text>
    <text x="72" y="594" class="body">・別の視点でレビューする</text>
    <line x1="60" y1="624" x2="372" y2="624" stroke="#ddd6fe"/>
    <text x="60" y="642" class="label">注意点</text>
    <text x="60" y="668" class="note">依頼・報告にもトークンを使う。</text>
    <text x="60" y="694" class="note">同じファイルの同時編集は競合に注意。</text>
  </g>

  <g id="hooks-card" data-card="hooks">
    <rect x="420" y="282" width="360" height="430" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/>
    <rect x="438" y="300" width="324" height="72" rx="9" fill="#d1fae5"/>
    <circle cx="464" cy="327" r="16" fill="#059669"/>
    <text x="464" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
    <text x="492" y="333" class="card-title" fill="#065f46">フック</text>
    <text x="492" y="361" class="guide">hook-guide</text>
    <text x="444" y="406" class="lead" fill="#065f46">決まった節目に処理を実行</text>
    <text x="444" y="442" class="label">仕組み・動くタイミング</text>
    <text x="444" y="468" class="body">ツール実行前後などのイベントで、</text>
    <text x="444" y="496" class="body">設定した処理を自動で実行する。</text>
    <rect x="440" y="516" width="320" height="90" rx="9" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="456" y="539" font-size="15" font-weight="700" fill="#065f46">使う場面</text>
    <text x="456" y="566" class="body">・禁止操作を実行前に検査する</text>
    <text x="456" y="594" class="body">・編集後の整形や完了前の検査</text>
    <line x1="444" y1="624" x2="756" y2="624" stroke="#a7f3d0"/>
    <text x="444" y="642" class="label">注意点</text>
    <text x="444" y="668" class="note">検査の範囲と精度は実装次第。</text>
    <text x="444" y="694" class="note">重い処理や繰り返し実行に注意。</text>
  </g>

  <g id="mcp-card" data-card="mcp">
    <rect x="804" y="282" width="360" height="430" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
    <rect x="822" y="300" width="324" height="72" rx="9" fill="#dbeafe"/>
    <circle cx="848" cy="327" r="16" fill="#2563eb"/>
    <text x="848" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
    <text x="876" y="333" class="card-title" fill="#1e40af">MCP</text>
    <text x="876" y="361" class="guide">mcp-guide</text>
    <text x="828" y="406" class="lead" fill="#1e40af">外部ツール・データと接続</text>
    <text x="828" y="442" class="label">仕組み・動くタイミング</text>
    <text x="828" y="468" class="body">共通規格でサーバーと通信し、</text>
    <text x="828" y="496" class="body">ツールやデータを AI に提供する。</text>
    <rect x="824" y="516" width="320" height="90" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="840" y="539" font-size="15" font-weight="700" fill="#1e40af">使う場面</text>
    <text x="840" y="566" class="body">・Figma / Notion の情報を参照</text>
    <text x="840" y="594" class="body">・ブラウザ操作や社内 DB の検索</text>
    <line x1="828" y1="624" x2="1140" y2="624" stroke="#bfdbfe"/>
    <text x="828" y="642" class="label">注意点</text>
    <text x="828" y="668" class="note">接続先の信頼性と権限を確認する。</text>
    <text x="828" y="694" class="note">ツールの説明量にも気を配る。</text>
  </g>

  <!-- Three short choices replace the overflowing single-line summary. -->
  <g id="selection-guide">
    <rect x="36" y="736" width="1128" height="108" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="60" y="765" font-size="18" font-weight="700" fill="#92400e">迷ったときは、目的で選ぶ</text>
    <text x="60" y="794" font-size="16" fill="#475569">作業を分けたい</text>
    <text x="60" y="823" class="choice" fill="#5b21b6">① サブエージェント</text>
    <line x1="396" y1="783" x2="396" y2="827" stroke="#fde68a"/>
    <text x="420" y="794" font-size="16" fill="#475569">節目で自動化したい</text>
    <text x="420" y="823" class="choice" fill="#065f46">② フック</text>
    <line x1="756" y1="783" x2="756" y2="827" stroke="#fde68a"/>
    <text x="780" y="794" font-size="16" fill="#475569">外部とつなぎたい</text>
    <text x="780" y="823" class="choice" fill="#1e40af">③ MCP</text>
  </g>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(1080 778) scale(0.58)" aria-hidden="true">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
