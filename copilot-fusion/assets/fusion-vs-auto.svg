<text x="236" y="411" font-size="17" font-weight="400" fill="#475569" text-anchor="start">1モデル選びを任せる</text>
<text x="572" y="380" font-size="17" font-weight="400" fill="#475569" text-anchor="start">自動で選んだ</text>
<text x="572" y="411" font-size="17" font-weight="400" fill="#475569" text-anchor="start">1モデルが処理</text>
<text x="900" y="380" font-size="17" font-weight="400" fill="#475569" text-anchor="start">複数モデルの批評とは別</text>
