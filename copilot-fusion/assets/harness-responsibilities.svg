<rect x="348" y="612" width="540" height="138" rx="11" fill="#ecfeff" stroke="#0e7490"/>
<text x="618" y="644" font-size="22" font-weight="700" fill="#0e7490" text-anchor="middle">作業ツール＝呼び出せる操作</text>
<text x="618" y="676" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">ファイル読取・編集・コマンド・検索・テスト</text>
<text x="618" y="703" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">MCP 経由の操作も、道具の一種として扱う</text>
<line x1="504" y1="546" x2="504" y2="612" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<line x1="744" y1="612" x2="744" y2="546" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-tool)"/>
<text x="618" y="802" font-size="21" font-weight="700" fill="#059669" text-anchor="middle">次のシーケンス図では、この緑の担当を1本の列として描く</text>
<rect x="28" y="852" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="880" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「生成」と「評価」は AI の役割の違い。必ず別製品・別会社のモデルという意味ではない。</text>
<text x="44" y="907" font-size="16" font-weight="400" fill="#475569" text-anchor="start">内側の4つの枠は担当を説明するための整理で、固定の内部モジュールや物理的な配置を表すものではない。</text>
