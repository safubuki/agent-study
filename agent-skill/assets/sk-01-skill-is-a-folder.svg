<path d="M476 520 V490 Q476 478 488 478 H1160 Q1172 478 1172 490 V520 Z" fill="#fffbeb" stroke="none"/>
<path d="M476 520 H1172" fill="none" stroke="#fde68a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="476" y="478" width="696" height="106" rx="12" fill="none" stroke="#b45309" stroke-width="1.6"/>
<text x="494" y="505.5" font-size="16.5" font-weight="700" fill="#92400e" text-anchor="start">assets/ ─ 出力の型紙・素材</text>
<text x="494" y="544" font-size="14" font-weight="400" fill="#334155" text-anchor="start">テンプレート・雛形・画像・フォントなど。</text>
<text x="494" y="566" font-size="14" font-weight="400" fill="#334155" text-anchor="start">「この形で出力する」を文章で説明する代わりに、実物を渡す。</text>
<path d="M392 425 L446 425 L446 499 L474 499" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M465 504 L474 499 L465 494.1 Z" fill="#b45309" stroke="none"/>
<rect x="28" y="624" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="652" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スキルは「1 つの目的」に絞るほど迷わず使われる。中身は Markdown とファイルだけなので、Git で版管理・レビューできる。</text>
<text x="44" y="679" font-size="16" font-weight="400" fill="#475569" text-anchor="start">同じ形式が Claude Code・GitHub Copilot・Codex などで共通に読める（置き場所のフォルダ名は製品ごとに少し違う）。</text>
</svg>
