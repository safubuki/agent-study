<rect x="680" y="490" width="32" height="22" rx="6" fill="#0f766e" stroke="none"/>
<text x="696" y="505.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L3</text>
<text x="722" y="506" font-size="13" font-weight="400" fill="#334155" text-anchor="start">ポリシー l3-qa-inspection.json（署名済み・Excel）</text>
<rect x="670" y="526" width="484" height="34" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<rect x="680" y="532" width="32" height="22" rx="6" fill="#0f766e" stroke="none"/>
<text x="696" y="547.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L3</text>
<text x="722" y="548" font-size="13" font-weight="400" fill="#334155" text-anchor="start">スキル qa-inspection-record</text>
<rect x="670" y="576" width="484" height="34" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="680" y="582" width="31" height="22" rx="6" fill="#475569" stroke="none"/>
<text x="695.5" y="597.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">—</text>
<text x="722" y="598" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">営業部・海外営業係のルールは使われない</text>
<text x="670" y="668" font-size="13" font-weight="700" fill="#9f1239" text-anchor="start">書き込み：可（signed/ や Excel なら L3 のポリシーで止まる）</text>
<rect x="28" y="718" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="746" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ファイルの一覧とリンクは copilot/samples/03-ai-workspace/README.md。which-rules.js で同じ結果を手元で確かめられる。</text>
<text x="44" y="773" font-size="16" font-weight="400" fill="#475569" text-anchor="start">太枠が編集中のファイルのある範囲。範囲の外（営業部）の指示・ポリシー・スキルは混ざらない。</text>
