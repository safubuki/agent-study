<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ベース（全社・製品で絶対）・部署・個人の層ごとに、「常に知らせる」「必ず止める」「手順を渡す」「配る」の置き場所が決まっている。</text>
