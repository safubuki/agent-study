<title id="title">仕組みは GitHub、大容量の実データは Box：目録でつなぐ</title><desc id="desc">Git は差分・レビュー・履歴が得意だが、大きなバイナリは苦手。実体は Box に置き、「どれが正か」の目録だけを Git で管理する。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="794" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">仕組みは GitHub、大容量の実データは Box：目録でつなぐ</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Git は差分・レビュー・履歴が得意だが、大きなバイナリは苦手。実体は Box に置き、「どれが正か」の目録だけを Git で管理する。</text>
<rect x="28" y="128" width="360" height="380" rx="12" fill="#fff" stroke="none"/>
<path d="M28 174 V140 Q28 128 40 128 H376 Q388 128 388 140 V174 Z" fill="#ecfdf5" stroke="none"/>
<path d="M28 174 H388" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="128" width="360" height="380" rx="12" fill="none" stroke="#059669" stroke-width="1.6"/>
<text x="46" y="157.5" font-size="17.5" font-weight="700" fill="#065f46" text-anchor="start">GitHub（仕組み）</text>
<text x="46" y="204" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">AGENTS.md・指示ファイル</text>
<text x="46" y="234" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">スキル（SKILL.md・scripts/）</text>
<text x="46" y="264" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">フック・CI の設定</text>
<text x="46" y="294" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">ソースコード・設定値</text>
<text x="46" y="324" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="start">assets.manifest.json（目録）</text>
<text x="46" y="360" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">得意：差分・レビュー・履歴・</text>
<text x="46" y="390" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">　　　巻き戻し・PR の関所</text>
<rect x="812" y="128" width="360" height="380" rx="12" fill="#fff" stroke="none"/>
<path d="M812 174 V140 Q812 128 824 128 H1160 Q1172 128 1172 140 V174 Z" fill="#ecfeff" stroke="none"/>
<path d="M812 174 H1172" fill="none" stroke="#a5f3fc" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="812" y="128" width="360" height="380" rx="12" fill="none" stroke="#0e7490" stroke-width="1.6"/>
<text x="830" y="157.5" font-size="17.5" font-weight="700" fill="#155e75" text-anchor="start">Box（実データ）</text>
<text x="830" y="204" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">3D CAD（STEP・SLDPRT など）</text>
<text x="830" y="234" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">基板・製品の写真</text>
<text x="830" y="264" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">組立・試験の動画</text>
<text x="830" y="294" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">寸法の正となる図面 PDF</text>
<text x="830" y="324" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">大きな測定データ</text>
<text x="830" y="360" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">得意：大容量・権限管理・</text>
<text x="830" y="390" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">　　　版の履歴・社外共有</text>
<rect x="412" y="168" width="376" height="300" rx="12" fill="#fff" stroke="none"/>
<path d="M412 214 V180 Q412 168 424 168 H776 Q788 168 788 180 V214 Z" fill="#fffbeb" stroke="none"/>
<path d="M412 214 H788" fill="none" stroke="#fde68a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="412" y="168" width="376" height="300" rx="12" fill="none" stroke="#b45309" stroke-width="1.6"/>
<text x="430" y="197.5" font-size="17.5" font-weight="700" fill="#92400e" text-anchor="start">目録の 1 件（例）</text>
<text x="430" y="244" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">id: cad-motor-housing</text>
<text x="430" y="270" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">path: product-x/cad/motor-housing.step</text>
<text x="430" y="296" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">bytes / sha256: 版の確認用</text>
<text x="430" y="322" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">box.url: Box 上の場所</text>
<text x="430" y="348" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">owner: 機構設計課</text>
<text x="430" y="380" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">AI は目録で「どれが正か」を知り、</text>
<text x="430" y="406" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">実体は必要なときだけ見に行く</text>
<path d="M390 318 L410 318" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M398 324.6 L410 318 L398 311.4 Z" fill="#b45309" stroke="none"/>
<path d="M790 318 L810 318" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M798 324.6 L810 318 L798 311.4 Z" fill="#b45309" stroke="none"/>
<rect x="28" y="532" width="1144" height="132" rx="12" fill="#fff" stroke="none"/>
<path d="M28 578 V544 Q28 532 40 532 H1160 Q1172 532 1172 544 V578 Z" fill="#fff1f2" stroke="none"/>
<path d="M28 578 H1172" fill="none" stroke="#fecdd3" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="532" width="1144" height="132" rx="12" fill="none" stroke="#be123c" stroke-width="1.6"/>
<text x="46" y="561.5" font-size="17.5" font-weight="700" fill="#9f1239" text-anchor="start">GitHub の上限（公式）と、なぜ手前で止めるか</text>
<text x="46" y="606" font-size="14" font-weight="400" fill="#334155" text-anchor="start">1 ファイル 50 MiB で警告・100 MiB で拒否、リポジトリは 1 GB 未満が理想（5 GB 未満を強く推奨）、ブラウザからの追加は 25 MiB まで。</text>
<text x="46" y="632" font-size="14" font-weight="400" fill="#334155" text-anchor="start">一度コミットした大きなファイルは履歴に残り、消すには履歴の書き換えが要る → 入る前に止める（lf-03）。Git LFS という方法もあるが、容量課金と運用が増える。</text>
<rect x="28" y="694" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="722" font-size="16" font-weight="400" fill="#475569" text-anchor="start">上限値は GitHub Docs「About large files on GitHub」（2026-11-18 確認）。サンプルは shared/external-assets/。</text>
<text x="44" y="749" font-size="16" font-weight="400" fill="#475569" text-anchor="start">目録の変更も PR でレビューする。「Box 側を差し替えたのに目録が古い」は assets-check.js のハッシュ照合で気づける。</text>
</svg>
