<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">AGENTS.md とスキル（SKILL.md）の形式は共通。置き場所・パス限定の指示・強制・同名スキルの優先順は製品ごとに違う。</text>
