<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:12.5px;fill:#374151}
      .s{font-size:11.5px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="479" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">③ 作り手＋チェック係（ジェネレーター／ベリファイア）</text>
  <text x="30" y="64" class="s" font-size="13">作る役と確かめる役を分け、確かめる役は「作った過程を見ていない、まっさらな目」で採点する</text>

  <rect x="290" y="82" width="320" height="50" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="450" y="104" text-anchor="middle" class="h" fill="#b45309">完了の定義（スプリント契約）</text>
  <text x="450" y="123" text-anchor="middle" class="s">何を作り、どう確かめたら完了か を先に合意</text>
  <g stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="4 4" fill="none">
    <path d="M290 107 L155 107 L155 168"/>
    <path d="M610 107 L750 107 L750 168"/>
  </g>

  <rect x="50" y="170" width="210" height="80" rx="10" fill="#d1fae5" stroke="#10b981"/>
  <text x="155" y="199" text-anchor="middle" class="h" fill="#047857">作り手</text>
  <text x="155" y="221" text-anchor="middle" class="b">作る・直す</text>
  <text x="155" y="240" text-anchor="middle" class="s">書き込み権限あり</text>

  <line x1="260" y1="210" x2="358" y2="210" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="360" y="188" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="450" y="215" text-anchor="middle" class="b">成果物（差分・アプリ）</text>
  <line x1="540" y1="210" x2="638" y2="210" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="640" y="170" width="220" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="750" y="199" text-anchor="middle" class="h" fill="#1d4ed8">チェック係</text>
  <text x="750" y="221" text-anchor="middle" class="b">まっさらな文脈で採点</text>
  <text x="750" y="240" text-anchor="middle" class="s">読むだけ・テストを実行</text>

  <path d="M720 250 L720 292 L155 292 L155 252" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahR)"/>
  <rect x="270" y="280" width="360" height="24" rx="12" fill="#ffffff" stroke="#fecaca"/>
  <text x="450" y="296" text-anchor="middle" class="b" style="fill:#b91c1c">✕ 不合格：具体的な指摘で差し戻す（回数に上限）</text>

  <path d="M830 250 L830 318" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ahG)"/>
  <text x="820" y="292" text-anchor="end" class="b" style="fill:#15803d">◯ 合格</text>
  <rect x="780" y="320" width="90" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="825" y="341" text-anchor="middle" class="b" style="fill:#15803d">完了</text>

  <rect x="30" y="366" width="370" height="100" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="48" y="390" class="h" fill="#15803d">得るもの</text>
  <text x="48" y="414" class="b">・自己採点の甘さを避けられる</text>
  <text x="48" y="435" class="b">・まっさらな目がバグを拾う（PR あたり約2件）</text>
  <text x="48" y="456" class="b">・失敗の約1/4を占める「検証不足」を潰す（MAST）</text>

  <rect x="410" y="366" width="370" height="100" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="428" y="390" class="h" fill="#b91c1c">失うもの・注意点</text>
  <text x="428" y="414" class="b">・時間とお金：単体20分・9ドル → 6時間・200ドルの例</text>
  <text x="428" y="435" class="b">・指摘を全部直すと過剰設計に（見る範囲を絞る）</text>
  <text x="428" y="456" class="b">・モデルが単独で確実にこなせる仕事では無駄</text>
  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 414) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <!-- soft ground shadow -->
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <!-- far legs, tail -->
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- neck -->
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <!-- near legs (chubby) -->
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <!-- shell -->
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <!-- rim -->
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <!-- head: gazing up-left at the figure -->
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <!-- toes -->
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
