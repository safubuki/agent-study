<title id="title">下位要求の粒度を揃える：NG 例と OK 例</title><desc id="desc">同じ親を持つ兄弟の要求は「主語・確認の場・抽象度」を揃える。混ざると、抜け漏れや試験の計画漏れが起きやすい。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="932" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">下位要求の粒度を揃える：NG 例と OK 例</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">同じ親を持つ兄弟の要求は「主語・確認の場・抽象度」を揃える。混ざると、抜け漏れや試験の計画漏れが起きやすい。</text>
