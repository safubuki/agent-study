<text x="326" y="228.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">L2</text>
<text x="350" y="229" font-size="15" font-weight="700" fill="#9a3412" text-anchor="start">部署・カテゴリ B</text>
<text x="312" y="252" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">applyTo: area-b/**</text>
