<rect x="318" y="686" width="274" height="128" rx="12" fill="none" stroke="#b45309" stroke-width="1.6"/>
<text x="336" y="714" font-size="17.5" font-weight="700" fill="#92400e" text-anchor="start">分析</text>
<text x="336" y="736" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Analysis</text>
<text x="336" y="776" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">計算や解析で確かめる</text>
<text x="336" y="799" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">例）電池寿命を計算する</text>
<rect x="608" y="686" width="274" height="128" rx="12" fill="#fff" stroke="none"/>
