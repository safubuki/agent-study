  <rect x="114" y="256" width="612" height="36" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="126" y="271" font-size="9.5" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">① ユーザーが選択した段落</text>
  <text x="126" y="286" font-size="11.5" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">春の宇治抹茶ラテを発売します。京都の抹茶を使っていておいしいです。ぜひ飲んでください。</text>

  <!-- 差分プレビュー箱 -->
  <rect x="114" y="298" width="612" height="62" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
  <text x="126" y="314" font-size="10" font-weight="800" fill="#0f766e" font-family="BIZ UDPGothic, sans-serif">③ ✨ AI の書き換え提案（勝手に上書きせず、確認してから置換）</text>
  <text x="126" y="332" font-size="11.5" font-weight="700" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">京都産の一番茶を贅沢に使用した季節限定「春の宇治抹茶ラテ」を発売いたします。</text>
  <rect x="126" y="338" width="136" height="18" rx="5" fill="#0f766e"/>
  <text x="194" y="351" text-anchor="middle" font-size="9.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">✅ この文章に置き換える</text>
  <rect x="270" y="338" width="84" height="18" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="312" y="351" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">✕ キャンセル</text>

  <rect x="24" y="394" width="792" height="34" rx="10" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="40" y="415" font-size="11" font-weight="700" fill="#0c4a6e" font-family="BIZ UDPGothic, sans-serif">📌 ポイント：普段使っている文書エディタやフォームから別画面へ移動させず、「選択→浮くバー→差分確認→置換」で自然に助ける。</text>
</svg>
