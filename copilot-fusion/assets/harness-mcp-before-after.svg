<marker id="arrow-sdk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="1268" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">なぜ見えない？ teamDocs が転送される前に止まる例</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">上から下へ時間が進む。④は接続・認証より前の停止。サーバーの障害とは切り分けて考える。</text>
<rect x="116" y="112" width="328" height="32" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="130" y="135" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">Local：利用できていた</text>
<rect x="464" y="112" width="328" height="32" rx="6" fill="#fffbeb" stroke="#b45309"/>
<text x="478" y="135" font-size="18" font-weight="700" fill="#b45309" text-anchor="start">切り替え：定義が届かない</text>
<rect x="812" y="112" width="360" height="32" rx="6" fill="#ecfdf5" stroke="#059669"/>
<text x="826" y="135" font-size="18" font-weight="700" fill="#059669" text-anchor="start">対処後：検索まで確かめる</text>
<line x1="66" y1="204" x2="66" y2="1058" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="66" cy="204" r="24" fill="#2563eb"/>
<text x="66" y="212" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<rect x="116" y="170" width="1056" height="120" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<text x="138" y="206" font-size="23" font-weight="700" fill="#2563eb" text-anchor="start">Local が旧設定を読む</text>
<text x="138" y="242" font-size="20" font-weight="400" fill="#334155" text-anchor="start">.vscode/mcp.json → servers → teamDocs</text>
<text x="138" y="271" font-size="20" font-weight="400" fill="#334155" text-anchor="start">認証ヘッダー：Bearer ${input:docs-key}</text>
<line x1="644" y1="290" x2="644" y2="334" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<circle cx="66" cy="368" r="24" fill="#2563eb"/>
<text x="66" y="376" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<rect x="116" y="334" width="1056" height="120" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<text x="138" y="370" font-size="23" font-weight="700" fill="#2563eb" text-anchor="start">入力を解決して、サーバーへ接続する</text>
<text x="138" y="406" font-size="20" font-weight="400" fill="#334155" text-anchor="start">VS Code の入力ダイアログでキーを受け取り、HTTP サーバーに認証。</text>
<text x="138" y="435" font-size="20" font-weight="400" fill="#334155" text-anchor="start">公開された検索ツールを使える。ここまでは Local での動作。</text>
<line x1="644" y1="454" x2="644" y2="498" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<circle cx="66" cy="532" r="24" fill="#b45309"/>
<text x="66" y="540" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<rect x="116" y="498" width="1056" height="120" rx="12" fill="#fffbeb" stroke="#b45309"/>
<text x="138" y="534" font-size="23" font-weight="700" fill="#b45309" text-anchor="start">新しいセッションの対象を Copilot に変える</text>
<text x="138" y="570" font-size="20" font-weight="400" fill="#334155" text-anchor="start">旧ファイルはそのまま。エディタは、転送条件を満たす定義を選ぶ。</text>
<text x="138" y="599" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Local の入力値が、Copilot にも引き継がれるとは限らない。</text>
<line x1="644" y1="618" x2="644" y2="662" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-review)"/>
<circle cx="66" cy="696" r="24" fill="#b45309"/>
<text x="66" y="704" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<rect x="116" y="662" width="1056" height="154" rx="12" fill="#fffbeb" stroke="#b45309"/>
<text x="138" y="698" font-size="23" font-weight="700" fill="#b45309" text-anchor="start">ここで停止：入力の値を解決する前の「転送チェック」</text>
<text x="138" y="734" font-size="20" font-weight="400" fill="#334155" text-anchor="start">${input:docs-key} が必要 → この定義は転送の対象外。</text>
<text x="138" y="763" font-size="20" font-weight="400" fill="#334155" text-anchor="start">定義が届かない → 接続に進まない → ツール一覧に現れない。</text>
<text x="138" y="792" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Local で入力済み・キャッシュ済みでも、この条件は変わらない。</text>
<line x1="644" y1="816" x2="644" y2="860" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-review)"/>
<circle cx="66" cy="894" r="24" fill="#059669"/>
<text x="66" y="902" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<rect x="116" y="860" width="1056" height="120" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="138" y="896" font-size="23" font-weight="700" fill="#059669" text-anchor="start">Copilot 用の設定と、認証に使う環境を整える</text>
<text x="138" y="932" font-size="20" font-weight="400" fill="#334155" text-anchor="start">.mcp.json / mcpServers へ変換し、${DOCS_API_KEY} を参照する。</text>
<text x="138" y="961" font-size="20" font-weight="400" fill="#334155" text-anchor="start">実行先へキーを用意 → 対象のクライアント / Agent Host を再起動。</text>
<line x1="644" y1="980" x2="644" y2="1024" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<circle cx="66" cy="1058" r="24" fill="#059669"/>
<text x="66" y="1066" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<rect x="116" y="1024" width="1056" height="120" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="138" y="1060" font-size="23" font-weight="700" fill="#059669" text-anchor="start">新しい Copilot セッションから検索し、復旧を確認する</text>
<text x="138" y="1096" font-size="20" font-weight="400" fill="#334155" text-anchor="start">サーバーが表示される → 接続・認証できる → 検索結果が返る。</text>
<text x="138" y="1125" font-size="20" font-weight="400" fill="#334155" text-anchor="start">一覧への表示だけで終えず、呼び出したツールと文書の内容を確認する。</text>
<rect x="28" y="1168" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="1196" font-size="16" font-weight="400" fill="#475569" text-anchor="start">teamDocs は固定トークン方式の説明用例。OAuth 対応なら、サーバーが提供する認証方式も選べる。</text>
<text x="44" y="1223" font-size="16" font-weight="400" fill="#475569" text-anchor="start">旧設定がすべて使えなくなるわけではない。転送できる定義と、移行が必要な定義の選び方は次の図へ。</text>
</svg>
