<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">上の質問から順に答える。「はい」になった時点で置き場所が決まる。どの層（全社・部署・個人）に置くかは、効かせたい人の範囲で選ぶ。</text>
