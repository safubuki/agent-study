<rect x="28" y="1188" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="1216" font-size="16" font-weight="400" fill="#475569" text-anchor="start">② → ③の順序が要点。別ターミナルだけに変数を追加しても、起動済み Host の環境は変わらない。</text>
<text x="44" y="1243" font-size="16" font-weight="400" fill="#475569" text-anchor="start">固定トークンを使える場合の例。設定には参照だけを書き、キーの実値は画面やログに出さない。</text>
