<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .h{font-size:14.5px;font-weight:700}
      .b{font-size:12.5px;fill:#374151}
      .s{font-size:11.5px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="539" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">プロンプトの「お願い」とフックの「強制」の違い</text>
  <text x="30" y="64" class="s" font-size="13">AI の気分や記憶に頼らず、決まった節目にプログラム（関所・自動処理）を毎回必ず割り込ませる</text>

  <!-- Top Left: Prompt -->
  <rect x="30" y="84" width="410" height="196" rx="12" fill="#fff7ed" fill-opacity="0.7" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="48" y="100" width="210" height="24" rx="12" fill="#f59e0b"/>
  <text x="153" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">確率的（AI の判断まかせ）</text>
  <text x="48" y="148" class="h" fill="#b45309">プロンプト（CLAUDE.md）＝ 壁の貼り紙</text>
  <text x="48" y="172" class="b">「.env は触らないで」「保存後に Prettier を実行して」</text>

  <rect x="44" y="190" width="184" height="72" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="136" y="214" text-anchor="middle" class="b" font-weight="700" fill="#047857">普段は</text>
  <text x="136" y="236" text-anchor="middle" class="s">指示を覚えていて守る</text>
  <text x="136" y="253" text-anchor="middle" class="s">（毎回トークンを消費）</text>

  <rect x="238" y="190" width="188" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="332" y="214" text-anchor="middle" class="b" font-weight="700" fill="#b91c1c">長い会話・焦った時</text>
  <text x="332" y="236" text-anchor="middle" class="s">忘れて .env を上書き</text>
  <text x="332" y="253" text-anchor="middle" class="s">未検証のまま完了申告</text>

  <!-- Top Right: Hooks -->
  <rect x="460" y="84" width="410" height="196" rx="12" fill="#ecfdf5" fill-opacity="0.7" stroke="#10b981" stroke-width="1.8"/>
  <rect x="478" y="100" width="210" height="24" rx="12" fill="#10b981"/>
  <text x="583" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">決定論的（毎回必ず作動）</text>
  <text x="478" y="148" class="h" fill="#065f46">フック（Hooks）＝ 物理的な自動改札・機械</text>
  <text x="478" y="172" class="b">ツール実行の前後や完了時にスクリプトが自動起動</text>

  <rect x="474" y="190" width="184" height="72" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="566" y="214" text-anchor="middle" class="b" font-weight="700" fill="#065f46">関所（PreToolUse）</text>
  <text x="566" y="236" text-anchor="middle" class="s">.env 編集や危険操作を</text>
  <text x="566" y="253" text-anchor="middle" class="s">exit 2 で確実に遮断</text>

  <rect x="668" y="190" width="188" height="72" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="762" y="214" text-anchor="middle" class="b" font-weight="700" fill="#065f46">自動化（Post / Stop）</text>
  <text x="762" y="236" text-anchor="middle" class="s">保存直後にトークン0で整形</text>
  <text x="762" y="253" text-anchor="middle" class="s">テスト合格まで差し戻し</text>

  <!-- Bottom: 5 features comparison -->
  <text x="30" y="312" class="h" fill="#111827">周辺機能との役割分担（何をどこに書くか）</text>

  <rect x="30" y="326" width="158" height="128" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="109" y="350" text-anchor="middle" class="h" fill="#374151">CLAUDE.md</text>
  <text x="109" y="370" text-anchor="middle" class="s">常時貼る貼り紙</text>
  <line x1="46" y1="380" x2="172" y2="380" stroke="#e5e7eb"/>
  <text x="109" y="402" text-anchor="middle" class="b">設計方針・好み</text>
  <text x="109" y="422" text-anchor="middle" class="b">言葉遣い・全体像</text>
  <text x="109" y="442" text-anchor="middle" class="s">動く人：メイン AI</text>

  <rect x="200" y="326" width="158" height="128" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="279" y="350" text-anchor="middle" class="h" fill="#374151">Skills（スキル）</text>
  <text x="279" y="370" text-anchor="middle" class="s">専門手順書</text>
  <line x1="216" y1="380" x2="342" y2="380" stroke="#e5e7eb"/>
  <text x="279" y="402" text-anchor="middle" class="b">特定作業の手順</text>
  <text x="279" y="422" text-anchor="middle" class="b">必要時だけ開く</text>
  <text x="279" y="442" text-anchor="middle" class="s">動く人：メイン AI</text>

  <rect x="370" y="326" width="158" height="128" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="449" y="350" text-anchor="middle" class="h" fill="#374151">Subagents</text>
  <text x="449" y="370" text-anchor="middle" class="s">別の AI 作業員</text>
  <line x1="386" y1="380" x2="512" y2="380" stroke="#e5e7eb"/>
  <text x="449" y="402" text-anchor="middle" class="b">広い調査の分担</text>
  <text x="449" y="422" text-anchor="middle" class="b">独立した客観採点</text>
  <text x="449" y="442" text-anchor="middle" class="s">動く人：子の AI</text>

  <rect x="540" y="326" width="158" height="128" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="619" y="350" text-anchor="middle" class="h" fill="#374151">MCP</text>
  <text x="619" y="370" text-anchor="middle" class="s">外の世界への道具</text>
  <line x1="556" y1="380" x2="682" y2="380" stroke="#e5e7eb"/>
  <text x="619" y="402" text-anchor="middle" class="b">社内 DB・外部 API</text>
  <text x="619" y="422" text-anchor="middle" class="b">ブラウザ等の操作</text>
  <text x="619" y="442" text-anchor="middle" class="s">動く人：外部サーバー</text>

  <rect x="710" y="326" width="160" height="128" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="790" y="350" text-anchor="middle" class="h" fill="#065f46">Hooks（フック）</text>
  <text x="790" y="370" text-anchor="middle" class="s">自動改札・検査機</text>
  <line x1="726" y1="380" x2="854" y2="380" stroke="#a7f3d0"/>
  <text x="790" y="402" text-anchor="middle" class="b" font-weight="700" fill="#065f46">危険操作の阻止</text>
  <text x="790" y="422" text-anchor="middle" class="b" font-weight="700" fill="#065f46">自動整形・完了検査</text>
  <text x="790" y="442" text-anchor="middle" class="s">動く人：スクリプト</text>

  <text x="30" y="488" class="s">判断や文脈が要ることは AI（CLAUDE.md / Subagents）へ、100% 同じ規則で縛ることは Hooks へ任せる</text>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 474) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
