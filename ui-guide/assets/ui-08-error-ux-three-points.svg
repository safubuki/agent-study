<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 285" role="img" aria-label="親切なエラー表示の3点セットと近接配置のビフォーアフター比較図">
  <rect width="840" height="285" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="32" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">エラー表示のビフォー／アフター：「何が起きた・なぜ・どう直すか」の 3 点セット</text>

  <!-- 左：悪いエラー -->
  <rect x="22" y="48" width="374" height="218" rx="14" fill="#ffffff" stroke="#fda4af" stroke-width="2"/>
  <rect x="22" y="48" width="374" height="30" rx="14" fill="#be123c"/>
  <rect x="22" y="64" width="374" height="14" fill="#be123c"/>
  <text x="40" y="68" font-size="11.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">❌ 不親切なエラー（離脱の原因）</text>

  <rect x="38" y="90" width="342" height="26" rx="6" fill="#fff1f2" stroke="#fca5a5"/>
  <text x="48" y="107" font-size="10" font-weight="700" fill="#be123c" font-family="Cascadia Code, monospace">Error 400: Invalid Input (field: email)</text>

  <text x="38" y="138" font-size="10" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">Email</text>
  <rect x="38" y="146" width="342" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="165" font-size="10" fill="#94a3b8" font-family="BIZ UDPGothic, sans-serif">（入力した文字が全部消えて空っぽに…）</text>

  <text x="38" y="204" font-size="9.5" font-weight="700" fill="#9f1239" font-family="BIZ UDPGothic, sans-serif">・画面上部に英語エラーコードだけ → 何を直すか不明</text>
  <text x="38" y="224" font-size="9.5" font-weight="700" fill="#9f1239" font-family="BIZ UDPGothic, sans-serif">・入力欄から離れているため該当箇所を探してしまう</text>
  <text x="38" y="244" font-size="9.5" font-weight="700" fill="#9f1239" font-family="BIZ UDPGothic, sans-serif">・入力した内容まで消去され、やり直す気力がなくなる</text>

  <!-- 右：良いエラー -->
  <rect x="418" y="48" width="400" height="218" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="418" y="48" width="400" height="30" rx="14" fill="#059669"/>
  <rect x="418" y="64" width="400" height="14" fill="#059669"/>
  <text x="436" y="68" font-size="11.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">✅ 親切なエラー（近接配置＋3 点セット＋入力保持）</text>

  <text x="436" y="100" font-size="10.5" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">メールアドレス</text>
  <rect x="524" y="88" width="34" height="16" rx="5" fill="#fff1f2" stroke="#be123c"/>
  <text x="541" y="100" text-anchor="middle" font-size="8.5" font-weight="800" fill="#be123c" font-family="BIZ UDPGothic, sans-serif">必須</text>

  <rect x="436" y="108" width="364" height="32" rx="7" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
  <text x="448" y="128" font-size="11" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">kame-cafe.jp</text>
  <text x="788" y="128" text-anchor="end" font-size="9" font-weight="700" fill="#059669" font-family="BIZ UDPGothic, sans-serif">入力保持◎</text>

  <!-- 近接エラー箱 -->
  <rect x="436" y="148" width="364" height="58" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="448" y="166" font-size="9.5" font-weight="800" fill="#be123c" font-family="BIZ UDPGothic, sans-serif">⚠️ メールアドレスに「@」がありません（①何が起きた・②なぜ）</text>
  <text x="448" y="184" font-size="9.5" fill="#881337" font-family="BIZ UDPGothic, sans-serif">example@domain.com のように「@」を入れて入力し直してください</text>
  <text x="448" y="198" font-size="9" font-weight="700" fill="#9f1239" font-family="BIZ UDPGothic, sans-serif">（③具体的な直し方／role="alert" で読み上げソフトにも対応）</text>

  <text x="436" y="232" font-size="9.5" font-weight="700" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">💡 ユーザーを責めず、解決を一緒に手伝う丁寧な日本語にする</text>
  <text x="436" y="250" font-size="9.5" font-weight="700" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">💡 可能なら全角→半角やハイフン自動補正でエラー自体を防ぐ</text>
</svg>
