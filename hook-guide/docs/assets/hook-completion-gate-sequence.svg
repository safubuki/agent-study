</defs>
<rect x="1" y="1" width="1198" height="2281" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="47" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">例4：依頼・作業・返答を経て、終了時の検査で差し戻す</text>
<text x="28" y="80" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ユーザーが実装を頼むところから始める。返答が得られた後、ターンを終える節目で検査フックが動く。</text>
<text x="28" y="107" font-size="13" font-weight="400" fill="#475569" text-anchor="start">全シーケンス図で列順と色を固定　上→下が時間　矢印の色＝送り手　実線＝依頼・通知　横破線＝結果・応答</text>
