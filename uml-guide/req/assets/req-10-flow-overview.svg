<title id="title">全体の流れ：声 → 要求図 → 仕様 → 構造と振る舞い → 確認</title><desc id="desc">各段階で「問い」と「成果物」が変わる。作った物は、点線の関係（トレース）でいつでも要件へたどれるようにしておく。</desc><defs>
