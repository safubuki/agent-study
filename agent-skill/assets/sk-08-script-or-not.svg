<rect x="28" y="338" width="802" height="214" rx="12" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="46" y="367.5" font-size="17.5" font-weight="700" fill="#1e40af" text-anchor="start">自然言語（SKILL.md の文章）に残す</text>
<text x="46" y="414" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">要件の整理・設計判断・優先順位付け（判断が主で、分岐が多すぎる）</text>
<text x="46" y="441" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">レビュー結果の評価・改善提案（文脈で最適解が変わる）</text>
<text x="46" y="468" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">入力仕様が固まっていない初回の業務（先にヒアリングが要る）</text>
<text x="46" y="495" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">一度きりの小さな作業（スクリプトを作る手間が回収できない）</text>
<text x="46" y="522" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">文体や説明の粒度など、利用者の好みで変わる出力</text>
<rect x="854" y="440" width="318" height="112" rx="10" fill="#fff" stroke="#475569" stroke-width="1.7"/>
<text x="1013" y="477" font-size="15.5" font-weight="700" fill="#334155" text-anchor="middle">迷ったら</text>
<text x="1013" y="501" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">取得・正規化・出力だけ固定し</text>
<text x="1013" y="525" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">判断と文章化は自然言語に</text>
<rect x="28" y="582" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="610" font-size="16" font-weight="400" fill="#475569" text-anchor="start">判断基準は scripted-skill-generator の references/script-first-design.md を図にしたもの。</text>
<text x="44" y="637" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スクリプト化の目的は AI を不要にすることではなく、AI に毎回同じ定型処理を再発明させないこと。</text>
