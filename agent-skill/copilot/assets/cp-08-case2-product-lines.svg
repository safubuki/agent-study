<text x="42" y="178" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">AGENTS.md・product-rules.json・l1-product.json</text>
<text x="42" y="202" font-size="13" font-weight="400" fill="#334155" text-anchor="start">安全停止は common/safety を使い変更しない</text>
<text x="42" y="223" font-size="13" font-weight="400" fill="#334155" text-anchor="start">停止 100 ms・定格 10 A は固定／試験は必須</text>
