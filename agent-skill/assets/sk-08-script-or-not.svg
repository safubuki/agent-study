<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">1 つでも「いいえ」なら、まず自然言語（SKILL.md の文章）に残す。迷ったら「取得・正規化・出力」だけをスクリプトにする。</text>
