<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 788" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP', 'Yu Gothic UI', Meiryo, sans-serif">
<title id="title">Claude Code と Copilot：同じ節目でも、返せる結果が違う</title><desc id="desc">Copilot は VS Code で選ぶ実行環境と CLI が対象。図は設定ファイルの command フックを比較。</desc>
<defs>
<marker id="arrow-host" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
<marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker>
<marker id="arrow-hook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker>
<marker id="arrow-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
<marker id="arrow-app" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker>
<marker id="arrow-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#be123c"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="786" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="32" y="49" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Claude Code と Copilot：同じ節目でも、返せる結果が違う</text>
<text x="32" y="84" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Copilot は VS Code で選ぶ実行環境と CLI が対象。図は設定ファイルの command フックを比較。</text>
<rect x="32" y="122" width="272" height="56" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="50" y="158" font-size="21" font-weight="700" fill="#475569" text-anchor="start">目的 / 節目</text>
<rect x="304" y="122" width="432" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="322" y="158" font-size="21" font-weight="700" fill="#7c3aed" text-anchor="start">Claude Code</text>
<rect x="736" y="122" width="432" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="754" y="158" font-size="21" font-weight="700" fill="#2563eb" text-anchor="start">Copilot（VS Code / CLI）</text>
<rect x="32" y="178" width="1136" height="80" rx="0" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="50" y="223" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">チャット送信時</text>
<text x="322" y="207" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">UserPromptSubmit</text>
<text x="322" y="240" font-size="17" font-weight="400" fill="#475569" text-anchor="start">追加情報の添付・送信の拒否</text>
<text x="754" y="207" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">userPromptSubmitted</text>
<text x="754" y="240" font-size="17" font-weight="400" fill="#475569" text-anchor="start">手元の処理は可能。出力は不採用</text>
<rect x="32" y="258" width="1136" height="80" rx="0" fill="#fff" stroke="#e2e8f0"/>
<text x="50" y="303" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">ツール実行前</text>
<text x="322" y="287" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">PreToolUse</text>
<text x="322" y="320" font-size="17" font-weight="400" fill="#475569" text-anchor="start">対象を検査し、許可 / 拒否</text>
<text x="754" y="287" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">preToolUse</text>
<text x="754" y="320" font-size="17" font-weight="400" fill="#475569" text-anchor="start">対象を検査し、許可 / 拒否</text>
<rect x="32" y="338" width="1136" height="80" rx="0" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="50" y="383" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">ツール成功後</text>
<text x="322" y="367" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">PostToolUse</text>
<text x="322" y="400" font-size="17" font-weight="400" fill="#475569" text-anchor="start">整形・検査・追加情報</text>
<text x="754" y="367" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">postToolUse</text>
<text x="754" y="400" font-size="17" font-weight="400" fill="#475569" text-anchor="start">整形・検査・追加情報</text>
<rect x="32" y="418" width="1136" height="80" rx="0" fill="#fff" stroke="#e2e8f0"/>
<text x="50" y="463" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">返答の終了時</text>
<text x="322" y="447" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">Stop</text>
<text x="322" y="480" font-size="17" font-weight="400" fill="#475569" text-anchor="start">検査で block して続行可能</text>
<text x="754" y="447" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">agentStop</text>
<text x="754" y="480" font-size="17" font-weight="400" fill="#475569" text-anchor="start">検査で block して続行可能</text>
<rect x="32" y="498" width="1136" height="80" rx="0" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="50" y="543" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">通知イベント</text>
<text x="322" y="527" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">Notification</text>
<text x="322" y="560" font-size="17" font-weight="400" fill="#475569" text-anchor="start">確認待ち・アイドルなど</text>
<text x="754" y="527" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">notification</text>
<text x="754" y="560" font-size="17" font-weight="400" fill="#475569" text-anchor="start">CLI 限定として文書化</text>
<rect x="32" y="602" width="1136" height="66" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
<text x="50" y="629" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">VS Code は画面の名前。選択中の実行環境が Claude なら Claude の仕様、Copilot なら Copilot の仕様。</text>
<text x="50" y="656" font-size="16" font-weight="400" fill="#475569" text-anchor="start">入力 JSON のキー、出力の入れ子、ツール名、実行されるマシンを確認して移植する。</text>
<rect x="28" y="680" width="1144" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="46" y="704" font-size="16" font-weight="400" fill="#475569" text-anchor="start">共通化しやすいのは、ログ保存・整形・検査の本体。イベントの入力と判定の出力には環境別の変換を置く。</text>
<text x="46" y="731" font-size="16" font-weight="400" fill="#475569" text-anchor="start">2026-11-12 に公式資料を確認。詳細な制約と対応表は 03_hook-flow-examples.md を参照。</text>
</svg>
