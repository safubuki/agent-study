<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">エージェントスキルは「手順書つきの道具箱フォルダ」</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">SKILL.md が目次と手順。資料・スクリプト・型紙は同じフォルダに置き、SKILL.md から「いつ・どれを使うか」を指す。</text>
