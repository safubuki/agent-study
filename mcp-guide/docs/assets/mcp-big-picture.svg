<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif" role="img" aria-label="MCPの全体像：人がAIアプリに依頼し、AIアプリがインターネットの先のLLMに道具の一覧を渡し、LLMが選んだ道具をAIアプリのMCPクライアントがMCPサーバーに呼び出す。ローカルのMCPサーバーは自分のPCの中で、リモートのMCPサーバーはインターネットの先で、その先のデータやサービスを操作する">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:12px;fill:#374151}
      .s{font-size:11px;fill:#6b7280}
      .n{font-size:12px;font-weight:700}
      .net{font-size:10px;font-weight:700;fill:#2563eb}
      .loc{font-size:10px;font-weight:700;fill:#475569}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="739" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#111827">MCP の全体像：人・AI アプリ・LLM・MCP サーバー・その先のアプリ</text>
  <text x="30" y="62" class="s" font-size="12.5">道具を「選ぶ」のは LLM、実際に「呼ぶ」のは AI アプリ（ホスト）。MCP は AI アプリと MCP サーバーの間の約束ごと</text>

  <!-- 凡例：どこで動くか -->
  <rect x="520" y="74" width="26" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="552" y="85" class="b" font-size="11">💻 自分の PC の中</text>
  <rect x="680" y="74" width="26" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="4 3"/>
  <text x="712" y="85" class="b" font-size="11">🌐 インターネットの先</text>

  <!-- 区域：自分の PC の中（AI アプリ＋ローカルの MCP サーバー＋PC の中のデータ） -->
  <path d="M140,100 L452,100 L452,236 L886,236 L886,338 L452,338 L452,474 L140,474 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="150" y="91" width="138" height="19" rx="9.5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="219" y="105" text-anchor="middle" class="loc" font-size="11">💻 自分の PC の中</text>

  <!-- 区域：インターネットの先（LLM） -->
  <rect x="460" y="100" width="426" height="128" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="470" y="91" width="150" height="19" rx="9.5" fill="#ffffff" stroke="#3b82f6"/>
  <text x="545" y="105" text-anchor="middle" class="net" font-size="11">🌐 インターネットの先</text>

  <!-- 区域：インターネットの先（リモートの MCP サーバー＋Web サービス） -->
  <rect x="460" y="346" width="426" height="128" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="728" y="465" width="150" height="19" rx="9.5" fill="#ffffff" stroke="#3b82f6"/>
  <text x="803" y="479" text-anchor="middle" class="net" font-size="11">🌐 インターネットの先</text>

  <!-- 人 -->
  <rect x="20" y="200" width="100" height="124" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="70" y="232" text-anchor="middle" font-size="22">👤</text>
  <text x="70" y="258" text-anchor="middle" class="h" fill="#854d0e">人</text>
  <text x="70" y="278" text-anchor="middle" class="s">依頼する</text>
  <text x="70" y="296" text-anchor="middle" class="s">実行を承認する</text>
  <line x1="120" y1="240" x2="150" y2="240" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <text x="135" y="232" text-anchor="middle" class="n" fill="#4b5563">①</text>
  <line x1="150" y1="290" x2="120" y2="290" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <text x="135" y="308" text-anchor="middle" class="n" fill="#4b5563">⑦</text>

  <!-- AI アプリ（ホスト） -->
  <rect x="152" y="118" width="272" height="344" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="168" y="143" class="h" fill="#1e3a8a">🖥️ AI アプリ（ホスト）</text>
  <text x="168" y="161" class="s">VS Code の Copilot・Claude Code・</text>
  <text x="168" y="176" class="s">Antigravity・自作アプリ など</text>

  <rect x="168" y="186" width="240" height="52" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="288" y="207" text-anchor="middle" class="b" font-weight="700" fill="#1d4ed8">🔁 会話と実行の管理（エージェントループ）</text>
  <text x="288" y="227" text-anchor="middle" class="s">LLM とのやり取り・道具の呼び出し</text>

  <rect x="168" y="254" width="108" height="70" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="222" y="278" text-anchor="middle" class="b" font-weight="700" fill="#1e3a8a">🛡️ 承認・権限</text>
  <text x="222" y="298" text-anchor="middle" class="s">実行してよいか</text>
  <text x="222" y="314" text-anchor="middle" class="s">人に確認する</text>

  <rect x="168" y="352" width="108" height="94" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="222" y="376" text-anchor="middle" class="b" font-weight="700" fill="#1e3a8a">📄 設定ファイル</text>
  <text x="222" y="396" text-anchor="middle" class="s">.mcp.json など</text>
  <text x="222" y="414" text-anchor="middle" class="s">どのサーバーに</text>
  <text x="222" y="430" text-anchor="middle" class="s">つなぐかを書く</text>

  <rect x="288" y="254" width="120" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="348" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">MCP クライアント A</text>
  <text x="348" y="302" text-anchor="middle" class="s">A 専用の接続係</text>

  <rect x="288" y="368" width="120" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="348" y="396" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">MCP クライアント B</text>
  <text x="348" y="416" text-anchor="middle" class="s">B 専用の接続係</text>

  <!-- LLM（インターネットの先） -->
  <rect x="500" y="118" width="200" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="600" y="144" text-anchor="middle" class="h" fill="#5b21b6">🧠 LLM（AI そのもの）</text>
  <text x="600" y="166" text-anchor="middle" class="b">考えて、使う道具と</text>
  <text x="600" y="184" text-anchor="middle" class="b">引数を決める</text>
  <text x="600" y="205" text-anchor="middle" class="s">文章を受け取り、文章を返すだけ</text>
  <text x="794" y="146" text-anchor="middle" class="net" font-size="11">LLM の提供元の</text>
  <text x="794" y="164" text-anchor="middle" class="net" font-size="11">サーバーで動く</text>
  <text x="794" y="186" text-anchor="middle" class="s">Anthropic・OpenAI・</text>
  <text x="794" y="202" text-anchor="middle" class="s">Google など</text>

  <line x1="408" y1="198" x2="498" y2="158" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahv)"/>
  <line x1="498" y1="196" x2="408" y2="224" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahv)"/>
  <rect x="432" y="160" width="40" height="17" rx="8.5" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="452" y="173" text-anchor="middle" class="n" fill="#7c3aed">② ⑥</text>
  <rect x="438" y="220" width="28" height="17" rx="8.5" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="452" y="233" text-anchor="middle" class="n" fill="#7c3aed">③</text>
  <text x="456" y="134" text-anchor="middle" class="net">🌐 HTTPS</text>

  <!-- MCP サーバー A（PC の中） -->
  <rect x="500" y="246" width="200" height="84" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="268" text-anchor="middle" class="h" fill="#065f46">🔌 MCP サーバー A</text>
  <text x="600" y="287" text-anchor="middle" class="b">ローカル（PC の中・stdio）</text>
  <text x="600" y="305" text-anchor="middle" class="s">道具の例：メニュー検索・原価計算</text>
  <text x="600" y="321" text-anchor="middle" class="s">（Tools・Resources・Prompts）</text>

  <line x1="408" y1="276" x2="498" y2="276" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="498" y1="302" x2="408" y2="302" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <text x="454" y="294" text-anchor="middle" class="n" fill="#4b5563">④⑤</text>
  <text x="454" y="324" text-anchor="middle" class="loc">💻 PC の中</text>

  <!-- MCP サーバー B（インターネットの先） -->
  <rect x="500" y="358" width="200" height="104" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="600" y="384" text-anchor="middle" class="h" fill="#155e75">🔌 MCP サーバー B</text>
  <text x="600" y="404" text-anchor="middle" class="b">リモート（ネット越し・HTTP）</text>
  <text x="600" y="424" text-anchor="middle" class="s">道具の例：Issue を探す・作る</text>
  <text x="600" y="442" text-anchor="middle" class="s">（ログインは OAuth など）</text>

  <line x1="408" y1="390" x2="498" y2="390" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahb)"/>
  <line x1="498" y1="416" x2="408" y2="416" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahb)"/>
  <rect x="434" y="395" width="40" height="17" rx="8.5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="454" y="408" text-anchor="middle" class="n" fill="#2563eb">④⑤</text>
  <text x="454" y="438" text-anchor="middle" class="net">🌐 HTTPS</text>

  <!-- その先：PC の中 -->
  <rect x="716" y="246" width="160" height="84" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="796" y="263" text-anchor="middle" class="b" font-size="11.5" font-weight="700" fill="#9a3412">その先（PC の中）</text>
  <rect x="726" y="270" width="140" height="26" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="796" y="288" text-anchor="middle" class="b">🗄️ DB・ファイル</text>
  <rect x="726" y="300" width="140" height="26" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="796" y="318" text-anchor="middle" class="b">🧩 PC 内のアプリ</text>
  <line x1="700" y1="283" x2="724" y2="283" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="700" y1="313" x2="724" y2="313" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- その先：インターネットの先 -->
  <rect x="716" y="358" width="160" height="96" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="796" y="376" text-anchor="middle" class="b" font-size="11.5" font-weight="700" fill="#9a3412">その先（ネットの先）</text>
  <rect x="726" y="384" width="140" height="60" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="796" y="408" text-anchor="middle" class="b">☁️ Web API・SaaS</text>
  <text x="796" y="428" text-anchor="middle" class="s">GitHub・Notion など</text>
  <line x1="700" y1="412" x2="724" y2="412" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ahb)"/>

  <!-- 1 回の依頼で起きること -->
  <rect x="24" y="492" width="852" height="136" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="516" class="h" fill="#111827">🔢 1 回の依頼で起きること（①〜⑦）</text>
  <text x="40" y="542" class="b">① 人が AI アプリに依頼する</text>
  <text x="40" y="566" class="b">② AI アプリが LLM に依頼と道具の一覧を送る（🌐 ネット越し）</text>
  <text x="40" y="590" class="b">③ LLM が「この道具をこの引数で」と返す（承認が入ることも）</text>
  <text x="40" y="614" class="b">④ AI アプリの MCP クライアントがサーバーに tools/call</text>
  <text x="466" y="542" class="b">⑤ サーバーがその先の DB・アプリ・Web API を操作して結果を返す</text>
  <text x="466" y="566" class="b">⑥ AI アプリが結果を LLM に渡す（🌐 PC の中の結果もここで外へ）</text>
  <text x="466" y="590" class="b">⑦ LLM がまとめた答えを、AI アプリが人に見せる</text>
  <text x="466" y="614" class="s">※ ②の「道具の一覧」は、つないだ時の tools/list で取得済み</text>

  <rect x="24" y="640" width="760" height="30" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="404" y="660" text-anchor="middle" class="b" font-weight="700" fill="#9a3412">💡 LLM は MCP サーバーに直接つながっていない。AI アプリが間に立ち、承認と権限の確認も AI アプリが行う</text>

  <text x="30" y="694" class="s">出典：Model Context Protocol 公式仕様（Architecture）・Anthropic（2024）をもとに筆者作成</text>
  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 674) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
