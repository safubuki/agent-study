<line x1="1034" y1="1138" x2="1034" y2="1168" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="48" y="1114" width="812" height="34" rx="6" fill="#fff" stroke="none"/>
<text x="454" y="1138" font-size="21" font-weight="700" fill="#059669" text-anchor="middle">ツール呼出しと文書の内容を確認する</text>
