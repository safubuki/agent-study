<text x="959.5" y="286.1" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">L2 ドメイン</text>
<text x="917" y="320" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">電気設計部の様式で</text>
<text x="917" y="343" font-size="14.5" font-weight="700" fill="#9a3412" text-anchor="start">表に 1 行で書く</text>
