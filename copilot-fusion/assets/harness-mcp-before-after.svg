<marker id="arrow-process" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="arrow-sdk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="946" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">同じ MCP サーバーでも、切り替え後に道具が見えないのはなぜ？</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">入力ダイアログで API キーを渡していた定義の例。サーバーの故障ではなく、定義と認証を届ける経路が変わる。</text>
<rect x="28" y="124" width="368" height="672" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="212" y="163" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">① Local では使えていた</text>
<rect x="416" y="124" width="368" height="672" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="600" y="163" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">② Copilot に切り替える</text>
<rect x="804" y="124" width="368" height="672" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="988" y="163" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">③ 認証と設定を整える</text>
<rect x="52" y="202" width="320" height="146" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="212" y="234" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">旧エディタ設定</text>
<text x="212" y="266" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">.vscode/mcp.json / servers</text>
<text x="212" y="293" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">${input:api-key} を含む</text>
<text x="212" y="320" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">入力をエディタに任せる</text>
<rect x="52" y="418" width="320" height="146" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="212" y="450" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">VS Code が値を解決</text>
<text x="212" y="482" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">入力ダイアログで受け取る</text>
<text x="212" y="509" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">保存済みの値も利用できる</text>
<text x="212" y="536" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">その値でサーバーに認証</text>
<line x1="212" y1="348" x2="212" y2="418" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<rect x="52" y="636" width="320" height="118" rx="11" fill="#ecfeff" stroke="#0e7490"/>
<text x="212" y="668" font-size="20" font-weight="700" fill="#0e7490" text-anchor="middle">ツールが見える</text>
<text x="212" y="700" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">MCP サーバーへ接続</text>
<text x="212" y="727" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">道具を一覧に出して利用する</text>
<line x1="212" y1="564" x2="212" y2="636" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<rect x="440" y="202" width="320" height="146" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="600" y="234" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">同じ旧設定を転送したい</text>
<text x="600" y="266" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">${input:...} / ${command:...}</text>
<text x="600" y="293" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">この定義をそのまま</text>
<text x="600" y="320" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Copilot に渡そうとする</text>
<rect x="440" y="418" width="320" height="146" rx="11" fill="#fffbeb" stroke="#b45309"/>
<text x="600" y="450" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">転送の条件に合わない</text>
<text x="600" y="482" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">変数の値を解決する前に除外</text>
<text x="600" y="509" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Local で入力済みでも不可</text>
<text x="600" y="536" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">旧入力機能は移らない</text>
<line x1="600" y1="348" x2="600" y2="418" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<rect x="440" y="636" width="320" height="118" rx="11" fill="#fffbeb" stroke="#b45309"/>
<text x="600" y="668" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">Copilot に定義が届かない</text>
<text x="600" y="700" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">この経路では起動・接続できず</text>
<text x="600" y="727" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">道具が一覧に現れない</text>
<line x1="600" y1="564" x2="600" y2="636" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-review)"/>
<rect x="828" y="202" width="320" height="146" rx="11" fill="#ecfdf5" stroke="#059669"/>
<text x="988" y="234" font-size="20" font-weight="700" fill="#059669" text-anchor="middle">Copilot が読める設定</text>
<text x="988" y="266" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">.mcp.json / mcpServers</text>
<text x="988" y="293" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">例：${DOCS_API_KEY}</text>
<text x="988" y="320" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">必要なツールを指定する</text>
<rect x="828" y="418" width="320" height="146" rx="11" fill="#ecfdf5" stroke="#059669"/>
<text x="988" y="450" font-size="20" font-weight="700" fill="#059669" text-anchor="middle">実行先に認証を用意</text>
<text x="988" y="482" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">OAuth または許可された</text>
<text x="988" y="509" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">環境変数で資格情報を渡す</text>
<text x="988" y="536" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Agent Host 側の環境も確認</text>
<line x1="988" y1="348" x2="988" y2="418" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="828" y="636" width="320" height="118" rx="11" fill="#ecfeff" stroke="#0e7490"/>
<text x="988" y="668" font-size="20" font-weight="700" fill="#0e7490" text-anchor="middle">Copilot から利用できる</text>
<text x="988" y="700" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">サーバーに接続・認証する</text>
<text x="988" y="727" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">実際のツール呼出しを確認</text>
<line x1="988" y1="564" x2="988" y2="636" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="28" y="846" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="874" font-size="16" font-weight="400" fill="#475569" text-anchor="start">これは入力・コマンド変数を含む定義の例。すべての旧 MCP 設定が一律に転送できなくなる、という意味ではない。</text>
<text x="44" y="901" font-size="16" font-weight="400" fill="#475569" text-anchor="start">設定を読めること、認証できること、必要な道具を呼べることは別々に確認する。秘密値を設定へ直書きしない。</text>
</svg>
