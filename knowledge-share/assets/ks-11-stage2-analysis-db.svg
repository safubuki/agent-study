  <rect width="960" height="680" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, Yu Gothic UI, sans-serif">段階 2：GitHub のまま、集計を DB で（アプリは変えない）</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#475569" font-family="BIZ UDPGothic, Yu Gothic UI, sans-serif">記録の受け口は GitHub のまま。分析する人が runs/ を DB に取り込み、SQL とダッシュボードで見る</text>

  <!-- ===== 左：利用者の PC（段階 1 と同じ） ===== -->
  <rect x="24" y="80" width="256" height="370" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
