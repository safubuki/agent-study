<text x="544" y="536" font-size="15" font-weight="700" fill="#065f46" text-anchor="start">新しい版に結論を書く</text>
<text x="544" y="560" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">rev-c031-a.md に「C1 を再選定」と理由を表で</text>
<rect x="28" y="622" width="1144" height="78" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="48" y="654" font-size="16" font-weight="700" fill="#334155" text-anchor="start">変わったのは「入力電圧の値」だけ。</text>
<text x="48" y="680" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">判定の手順（L3 電源係）・書き方（L2 電気設計部）・全体の約束（L1）はそのまま。だから次の通常品の依頼では、また 24 V で正しく判定できる。</text>
<rect x="28" y="730" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="758" font-size="16" font-weight="400" fill="#475569" text-anchor="start">48 V の出どころは案件の case.json（期限つき）、24 V は部品の part.json。値の「経緯」は resolve-case.js が表で出す。</text>
<text x="44" y="785" font-size="16" font-weight="400" fill="#475569" text-anchor="start">期限を過ぎた案件を指定すると、スクリプトが NG にして作業を始めない（古い顧客条件を使い続ける事故を防ぐ）。</text>
