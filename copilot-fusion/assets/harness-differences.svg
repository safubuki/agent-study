<text x="44" y="1016" font-size="16" font-weight="400" fill="#475569" text-anchor="start">継続には Agent Host と実行環境の稼働が必要。エディタ由来の道具は、エディタの接続にも依存する。</text>
<text x="44" y="1043" font-size="16" font-weight="400" fill="#475569" text-anchor="start">共有ランタイムでも、全クライアントの道具・設定・認証が同じになるわけではない。MCP の具体例は次の図へ。</text>
