<path d="M575 740 L575 658 L356 658 L356 398 L379 398" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/>
<path d="M367 404.6 L379 398 L367 391.4" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
