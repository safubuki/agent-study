<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 852" role="img" aria-labelledby="title desc" font-family="'Noto Sans JP', 'Yu Gothic UI', Meiryo, sans-serif">
<!-- Generated by ../scripts/generate-diagrams.js. -->
<title id="title">要求の抽出：集めて、並べて、点検する</title><desc id="desc">関係者と使う場面から要求を集め、「なぜ？」「どうやって？」で上下に並べてから要求図に置く。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="850" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">要求の抽出：集めて、並べて、点検する</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">関係者と使う場面から要求を集め、「なぜ？」「どうやって？」で上下に並べてから要求図に置く。</text>
<path d="M60 150 V590" fill="none" stroke="#bfdbfe" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="90" y="120" width="600" height="76" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="1.4"/>
<circle cx="60" cy="150" r="16" fill="#2563eb"/>
<text x="60" y="155.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="108" y="146" font-size="16.5" font-weight="700" fill="#1e40af" text-anchor="start">関係者を洗い出す</text>
<text x="108" y="168" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">使う人・買う人・作る人・直す人・守るべき決まり</text>
<text x="108" y="187" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">例）利用者・家族・販売店・修理担当・安全の規格</text>
<rect x="90" y="208" width="600" height="76" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="1.4"/>
<circle cx="60" cy="238" r="16" fill="#2563eb"/>
<text x="60" y="243.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="108" y="234" font-size="16.5" font-weight="700" fill="#1e40af" text-anchor="start">使う場面を集める</text>
<text x="108" y="256" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">ユースケースや運用シナリオで「いつ・だれが・何を」を書き出す</text>
<text x="108" y="275" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">例）出発前に設定 → 留守中に自動給水 → 帰宅後に水を補充</text>
<rect x="90" y="296" width="600" height="76" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="1.4"/>
<circle cx="60" cy="326" r="16" fill="#2563eb"/>
<text x="60" y="331.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="108" y="322" font-size="16.5" font-weight="700" fill="#1e40af" text-anchor="start">境界とやり取りを決める</text>
<text x="108" y="344" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">システムの内と外、出入りする物・情報・エネルギーを図にする</text>
<text x="108" y="363" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">例）外：植物と土・スマホ・水道水 ／ 内：センサー・ポンプ</text>
<rect x="90" y="384" width="600" height="76" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="1.4"/>
<circle cx="60" cy="414" r="16" fill="#2563eb"/>
<text x="60" y="419.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="108" y="410" font-size="16.5" font-weight="700" fill="#1e40af" text-anchor="start">機能以外も拾う</text>
<text x="108" y="432" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">性能・安全・使う環境・コスト・法規・保守のしやすさ</text>
<text x="108" y="451" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">例）水漏れしない・室内で静か・電池交換が簡単</text>
<rect x="90" y="472" width="600" height="76" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="1.4"/>
<circle cx="60" cy="502" r="16" fill="#2563eb"/>
<text x="60" y="507.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="108" y="498" font-size="16.5" font-weight="700" fill="#1e40af" text-anchor="start">なぜ？どうやって？で並べる</text>
<text x="108" y="520" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">上下関係を決め、要求図に置いて分解・導出する</text>
<text x="108" y="539" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">例）右の「はしご」のように目的と手段をつなぐ</text>
<rect x="90" y="560" width="600" height="76" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="1.4"/>
<circle cx="60" cy="590" r="16" fill="#2563eb"/>
<text x="60" y="595.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="108" y="586" font-size="16.5" font-weight="700" fill="#1e40af" text-anchor="start">点検して合意する</text>
<text x="108" y="608" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">よい要求の性質で点検し、関係者とレビューする</text>
<text x="108" y="627" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">例）「十分」「すぐ」などのあいまい語を数値に置き換える</text>
<text x="28" y="676" font-size="15" font-weight="700" fill="#334155" text-anchor="start">集め方の例</text>
<rect x="121.8" y="657" width="101" height="28" rx="14" fill="#fff" stroke="#475569" stroke-width="1.4"/>
<text x="172.3" y="675.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">インタビュー</text>
<rect x="230.3" y="657" width="50" height="28" rx="14" fill="#fff" stroke="#475569" stroke-width="1.4"/>
<text x="255.3" y="675.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">観察</text>
<rect x="287.6" y="657" width="114" height="28" rx="14" fill="#fff" stroke="#475569" stroke-width="1.4"/>
<text x="344.6" y="675.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">ワークショップ</text>
<rect x="409" y="657" width="152" height="28" rx="14" fill="#fff" stroke="#475569" stroke-width="1.4"/>
<text x="485" y="675.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">既存資料・苦情の分析</text>
<rect x="568.8" y="657" width="126" height="28" rx="14" fill="#fff" stroke="#475569" stroke-width="1.4"/>
<text x="631.8" y="675.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">試作を見てもらう</text>
<rect x="726" y="120" width="446" height="600" rx="12" fill="#fff" stroke="none"/>
<path d="M726 182 V132 Q726 120 738 120 H1160 Q1172 120 1172 132 V182 Z" fill="#f5f3ff" stroke="none"/>
<path d="M726 182 H1172" fill="none" stroke="#ddd6fe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="726" y="120" width="446" height="600" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
<text x="744" y="148" font-size="17.5" font-weight="700" fill="#5b21b6" text-anchor="start">「なぜ？」と「どうやって？」のはしご</text>
<text x="744" y="170" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">上へ行くほど目的、下へ行くほど手段</text>
<rect x="800" y="210" width="276" height="56" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.6"/>
<text x="938" y="231" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">目的・価値（要望の奥にあるもの）</text>
<text x="938" y="254" font-size="14.5" font-weight="700" fill="#9f1239" text-anchor="middle">旅行を気兼ねなく楽しみたい</text>
<rect x="800" y="282" width="276" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="938" y="303" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">要求 REQ-1</text>
<text x="938" y="326" font-size="14.5" font-weight="700" fill="#5b21b6" text-anchor="middle">留守中も植物を枯らさない</text>
<rect x="800" y="354" width="276" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="938" y="375" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">要件 REQ-1.2</text>
<text x="938" y="398" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="middle">乾いたら10分以内に給水する</text>
<rect x="800" y="426" width="276" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="938" y="447" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">本機の仕様 S-2</text>
<text x="938" y="470" font-size="14.5" font-weight="700" fill="#3730a3" text-anchor="middle">30%未満ならポンプを10秒動かす</text>
<rect x="800" y="498" width="276" height="56" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
<text x="938" y="519" font-size="12" font-weight="700" fill="#0e7490" text-anchor="middle">部品の要件 PMP-1</text>
<text x="938" y="542" font-size="14.5" font-weight="700" fill="#155e75" text-anchor="middle">ポンプは1回 約50mLを送る</text>
<rect x="800" y="570" width="276" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="938" y="591" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">部品の設計</text>
<text x="938" y="614" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="middle">条件に合う小型ポンプを選ぶ</text>
<path d="M766 618 L766 218" fill="none" stroke="#be123c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M772.6 230 L766 218 L759.4 230 Z" fill="#be123c" stroke="none"/>
<text x="766" y="204" font-size="15" font-weight="700" fill="#9f1239" text-anchor="middle">なぜ？</text>
<path d="M1110 218 L1110 618" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1103.4 606 L1110 618 L1116.6 606 Z" fill="#4f46e5" stroke="none"/>
<text x="1110" y="642" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">どうやって？</text>
<text x="746" y="680" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">要求・要件は要求図に、仕様・設計は仕様書や設計図</text>
<text x="746" y="702" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">に書く。1 段上の仕様が、1 段下の要件になる。</text>
<rect x="28" y="750" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="778" font-size="16" font-weight="400" fill="#475569" text-anchor="start">手順は ISO/IEC/IEEE 29148・15288 の「利害関係者要求の定義」の流れを、初心者向けに 6 段階へまとめたもの。</text>
<text x="44" y="805" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「なぜ？」で上がって目的を確かめ、「どうやって？」で下がって手段を考えると、階層の抜けや飛びに気づきやすい。</text>
</svg>
