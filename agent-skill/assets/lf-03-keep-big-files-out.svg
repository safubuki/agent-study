<title id="title">大容量データの混入を止める 4 つの関所</title><desc id="desc">お願い（指示）・手元（pre-commit）・PR（必須チェック）・GitHub の上限の順に重ねる。履歴に入ってからでは遅いので、手前ほど大事。</desc><defs>
</defs>
