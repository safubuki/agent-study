<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="試作から本番化への分岐：継ぎ足し改修の失敗パターンと仕様抽出からの再構築の成功パターン">
  <defs>
    <marker id="arrNg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="400" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- タイトル -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, Yu Gothic UI, sans-serif">本番移行の分かれ道：「継ぎ足し改修（NG）」vs.「仕様抽出から再構築（OK）」</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#475569" font-family="BIZ UDPGothic, Yu Gothic UI, sans-serif">リアルライトモックを「使い捨てにしない」とは、コードを流用することではなく「仕様と体験の資産」として渡すこと</text>

  <!-- 左：完成したリアルライトモック -->
  <rect x="28" y="138" width="196" height="148" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="126" y="168" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e3a8a" font-family="BIZ UDPGothic, sans-serif">📄 完成した</text>
  <text x="126" y="188" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e3a8a" font-family="BIZ UDPGothic, sans-serif">リアルライトモック</text>
  <line x1="46" y1="202" x2="206" y2="202" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="126" y="224" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">✅ 体験・UI・手順は検証済</text>
  <text x="126" y="244" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">✅ FBがすべて凝縮</text>
  <text x="126" y="264" text-anchor="middle" font-size="10.5" fill="#b45309" font-family="BIZ UDPGothic, sans-serif">⚠️ 中のコードは泥臭い</text>

  <!-- 分岐矢印（上：NG、下：OK） -->
  <path d="M 224 185 L 262 185 L 262 135 L 298 135" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrNg)"/>
  <path d="M 224 235 L 262 235 L 262 285 L 298 285" fill="none" stroke="#059669" stroke-width="2.8" marker-end="url(#arrOk)"/>

  <!-- 上ルート：NG（継ぎ足し改修） -->
  <rect x="304" y="84" width="632" height="108" rx="12" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
  <rect x="320" y="96" width="176" height="24" rx="12" fill="#dc2626"/>
  <text x="408" y="112" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">❌ NG：継ぎ足し改修</text>
  <text x="510" y="112" font-size="11" font-weight="800" fill="#991b1b" font-family="BIZ UDPGothic, sans-serif">試作コードへの後付け（保守で行き詰まりやすい）</text>

  <rect x="320" y="130" width="274" height="48" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="457" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7f1d1d" font-family="BIZ UDPGothic, sans-serif">単一HTMLの泥臭いコードを直接改造</text>
  <text x="457" y="167" text-anchor="middle" font-size="9.5" fill="#991b1b" font-family="BIZ UDPGothic, sans-serif">認証・エラー処理・APIを無理やり後付け</text>

  <line x1="594" y1="154" x2="622" y2="154" stroke="#dc2626" stroke-width="2" marker-end="url(#arrNg)"/>

  <rect x="628" y="130" width="292" height="48" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="774" y="150" text-anchor="middle" font-size="10.5" font-weight="800" fill="#991b1b" font-family="BIZ UDPGothic, sans-serif">負債の蓄積・セキュリティ穴・保守難</text>
  <text x="774" y="167" text-anchor="middle" font-size="9.5" fill="#7f1d1d" font-family="BIZ UDPGothic, sans-serif">顧客環境での品質・安全性が担保しにくい</text>

  <!-- 下ルート：OK（インプット再構築） -->
  <rect x="304" y="212" width="632" height="128" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.4"/>
  <rect x="320" y="224" width="228" height="24" rx="12" fill="#059669"/>
  <text x="434" y="240" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">✅ OK：仕様を抜き出して再構築</text>
  <text x="562" y="240" font-size="11" font-weight="800" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">使い捨て試作 → 文章の仕様書 → 本番を新規実装</text>

  <rect x="320" y="258" width="274" height="66" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="457" y="278" text-anchor="middle" font-size="10.5" font-weight="800" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">モックから仕様・設計を抜き出す</text>
  <text x="457" y="296" text-anchor="middle" font-size="9.5" fill="#047857" font-family="BIZ UDPGothic, sans-serif">画面遷移・入力項目・AIプロンプト・</text>
  <text x="457" y="311" text-anchor="middle" font-size="9.5" fill="#047857" font-family="BIZ UDPGothic, sans-serif">MCP呼出仕様を AI で整理・文書化</text>

  <line x1="594" y1="291" x2="622" y2="291" stroke="#059669" stroke-width="2.4" marker-end="url(#arrOk)"/>

  <rect x="628" y="258" width="292" height="66" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="774" y="278" text-anchor="middle" font-size="10.5" font-weight="800" fill="#064e3b" font-family="BIZ UDPGothic, sans-serif">本番構成を清潔に新規実装＆テスト</text>
  <text x="774" y="296" text-anchor="middle" font-size="9.5" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">React ＋ Python ＋ DB ＋ Azure AI 等</text>
  <text x="774" y="311" text-anchor="middle" font-size="9.5" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">認証・権限制御・自動テスト付きで構築</text>

  <!-- 下部まとめ -->
  <rect x="28" y="356" width="908" height="30" rx="10" fill="#0f172a"/>
  <text x="482" y="375" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">🛡️ 覚えておく合言葉：「コードは使い捨ててよい。しかしモックに詰まった『体験と仕様』は絶対に捨てず、次の AI への最高インプットにする」</text>
</svg>
