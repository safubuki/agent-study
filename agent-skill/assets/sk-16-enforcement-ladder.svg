<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">強制力のはしご：「必ず」の強さで、置く仕組みを変える</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">上ほど確実。スキルの自動発火は下から 2 段目。「毎回必ず」をスキルの説明文だけに頼るのは、いちばん弱い置き方の 1 つ。</text>
<rect x="28" y="128" width="1144" height="92" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
