<rect x="28" y="752" width="1144" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="50" y="783" font-size="16" font-weight="700" fill="#334155" text-anchor="start">迷ったら</text>
<text x="140" y="783" font-size="15.5" font-weight="700" fill="#5b21b6" text-anchor="start">主語が同じで「子を全部満たす ＝ 親を満たす」なら → 分解</text>
<text x="140" y="810" font-size="15.5" font-weight="700" fill="#1e40af" text-anchor="start">主語が下の部品に変わる・計算や設計判断が入るなら → 導出（根拠も書く）</text>
<rect x="28" y="858" width="1144" height="55" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="886" font-size="16" font-weight="400" fill="#475569" text-anchor="start">分解（containment）は要求の入れ子（所有）で、1 つの要求の親は 1 つ。導出（deriveReqt）は依存関係で、複数の元を持てる。</text>
