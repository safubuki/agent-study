<title id="title">事例 1：全社 AI ワークスペース（絶対ルール → 部署 → 係）</title><desc id="desc">1 つのリポジトリを複数の部署が AI の作業環境として共有する。検査係のファイルを編集すると、L1・L2・L3 が重なって使われる。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="818" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">事例 1：全社 AI ワークスペース（絶対ルール → 部署 → 係）</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">1 つのリポジトリを複数の部署が AI の作業環境として共有する。検査係のファイルを編集すると、L1・L2・L3 が重なって使われる。</text>
<rect x="28" y="128" width="600" height="560" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
<rect x="40" y="139" width="32" height="22" rx="6" fill="#4f46e5" stroke="none"/>
<text x="56" y="154.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">L1</text>
<text x="80" y="155" font-size="15" font-weight="700" fill="#3730a3" text-anchor="start">全社ワークスペース</text>
<text x="42" y="178" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">AGENTS.md・copilot-instructions.md・l1-workspace.json</text>
<text x="42" y="202" font-size="13" font-weight="400" fill="#334155" text-anchor="start">社外秘は編集しない・写さない／個人情報を書かない</text>
<text x="42" y="223" font-size="13" font-weight="400" fill="#334155" text-anchor="start">冒頭に作成日・作成者・出典／公開前は /ws-publish-check</text>
<rect x="46" y="258" width="274" height="410" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<rect x="58" y="269" width="32" height="22" rx="6" fill="#c2410c" stroke="none"/>
<text x="74" y="284.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">L2</text>
<text x="98" y="285" font-size="15" font-weight="700" fill="#9a3412" text-anchor="start">営業部</text>
<text x="60" y="308" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">departments/sales/**</text>
<text x="60" y="332" font-size="13" font-weight="400" fill="#334155" text-anchor="start">価格は価格表の値だけ</text>
<text x="60" y="353" font-size="13" font-weight="400" fill="#334155" text-anchor="start">価格表は編集不可</text>
<text x="60" y="374" font-size="13" font-weight="400" fill="#334155" text-anchor="start">文体の既定：です・ます</text>
<rect x="336" y="258" width="274" height="410" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<rect x="348" y="269" width="32" height="22" rx="6" fill="#c2410c" stroke="none"/>
<text x="364" y="284.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">L2</text>
<text x="388" y="285" font-size="15" font-weight="700" fill="#9a3412" text-anchor="start">品質保証部</text>
<text x="350" y="308" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">departments/qa/**</text>
<text x="350" y="332" font-size="13" font-weight="400" fill="#334155" text-anchor="start">不具合報告の型を使う</text>
<text x="350" y="353" font-size="13" font-weight="400" fill="#334155" text-anchor="start">規格書は編集不可</text>
<text x="350" y="374" font-size="13" font-weight="400" fill="#334155" text-anchor="start">原因は断定しない</text>
<rect x="62" y="418" width="242" height="230" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<rect x="74" y="429" width="32" height="22" rx="6" fill="#0f766e" stroke="none"/>
<text x="90" y="444.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">L3</text>
<text x="114" y="445" font-size="15" font-weight="700" fill="#115e59" text-anchor="start">海外営業係</text>
<text x="76" y="468" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">departments/sales/overseas/**</text>
<text x="76" y="492" font-size="13" font-weight="400" fill="#334155" text-anchor="start">英語で書く</text>
<text x="76" y="513" font-size="13" font-weight="400" fill="#334155" text-anchor="start">（L2 の文体を上書き）</text>
<text x="76" y="534" font-size="13" font-weight="400" fill="#334155" text-anchor="start">USD と JPY を併記</text>
<text x="76" y="555" font-size="13" font-weight="400" fill="#334155" text-anchor="start">日付は YYYY-MM-DD</text>
<rect x="352" y="418" width="242" height="230" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="3.2"/>
<rect x="364" y="429" width="32" height="22" rx="6" fill="#0f766e" stroke="none"/>
<text x="380" y="444.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">L3</text>
<text x="404" y="445" font-size="15" font-weight="700" fill="#115e59" text-anchor="start">検査係</text>
<text x="366" y="468" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">departments/qa/inspection/**</text>
<text x="366" y="492" font-size="13" font-weight="400" fill="#334155" text-anchor="start">1 ロット 1 ファイル</text>
<text x="366" y="513" font-size="13" font-weight="400" fill="#334155" text-anchor="start">署名済み signed/ は編集不可</text>
<text x="366" y="534" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Excel を作らない</text>
<text x="366" y="555" font-size="13" font-weight="400" fill="#334155" text-anchor="start">→ lot-002.md を編集</text>
<rect x="652" y="128" width="520" height="560" rx="12" fill="#fff" stroke="none"/>
