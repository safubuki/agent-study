<text x="600" y="584.5" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle">改善の判断：AI が改善案を出し、評価で確かめ、人がレビューして ① に取り込む</text>
<text x="600" y="605.5" font-size="14" font-weight="400" fill="#334155" text-anchor="middle">②③ は ① を直すための材料。① を自動で書き換え続ける仕組みにはしない</text>
<rect x="28" y="658" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="686" font-size="16" font-weight="400" fill="#475569" text-anchor="start">② の例：Anthropic は PreToolUse フックでスキル利用を記録し、人気のスキルと「発火不足」のスキルを見つけている（公式ブログ）。</text>
<text x="44" y="713" font-size="16" font-weight="400" fill="#475569" text-anchor="start">組織向けには Claude Code の OpenTelemetry イベントや Analytics API（Enterprise）もある。③ は agentskills.io の評価手順に準拠。</text>
