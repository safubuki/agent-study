<title id="title">常時の指示・スキル・フックは「どれか」ではなく「重ねて」使う</title><desc id="desc">常時の指示が索引になってスキルを指し、スキルがスクリプトを動かし、フックが全体を下から支える。互いに置き換えるものではない。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="728" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">常時の指示・スキル・フックは「どれか」ではなく「重ねて」使う</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">常時の指示が索引になってスキルを指し、スキルがスクリプトを動かし、フックが全体を下から支える。互いに置き換えるものではない。</text>
<rect x="28" y="128" width="680" height="80" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
<text x="48" y="160" font-size="16" font-weight="700" fill="#92400e" text-anchor="start">常時の指示（AGENTS.md・copilot-instructions.md）</text>
<text x="48" y="188" font-size="14" font-weight="400" fill="#334155" text-anchor="start">毎回知るべき事実と約束＋「〇〇のときは △△ スキル」の索引。短く。</text>
<path d="M88 210 L88 222" fill="none" stroke="#b45309" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M83.6 214 L88 222 L92.4 214 Z" fill="#b45309" stroke="none"/>
<rect x="28" y="224" width="680" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="48" y="256" font-size="16" font-weight="700" fill="#3730a3" text-anchor="start">パス別の指示（*.instructions.md の applyTo）</text>
<text x="48" y="284" font-size="14" font-weight="400" fill="#334155" text-anchor="start">担当フォルダの約束。そのファイルを扱うときだけ使われる。</text>
<path d="M88 306 L88 318" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M83.6 310 L88 318 L92.4 310 Z" fill="#4f46e5" stroke="none"/>
<rect x="28" y="320" width="680" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="48" y="352" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="start">スキル（.github/skills/〇〇/SKILL.md）</text>
<text x="48" y="380" font-size="14" font-weight="400" fill="#334155" text-anchor="start">複数手順の作業・資料・スクリプト。必要なときだけ読まれる。</text>
<path d="M88 402 L88 414" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M83.6 406 L88 414 L92.4 406 Z" fill="#7c3aed" stroke="none"/>
<rect x="28" y="416" width="680" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="48" y="448" font-size="16" font-weight="700" fill="#065f46" text-anchor="start">スクリプト（スキルの scripts/）</text>
<text x="48" y="476" font-size="14" font-weight="400" fill="#334155" text-anchor="start">決まった処理。中身は読まず、結果だけが文脈に入る。</text>
<path d="M88 498 L88 510" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M83.6 502 L88 510 L92.4 502 Z" fill="#059669" stroke="none"/>
<rect x="28" y="512" width="680" height="80" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="48" y="544" font-size="16" font-weight="700" fill="#9f1239" text-anchor="start">フック・PR の必須チェック</text>
<text x="48" y="572" font-size="14" font-weight="400" fill="#334155" text-anchor="start">破ったら困ることを、AI の判断と関係なく必ず止める。</text>
<rect x="446.5" y="295.5" width="203" height="25" rx="12.5" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="548" y="312.5" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">索引で「どのスキル」かを指す</text>
<rect x="459.5" y="391.5" width="177" height="25" rx="12.5" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="548" y="408.5" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">「scripts/〇〇 を実行」</text>
<rect x="736" y="128" width="436" height="470" rx="12" fill="#fff" stroke="none"/>
<path d="M736 178 V140 Q736 128 748 128 H1160 Q1172 128 1172 140 V178 Z" fill="#eff6ff" stroke="none"/>
<path d="M736 178 H1172" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="736" y="128" width="436" height="470" rx="12" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="754" y="159.5" font-size="16" font-weight="700" fill="#1e40af" text-anchor="start">Q. 文字数制限で漏れるならスキルの方がいい？</text>
<text x="754" y="208" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">A. 役割が違うので、両方使う。</text>
<text x="754" y="236" font-size="14" font-weight="400" fill="#334155" text-anchor="start">・code review の 4,000 字の打ち切りは</text>
<text x="754" y="260" font-size="14" font-weight="400" fill="#334155" text-anchor="start">　2026-06 に撤廃された（古い情報）</text>
<text x="754" y="284" font-size="14" font-weight="400" fill="#334155" text-anchor="start">・ただし常時の指示は毎回の文脈を使い、</text>
<text x="754" y="308" font-size="14" font-weight="400" fill="#334155" text-anchor="start">　長いほど守られにくい（今も有効）</text>
<text x="754" y="332" font-size="14" font-weight="400" fill="#334155" text-anchor="start">・スキルは普段は説明文だけで軽いが、</text>
<text x="754" y="356" font-size="14" font-weight="400" fill="#334155" text-anchor="start">　呼ばれるかは確率的</text>
<text x="754" y="386" font-size="14" font-weight="700" fill="#334155" text-anchor="start">→ 事実と約束：常時の指示（短く）</text>
<text x="754" y="410" font-size="14" font-weight="700" fill="#334155" text-anchor="start">→ 手順・資料：スキル（索引から指す）</text>
<text x="754" y="434" font-size="14" font-weight="700" fill="#334155" text-anchor="start">→ 絶対：フックと必須チェック</text>
<text x="754" y="464" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">これは Claude Code でも同じ考え方</text>
<rect x="28" y="628" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="656" font-size="16" font-weight="400" fill="#475569" text-anchor="start">公式の早見表も、常時の指示は「広い基準」、スキルは「資料つきの複数手順」、フックは「必ず行う動作」と役割を分けている（GitHub Docs）。</text>
<text x="44" y="683" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スキルを入れても常時の指示が要らなくなるわけではない。索引が無いと、AI はスキルの存在に気づきにくい。</text>
</svg>
