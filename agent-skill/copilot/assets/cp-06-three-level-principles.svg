<text x="100" y="229" font-size="15" font-weight="700" fill="#9a3412" text-anchor="start">部署・カテゴリ A</text>
<text x="62" y="252" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">applyTo: area-a/**</text>
