<text x="62" y="180.1" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="94" y="164" font-size="17" font-weight="700" fill="#9f1239" text-anchor="start">決定的に止める・必ず動かす</text>
<text x="94" y="194" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">権限（deny）・フック・CI・管理設定</text>
<text x="760" y="164" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">破ったら事故・損害になること</text>
<text x="760" y="194" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">例：秘密ファイル禁止・必須チェック</text>
<rect x="62" y="230" width="1110" height="92" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
<circle cx="96" cy="276" r="18" fill="#b45309"/>
<text x="96" y="282.1" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="128" y="266" font-size="17" font-weight="700" fill="#92400e" text-anchor="start">毎回見える指示（常時）</text>
<text x="128" y="296" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">CLAUDE.md・AGENTS.md・copilot-instructions.md</text>
<text x="760" y="266" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">毎回知っておくべき事実と約束</text>
<text x="760" y="296" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">例：ビルド方法・命名規則</text>
<rect x="96" y="332" width="1076" height="92" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<circle cx="130" cy="378" r="18" fill="#4f46e5"/>
<text x="130" y="384.1" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="162" y="368" font-size="17" font-weight="700" fill="#3730a3" text-anchor="start">該当ファイルのときは毎回</text>
<text x="162" y="398" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">.claude/rules（paths）・*.instructions.md（applyTo）</text>
<text x="760" y="368" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">特定のフォルダ・種類だけの約束</text>
<text x="760" y="398" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">例：firmware/ の安全規則</text>
<rect x="130" y="434" width="1042" height="92" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<circle cx="164" cy="480" r="18" fill="#7c3aed"/>
<text x="164" y="486.1" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="196" y="470" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="start">合いそうなら呼ばれる（自動）</text>
<text x="196" y="500" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">スキル（説明文で判断・確率的）</text>
<text x="760" y="470" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">必要なときだけ要る手順や知識</text>
<text x="760" y="500" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">例：API の落とし穴・調査手順</text>
<rect x="164" y="536" width="1008" height="92" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
