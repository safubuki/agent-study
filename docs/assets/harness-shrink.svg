<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:12.5px;fill:#374151}
      .s{font-size:11.5px;fill:#6b7280}
      .gone{font-size:12.5px;fill:#9ca3af}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="499" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">モデルが育つと、仕組みは削れる</text>
  <text x="30" y="64" class="s" font-size="13">Anthropic の長時間アプリ開発ハーネスの変遷（2026-03-24 公開の記事をもとに作図）</text>

  <rect x="40" y="84" width="240" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="160" y="109" text-anchor="middle" class="h" fill="#374151">Sonnet 4.5 の頃</text>
  <rect x="330" y="84" width="240" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="450" y="109" text-anchor="middle" class="h" fill="#374151">Opus 4.5</text>
  <rect x="620" y="84" width="240" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="740" y="109" text-anchor="middle" class="h" fill="#374151">Opus 4.6</text>
  <g stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)">
    <line x1="284" y1="104" x2="326" y2="104"/><line x1="574" y1="104" x2="616" y2="104"/>
  </g>

  <!-- column 1 -->
  <g>
    <rect x="40" y="140" width="240" height="38" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="160" y="164" text-anchor="middle" class="b">プランナー</text>
    <rect x="40" y="186" width="240" height="38" rx="8" fill="#d1fae5" stroke="#10b981"/>
    <text x="160" y="210" text-anchor="middle" class="b">ジェネレーター</text>
    <rect x="40" y="232" width="240" height="38" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="160" y="256" text-anchor="middle" class="b">エバリュエーター（毎スプリント）</text>
    <rect x="40" y="278" width="240" height="38" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="160" y="302" text-anchor="middle" class="b">スプリント分割</text>
    <rect x="40" y="324" width="240" height="38" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="160" y="348" text-anchor="middle" class="b">文脈リセット</text>
  </g>

  <!-- column 2 -->
  <g>
    <rect x="330" y="140" width="240" height="38" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="450" y="164" text-anchor="middle" class="b">プランナー</text>
    <rect x="330" y="186" width="240" height="38" rx="8" fill="#d1fae5" stroke="#10b981"/>
    <text x="450" y="210" text-anchor="middle" class="b">ジェネレーター</text>
    <rect x="330" y="232" width="240" height="38" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="450" y="256" text-anchor="middle" class="b">エバリュエーター（毎スプリント）</text>
    <rect x="330" y="278" width="240" height="38" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="450" y="302" text-anchor="middle" class="b">スプリント分割</text>
    <rect x="330" y="324" width="240" height="38" rx="8" fill="none" stroke="#d1d5db" stroke-dasharray="5 4"/>
    <text x="450" y="348" text-anchor="middle" class="gone" text-decoration="line-through">文脈リセット</text>
    <text x="450" y="384" text-anchor="middle" class="s" style="fill:#b91c1c">廃止：文脈が埋まると焦る癖が消えた</text>
  </g>

  <!-- column 3 -->
  <g>
    <rect x="620" y="140" width="240" height="38" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="740" y="164" text-anchor="middle" class="b">プランナー（維持）</text>
    <rect x="620" y="186" width="240" height="38" rx="8" fill="#d1fae5" stroke="#10b981"/>
    <text x="740" y="210" text-anchor="middle" class="b">ジェネレーター</text>
    <rect x="620" y="232" width="240" height="38" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="5 3"/>
    <text x="740" y="256" text-anchor="middle" class="b">エバリュエーター（最後に1回）</text>
    <rect x="620" y="278" width="240" height="38" rx="8" fill="none" stroke="#d1d5db" stroke-dasharray="5 4"/>
    <text x="740" y="302" text-anchor="middle" class="gone" text-decoration="line-through">スプリント分割</text>
    <rect x="620" y="324" width="240" height="38" rx="8" fill="none" stroke="#d1d5db" stroke-dasharray="5 4"/>
    <text x="740" y="348" text-anchor="middle" class="gone" text-decoration="line-through">文脈リセット</text>
    <text x="740" y="384" text-anchor="middle" class="s" style="fill:#b91c1c">廃止：分割しなくても一貫して作れる</text>
  </g>

  <rect x="30" y="404" width="750" height="76" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="48" y="432" class="h" fill="#6d28d9">部品はどれも「モデルが単独ではできないこと」という前提を埋め込んでいる</text>
  <text x="48" y="458" class="b">前提が崩れたら外す。評価役も「今のモデルが単独では確実にこなせない難しさ」のときだけ元が取れる</text>
  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 434) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <!-- soft ground shadow -->
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <!-- far legs, tail -->
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- neck -->
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <!-- near legs (chubby) -->
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <!-- shell -->
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <!-- rim -->
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <!-- head: gazing up-left at the figure -->
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <!-- toes -->
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
