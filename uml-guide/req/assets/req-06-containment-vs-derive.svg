<title id="title">「分解」と「導出」の違い：親子関係の 2 つの作り方</title><desc id="desc">分解は 1 つの要求を同じ目線のまま部分に分けること。導出は分析・計算して、下の階層（部品）の要求を新しく生み出すこと。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="931" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">「分解」と「導出」の違い：親子関係の 2 つの作り方</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">分解は 1 つの要求を同じ目線のまま部分に分けること。導出は分析・計算して、下の階層（部品）の要求を新しく生み出すこと。</text>
