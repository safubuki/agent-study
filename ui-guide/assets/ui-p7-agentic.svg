<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-label="パターン7 Agentic Workspace の本格画面イメージ：出発点の1回のゴール依頼からAIが4ステップ計画を作り、外部送信直前で人間の承認を待つ画面">
  <defs>
    <marker id="p7Arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="840" height="440" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="26" y="32" font-size="15" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">⑦ Agentic / Multi-step Workspace（計画＆承認コンソール型）の画面イメージ</text>
  <rect x="598" y="14" width="218" height="24" rx="12" fill="#b45309"/>
  <text x="707" y="30" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">出典：Microsoft HAX・Google PAIR</text>

  <!-- ブラウザウィンドウ -->
  <rect x="24" y="48" width="792" height="334" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="24" y="48" width="792" height="32" rx="14" fill="#e2e8f0"/>
  <rect x="24" y="66" width="792" height="14" fill="#e2e8f0"/>
  <circle cx="44" cy="64" r="5" fill="#ef4444"/>
  <circle cx="60" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="64" r="5" fill="#22c55e"/>
  <rect x="96" y="54" width="380" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="108" y="68" font-size="10.5" fill="#475569" font-family="Cascadia Code, monospace">🔒 https://agent.kame-cafe.jp/runs/campaign-042</text>

  <!-- アプリヘッダー -->
  <rect x="25" y="80" width="790" height="38" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="38" y="88" width="22" height="22" rx="6" fill="#b45309"/>
  <text x="49" y="103" text-anchor="middle" font-size="12" font-family="sans-serif">🤖</text>
  <text x="68" y="104" font-size="12.5" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">Kame Agent Console</text>
  <rect x="218" y="89" width="128" height="20" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="282" y="103" text-anchor="middle" font-size="10" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">Human-in-the-loop</text>
  <rect x="706" y="89" width="94" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="753" y="103" text-anchor="middle" font-size="10" font-weight="800" fill="#b45309" font-family="BIZ UDPGothic, sans-serif">⏸️ 承認待ち</text>

  <!-- 左：出発点＋AIの実行計画タイムライン -->
  <rect x="25" y="118" width="308" height="263" fill="#0f172a"/>
  <rect x="39" y="130" width="280" height="46" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="50" y="147" font-size="10" font-weight="800" fill="#38bdf8" font-family="BIZ UDPGothic, sans-serif">① 出発点（あなたの 1 回のゴール依頼）</text>
  <text x="50" y="165" font-size="10.5" fill="#f8fafc" font-family="BIZ UDPGothic, sans-serif">「常連客120名に春の150円引きを案内して」</text>

  <text x="41" y="194" font-size="10" font-weight="800" fill="#94a3b8" font-family="BIZ UDPGothic, sans-serif">② AI が自動作成した 4 ステップ実行計画</text>

  <rect x="39" y="202" width="280" height="36" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="224" font-size="11" font-weight="700" fill="#d1fae5" font-family="BIZ UDPGothic, sans-serif">✅ Step 1: 顧客DB検索（120名抽出完了）</text>

  <rect x="39" y="244" width="280" height="36" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="266" font-size="11" font-weight="700" fill="#d1fae5" font-family="BIZ UDPGothic, sans-serif">✅ Step 2: 案内メール下書き作成完了</text>

  <rect x="39" y="286" width="280" height="40" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
  <text x="52" y="304" font-size="11" font-weight="800" fill="#fef3c7" font-family="BIZ UDPGothic, sans-serif">⏸️ Step 3: 外部メール一斉送信</text>
  <text x="52" y="319" font-size="9.5" fill="#fde68a" font-family="BIZ UDPGothic, sans-serif">🛡️ 重要操作の直前で自動停止・承認待ち</text>

  <rect x="39" y="332" width="280" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="353" font-size="11" fill="#94a3b8" font-family="BIZ UDPGothic, sans-serif">⏳ Step 4: 送信監査ログを保存（待機）</text>

  <!-- 右：Human-in-the-loop 承認カード -->
  <rect x="333" y="118" width="482" height="263" fill="#f8fafc"/>
  <path d="M 322 306 L 354 306" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#p7Arr)"/>

  <rect x="360" y="138" width="436" height="224" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="380" y="164" font-size="13" font-weight="800" fill="#b45309" font-family="BIZ UDPGothic, sans-serif">③ 🛡️ 人間の承認ゲート（確認・修正してから送信）</text>
  <rect x="688" y="148" width="90" height="22" rx="11" fill="#f1f5f9"/>
  <text x="733" y="163" text-anchor="middle" font-size="10" font-weight="700" fill="#334155" font-family="BIZ UDPGothic, sans-serif">宛先：120名</text>

  <!-- プレビュー箱 -->
  <rect x="380" y="178" width="396" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="394" y="200" font-size="11" font-weight="700" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">件名：【春限定】宇治抹茶ラテ先行クーポンのお知らせ</text>
  <text x="394" y="224" font-size="11" fill="#334155" font-family="BIZ UDPGothic, sans-serif">本文：春の宇治抹茶ラテ発売！今だけ</text>
  <text x="582" y="224" font-size="11.5" font-weight="800" fill="#be123c" text-decoration="line-through" font-family="BIZ UDPGothic, sans-serif">500円引き(誤記)</text>
  <text x="394" y="248" font-size="11.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">→ 人間がチェックで発見！「150円引き」へ手動修正済み ✅</text>
  <text x="394" y="266" font-size="10" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">※ 承認を押すまで外部へ 1 通も送信されません</text>

  <!-- アクションボタン -->
  <rect x="380" y="290" width="128" height="34" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="444" y="311" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">✏️ 内容を修正</text>
  <rect x="518" y="290" width="166" height="34" rx="9" fill="#059669"/>
  <text x="601" y="311" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">✅ 承認して120名へ送信</text>
  <rect x="694" y="290" width="82" height="34" rx="9" fill="#be123c"/>
  <text x="735" y="311" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">🛑 中止</text>

  <text x="380" y="346" font-size="10" font-weight="700" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">Microsoft HAX G1(計画明示)・G3(適切介入)・G8(却下/中止)・G9(簡単修正)</text>

  <rect x="24" y="394" width="792" height="34" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="415" font-size="11" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">📌 ポイント：1 問 1 答ではなく多段階の自律作業。左で「今どこにいるか」を透明に見せ、右で「危ない操作前だけ人間が承認」する。</text>
</svg>
