<marker id="arrow-process" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="arrow-sdk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="722" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">なぜ見えない？ teamDocs が転送される前に止まる流れ</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">左から右へ 3 つの段階（各列は上から下）で進み、④ の転送チェックで定義が除外される様子を示す。</text>
<rect x="32" y="114" width="352" height="40" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="208" y="141" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">段階 1：Local で利用できていた</text>
<rect x="424" y="114" width="352" height="40" rx="8" fill="#fffbeb" stroke="#b45309"/>
<text x="600" y="141" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle">段階 2：切替後に定義が届かない</text>
<rect x="816" y="114" width="352" height="40" rx="8" fill="#ecfdf5" stroke="#059669"/>
<text x="992" y="141" font-size="17" font-weight="700" fill="#059669" text-anchor="middle">段階 3：移行と起動環境で復旧</text>
<rect x="32" y="174" width="352" height="184" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<circle cx="66" cy="204" r="16" fill="#2563eb"/>
<text x="66" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="92" y="211" font-size="19.5" font-weight="700" fill="#2563eb" text-anchor="start">Local が旧設定を読む</text>
<text x="54" y="246" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">.vscode/mcp.json を読み込み</text>
<text x="54" y="274" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">servers → teamDocs を取得。</text>
<text x="54" y="302" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">認証：Bearer ${input:docs-key}</text>
<line x1="208" y1="358" x2="208" y2="412" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<rect x="32" y="412" width="352" height="184" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<circle cx="66" cy="442" r="16" fill="#2563eb"/>
<text x="66" y="448" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="92" y="449" font-size="19.5" font-weight="700" fill="#2563eb" text-anchor="start">入力解決して接続・検索</text>
<text x="54" y="484" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">VS Code の入力ダイアログで</text>
<text x="54" y="512" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">キーを受け取り HTTP 認証。</text>
<text x="54" y="540" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">検索ツールが一覧に現れ使える。</text>
<path d="M384 504 H404 V266 H424" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-review)"/>
<rect x="424" y="174" width="352" height="184" rx="12" fill="#fffbeb" stroke="#b45309"/>
<circle cx="458" cy="204" r="16" fill="#b45309"/>
<text x="458" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="484" y="211" font-size="19.5" font-weight="700" fill="#b45309" text-anchor="start">Session Target を切替</text>
<text x="446" y="246" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">新チャットで Copilot を選択。</text>
<text x="446" y="274" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">エディタは転送できる定義だけを</text>
<text x="446" y="302" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">選んで Copilot 側へ渡そうとする。</text>
<line x1="600" y1="358" x2="600" y2="412" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-review)"/>
<rect x="424" y="412" width="352" height="184" rx="12" fill="#fffbeb" stroke="#b45309"/>
<circle cx="458" cy="442" r="16" fill="#b45309"/>
<text x="458" y="448" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="484" y="449" font-size="19.5" font-weight="700" fill="#b45309" text-anchor="start">停止：転送前チェックで除外</text>
<text x="446" y="484" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">${input:docs-key} が必要なため</text>
<text x="446" y="512" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">値の解決前に転送対象外となる。</text>
<text x="446" y="540" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">Local で入力済みでも一覧に出ない。</text>
<path d="M776 504 H796 V266 H816" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="816" y="174" width="352" height="184" rx="12" fill="#ecfdf5" stroke="#059669"/>
<circle cx="850" cy="204" r="16" fill="#059669"/>
<text x="850" y="210" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="876" y="211" font-size="19.5" font-weight="700" fill="#059669" text-anchor="start">設定と起動環境を整える</text>
<text x="838" y="246" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">.mcp.json（mcpServers）へ直し</text>
<text x="838" y="274" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">${DOCS_API_KEY} 参照へ変更。</text>
<text x="838" y="302" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">実行先へキー注入 → Host 再起動。</text>
<line x1="992" y1="358" x2="992" y2="412" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="816" y="412" width="352" height="184" rx="12" fill="#ecfdf5" stroke="#059669"/>
<circle cx="850" cy="442" r="16" fill="#059669"/>
<text x="850" y="448" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="876" y="449" font-size="19.5" font-weight="700" fill="#059669" text-anchor="start">新セッションで検索まで確認</text>
<text x="838" y="484" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">新しい Copilot チャットを開き</text>
<text x="838" y="512" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">表示・接続に加えて実際に検索を</text>
<text x="838" y="540" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">呼び出し結果が返るか確かめる。</text>
<rect x="28" y="622" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="650" font-size="16" font-weight="400" fill="#475569" text-anchor="start">teamDocs は固定トークン方式の例。OAuth 対応サーバーなら Copilot 側の OAuth 認証も選べる。</text>
<text x="44" y="677" font-size="16" font-weight="400" fill="#475569" text-anchor="start">入力変数を含まない旧設定など転送できる定義もある。届け方と認証の選び方は次の手順図へ。</text>
</svg>
