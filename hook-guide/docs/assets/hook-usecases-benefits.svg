<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .h{font-size:13px;font-weight:700}
      .b{font-size:11.5px;fill:#374151}
      .s{font-size:11px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="579" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#111827">フックはどんな時に使う？ — 5つの具体的な使いどころとメリット</text>
  <text x="30" y="62" class="s" font-size="13">「AI を使っていてよくある困りごと」を、フックが裏側の自動処理でどう解決するか</text>

  <!-- Column Headers -->
  <rect x="26" y="76" width="256" height="28" rx="6" fill="#f1f5f9"/>
  <text x="154" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">よくある困りごと（フックなし）</text>
  <rect x="302" y="76" width="292" height="28" rx="6" fill="#f1f5f9"/>
  <text x="448" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">フックが自動でやること（仕組み）</text>
  <rect x="614" y="76" width="260" height="28" rx="6" fill="#f1f5f9"/>
  <text x="744" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">あなたが得られるメリット</text>

  <!-- Row 1: Notification / Completion Alert -->
  <rect x="26" y="114" width="256" height="74" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="38" y="136" class="h" fill="#9a3412">① 終わったことに気づかない</text>
  <text x="38" y="156" class="b">長い作業を頼んで別画面を見ていると</text>
  <text x="38" y="174" class="b">完了や確認待ちで放置してしまう</text>
  <line x1="282" y1="151" x2="298" y2="151" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="302" y="114" width="292" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="314" y="136" class="h" fill="#1e40af">完了・確認通知（Notification 等）</text>
  <text x="314" y="156" class="b">止まった瞬間に PC の通知音・Windows</text>
  <text x="314" y="174" class="b">ポップアップ・Slack 通知を自動で鳴らす</text>
  <line x1="594" y1="151" x2="610" y2="151" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="614" y="114" width="260" height="74" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="626" y="136" class="h" fill="#065f46">画面を見張る必要がゼロに！</text>
  <text x="626" y="156" class="b">安心して別作業や休憩ができ、</text>
  <text x="626" y="174" class="b">終わったら音や通知ですぐ戻れる</text>

  <!-- Row 2: Guardrail -->
  <rect x="26" y="198" width="256" height="74" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="38" y="220" class="h" fill="#9a3412">② うっかり破壊・秘密漏洩が怖い</text>
  <text x="38" y="240" class="b">「.env は触るな」と書いたのに AI が</text>
  <text x="38" y="258" class="b">忘れて書き換えたり危険コマンドを叩く</text>
  <line x1="282" y1="235" x2="298" y2="235" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="302" y="198" width="292" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="314" y="220" class="h" fill="#1e40af">実行前の関所（PreToolUse）</text>
  <text x="314" y="240" class="b">保存・実行の「直前」にスクリプトで検査し</text>
  <text x="314" y="258" class="b">禁止ファイルや rm -rf を強制ブロック</text>
  <line x1="594" y1="235" x2="610" y2="235" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="614" y="198" width="260" height="74" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="626" y="220" class="h" fill="#065f46">事故の確率を 0% にできる！</text>
  <text x="626" y="240" class="b">AI の記憶力に頼らず、危ない操作を</text>
  <text x="626" y="258" class="b">物理的に100%防いで安全に任せられる</text>

  <!-- Row 3: Auto Format -->
  <rect x="26" y="282" width="256" height="74" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="38" y="304" class="h" fill="#9a3412">③ コードの書き方が毎回バラつく</text>
  <text x="38" y="324" class="b">インデントや規約違反を毎回人間が</text>
  <text x="38" y="342" class="b">指摘したり手で整形ツールを実行</text>
  <line x1="282" y1="319" x2="298" y2="319" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="302" y="282" width="292" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="314" y="304" class="h" fill="#1e40af">保存直後の自動手入れ（PostToolUse）</text>
  <text x="314" y="324" class="b">AI がファイルを保存した瞬間に Prettier</text>
  <text x="314" y="342" class="b">整形や構文チェックを0.1秒で自動実行</text>
  <line x1="594" y1="319" x2="610" y2="319" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="614" y="282" width="260" height="74" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="626" y="304" class="h" fill="#065f46">手直しゼロ＆トークン節約！</text>
  <text x="626" y="324" class="b">AI に整形を頼む時間と料金が浮き、</text>
  <text x="626" y="342" class="b">常にきれいなコードだけが保存される</text>

  <!-- Row 4: Completion Gate -->
  <rect x="26" y="366" width="256" height="74" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="38" y="388" class="h" fill="#9a3412">④ 「できました」が実は動かない</text>
  <text x="38" y="408" class="b">テスト失敗や必須項目が抜けた状態で</text>
  <text x="38" y="426" class="b">AI が「完了」と作業を終えてしまう</text>
  <line x1="282" y1="403" x2="298" y2="403" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="302" y="366" width="292" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="314" y="388" class="h" fill="#1e40af">完了前の自動テスト（Stop）</text>
  <text x="314" y="408" class="b">完了時にテストを実行し、不合格なら</text>
  <text x="314" y="426" class="b">エラー内容を渡して自動でやり直させる</text>
  <line x1="594" y1="403" x2="610" y2="403" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="614" y="366" width="260" height="74" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="626" y="388" class="h" fill="#065f46">打ち直す手間が消える！</text>
  <text x="626" y="408" class="b">テストに合格した完成品だけが</text>
  <text x="626" y="426" class="b">あなたの手元に届くようになる</text>

  <!-- Row 5: Context & Audit -->
  <rect x="26" y="450" width="256" height="74" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="38" y="472" class="h" fill="#9a3412">⑤ 前提説明や履歴確認が面倒</text>
  <text x="38" y="492" class="b">毎回ブランチ名を伝えたり、AI が裏で</text>
  <text x="38" y="510" class="b">何を触ったか後から追うのが大変</text>
  <line x1="282" y1="487" x2="298" y2="487" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="302" y="450" width="292" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="314" y="472" class="h" fill="#1e40af">文脈注入・監査記録（Prompt / Post）</text>
  <text x="314" y="492" class="b">指示送信時に Git 状態を自動で添え、</text>
  <text x="314" y="510" class="b">実行した全コマンドをログに自動記録する</text>
  <line x1="594" y1="487" x2="610" y2="487" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="614" y="450" width="260" height="74" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="626" y="472" class="h" fill="#065f46">短い指示で動き、履歴も残る！</text>
  <text x="626" y="492" class="b">毎回の前提説明が不要になり、</text>
  <text x="626" y="510" class="b">いつ何を編集したかもすぐ追跡できる</text>

  <text x="26" y="554" class="s">ポイント：すべて自分の PC 上の小さなスクリプト（Node.js や PowerShell 等）で動き、追加の AI 料金はかかりません</text>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 504) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
