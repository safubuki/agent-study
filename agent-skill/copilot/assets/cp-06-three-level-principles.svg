<circle cx="602" cy="340" r="13" fill="#c2410c"/>
<text x="602" y="344.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="620" y="346.5" font-size="16" font-weight="700" fill="#9a3412" text-anchor="start">下は足す・狭めるだけ</text>
<text x="590" y="384" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">絶対ルールを緩める書き方をしない。禁止は足してよい</text>
