    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr3r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="360" height="205" rx="18" fill="url(#bg3)"/>

  <rect x="18" y="58" width="84" height="62" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2.2"/>
  <text x="60" y="82" text-anchor="middle" font-size="18" font-family="sans-serif">🤖</text>
  <text x="60" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">AI の行動</text>
  <text x="60" y="113" text-anchor="middle" font-size="9" fill="#475569" font-family="BIZ UDPGothic, sans-serif">編集・削除</text>

  <path d="M 104 89 L 136 89" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arr3)"/>

  <rect x="142" y="28" width="86" height="122" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2.8"/>
  <rect x="150" y="36" width="70" height="22" rx="8" fill="#fef3c7"/>
  <text x="185" y="51" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">🚧 関所</text>
  <text x="185" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">Hook</text>
  <text x="185" y="98" text-anchor="middle" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">自動プログラム</text>
  <text x="185" y="112" text-anchor="middle" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">で機械判定</text>
  <rect x="154" y="124" width="62" height="18" rx="9" fill="#059669"/>
  <text x="185" y="137" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">100% 厳守</text>

  <path d="M 230 66 L 260 48" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arr3)"/>
  <path d="M 230 112 L 260 130" fill="none" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr3r)"/>

  <rect x="266" y="22" width="78" height="50" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="305" y="43" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">✅ 安全</text>
