<title id="title">例2：チャット送信時に処理し、その後 AI が返答する</title><desc id="desc">ユーザーが送信した直後にフックが動く。通知先アプリを使わず、手元で記録や前提情報の収集を行う例。 列順はユーザー、AI アプリ、AI モデル、フック、作業・検査ツール、通知先アプリ。上から下へ時間が進む。</desc>
