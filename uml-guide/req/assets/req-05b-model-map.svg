<text x="550" y="467.5" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">«deriveReqt»</text>
<path d="M40 176 H276 L290 190 V252 H40 Z" fill="#fff" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M276 176 V190 H290" fill="none" stroke="#be123c" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="54" y="186" width="46" height="24" rx="6" fill="#be123c" stroke="none"/>
<text x="77" y="202.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">要望</text>
<text x="54" y="238" font-size="13.5" font-weight="700" fill="#9f1239" text-anchor="start">「旅行中も植物に水をあげたい」</text>
<path d="M380 214 L292 214" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/>
<path d="M304 207.4 L292 214 L304 220.6" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
