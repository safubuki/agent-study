<text x="44" y="776" font-size="16" font-weight="400" fill="#475569" text-anchor="start">分類は OMG の UML 2.5.1（2017年12月）と SysML 1.7（2024年6月）に基づく。SysML 1.x は UML を拡張した「プロファイル」。</text>
<text x="44" y="803" font-size="16" font-weight="400" fill="#475569" text-anchor="start">SysML v2（2025年9月 正式版）は UML に依存しない新しい土台（KerML）で作り直され、テキスト記法も標準化された。</text>
