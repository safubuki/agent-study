<text x="130" y="206" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Git リポジトリ</text>
<text x="52" y="264" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">SKILL.md・資料・スクリプト</text>
<text x="52" y="292" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">変更は PR でレビュー</text>
<text x="52" y="320" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">タグ・ブランチで版を管理</text>
<text x="52" y="348" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">まずい変更は巻き戻せる</text>
<rect x="44" y="396" width="330" height="92" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/>
