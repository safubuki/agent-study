<title id="title">例4：依頼・作業・返答を経て、終了時の検査で差し戻す</title><desc id="desc">ユーザーが実装を頼むところから始める。返答が得られた後、ターンを終える節目で検査フックが動く。 列順はユーザー、AI アプリ、AI モデル、フック、作業・検査ツール、通知先アプリ。上から下へ時間が進む。</desc>
<defs>
