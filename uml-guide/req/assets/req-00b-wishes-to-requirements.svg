<title id="title">雑多な要望を、要求・要件にまとめる</title><desc id="desc">集まった「〜したい」は、目的・機能・品質と制約・解決策の提案がまざっている。4 つに仕分けてから、主語のある文に直す。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="902" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">雑多な要望を、要求・要件にまとめる</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">集まった「〜したい」は、目的・機能・品質と制約・解決策の提案がまざっている。4 つに仕分けてから、主語のある文に直す。</text>
<rect x="24" y="150" width="1152" height="126" rx="14" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.6"/>
<rect x="24" y="288" width="1152" height="192" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<rect x="24" y="492" width="1152" height="134" rx="14" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.6"/>
<rect x="24" y="638" width="1152" height="134" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.6"/>
<text x="28" y="132" font-size="16" font-weight="700" fill="#9f1239" text-anchor="start">集まった要望（付箋）</text>
<rect x="196" y="114" width="47" height="24" rx="6" fill="#be123c" stroke="none"/>
<text x="219.5" y="130.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">要望</text>
<text x="372" y="132" font-size="16" font-weight="700" fill="#334155" text-anchor="start">仕分けと、やること</text>
<text x="616" y="132" font-size="16" font-weight="700" fill="#1e40af" text-anchor="start">直した文（主語から書く）</text>
<path d="M40 192 H326 L340 206 V232 H40 Z" fill="#fff" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M326 192 V206 H340" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="41" y="193" width="284" height="38" rx="0" fill="#fefce8" stroke="none"/>
<text x="54" y="218" font-size="14" font-weight="700" fill="#713f12" text-anchor="start">「旅行中も植物に水をあげたい」</text>
<rect x="372" y="162" width="220" height="102" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.6"/>
<text x="386" y="189" font-size="16" font-weight="700" fill="#9f1239" text-anchor="start">目的・困りごと</text>
<text x="386" y="213" font-size="13" font-weight="400" fill="#334155" text-anchor="start">「なぜ？」で本当の</text>
<text x="386" y="233" font-size="13" font-weight="400" fill="#334155" text-anchor="start">困りごとを確かめ、</text>
<text x="386" y="253" font-size="13" font-weight="400" fill="#334155" text-anchor="start">利用者の成果にする</text>
<path d="M344 213 L368 213" fill="none" stroke="#be123c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M356 219.6 L368 213 L356 206.4 Z" fill="#be123c" stroke="none"/>
<path d="M594 213 L612 213" fill="none" stroke="#be123c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600 219.6 L612 213 L600 206.4 Z" fill="#be123c" stroke="none"/>
<rect x="616" y="188" width="544" height="50" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
<rect x="628" y="202" width="45" height="22" rx="6" fill="#7c3aed" stroke="none"/>
<text x="650.5" y="217.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">要求</text>
<text x="682" y="218" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="start">REQ-1</text>
<text x="752" y="209" font-size="13" font-weight="400" fill="#334155" text-anchor="start">本機は、利用者が最大7日間留守にしても、</text>
<text x="752" y="228" font-size="13" font-weight="400" fill="#334155" text-anchor="start">鉢植えの植物を水不足で枯らさないこと</text>
<path d="M40 305 H326 L340 319 V345 H40 Z" fill="#fff" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M326 305 V319 H340" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="41" y="306" width="284" height="38" rx="0" fill="#fefce8" stroke="none"/>
<text x="54" y="331" font-size="14" font-weight="700" fill="#713f12" text-anchor="start">「土が乾いたら水をあげて」</text>
<path d="M40 363 H326 L340 377 V403 H40 Z" fill="#fff" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M326 363 V377 H340" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="41" y="364" width="284" height="38" rx="0" fill="#fefce8" stroke="none"/>
<text x="54" y="389" font-size="14" font-weight="700" fill="#713f12" text-anchor="start">「水がなくなったら教えて」</text>
<path d="M40 421 H326 L340 435 V461 H40 Z" fill="#fff" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M326 421 V435 H340" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="41" y="422" width="284" height="38" rx="0" fill="#fefce8" stroke="none"/>
<text x="54" y="447" font-size="14" font-weight="700" fill="#713f12" text-anchor="start">「留守中もスマホで様子を見たい」</text>
<rect x="372" y="300" width="220" height="168" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<text x="386" y="360" font-size="16" font-weight="700" fill="#1e40af" text-anchor="start">機能の要望</text>
<text x="386" y="384" font-size="13" font-weight="400" fill="#334155" text-anchor="start">主語を本機にして、</text>
<text x="386" y="404" font-size="13" font-weight="400" fill="#334155" text-anchor="start">条件と数値をつけ、</text>
<text x="386" y="424" font-size="13" font-weight="400" fill="#334155" text-anchor="start">本機の条件にする</text>
<path d="M344 384 L368 384" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M356 390.6 L368 384 L356 377.4 Z" fill="#2563eb" stroke="none"/>
<path d="M594 384 L612 384" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600 390.6 L612 384 L600 377.4 Z" fill="#2563eb" stroke="none"/>
<rect x="616" y="301" width="544" height="50" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.4"/>
<rect x="628" y="315" width="45" height="22" rx="6" fill="#2563eb" stroke="none"/>
<text x="650.5" y="330.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="682" y="331" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">REQ-1.2</text>
<text x="752" y="322" font-size="13" font-weight="400" fill="#334155" text-anchor="start">本機は、土の水分量が30%未満になってから</text>
<text x="752" y="341" font-size="13" font-weight="400" fill="#334155" text-anchor="start">10分以内に、鉢への給水を始めること</text>
<rect x="616" y="359" width="544" height="50" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.4"/>
<rect x="628" y="373" width="45" height="22" rx="6" fill="#2563eb" stroke="none"/>
<text x="650.5" y="388.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="682" y="389" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">REQ-1.3</text>
<text x="752" y="380" font-size="13" font-weight="400" fill="#334155" text-anchor="start">本機は、タンクの水が尽きる前に、</text>
<text x="752" y="399" font-size="13" font-weight="400" fill="#334155" text-anchor="start">利用者のスマホへ知らせること</text>
<rect x="616" y="417" width="544" height="50" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="682" y="447" font-size="13" font-weight="700" fill="#64748b" text-anchor="start">保留</text>
<text x="752" y="438" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">範囲に入れるかを顧客と決める</text>
<text x="752" y="457" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">（入れるなら要求・要件にする）</text>
<path d="M40 509 H326 L340 523 V549 H40 Z" fill="#fff" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M326 509 V523 H340" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="41" y="510" width="284" height="38" rx="0" fill="#fefce8" stroke="none"/>
<text x="54" y="535" font-size="14" font-weight="700" fill="#713f12" text-anchor="start">「音が静かなのがいい」</text>
<path d="M40 567 H326 L340 581 V607 H40 Z" fill="#fff" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M326 567 V581 H340" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="41" y="568" width="284" height="38" rx="0" fill="#fefce8" stroke="none"/>
<text x="54" y="593" font-size="14" font-weight="700" fill="#713f12" text-anchor="start">「1万円以内で」</text>
<rect x="372" y="504" width="220" height="110" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.6"/>
<text x="386" y="535" font-size="16" font-weight="700" fill="#155e75" text-anchor="start">品質・制約</text>
<text x="386" y="559" font-size="13" font-weight="400" fill="#334155" text-anchor="start">数値と単位をつけて、</text>
<text x="386" y="579" font-size="13" font-weight="400" fill="#334155" text-anchor="start">性能・制約の条件に</text>
<text x="386" y="599" font-size="13" font-weight="400" fill="#334155" text-anchor="start">する</text>
<path d="M344 559 L368 559" fill="none" stroke="#0e7490" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M356 565.6 L368 559 L356 552.4 Z" fill="#0e7490" stroke="none"/>
<path d="M594 559 L612 559" fill="none" stroke="#0e7490" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600 565.6 L612 559 L600 552.4 Z" fill="#0e7490" stroke="none"/>
<rect x="616" y="505" width="544" height="50" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.4"/>
<rect x="628" y="519" width="45" height="22" rx="6" fill="#2563eb" stroke="none"/>
<text x="650.5" y="534.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="682" y="535" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">REQ-2</text>
<text x="752" y="526" font-size="13" font-weight="400" fill="#334155" text-anchor="start">本機は、給水中の運転音を</text>
<text x="752" y="545" font-size="13" font-weight="400" fill="#334155" text-anchor="start">40dB以下にすること（想定値）</text>
<rect x="616" y="563" width="544" height="50" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
<rect x="628" y="577" width="45" height="22" rx="6" fill="#7c3aed" stroke="none"/>
<text x="650.5" y="592.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">要求</text>
<text x="682" y="593" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="start">REQ-3</text>
<text x="752" y="584" font-size="13" font-weight="400" fill="#334155" text-anchor="start">本機は、1万円以下の価格で</text>
<text x="752" y="603" font-size="13" font-weight="400" fill="#334155" text-anchor="start">販売できること</text>
<path d="M40 655 H326 L340 669 V695 H40 Z" fill="#fff" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M326 655 V669 H340" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="41" y="656" width="284" height="38" rx="0" fill="#fefce8" stroke="none"/>
<text x="54" y="681" font-size="14" font-weight="700" fill="#713f12" text-anchor="start">「タイマー式でいいよ」</text>
<path d="M40 713 H326 L340 727 V753 H40 Z" fill="#fff" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M326 713 V727 H340" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="41" y="714" width="284" height="38" rx="0" fill="#fefce8" stroke="none"/>
<text x="54" y="739" font-size="14" font-weight="700" fill="#713f12" text-anchor="start">「ポンプは小さいのがいい」</text>
<rect x="372" y="650" width="220" height="110" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
<text x="386" y="681" font-size="16" font-weight="700" fill="#92400e" text-anchor="start">解決策の提案</text>
<text x="386" y="705" font-size="13" font-weight="400" fill="#334155" text-anchor="start">「なぜ？」で目的に</text>
<text x="386" y="725" font-size="13" font-weight="400" fill="#334155" text-anchor="start">戻して文に置き換え、</text>
<text x="386" y="745" font-size="13" font-weight="400" fill="#334155" text-anchor="start">案は設計の候補へ</text>
<path d="M344 705 L368 705" fill="none" stroke="#b45309" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M356 711.6 L368 705 L356 698.4 Z" fill="#b45309" stroke="none"/>
<path d="M594 705 L612 705" fill="none" stroke="#b45309" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600 711.6 L612 705 L600 698.4 Z" fill="#b45309" stroke="none"/>
<rect x="616" y="651" width="544" height="50" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="682" y="681" font-size="13" font-weight="700" fill="#64748b" text-anchor="start">→</text>
<text x="752" y="672" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">なぜ？「留守中も定期的に水を」</text>
<text x="752" y="691" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">→ REQ-1・REQ-1.2 で表せている</text>
<rect x="616" y="709" width="544" height="50" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="628" y="723" width="45" height="22" rx="6" fill="#059669" stroke="none"/>
<text x="650.5" y="738.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">設計</text>
<text x="682" y="739" font-size="13" font-weight="700" fill="#059669" text-anchor="start">候補</text>
<text x="752" y="730" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">タイマー・ポンプの大きさは</text>
<text x="752" y="749" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">設計の段階で比べて選ぶ</text>
<rect x="28" y="802" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="830" font-size="16" font-weight="400" fill="#475569" text-anchor="start">要望は捨てずに記録しておく。要求・要件の出どころ（«trace»）や設計の候補として残すと、「なぜこの文があるか」をあとでたどれる。</text>
<text x="44" y="857" font-size="16" font-weight="400" fill="#475569" text-anchor="start">まとめた要求・要件は、顧客に「これを満たせば困りごとは解決しますか？」と確かめてから確定する（妥当性確認）。</text>
</svg>
