<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 315" role="img" aria-label="UDフォントの特長とWCAG 2.1/2.2コントラスト比・色覚多様性の配慮図">
  <rect width="840" height="315" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="32" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">誰でも読める文字と配色：UD フォント・WCAG AA (4.5:1)・色覚多様性</text>

  <!-- 左：UD文字とサイズ・行間 -->
  <rect x="20" y="48" width="388" height="248" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="20" y="48" width="388" height="30" rx="14" fill="#2563eb"/>
  <rect x="20" y="64" width="388" height="14" fill="#2563eb"/>
  <text x="36" y="68" font-size="11.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">1. UD（ユニバーサルデザイン）文字・サイズ・行間</text>

  <rect x="34" y="90" width="360" height="68" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="46" y="110" font-size="10" font-weight="800" fill="#1e40af" font-family="BIZ UDPGothic, sans-serif">BIZ UDPGothic 等の UD 書体の工夫</text>
  <text x="46" y="132" font-size="14" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">ば・ぱ・だ　／　0 と O　／　1 と l と I</text>
  <text x="46" y="150" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">濁点が大きく、似た文字・英数字がパッと見分けやすい</text>

  <rect x="34" y="168" width="174" height="112" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="44" y="186" font-size="9.5" font-weight="800" fill="#be123c" font-family="BIZ UDPGothic, sans-serif">❌ 11px・行間 1.2（窮屈）</text>
  <text x="44" y="206" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">春の抹茶ラテのご案内です。</text>
  <text x="44" y="218" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">小さく行が詰まると目が疲れ</text>
  <text x="44" y="230" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">途中で読む気が失せます。</text>
  <text x="44" y="266" font-size="9" font-weight="700" fill="#be123c" font-family="BIZ UDPGothic, sans-serif">行の折り返しで視線が迷子に</text>

  <rect x="218" y="168" width="176" height="112" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="230" y="186" font-size="9.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">✅ 16px・行間 1.8（快適）</text>
  <text x="230" y="210" font-size="12.5" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">春の宇治抹茶ラテ。</text>
  <text x="230" y="234" font-size="12.5" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">余白と行間が広いと</text>
  <text x="230" y="258" font-size="12.5" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">楽に読み進められる。</text>

  <!-- 右：WCAGコントラストと色覚多様性 -->
  <rect x="424" y="48" width="396" height="248" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="424" y="48" width="396" height="30" rx="14" fill="#0f766e"/>
  <rect x="424" y="64" width="396" height="14" fill="#0f766e"/>
  <text x="440" y="68" font-size="11.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">2. WCAG コントラスト比 &amp; 色「だけ」に頼らない設計</text>

  <!-- コントラスト3段 -->
  <rect x="438" y="90" width="368" height="34" rx="8" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  <text x="450" y="111" font-size="11.5" font-weight="700" fill="#b0b8c1" font-family="BIZ UDPGothic, sans-serif">薄すぎるグレー文字（約 2.0 : 1）</text>
  <rect x="696" y="97" width="100" height="20" rx="10" fill="#be123c"/>
  <text x="746" y="111" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">🚫 AA 不合格</text>

  <rect x="438" y="132" width="368" height="34" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="450" y="153" font-size="11.5" font-weight="700" fill="#596370" font-family="BIZ UDPGothic, sans-serif">濃いグレー文字（約 6.0 : 1）</text>
  <rect x="696" y="139" width="100" height="20" rx="10" fill="#059669"/>
  <text x="746" y="153" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">✅ AA 合格(4.5+)</text>

  <rect x="438" y="174" width="368" height="34" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="450" y="195" font-size="11.5" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">くっきり濃紺黒 #0f172a（約 17 : 1）</text>
  <rect x="696" y="181" width="100" height="20" rx="10" fill="#0f766e"/>
  <text x="746" y="195" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">🌟 AAA 合格(7.0+)</text>

  <!-- 色覚多様性 -->
  <rect x="438" y="218" width="368" height="64" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="450" y="236" font-size="9.5" font-weight="800" fill="#115e59" font-family="BIZ UDPGothic, sans-serif">色覚多様性への配慮（赤・緑の見分けが難しい人も安心）</text>
  <text x="450" y="256" font-size="10" fill="#be123c" font-weight="700" font-family="BIZ UDPGothic, sans-serif">❌ 色だけ： ●  ●</text>
  <text x="560" y="256" font-size="9.5" fill="#047857" font-weight="800" font-family="BIZ UDPGothic, sans-serif">✅ 色＋形＋文字：✅ 合格 ／ 🚫 エラー</text>
  <text x="450" y="273" font-size="9" fill="#475569" font-family="BIZ UDPGothic, sans-serif">※ UI部品の枠線・アイコンも背景と 3.0 : 1 以上のコントラストを確保</text>
</svg>
