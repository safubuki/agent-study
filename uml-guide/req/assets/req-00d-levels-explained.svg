<title id="title">答え合わせ：各段は何か、どこに書くか、設計判断はどこで入るか</title><desc id="desc">要望 → 要求 → 要件までは「何を」。本機の作り方（仕様・設計）を決めると、それを部品を主語に書き直した「部品の要件」が生まれる。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="924" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">答え合わせ：各段は何か、どこに書くか、設計判断はどこで入るか</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">要望 → 要求 → 要件までは「何を」。本機の作り方（仕様・設計）を決めると、それを部品を主語に書き直した「部品の要件」が生まれる。</text>
<rect x="160" y="118" width="1012" height="76" rx="12" fill="#fff" stroke="none"/>
<rect x="160" y="118" width="230" height="76" rx="12" fill="#fff1f2" stroke="none"/>
<path d="M390 118 V194" fill="none" stroke="#fecdd3" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="160" y="118" width="1012" height="76" rx="12" fill="none" stroke="#be123c" stroke-width="1.8"/>
<rect x="176" y="129" width="47" height="26" rx="6" fill="#be123c" stroke="none"/>
<text x="199.5" y="146.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">要望</text>
<text x="176" y="178" font-size="16" font-weight="700" fill="#9f1239" text-anchor="start">要望</text>
<text x="408" y="150" font-size="14" font-weight="700" fill="#9f1239" text-anchor="start">「旅行中も植物に水をあげたい」</text>
<text x="860" y="150" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">まだ確かめられない。目的・願い・</text>
<text x="860" y="174" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">解決策の提案がまざっている</text>
<text x="28" y="144" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">置き場所</text>
<text x="28" y="166" font-size="13.5" font-weight="700" fill="#9f1239" text-anchor="start">記録</text>
<text x="28" y="185" font-size="13.5" font-weight="700" fill="#9f1239" text-anchor="start">（図の外）</text>
<path d="M275 196 L275 236" fill="none" stroke="#be123c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M268.4 224 L275 236 L281.6 224 Z" fill="#be123c" stroke="none"/>
<text x="316" y="222" font-size="14.5" font-weight="700" fill="#9f1239" text-anchor="start">整理する</text>
<text x="391.2" y="222" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">「なぜ？」で目的を確かめ、主語を本機にして顧客と合意する</text>
<rect x="160" y="238" width="1012" height="76" rx="12" fill="#fff" stroke="none"/>
<rect x="160" y="238" width="230" height="76" rx="12" fill="#f5f3ff" stroke="none"/>
<path d="M390 238 V314" fill="none" stroke="#ddd6fe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="160" y="238" width="1012" height="76" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="176" y="249" width="47" height="26" rx="6" fill="#7c3aed" stroke="none"/>
<text x="199.5" y="266.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">要求</text>
<text x="176" y="298" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="start">① 上位要求</text>
<text x="408" y="270" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="start">REQ-1 本機は、最大7日間の留守中も、</text>
<text x="408" y="294" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="start">植物を水不足で枯らさないこと</text>
<text x="860" y="270" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">利用者から見た成果。顧客と</text>
<text x="860" y="294" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">「これで解決？」を確かめる</text>
<text x="28" y="264" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">置き場所</text>
<text x="28" y="286" font-size="13.5" font-weight="700" fill="#5b21b6" text-anchor="start">要求図</text>
<path d="M275 316 L275 356" fill="none" stroke="#7c3aed" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M268.4 344 L275 356 L281.6 344 Z" fill="#7c3aed" stroke="none"/>
<text x="316" y="342" font-size="14.5" font-weight="700" fill="#5b21b6" text-anchor="start">分解（⊕）して条件に直す</text>
<text x="509.5" y="342" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">本機を主語にしたまま、確かめられる条件に分ける</text>
<rect x="160" y="358" width="1012" height="76" rx="12" fill="#fff" stroke="none"/>
<rect x="160" y="358" width="230" height="76" rx="12" fill="#eff6ff" stroke="none"/>
<path d="M390 358 V434" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="160" y="358" width="1012" height="76" rx="12" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<rect x="176" y="369" width="47" height="26" rx="6" fill="#2563eb" stroke="none"/>
<text x="199.5" y="386.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="176" y="418" font-size="16" font-weight="700" fill="#1e40af" text-anchor="start">② 下位要求</text>
<text x="408" y="390" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">REQ-1.2 本機は、土の水分量が30%未満</text>
<text x="408" y="414" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">になってから10分以内に給水を始めること</text>
<text x="860" y="390" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">本機を中の見えない箱として、</text>
<text x="860" y="414" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">外から確かめられる条件を書く</text>
<text x="28" y="384" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">置き場所</text>
<text x="28" y="406" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="start">要求図</text>
<path d="M275 436 L275 476" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M268.4 464 L275 476 L281.6 464 Z" fill="#4f46e5" stroke="none"/>
<rect x="300" y="441" width="860" height="30" rx="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="316" y="462" font-size="14.5" font-weight="700" fill="#3730a3" text-anchor="start">★ 本機の作り方を決める</text>
<text x="502.8" y="462" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">振る舞いの取り決め（仕様）と、部品の構成（設計）を決める</text>
<rect x="160" y="478" width="1012" height="76" rx="12" fill="#fff" stroke="none"/>
<rect x="160" y="478" width="230" height="76" rx="12" fill="#eef2ff" stroke="none"/>
<path d="M390 478 V554" fill="none" stroke="#c7d2fe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="160" y="478" width="1012" height="76" rx="12" fill="none" stroke="#4f46e5" stroke-width="1.8"/>
<rect x="176" y="489" width="47" height="26" rx="6" fill="#4f46e5" stroke="none"/>
<text x="199.5" y="506.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">仕様</text>
<rect x="229" y="489" width="47" height="26" rx="6" fill="#059669" stroke="none"/>
<text x="252.5" y="506.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">設計</text>
<text x="176" y="538" font-size="16" font-weight="700" fill="#3730a3" text-anchor="start">本機の作り方</text>
<text x="408" y="510" font-size="14" font-weight="700" fill="#3730a3" text-anchor="start">仕様 S-2 30%未満ならポンプを10秒動かす</text>
<text x="408" y="534" font-size="14" font-weight="700" fill="#3730a3" text-anchor="start">設計 部品は制御部・センサー・ポンプ…</text>
<text x="860" y="510" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">ここで初めて部品が登場する。</text>
<text x="860" y="534" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">仕様は «refine» で要件に結ぶ</text>
<text x="28" y="504" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">置き場所</text>
<text x="28" y="526" font-size="13.5" font-weight="700" fill="#3730a3" text-anchor="start">仕様書・</text>
<text x="28" y="545" font-size="13.5" font-weight="700" fill="#3730a3" text-anchor="start">ブロック定義図</text>
<path d="M275 556 L275 596" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M268.4 584 L275 596 L281.6 584 Z" fill="#2563eb" stroke="none"/>
<text x="316" y="582" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="start">部品を主語に書き直す（導出）</text>
<text x="539.1" y="582" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">本機の仕様・設計から、部品が守る条件を導く（«deriveReqt»）</text>
<rect x="160" y="598" width="1012" height="76" rx="12" fill="#fff" stroke="none"/>
<rect x="160" y="598" width="230" height="76" rx="12" fill="#ecfeff" stroke="none"/>
<path d="M390 598 V674" fill="none" stroke="#a5f3fc" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="160" y="598" width="1012" height="76" rx="12" fill="none" stroke="#0e7490" stroke-width="1.8"/>
<rect x="176" y="609" width="47" height="26" rx="6" fill="#2563eb" stroke="none"/>
<text x="199.5" y="626.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="176" y="658" font-size="16" font-weight="700" fill="#155e75" text-anchor="start">③ 部品への要求</text>
<text x="408" y="630" font-size="14" font-weight="700" fill="#155e75" text-anchor="start">PMP-1 ポンプは、1回に約50mLを送ること</text>
<text x="408" y="654" font-size="14" font-weight="700" fill="#155e75" text-anchor="start">（S-2 の 10秒 × 約5mL/s から導出）</text>
<text x="860" y="630" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">本機の仕様・設計を、部品を</text>
<text x="860" y="654" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">主語にして書き直した条件</text>
<text x="28" y="624" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">置き場所</text>
<text x="28" y="646" font-size="13.5" font-weight="700" fill="#155e75" text-anchor="start">要求図</text>
<path d="M275 676 L275 716" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M268.4 704 L275 716 L281.6 704 Z" fill="#4f46e5" stroke="none"/>
<rect x="300" y="681" width="860" height="30" rx="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="316" y="702" font-size="14.5" font-weight="700" fill="#3730a3" text-anchor="start">★ 部品・ソフトの作り方を決める</text>
<text x="562" y="702" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">各部品の中の仕様と設計を、部品の要件を満たすように決める</text>
<rect x="160" y="718" width="1012" height="76" rx="12" fill="#fff" stroke="none"/>
<rect x="160" y="718" width="230" height="76" rx="12" fill="#ecfdf5" stroke="none"/>
<path d="M390 718 V794" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="160" y="718" width="1012" height="76" rx="12" fill="none" stroke="#059669" stroke-width="1.8"/>
<rect x="176" y="729" width="47" height="26" rx="6" fill="#4f46e5" stroke="none"/>
<text x="199.5" y="746.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">仕様</text>
<rect x="229" y="729" width="47" height="26" rx="6" fill="#059669" stroke="none"/>
<text x="252.5" y="746.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">設計</text>
<text x="176" y="778" font-size="16" font-weight="700" fill="#065f46" text-anchor="start">部品・ソフトの作り方</text>
<text x="408" y="750" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">制御ソフト：クラス図・シーケンス図（03 章）</text>
<text x="408" y="774" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">電源部：5分ごとに起きる省電力モード</text>
<text x="860" y="750" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">各部品の中の作り方。</text>
<text x="860" y="774" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">部品の要件を満たすように決める</text>
<text x="28" y="744" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">置き場所</text>
<text x="28" y="766" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="start">クラス図・</text>
<text x="28" y="785" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="start">シーケンス図など</text>
<rect x="28" y="824" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="852" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「1 段上の仕様が、1 段下の要件になる」。センサーやポンプは «satisfy» から生まれるのではなく、本機の設計で選んだ部品を要件に結ぶ。</text>
<text x="44" y="879" font-size="16" font-weight="400" fill="#475569" text-anchor="start">確かめ方は 2 種類：要件どおりに作れたか（検証 verification）と、その要求で困りごとが解決するか（妥当性確認 validation）。</text>
</svg>
