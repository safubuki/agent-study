<text x="46" y="154.5" font-size="17.5" font-weight="700" fill="#92400e" text-anchor="start">常時の指示：画面ごとに違う</text>
<text x="52" y="202" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="start">GitHub.com（Chat）の優先順</text>
