</defs>
<rect x="1" y="1" width="1198" height="1056" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">Copilot：実行ランタイムが AI モデルと接続する</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Agent Host・Copilot SDK・実行ランタイムは役割が異なり、AI モデルとは最下段の「実行ランタイム」が直接つながる。</text>
<rect x="28" y="206" width="260" height="150" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="158" y="238" font-size="21" font-weight="700" fill="#2563eb" text-anchor="middle">VS Code の画面</text>
<text x="158" y="270" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">依頼を送り、状態を見る</text>
<text x="158" y="297" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">画面と実行を切り離す</text>
<rect x="344" y="124" width="828" height="566" rx="14" fill="#f0fdf4" stroke="#86efac"/>
<text x="368" y="164" font-size="23" font-weight="700" fill="#059669" text-anchor="start">Copilot ハーネスを動かす側（役割の構成図）</text>
<rect x="372" y="212" width="320" height="186" rx="11" fill="#f8fafc" stroke="#64748b"/>
<text x="532" y="244" font-size="23" font-weight="700" fill="#64748b" text-anchor="middle">Agent Host</text>
<text x="532" y="276" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">専用の実行プロセス</text>
<text x="532" y="303" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">セッションを所有・管理する</text>
<text x="532" y="330" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">画面が変わっても作業を保持</text>
<text x="532" y="357" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">対応ハーネスを受け持つ</text>
<rect x="756" y="212" width="388" height="186" rx="11" fill="#eef2ff" stroke="#6366f1"/>
<text x="950" y="244" font-size="23" font-weight="700" fill="#6366f1" text-anchor="middle">Copilot SDK</text>
<text x="950" y="276" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">実行機能を呼ぶための部品・API</text>
<text x="950" y="303" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">プログラムから依頼や操作を渡す</text>
<text x="950" y="330" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Host や AI モデルそのものではない</text>
<line x1="692" y1="302" x2="756" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-process)"/>
<text x="724" y="288" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">利用</text>
<rect x="372" y="490" width="772" height="174" rx="11" fill="#ecfdf5" stroke="#059669"/>
<text x="758" y="522" font-size="23" font-weight="700" fill="#059669" text-anchor="middle">Copilot の実行ランタイム</text>
<text x="758" y="554" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Copilot CLI などと共有する、実際の作業を進める中核</text>
<text x="758" y="581" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">文脈・ツール・承認を管理し、外部の AI モデルへ依頼を送る</text>
<text x="758" y="608" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">SDK が、この実行機能への呼出し口を提供する</text>
<line x1="950" y1="398" x2="950" y2="490" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-sdk)"/>
<text x="966" y="450" font-size="16" font-weight="400" fill="#6366f1" text-anchor="start">実行機能を呼ぶ</text>
<line x1="516" y1="490" x2="516" y2="398" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-harness)"/>
<text x="504" y="450" font-size="16" font-weight="400" fill="#059669" text-anchor="end">状態・結果</text>
<line x1="288" y1="264" x2="372" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<text x="330" y="250" font-size="14" font-weight="400" fill="#2563eb" text-anchor="middle">依頼</text>
<line x1="372" y1="340" x2="288" y2="340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-process)"/>
<text x="330" y="327" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">状態</text>
<rect x="28" y="504" width="260" height="128" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="158" y="536" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">別の対応画面</text>
<text x="158" y="568" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Agents window など</text>
<text x="158" y="595" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">同じセッションを表示できる</text>
<path d="M288 568 H322 V378 H372" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<rect x="480" y="768" width="556" height="136" rx="11" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="758" y="800" font-size="22" font-weight="700" fill="#7c3aed" text-anchor="middle">AI モデル</text>
<text x="758" y="832" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">ランタイムがつながる外部の推論先（クラウド等）</text>
<text x="758" y="859" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">受け取った文脈から案・返答やツール呼び出しを提案する</text>
<line x1="676" y1="664" x2="676" y2="768" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<text x="660" y="734" font-size="15" font-weight="700" fill="#059669" text-anchor="end">推論を依頼</text>
<line x1="840" y1="768" x2="840" y2="664" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-model)"/>
<text x="856" y="734" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start">案・ツール要求</text>
<rect x="28" y="929" width="1144" height="109" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="957" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Agent Host や Copilot SDK ではなく、「Copilot の実行ランタイム」が外部の AI モデルとつながる。</text>
<text x="44" y="984" font-size="16" font-weight="400" fill="#475569" text-anchor="start">図は役割の接続を示す。SDK と実行ランタイムが常に1つの OS プロセスに入る、という配置を断定していない。</text>
<text x="44" y="1011" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Host が動いている間は窓とは独立して継続できる。エディタが提供する道具には、エディタ接続が引き続き必要。</text>
</svg>
