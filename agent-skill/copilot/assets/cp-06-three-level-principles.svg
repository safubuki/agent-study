<title id="title">階層を組む 5 つの原則（GitHub Copilot）</title><desc id="desc">範囲はフォルダで表し、上の階層が「変えてよい点」を決め、下の階層は足す・狭めるだけ。強制は 1 つのフックが全階層を読む。</desc><defs>
</defs>
