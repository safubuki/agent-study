<title id="title">「データベースに貯める」は、性質の違う 3 つに分ける</title><desc id="desc">スキル本体・利用ログ・評価結果は、変わる速さも見る人も違う。1 つの DB にまとめず、それぞれに合う置き場を使う。</desc><defs>
</defs>
