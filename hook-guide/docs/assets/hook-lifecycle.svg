<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:12.5px;fill:#374151}
      .s{font-size:11.5px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="539" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">フックが動くタイミング（ライフサイクル全体図）</text>
  <text x="30" y="64" class="s" font-size="13">★印の4つ（UserPromptSubmit / PreToolUse / PostToolUse / Stop）が実務の主役</text>

  <!-- Row 1: SessionStart -> UserPromptSubmit -> AI Think -->
  <rect x="30" y="92" width="220" height="76" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="140" y="116" text-anchor="middle" class="h" fill="#374151">1. SessionStart</text>
  <text x="140" y="138" text-anchor="middle" class="b">セッション開始・再開時</text>
  <text x="140" y="156" text-anchor="middle" class="s">初期環境や圧縮後ルールの注入</text>

  <line x1="250" y1="130" x2="290" y2="130" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="292" y="92" width="266" height="76" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="425" y="116" text-anchor="middle" class="h" fill="#6d28d9">2. UserPromptSubmit ★</text>
  <text x="425" y="138" text-anchor="middle" class="b">ユーザーが指示を送信した直後</text>
  <text x="425" y="156" text-anchor="middle" class="s">ブランチ名の自動添付・機密送信阻止</text>

  <line x1="558" y1="130" x2="598" y2="130" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="600" y="92" width="270" height="76" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="735" y="122" text-anchor="middle" class="h" fill="#111827">AI エージェントが考える</text>
  <text x="735" y="146" text-anchor="middle" class="b">「どのツールを使うか／完了するか」</text>

  <!-- Tool loop box -->
  <rect x="30" y="196" width="840" height="148" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="48" y="220" class="h" fill="#475569">ツール実行ループ（1回の返答の中で何回でも繰り返す）</text>

  <rect x="46" y="236" width="260" height="90" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="176" y="260" text-anchor="middle" class="h" fill="#b91c1c">3. PreToolUse ★最重要</text>
  <text x="176" y="282" text-anchor="middle" class="b">ツール実行の「直前」</text>
  <text x="176" y="302" text-anchor="middle" class="s">.env 保護・危険操作を exit 2 阻止</text>
  <text x="176" y="318" text-anchor="middle" class="s">（確認画面：4. PermissionRequest）</text>

  <line x1="306" y1="281" x2="342" y2="281" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="342" y="246" width="210" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="447" y="275" text-anchor="middle" class="h" fill="#1e293b">ツール本体を実行</text>
  <text x="447" y="297" text-anchor="middle" class="s">Bash / Write / Edit / MCP</text>

  <line x1="550" y1="281" x2="590" y2="281" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="592" y="236" width="262" height="90" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.8"/>
  <text x="723" y="260" text-anchor="middle" class="h" fill="#047857">5. PostToolUse ★重要</text>
  <text x="723" y="282" text-anchor="middle" class="b">ツール実行の「直後」</text>
  <text x="723" y="302" text-anchor="middle" class="s">Prettier 自動整形・構文検査</text>
  <text x="723" y="318" text-anchor="middle" class="s">違反があればその場で AI へ通知</text>

  <!-- Row 3: Stop & End -->
  <line x1="735" y1="168" x2="735" y2="196" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="445" y1="344" x2="445" y2="376" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="30" y="378" width="246" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="153" y="402" text-anchor="middle" class="h" fill="#b45309">6〜8. 補助イベント</text>
  <text x="153" y="424" text-anchor="middle" class="b">・Notification（通知・確認待ち）</text>
  <text x="153" y="444" text-anchor="middle" class="b">・SubagentStop / PreCompact</text>

  <rect x="304" y="378" width="286" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="447" y="402" text-anchor="middle" class="h" fill="#1d4ed8">9. Stop ★重要（完了ゲート）</text>
  <text x="447" y="424" text-anchor="middle" class="b">AI が「完了」と止まろうとした瞬間</text>
  <text x="447" y="444" text-anchor="middle" class="s">不合格なら decision: block で差し戻し</text>

  <line x1="590" y1="421" x2="634" y2="421" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="636" y="378" width="234" height="86" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="753" y="406" text-anchor="middle" class="h" fill="#374151">10. SessionEnd</text>
  <text x="753" y="428" text-anchor="middle" class="b">セッション終了時</text>
  <text x="753" y="448" text-anchor="middle" class="s">一時ファイル掃除・集計保存</text>

  <text x="30" y="494" class="s">まずは PreToolUse（事前ブロック）、PostToolUse（事後整形）、Stop（完了検査）の3つを押さえれば十分</text>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 474) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
