<text x="718" y="213.5" font-size="15.5" font-weight="700" fill="#1e40af" text-anchor="middle">結果を読む</text>
<text x="718" y="234.5" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">（毎回少し違う）</text>
<text x="48" y="284" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">毎回「再発明」になる。同じ依頼でも書くコードが変わり、結果や形式が揺れる。</text>
