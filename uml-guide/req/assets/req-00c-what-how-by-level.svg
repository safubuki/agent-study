<title id="title">要件か仕様かは「どの箱を主語にするか」で変わる</title><desc id="desc">同じ「待機電力 0.1W 以下」が、本機の設計者には仕様（自分で選んだ作り方）、電源部の設計者には要件（守る条件）になる。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="972" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">要件か仕様かは「どの箱を主語にするか」で変わる</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">同じ「待機電力 0.1W 以下」が、本機の設計者には仕様（自分で選んだ作り方）、電源部の設計者には要件（守る条件）になる。</text>
<rect x="400" y="150" width="400" height="124" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="600" y="180" font-size="13.5" font-weight="700" fill="#64748b" text-anchor="middle">同じ文</text>
<text x="600" y="214" font-size="19" font-weight="700" fill="#334155" text-anchor="middle">待機中の平均消費電力を</text>
<text x="600" y="246" font-size="19" font-weight="700" fill="#334155" text-anchor="middle">0.1W 以下にする</text>
<rect x="28" y="136" width="340" height="152" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="46" y="166" font-size="16" font-weight="700" fill="#3730a3" text-anchor="start">本機の設計者から見ると</text>
<text x="46" y="196" font-size="14" font-weight="400" fill="#334155" text-anchor="start">7日間動かすために、自分で選んだ</text>
<text x="46" y="218" font-size="14" font-weight="400" fill="#334155" text-anchor="start">配分。電池を大きくして待機電力を</text>
<text x="46" y="240" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ゆるめる、という別の手もあった</text>
<rect x="46" y="251" width="120" height="30" rx="6" fill="#4f46e5" stroke="none"/>
<text x="106" y="271" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">これは「仕様」</text>
<rect x="832" y="136" width="340" height="152" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="850" y="166" font-size="16" font-weight="700" fill="#1e40af" text-anchor="start">電源部の設計者から見ると</text>
<text x="850" y="196" font-size="14" font-weight="400" fill="#334155" text-anchor="start">外から決められた、守るべき条件。</text>
<text x="850" y="218" font-size="14" font-weight="400" fill="#334155" text-anchor="start">守らないと本機の要件（7日間）が</text>
<text x="850" y="240" font-size="14" font-weight="400" fill="#334155" text-anchor="start">満たせない。達成方法は自由に選ぶ</text>
<rect x="850" y="251" width="120" height="30" rx="6" fill="#2563eb" stroke="none"/>
<text x="910" y="271" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">これは「要件」</text>
<path d="M368 212 L398 212" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
<path d="M386 218.6 L398 212 L386 205.4 Z" fill="#4f46e5" stroke="none"/>
<path d="M832 212 L802 212" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
<path d="M814 205.4 L802 212 L814 218.6 Z" fill="#2563eb" stroke="none"/>
<text x="28" y="336" font-size="18" font-weight="700" fill="#334155" text-anchor="start">要件 → 仕様 → 要件 → 仕様… と、1 段下りるたびに入れ替わる</text>
<rect x="28" y="356" width="680" height="96" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<rect x="44" y="369" width="51" height="30" rx="6" fill="#2563eb" stroke="none"/>
<text x="69.5" y="389.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="112" y="390" font-size="16" font-weight="700" fill="#1e40af" text-anchor="start">本機への要件（REQ-1.4）</text>
<text x="112" y="416" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">本機は、コンセントなしで 7 日間以上動き続けること</text>
<path d="M88 454 L144 484" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M130.3 484.2 L144 484 L136.5 472.5 Z" fill="#4f46e5" stroke="none"/>
<text x="164" y="476" font-size="14" font-weight="700" fill="#3730a3" text-anchor="start">どう実現する？（本機の設計）</text>
<rect x="84" y="486" width="680" height="96" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<rect x="100" y="499" width="51" height="30" rx="6" fill="#4f46e5" stroke="none"/>
<text x="125.5" y="519.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">仕様</text>
<text x="168" y="520" font-size="16" font-weight="700" fill="#3730a3" text-anchor="start">本機の設計で決めたこと</text>
<text x="168" y="546" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">電池 20Wh を載せ、待機電力を 0.1W 以下に配分する</text>
<text x="168" y="566" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">（0.1W × 24h × 7日 ＝ 16.8Wh ＋ 給水の分）</text>
<path d="M144 584 L200 614" fill="none" stroke="#059669" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M186.3 614.2 L200 614 L192.5 602.5 Z" fill="#059669" stroke="none"/>
<text x="220" y="606" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">★ 同じ内容を、電源部を主語にして書き直す</text>
<rect x="140" y="616" width="680" height="96" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<rect x="156" y="629" width="51" height="30" rx="6" fill="#2563eb" stroke="none"/>
<text x="181.5" y="649.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="224" y="650" font-size="16" font-weight="700" fill="#1e40af" text-anchor="start">電源部への要件（PWR-1）</text>
<text x="224" y="676" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">電源部は、待機中の平均消費電力を 0.1W 以下にすること</text>
<path d="M200 714 L256 744" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M242.3 744.2 L256 744 L248.5 732.5 Z" fill="#4f46e5" stroke="none"/>
<text x="276" y="736" font-size="14" font-weight="700" fill="#3730a3" text-anchor="start">どう実現する？（電源部の設計）</text>
<rect x="196" y="746" width="680" height="96" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<rect x="212" y="759" width="51" height="30" rx="6" fill="#4f46e5" stroke="none"/>
<text x="237.5" y="779.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">仕様</text>
<text x="280" y="780" font-size="16" font-weight="700" fill="#3730a3" text-anchor="start">電源部の設計で決めたこと</text>
<text x="280" y="806" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">5 分ごとにだけ起きる省電力モードにする</text>
<text x="280" y="826" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">（低電力の部品を選ぶなど、別の方法でもよい）</text>
<rect x="900" y="356" width="272" height="486" rx="12" fill="#fff" stroke="none"/>
<path d="M900 402 V368 Q900 356 912 356 H1160 Q1172 356 1172 368 V402 Z" fill="#f8fafc" stroke="none"/>
<path d="M900 402 H1172" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="900" y="356" width="272" height="486" rx="12" fill="none" stroke="#475569" stroke-width="1.6"/>
<text x="918" y="385.5" font-size="17.5" font-weight="700" fill="#334155" text-anchor="start">見分け方</text>
<text x="918" y="432" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="start">その箱の外から</text>
<text x="918" y="455" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="start">決められた条件</text>
<text x="918" y="478" font-size="14" font-weight="400" fill="#334155" text-anchor="start">→ その箱の「要件」</text>
<text x="918" y="512" font-size="14.5" font-weight="700" fill="#3730a3" text-anchor="start">その箱の中で</text>
<text x="918" y="535" font-size="14.5" font-weight="700" fill="#3730a3" text-anchor="start">自分で選んだ作り方</text>
<text x="918" y="558" font-size="14" font-weight="400" fill="#334155" text-anchor="start">→ その箱の「仕様」</text>
<text x="918" y="592" font-size="14" font-weight="700" fill="#334155" text-anchor="start">1 段上の仕様は、</text>
<text x="918" y="615" font-size="14" font-weight="700" fill="#334155" text-anchor="start">1 段下の要件になる</text>
<text x="918" y="649" font-size="13" font-weight="400" fill="#334155" text-anchor="start">SysML では部品の要件も</text>
<text x="918" y="672" font-size="13" font-weight="400" fill="#334155" text-anchor="start">«requirement» で描き、</text>
<text x="918" y="695" font-size="13" font-weight="400" fill="#334155" text-anchor="start">«deriveReqt» と «rationale»</text>
<text x="918" y="718" font-size="13" font-weight="400" fill="#334155" text-anchor="start">で出どころを残す</text>
<rect x="28" y="872" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="900" font-size="16" font-weight="400" fill="#475569" text-anchor="start">要件か仕様かは文の中身だけでは決まらず、どの箱（主語）について書いたかで決まる。数値は説明用の想定値。</text>
<text x="44" y="927" font-size="16" font-weight="400" fill="#475569" text-anchor="start">設計判断から生まれる部品の要件は、システムズエンジニアリングで「派生要求」や「配分された要求」と呼ばれる。</text>
</svg>
