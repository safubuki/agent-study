<text x="946" y="155.5" font-size="17.5" font-weight="700" fill="#065f46" text-anchor="start">scripts/ に置く</text>
<text x="946" y="200" font-size="14" font-weight="400" fill="#334155" text-anchor="start">API・コマンドからの取得</text>
<text x="946" y="225" font-size="14" font-weight="400" fill="#334155" text-anchor="start">大量ファイルの走査・統計</text>
<text x="946" y="250" font-size="14" font-weight="400" fill="#334155" text-anchor="start">CSV / JSON への変換・出力</text>
<text x="946" y="275" font-size="14" font-weight="400" fill="#334155" text-anchor="start">独自ルールの静的解析</text>
<text x="946" y="300" font-size="14" font-weight="400" fill="#334155" text-anchor="start">毎回同じ手順のワークフロー</text>
<text x="946" y="329" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="start">＋ dry-run と --help を用意</text>
<rect x="28" y="338" width="802" height="214" rx="12" fill="#fff" stroke="none"/>
<path d="M28 384 V350 Q28 338 40 338 H818 Q830 338 830 350 V384 Z" fill="#eff6ff" stroke="none"/>
