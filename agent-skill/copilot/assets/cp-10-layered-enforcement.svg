<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">階層つきの強制：1 つのフックが全階層のポリシーを読む</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">編集しようとしたファイルの場所から、範囲に入るポリシー（L1・L2・L3）を集め、どれか 1 つでも禁止なら止める。許可するキーは無い。</text>
