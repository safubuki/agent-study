<rect x="1" y="1" width="1198" height="1288" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">環境変数で復旧：設定 → 起動環境 → 接続 → 検索</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">上から下へ時間が進む。起動環境を整えてから Host を再起動し、最後に検索結果を確かめる。</text>
<rect x="316" y="104" width="566" height="1040" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
