<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-label="段階2：記録の受け口はGitHubのまま、分析する人がruns/を集計用DBに取り込み、SQLとダッシュボードで見る構成と流れ">
