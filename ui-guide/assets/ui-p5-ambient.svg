<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-label="パターン5 Ambient Invisible ML の本格画面イメージ：AIボタンなしの通常メール画面でゴーストテキスト予測補完と自動分類が裏側で動く">
  <rect width="840" height="440" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="26" y="32" font-size="15" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">⑤ Ambient / Invisible ML（不可視・先回り型）の画面イメージ</text>
  <rect x="572" y="14" width="244" height="24" rx="12" fill="#0f766e"/>
  <text x="694" y="30" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">出典：Apple HIG (Invisible)・NN/g</text>

  <!-- ブラウザウィンドウ -->
  <rect x="24" y="48" width="792" height="334" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="24" y="48" width="792" height="32" rx="14" fill="#e2e8f0"/>
  <rect x="24" y="66" width="792" height="14" fill="#e2e8f0"/>
  <circle cx="44" cy="64" r="5" fill="#ef4444"/>
  <circle cx="60" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="64" r="5" fill="#22c55e"/>
  <rect x="96" y="54" width="360" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="108" y="68" font-size="10.5" fill="#475569" font-family="Cascadia Code, monospace">🔒 https://mail.kame-cafe.jp/compose</text>

  <!-- アプリヘッダー -->
  <rect x="25" y="80" width="790" height="40" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="38" y="89" width="24" height="22" rx="6" fill="#0284c7"/>
  <text x="50" y="104" text-anchor="middle" font-size="12" font-family="sans-serif">✉️</text>
  <text x="70" y="105" font-size="12.5" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">Kame Mail</text>
  <rect x="150" y="90" width="210" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="255" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#334155" font-family="BIZ UDPGothic, sans-serif">通常のメール画面（AIチャット欄なし）</text>

  <text x="738" y="104" text-anchor="end" font-size="10.5" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">③ 先回り予測(OFF可):</text>
  <rect x="746" y="89" width="52" height="22" rx="11" fill="#0f766e"/>
  <text x="772" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">ON</text>

  <!-- 左：いつものメール作成画面 -->
  <rect x="25" y="120" width="536" height="261" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="42" y="144" font-size="11" font-weight="700" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">宛先</text>
  <text x="94" y="144" font-size="11.5" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">常連会員グループ（120名）</text>
  <line x1="42" y1="154" x2="544" y2="154" stroke="#f1f5f9"/>

  <text x="42" y="174" font-size="11" font-weight="700" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">件名</text>
  <text x="94" y="174" font-size="12" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">【春限定】宇治抹茶ラテ先行試飲のご案内</text>
  <line x1="42" y1="184" x2="544" y2="184" stroke="#f1f5f9"/>

  <!-- 本文欄（ゴーストテキスト予測補完） -->
  <rect x="42" y="196" width="502" height="128" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="218" font-size="11.5" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">いつも Kame Cafe をご愛顧いただきありがとうございます。</text>
  <text x="56" y="242" font-size="11.5" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">① 普通に打ち始める：3月1日より「春の宇治抹茶ラテ」を発売いたします。</text>
  <rect x="56" y="252" width="474" height="44" rx="7" fill="#e0f2fe" stroke="#7dd3fc" stroke-dasharray="4 3"/>
  <text x="66" y="270" font-size="11" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">会員様限定で 150円引きクーポンをご用意いたしましたので、ぜひこの機会に</text>
  <text x="66" y="288" font-size="11" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">ご賞味ください。  [Tabで採用 ／ Escで無視]</text>
  <text x="56" y="314" font-size="10" font-weight="800" fill="#0f766e" font-family="BIZ UDPGothic, sans-serif">↑ ② 裏側の AI が文脈を読み、続きの文章を薄文字（ゴーストテキスト）で先回り提案</text>

  <rect x="42" y="336" width="166" height="30" rx="8" fill="#0f766e"/>
  <text x="125" y="355" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">⇥ Tab で予測補完を採用</text>
  <rect x="218" y="336" width="114" height="30" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="275" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">✕ Esc で無視</text>

  <!-- 右サイドバー：裏側で静かに動く処理 -->
  <rect x="561" y="120" width="254" height="261" fill="#f8fafc"/>
  <text x="576" y="144" font-size="11" font-weight="800" fill="#115e59" font-family="BIZ UDPGothic, sans-serif">🌫️ 後ろ側で静かに動く AI</text>
  <text x="576" y="160" font-size="10" fill="#475569" font-family="BIZ UDPGothic, sans-serif">（Invisible ML：操作不要で自動判定）</text>

  <rect x="576" y="174" width="224" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="588" y="194" font-size="10" font-weight="700" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">自動カテゴリ分類</text>
  <rect x="588" y="202" width="142" height="22" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="659" y="217" text-anchor="middle" font-size="10" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">🏷️ 季節プロモーション</text>

  <rect x="576" y="242" width="224" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="588" y="262" font-size="10" font-weight="700" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">送信前リスク自動検知</text>
  <text x="588" y="284" font-size="11" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">✅ 割引額 150円（規定内）</text>

  <text x="576" y="324" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">※ Tab採用／Esc無視そのものが、</text>
  <text x="576" y="340" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">　Google PAIRの言う暗黙的(Implicit)</text>
  <text x="576" y="356" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">　フィードバックとして学習に活きる。</text>

  <rect x="24" y="394" width="792" height="34" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="40" y="415" font-size="10" font-weight="700" fill="#115e59" font-family="BIZ UDPGothic, sans-serif">📌 ポイント：AI を意識させずに助ける王道。Apple HIG 原則どおり先回り(Proactive)は外すと不快なので「OFF切替＋即無視」が必須。</text>
</svg>
