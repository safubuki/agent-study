<text x="921" y="558.32" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">本書では扱わない</text>
<text x="858" y="592" font-size="17.5" font-weight="700" fill="#334155" text-anchor="start">Copilot クラウドエージェント</text>
<text x="858" y="622" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">GitHub 上（Issue 依頼など）で動作</text>
<rect x="28" y="676" width="1144" height="78" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="705" font-size="15" font-weight="400" fill="#475569" text-anchor="start">旧 Local ハーネスは非推奨（2027 年 2 月までに削除予定）。新規に試す場合は VS Code の Session Target → Copilot（推奨）を選ぶ。</text>
<text x="44" y="731" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Copilot ハーネスと Copilot CLI は同じ実行ランタイムを共有し、委任ツールは task になる（個人設定や拡張ツールは別管理）。</text>
