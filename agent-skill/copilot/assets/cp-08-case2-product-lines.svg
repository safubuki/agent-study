<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">事例 2：製品づくり（絶対の作り方 → 製品カテゴリ → 顧客）</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">指示（文章）に加えて設定値も L1 → L2 → L3 の順に重ねる。どの値をどの階層で決めたかが表で分かる。</text>
