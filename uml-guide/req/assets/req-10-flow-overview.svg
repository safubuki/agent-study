<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">全体の流れ：声 → 要求図 → 仕様 → 構造と振る舞い → 確認</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">各段階で「問い」と「成果物」が変わる。作った物は、点線の関係（トレース）でいつでも要件へたどれるようにしておく。</text>
