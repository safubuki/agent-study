<text x="626" y="320" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">schematic.md の表</text>
<text x="626" y="343" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">C1：定格 63 V</text>
