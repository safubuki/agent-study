<text x="738" y="666" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">ルールセット・必須チェック（CI）</text>
<rect x="28" y="714" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="742" font-size="16" font-weight="400" fill="#475569" text-anchor="start">優先：Claude Code は CLAUDE.md が足し算、スキルは「管理＞個人＞プロジェクト」。Copilot は GitHub.com で「個人＞リポジトリ＞組織」。</text>
<text x="44" y="769" font-size="16" font-weight="400" fill="#475569" text-anchor="start">詳しくは claude/・copilot/ の各ガイド。パスは GitHub Docs・VS Code Docs・Claude Code Docs（2026-11-18 確認）による。</text>
