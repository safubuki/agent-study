<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">「データベースに貯める」は、性質の違う 3 つに分ける</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スキル本体・利用ログ・評価結果は、変わる速さも見る人も違う。1 つの DB にまとめず、それぞれに合う置き場を使う。</text>
