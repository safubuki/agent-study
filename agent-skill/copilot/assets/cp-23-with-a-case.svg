<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">同じ回路図・同じ手順でも、人が案件 C-2026-031（ACME 社・48 V）を指定すると入力電圧が上書きされ、C1 の判定が変わる。</text>
