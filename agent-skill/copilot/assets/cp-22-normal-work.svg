<text x="925" y="250.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="947" y="251" font-size="15" font-weight="700" fill="#9a3412" text-anchor="start">書き方をそろえる</text>
