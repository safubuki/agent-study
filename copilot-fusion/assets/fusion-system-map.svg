<text x="44" y="798" font-size="16" font-weight="400" fill="#475569" text-anchor="start">図は論理上の役割分担。選択ロジックを独立した物理サーバーや固定のモデル構成として断定していない。</text>
<text x="44" y="825" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Fusion はサブエージェントとは別の仕組み。初稿や批評を経ても、ユーザーが受け取る最終返答は1つ。</text>
