<text x="44" y="818" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Fusion Standard は通常1モデル。Fusion を選んだからといって、必ず複数のモデルが同時に働くわけではない。</text>
<text x="44" y="845" font-size="16" font-weight="400" fill="#475569" text-anchor="start">図は機能の概念比較。使える effort・モデル・機能は、契約・管理ポリシー・クライアントの提供状況で変わる。</text>
