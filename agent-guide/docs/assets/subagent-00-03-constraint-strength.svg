<text x="32" y="46" font-size="26.5" font-weight="700" fill="#0f172a" text-anchor="start">「指定したタスクだけやらせる」制約の強さと確実性</text>
<text x="32" y="76" font-size="15.5" font-weight="400" fill="#475569" text-anchor="start">tools や権限で仕組みから物理的に縛る方法と、本文の文章でお願いする方法の違い</text>
<rect x="36" y="124" width="550" height="366" rx="14" fill="#ecfdf5" fill-opacity="0.4" stroke="#059669" stroke-width="1.6"/>
<rect x="52" y="136" width="211" height="30" rx="15" fill="#059669" stroke="none"/>
<text x="157.5" y="156.5" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">強い制約（仕組みで縛る）</text>
<rect x="56" y="186" width="246" height="114" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
<text x="179" y="221.63" font-size="16.5" font-weight="700" fill="#065f46" text-anchor="middle">tools で道具を絞る</text>
<text x="179" y="247.41" font-size="13.5" font-weight="400" fill="#475569" text-anchor="middle">例：Write を与えなければ</text>
<text x="179" y="269.41" font-size="13.5" font-weight="400" fill="#475569" text-anchor="middle">ファイルに書けない</text>
<rect x="320" y="186" width="246" height="114" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
<text x="443" y="232.63" font-size="16.5" font-weight="700" fill="#065f46" text-anchor="middle">権限設定で</text>
<text x="443" y="258.41" font-size="16.5" font-weight="400" fill="#065f46" text-anchor="middle">特定コマンドを禁止</text>
<path d="M179 300 V336 H443 V300" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
<line x1="311" y1="336" x2="311" y2="372" stroke="#059669" stroke-width="2" marker-end="url(#arrow-rule)"/>
<rect x="106" y="372" width="410" height="86" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
<rect x="456" y="361" width="46" height="22" rx="11" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>
<text x="479" y="376.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">強制</text>
<text x="311" y="405.18" font-size="19" font-weight="700" fill="#065f46" text-anchor="middle">確実性が高い</text>
<text x="311" y="434.26" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">物理的に道具がないため違反が起きない</text>
<rect x="614" y="124" width="550" height="366" rx="14" fill="#fffbeb" fill-opacity="0.4" stroke="#b45309" stroke-width="1.6"/>
<rect x="630" y="136" width="211" height="30" rx="15" fill="#b45309" stroke="none"/>
<text x="735.5" y="156.5" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">弱い制約（お願いベース）</text>
<rect x="654" y="186" width="470" height="114" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="889" y="232.85" font-size="17.5" font-weight="700" fill="#92400e" text-anchor="middle">本文に「〇〇だけやれ」と書く</text>
<text x="889" y="259.95" font-size="14.5" font-weight="400" fill="#475569" text-anchor="middle">AI は概ね従うが完璧ではない</text>
<line x1="889" y1="300" x2="889" y2="372" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-warn)"/>
<rect x="684" y="372" width="410" height="86" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<rect x="1034" y="361" width="46" height="22" rx="11" fill="#b45309" stroke="#ffffff" stroke-width="1.5"/>
<text x="1057" y="376.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">指示</text>
<text x="889" y="404.96" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">柔軟だが確実性は中程度</text>
<text x="889" y="432.72" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">長い作業では指示を逸脱することがある</text>
<rect x="28" y="516" width="1144" height="78" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="46" y="545" font-size="15" font-weight="400" fill="#475569" text-anchor="start">・「やってはいけないこと」は本文の禁止事項だけに頼らず、tools から書き込み系や Bash を外して道具を取り上げるのが一番確実。</text>
<text x="46" y="570" font-size="15" font-weight="400" fill="#475569" text-anchor="start">・たとえば読み取り専用にするなら tools: Read, Grep, Glob のように絞ったうえで、本文の指示と併用する。</text>
</svg>
