<text x="626" y="714" font-size="17.5" font-weight="700" fill="#92400e" text-anchor="start">実演</text>
<text x="626" y="736" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Demonstration</text>
<text x="626" y="776" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">動かして見せる</text>
<text x="626" y="799" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">例）アプリで設定を変える</text>
