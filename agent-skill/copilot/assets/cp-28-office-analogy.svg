<title id="title">たとえ：Copilot の仕組みを、会社の書類と道具に置き換えると</title><desc id="desc">指示ファイルは「読むもの」、フックは「物理的に止めるもの」。同じ「ルール」でも、効き方がまったく違う 7 種類に分かれる。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="908" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">たとえ：Copilot の仕組みを、会社の書類と道具に置き換えると</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">指示ファイルは「読むもの」、フックは「物理的に止めるもの」。同じ「ルール」でも、効き方がまったく違う 7 種類に分かれる。</text>
<rect x="28" y="124" width="1144" height="40" rx="10" fill="#475569" stroke="none"/>
<text x="44" y="150" font-size="14" font-weight="700" fill="#fff" text-anchor="start">仕組み</text>
<text x="236" y="150" font-size="14" font-weight="700" fill="#fff" text-anchor="start">会社でたとえると</text>
<text x="640" y="150" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Copilot のファイル</text>
<text x="958" y="150" font-size="14" font-weight="700" fill="#fff" text-anchor="start">いつ効くか</text>
<rect x="28" y="172" width="1144" height="70" rx="8" fill="#f8fafc" stroke="none"/>
<rect x="40" y="190" width="180" height="34" rx="8" fill="#b45309" stroke="none"/>
<text x="130" y="212" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">常時の指示</text>
<text x="236" y="202" font-size="15.5" font-weight="700" fill="#92400e" text-anchor="start">就業規則・全社通達</text>
<text x="236" y="226" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">誰でも毎回目を通す。短く大事なことだけ</text>
<text x="640" y="202" font-size="13" font-weight="700" fill="#334155" text-anchor="start">AGENTS.md</text>
<text x="640" y="224" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">copilot-instructions.md</text>
<text x="958" y="214" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">毎回</text>
<rect x="28" y="248" width="1144" height="70" rx="8" fill="#fff" stroke="none"/>
<rect x="40" y="266" width="180" height="34" rx="8" fill="#2563eb" stroke="none"/>
<text x="130" y="288" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">パス別の指示</text>
<text x="236" y="278" font-size="15.5" font-weight="700" fill="#1e40af" text-anchor="start">部署の業務マニュアル</text>
<text x="236" y="302" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">その部署の書類を扱うときだけ開く</text>
<text x="640" y="278" font-size="13" font-weight="700" fill="#334155" text-anchor="start">.github/instructions/</text>
<text x="640" y="300" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">*.instructions.md（applyTo）</text>
<text x="958" y="290" font-size="13" font-weight="700" fill="#1e40af" text-anchor="start">その場所のファイルを扱うとき</text>
<rect x="28" y="324" width="1144" height="70" rx="8" fill="#f8fafc" stroke="none"/>
<rect x="40" y="342" width="180" height="34" rx="8" fill="#7c3aed" stroke="none"/>
<text x="130" y="364" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">スキル</text>
<text x="236" y="354" font-size="15.5" font-weight="700" fill="#5b21b6" text-anchor="start">手順書・チェックリスト</text>
<text x="236" y="378" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">必要な作業のときだけ棚から出す</text>
<text x="640" y="354" font-size="13" font-weight="700" fill="#334155" text-anchor="start">.github/skills/</text>
<text x="640" y="376" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">&lt;名前&gt;/SKILL.md</text>
<text x="958" y="366" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="start">説明文が合うとき・/名前</text>
<rect x="28" y="400" width="1144" height="70" rx="8" fill="#fff" stroke="none"/>
<rect x="40" y="418" width="180" height="34" rx="8" fill="#7c3aed" stroke="none"/>
<text x="130" y="440" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">手動の指示</text>
<text x="236" y="430" font-size="15.5" font-weight="700" fill="#5b21b6" text-anchor="start">案件ごとの指示書</text>
<text x="236" y="454" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">担当者が「この案件です」と手渡す</text>
<text x="640" y="430" font-size="13" font-weight="700" fill="#334155" text-anchor="start">cases/&lt;番号&gt;/CASE.md</text>
<text x="640" y="452" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">/case-context &lt;番号&gt;</text>
<text x="958" y="442" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="start">人が渡したときだけ</text>
<rect x="28" y="476" width="1144" height="70" rx="8" fill="#f8fafc" stroke="none"/>
<rect x="40" y="494" width="180" height="34" rx="8" fill="#0e7490" stroke="none"/>
<text x="130" y="516" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">エージェント</text>
<text x="236" y="506" font-size="15.5" font-weight="700" fill="#155e75" text-anchor="start">担当の役割</text>
<text x="236" y="530" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">「今日は検査担当」と役を決めて始める</text>
<text x="640" y="506" font-size="13" font-weight="700" fill="#334155" text-anchor="start">.github/agents/</text>
<text x="640" y="528" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">&lt;名前&gt;.agent.md</text>
<text x="958" y="518" font-size="13" font-weight="700" fill="#155e75" text-anchor="start">人が役を選んだとき</text>
<rect x="28" y="552" width="1144" height="70" rx="8" fill="#fff" stroke="none"/>
<rect x="40" y="570" width="180" height="34" rx="8" fill="#be123c" stroke="none"/>
<text x="130" y="592" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">強制</text>
<text x="236" y="582" font-size="15.5" font-weight="700" fill="#9f1239" text-anchor="start">鍵のかかった棚</text>
<text x="236" y="606" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">注意書きではなく、物理的に開かない</text>
<text x="640" y="582" font-size="13" font-weight="700" fill="#334155" text-anchor="start">.github/hooks/</text>
<text x="640" y="604" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">＋ policies/*.json</text>
<text x="958" y="594" font-size="13" font-weight="700" fill="#9f1239" text-anchor="start">書き込みのたびに必ず</text>
<rect x="28" y="628" width="1144" height="70" rx="8" fill="#f8fafc" stroke="none"/>
<rect x="40" y="646" width="180" height="34" rx="8" fill="#475569" stroke="none"/>
<text x="130" y="668" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">変更の関所</text>
<text x="236" y="658" font-size="15.5" font-weight="700" fill="#334155" text-anchor="start">承認印</text>
<text x="236" y="682" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">決まった人の判子がないと通らない</text>
<text x="640" y="658" font-size="13" font-weight="700" fill="#334155" text-anchor="start">CODEOWNERS</text>
<text x="640" y="680" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">＋ ルールセット</text>
<text x="958" y="670" font-size="13" font-weight="700" fill="#334155" text-anchor="start">PR を出したとき</text>
<rect x="28" y="708" width="1144" height="70" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.6"/>
<text x="48" y="738" font-size="14.5" font-weight="700" fill="#9f1239" text-anchor="start">上の 5 つ（読むもの）は「守られやすいが保証はない」、下の 2 つ（止めるもの）は「必ず効く」。</text>
<text x="48" y="762" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">絶対に守らせたいことは、マニュアルに書いたうえで鍵（フック）か承認印（必須チェック）でも止める。</text>
<rect x="28" y="808" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="836" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ルールの階層（L1〜L4）は、このうち「マニュアル（パス別の指示）」の重なりで作るのが基本。鍵と承認印は、どの階層でも同じ仕組みで使う。</text>
<text x="44" y="863" font-size="16" font-weight="400" fill="#475569" text-anchor="start">色は、ほかの図の「仕組み」の色と同じ。早見表（cp-20）やファイル構成図（cp-11・13・18）のチップの色と対応している。</text>
</svg>
