<rect x="34" y="2013" width="1132" height="99" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="48" y="2040" font-size="16" font-weight="400" fill="#475569" text-anchor="start">対象ツールや引数は環境で異なる。編集ツールの検査だけでは、シェル経由の書き込みまで覆えない。</text>
<text x="48" y="2067" font-size="16" font-weight="400" fill="#475569" text-anchor="start">成功後のフックは実行済みの操作を取り消さない。整形後の最新ファイルは、必要に応じて AI に再読込させる。</text>
<text x="48" y="2094" font-size="16" font-weight="400" fill="#475569" text-anchor="start">通知先アプリはこの例では使わない。ユーザー・AI アプリ・AI モデルの列は、ほかの図と同じ位置・色。</text>
