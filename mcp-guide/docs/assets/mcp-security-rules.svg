<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:12px;fill:#374151}
      .s{font-size:11px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="499" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#111827">知っておくべき2大注意点 — トークン消費とセキュリティ3原則</text>
  <text x="30" y="60" class="s" font-size="12.5">「入れすぎによるコスト・精度悪化」と「悪意あるサーバー・秘密情報の漏洩」を防ぐ基本ルール</text>

  <!-- Section 1: Token Bloat -->
  <rect x="26" y="78" width="848" height="122" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="44" y="104" class="h" fill="#9a3412">注意点①：MCP サーバーの「入れすぎ」はトークン浪費と選択ミスの原因になる</text>

  <rect x="44" y="118" width="380" height="68" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="58" y="142" class="b" font-weight="700" fill="#c2410c">× 20個も30個も常時つなぐと…</text>
  <text x="58" y="162" class="s">・質問する前からツール説明書だけで数万トークンを消費</text>
  <text x="58" y="178" class="s">・似た名前のツールが並び、AI がどれを使うか迷って間違える</text>

  <line x1="428" y1="152" x2="468" y2="152" stroke="#059669" stroke-width="2.2" marker-end="url(#ah-g)"/>

  <rect x="472" y="118" width="384" height="68" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="486" y="142" class="b" font-weight="700" fill="#065f46">◎ 快適・低コストに使う対策</text>
  <text x="486" y="162" class="s">・常時つなぐのは本当に使う 2〜3個（10〜15ツール以内）に絞る</text>
  <text x="486" y="178" class="s">・特定作業用はサブエージェントに隔離 / Tool Search を活用</text>

  <!-- Section 2: Security 3 Rules -->
  <rect x="26" y="216" width="848" height="218" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="242" class="h" fill="#1e293b">注意点②：セキュリティの3原則（野良サーバー・権限・パスワード）</text>

  <!-- Row 1 -->
  <rect x="44" y="256" width="380" height="48" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="58" y="276" class="b" font-weight="700" fill="#9f1239">NG 1：素性の知れない野良サーバーをそのまま実行</text>
  <text x="58" y="294" class="s">説明文に隠し命令を仕込む Tool Poisoning 攻撃の危険</text>
  <line x1="428" y1="280" x2="468" y2="280" stroke="#059669" stroke-width="2" marker-end="url(#ah-g)"/>
  <rect x="472" y="256" width="384" height="48" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="486" y="276" class="b" font-weight="700" fill="#065f46">OK 1：公式サーバーか中身の読めるコードだけを使う</text>
  <text x="486" y="294" class="s">npx 実行時も勝手な更新を防ぐためバージョンを固定する</text>

  <!-- Row 2 -->
  <rect x="44" y="314" width="380" height="48" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="58" y="334" class="b" font-weight="700" fill="#9f1239">NG 2：検索だけなのに削除・更新権限まで渡す</text>
  <text x="58" y="352" class="s">プロンプトインジェクションで本番 DB を壊される危険</text>
  <line x1="428" y1="338" x2="468" y2="338" stroke="#059669" stroke-width="2" marker-end="url(#ah-g)"/>
  <rect x="472" y="314" width="384" height="48" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="486" y="334" class="b" font-weight="700" fill="#065f46">OK 2：読み取り専用（Read-Only）を基本にする</text>
  <text x="486" y="352" class="s">必要な検索・計算関数だけを公開し、書き込みは人間が承認</text>

  <!-- Row 3 -->
  <rect x="44" y="372" width="380" height="48" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="58" y="392" class="b" font-weight="700" fill="#9f1239">NG 3：.mcp.json に生の API キーやパスワードを書く</text>
  <text x="58" y="410" class="s">Git にコミットした瞬間に秘密情報がチーム外へ漏洩</text>
  <line x1="428" y1="396" x2="468" y2="396" stroke="#059669" stroke-width="2" marker-end="url(#ah-g)"/>
  <rect x="472" y="372" width="384" height="48" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="486" y="392" class="b" font-weight="700" fill="#065f46">OK 3：環境変数 ${API_KEY} や VS Code inputs を使う</text>
  <text x="486" y="410" class="s">設定ファイルには変数名だけ書き、実体のキーは書かない</text>

  <text x="30" y="464" class="s">出典：Anthropic (2025)、Invariant Labs (2025)、OWASP MCP Top 10 をもとに筆者作成</text>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 436) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>