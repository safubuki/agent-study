<text x="44" y="556" font-size="16" font-weight="400" fill="#475569" text-anchor="start">CODEOWNERS とルールセット（必須レビュー・必須ステータスチェック）は GitHub の標準機能。サンプルは product-repo/.github/CODEOWNERS。</text>
<text x="44" y="583" font-size="16" font-weight="400" fill="#475569" text-anchor="start">必須チェックの例：shared/skill-catalog（--strict）と shared/external-assets の check-large-files.js を PR ごとに実行する。</text>
