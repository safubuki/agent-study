<marker id="arrow-sdk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="866" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">個別モデル・Auto・Fusion・サブエージェントの仕組みの違い</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「モデル選び・協調の方式（左）」と「別担当への作業分割（右）」はまったく別の役割</text>
<rect x="28" y="120" width="760" height="624" rx="14" fill="#f8fafc" stroke="#93c5fd"/>
<rect x="44" y="134" width="728" height="38" rx="8" fill="#dbeafe" stroke="none"/>
<text x="408" y="160" font-size="19" font-weight="700" fill="#1e40af" text-anchor="middle">同じ会話の中で「どのモデルに・どう考えさせるか」</text>
<rect x="44" y="188" width="728" height="122" rx="10" fill="#fff" stroke="#cbd5e1"/>
<rect x="60" y="204" width="132" height="30" rx="15" fill="#e2e8f0" stroke="none"/>
<text x="126" y="225" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">① 個別モデル</text>
<text x="60" y="262" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">自分で 1体 を固定指定</text>
<text x="60" y="290" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">必要なら手動で切り替える</text>
<rect x="330" y="214" width="190" height="68" rx="9" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="425" y="245" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">指定した 1モデル</text>
<text x="425" y="269" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">常にこれだけで処理</text>
<line x1="520" y1="248" x2="620" y2="248" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-model)"/>
<rect x="620" y="218" width="132" height="60" rx="9" fill="#eff6ff" stroke="#2563eb"/>
<text x="686" y="254" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">返答を返す</text>
<rect x="44" y="324" width="728" height="122" rx="10" fill="#fff" stroke="#cbd5e1"/>
<rect x="60" y="340" width="132" height="30" rx="15" fill="#dbeafe" stroke="none"/>
<text x="126" y="361" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">② Auto</text>
<text x="60" y="398" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">AI が最適な 1体 を自動選択</text>
<text x="60" y="426" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">複数モデルの批評は行わない</text>
<rect x="316" y="356" width="112" height="56" rx="9" fill="#eff6ff" stroke="#2563eb"/>
<text x="372" y="390" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">自動判定</text>
<line x1="428" y1="384" x2="462" y2="384" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<rect x="462" y="350" width="136" height="68" rx="9" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="530" y="380" font-size="15.5" font-weight="700" fill="#7c3aed" text-anchor="middle">選んだ 1モデル</text>
<text x="530" y="404" font-size="13.5" font-weight="400" fill="#475569" text-anchor="middle">1体で最後まで</text>
<line x1="598" y1="384" x2="626" y2="384" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-model)"/>
<rect x="626" y="356" width="126" height="56" rx="9" fill="#eff6ff" stroke="#2563eb"/>
<text x="689" y="390" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">返答を返す</text>
<rect x="44" y="460" width="728" height="268" rx="12" fill="#ecfdf5" stroke="#059669"/>
<rect x="60" y="476" width="132" height="30" rx="15" fill="#059669" stroke="none"/>
<text x="126" y="497" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">③ Fusion</text>
<text x="60" y="534" font-size="17" font-weight="700" fill="#065f46" text-anchor="start">難易度と effort に応じて</text>
<text x="60" y="562" font-size="17" font-weight="700" fill="#065f46" text-anchor="start">モデル選び＋工程を自動設計</text>
<text x="60" y="598" font-size="14" font-weight="400" fill="#374151" text-anchor="start">・Standard：基本は 1モデル</text>
<text x="60" y="624" font-size="14" font-weight="400" fill="#374151" text-anchor="start">・High / Max：必要に応じ</text>
<text x="60" y="648" font-size="14" font-weight="400" fill="#374151" text-anchor="start">　判定・並列批評で質を向上</text>
<text x="60" y="686" font-size="14" font-weight="700" fill="#059669" text-anchor="start">※ 最終返答は必ず 1つ</text>
<rect x="318" y="480" width="436" height="64" rx="8" fill="#fff" stroke="#a7f3d0"/>
<text x="334" y="518" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Single</text>
<text x="416" y="518" font-size="15" font-weight="400" fill="#334155" text-anchor="start">1つのモデルだけで手早く解決</text>
<rect x="318" y="554" width="436" height="72" rx="8" fill="#fff" stroke="#a7f3d0"/>
<text x="334" y="586" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Cascade</text>
<text x="432" y="584" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">効率モデルで下書き → Judge が判定</text>
<text x="432" y="610" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="start">不合格なら 強いモデル へ引き継ぎ</text>
<rect x="318" y="636" width="436" height="76" rx="8" fill="#fff" stroke="#a7f3d0"/>
<text x="334" y="668" font-size="16" font-weight="700" fill="#059669" text-anchor="start">Critique</text>
<text x="432" y="666" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">生成モデルが下書き → 複数モデルが批評</text>
<text x="432" y="694" font-size="14.5" font-weight="700" fill="#7c3aed" text-anchor="start">指摘を集約して 元のモデルが修正</text>
<rect x="812" y="120" width="360" height="624" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
<rect x="828" y="134" width="328" height="38" rx="8" fill="#ede9fe" stroke="none"/>
<text x="992" y="160" font-size="18" font-weight="700" fill="#5b21b6" text-anchor="middle">別作業員へ「仕事そのものを分担」</text>
<rect x="840" y="188" width="304" height="54" rx="9" fill="#fff" stroke="#c4b5fd"/>
<text x="992" y="221" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="middle">④ サブエージェント</text>
<rect x="856" y="262" width="272" height="72" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="992" y="294" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">親エージェント</text>
<text x="992" y="326" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">作業を別担当へ切り出す</text>
<path d="M992 334 V358 H912 V382" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-model)"/>
<path d="M992 334 V358 H1072 V382" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-model)"/>
<rect x="836" y="382" width="148" height="108" rx="9" fill="#fff" stroke="#7c3aed"/>
<text x="910" y="414" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">子エージェント A</text>
<text x="910" y="442" font-size="13.5" font-weight="400" fill="#475569" text-anchor="middle">独立した文脈で</text>
<text x="910" y="466" font-size="13.5" font-weight="400" fill="#475569" text-anchor="middle">調査・作業を実行</text>
<rect x="1000" y="382" width="148" height="108" rx="9" fill="#fff" stroke="#7c3aed"/>
<text x="1074" y="414" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">子エージェント B</text>
<text x="1074" y="442" font-size="13.5" font-weight="400" fill="#475569" text-anchor="middle">独立した文脈で</text>
<text x="1074" y="466" font-size="13.5" font-weight="400" fill="#475569" text-anchor="middle">別タスクを並行</text>
<path d="M910 490 V518 H992 V540" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-model)"/>
<path d="M1074 490 V518 H992 V540" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-model)"/>
<rect x="856" y="540" width="272" height="74" rx="11" fill="#ecfdf5" stroke="#059669"/>
<text x="992" y="572" font-size="17" font-weight="700" fill="#059669" text-anchor="middle">親が結果を統合</text>
<text x="992" y="604" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">各担当の報告をまとめて回答</text>
<rect x="836" y="632" width="312" height="92" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
<text x="992" y="662" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">Fusion との大事な違い</text>
<text x="992" y="690" font-size="14" font-weight="400" fill="#374151" text-anchor="middle">Fusion はサブエージェントを</text>
<text x="992" y="712" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">自動で増やす機能ではない</text>
<rect x="28" y="766" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="794" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Fusion の Critique は「1つの案への批評と修正」であり、作業を別担当に分割するサブエージェントとは別の仕組み。</text>
<text x="44" y="821" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Auto・Fusion で使える機能や effort 段階は、契約プラン・組織ポリシー・クライアントの更新状況により変わる。</text>
</svg>
