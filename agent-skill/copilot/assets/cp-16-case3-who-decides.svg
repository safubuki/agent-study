<text x="44" y="802" font-size="16" font-weight="400" fill="#475569" text-anchor="start">割り当ての正本は AGENTS.md の表と product-rules.json（値の「変えてよい点」と、part／case のどちらで変えてよいか）。</text>
<text x="44" y="829" font-size="16" font-weight="400" fill="#475569" text-anchor="start">軸が 3 つ以上になっても考え方は同じ：場所で表せる軸は applyTo、表せない軸は手動の読み込み、値は 1 つの正本から順に上書き。</text>
