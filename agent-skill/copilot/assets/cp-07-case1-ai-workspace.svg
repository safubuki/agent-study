<rect x="680" y="196" width="32" height="22" rx="6" fill="#4f46e5" stroke="none"/>
<text x="696" y="211.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L1</text>
<text x="722" y="212" font-size="13" font-weight="400" fill="#334155" text-anchor="start">AGENTS.md・copilot-instructions.md（常に）</text>
<rect x="670" y="232" width="484" height="34" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/>
<rect x="680" y="238" width="32" height="22" rx="6" fill="#4f46e5" stroke="none"/>
<text x="696" y="253.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L1</text>
<text x="722" y="254" font-size="13" font-weight="400" fill="#334155" text-anchor="start">ポリシー l1-workspace.json（社外秘）</text>
<rect x="670" y="274" width="484" height="34" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/>
<rect x="680" y="280" width="32" height="22" rx="6" fill="#4f46e5" stroke="none"/>
<text x="696" y="295.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L1</text>
<text x="722" y="296" font-size="13" font-weight="400" fill="#334155" text-anchor="start">スキル ws-weekly-report・/ws-publish-check</text>
<rect x="670" y="316" width="484" height="34" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<rect x="680" y="322" width="32" height="22" rx="6" fill="#c2410c" stroke="none"/>
<text x="696" y="337.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L2</text>
<text x="722" y="338" font-size="13" font-weight="400" fill="#334155" text-anchor="start">l2-dept-qa.instructions.md（applyTo 一致）</text>
<rect x="670" y="358" width="484" height="34" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<rect x="680" y="364" width="32" height="22" rx="6" fill="#c2410c" stroke="none"/>
<text x="696" y="379.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L2</text>
<text x="722" y="380" font-size="13" font-weight="400" fill="#334155" text-anchor="start">ポリシー l2-qa.json（規格書）</text>
<rect x="670" y="400" width="484" height="34" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<rect x="680" y="406" width="32" height="22" rx="6" fill="#c2410c" stroke="none"/>
<text x="696" y="421.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L2</text>
<text x="722" y="422" font-size="13" font-weight="400" fill="#334155" text-anchor="start">スキル qa-defect-report</text>
<rect x="670" y="442" width="484" height="34" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<rect x="680" y="448" width="32" height="22" rx="6" fill="#0f766e" stroke="none"/>
<text x="696" y="463.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L3</text>
<text x="722" y="464" font-size="13" font-weight="400" fill="#334155" text-anchor="start">l3-team-qa-inspection.instructions.md</text>
