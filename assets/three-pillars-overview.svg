<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px;fill:#374151}
      .s{font-size:11.5px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="579" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">サブエージェント・フック・MCP の役割と使い分け（全体像）</text>
  <text x="30" y="64" class="s" font-size="13">AI コーディングエージェント（Claude Code / GitHub Copilot）を拡張する3つの仕組み</text>

  <!-- Center Top: Main Agent -->
  <rect x="270" y="84" width="360" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="450" y="109" text-anchor="middle" class="h" fill="#0f172a">メインエージェント（AI 本人）</text>
  <text x="450" y="129" text-anchor="middle" class="s">あなたと会話し、計画・判断・コード編集を行う中心</text>

  <!-- Arrows from Main Agent to 3 pillars -->
  <g stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)">
    <line x1="330" y1="140" x2="165" y2="188"/>
    <line x1="450" y1="140" x2="450" y2="188"/>
    <line x1="570" y1="140" x2="735" y2="188"/>
  </g>
  <rect x="170" y="152" width="120" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="230" y="167" text-anchor="middle" class="s">仕事を分担・委任</text>
  <rect x="382" y="152" width="136" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="450" y="167" text-anchor="middle" class="s">実行前後に自動介入</text>
  <rect x="610" y="152" width="120" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="670" y="167" text-anchor="middle" class="s">共通規格で外へ接続</text>

  <!-- Pillar 1: Subagents -->
  <rect x="30" y="192" width="266" height="270" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <rect x="46" y="208" width="234" height="32" rx="6" fill="#ede9fe"/>
  <text x="163" y="229" text-anchor="middle" class="h" fill="#5b21b6">① サブエージェント（agent-guide）</text>
  <text x="46" y="262" class="h" fill="#4c1d95" font-size="13.5">例え：別室で調べる「専門の部下」</text>
  <text x="46" y="286" class="b">・正体：別の記憶枠を持つ <tspan font-weight="700">AI モデル</tspan></text>
  <text x="46" y="309" class="b">・誰が呼ぶ：AI が必要と判断したとき</text>
  <rect x="46" y="324" width="234" height="72" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="58" y="345" font-weight="700" font-size="12.5" fill="#5b21b6">いつ使う？</text>
  <text x="58" y="365" class="b">・大量調査で親の文脈を汚したくない</text>
  <text x="58" y="384" class="b">・まっさらな目でレビューさせたい</text>
  <rect x="46" y="406" width="234" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="58" y="424" class="s" fill="#991b1b">注意：1体ごとにトークンが増える。</text>
  <text x="58" y="440" class="s" fill="#991b1b">「書く作業」の並列分担は食い違いやすい</text>

  <!-- Pillar 2: Hooks -->
  <rect x="317" y="192" width="266" height="270" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <rect x="333" y="208" width="234" height="32" rx="6" fill="#d1fae5"/>
  <text x="450" y="229" text-anchor="middle" class="h" fill="#065f46">② フック（hook-guide）</text>
  <text x="333" y="262" class="h" fill="#065f46" font-size="13.5">例え：駅の改札・工場の「自動検品機」</text>
  <text x="333" y="286" class="b">・正体：決まった規則の <tspan font-weight="700">スクリプト</tspan></text>
  <text x="333" y="309" class="b">・誰が呼ぶ：保存・完了時に <tspan font-weight="700">100%自動発火</tspan></text>
  <rect x="333" y="324" width="234" height="72" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="345" y="345" font-weight="700" font-size="12.5" fill="#065f46">いつ使う？</text>
  <text x="345" y="365" class="b">・危険操作（.env編集等）を確実に阻止</text>
  <text x="345" y="384" class="b">・保存後の自動整形・完了前の自動検査</text>
  <rect x="333" y="406" width="234" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="345" y="424" class="s" fill="#991b1b">注意：重い処理を入れると毎回待たされる。</text>
  <text x="345" y="440" class="s" fill="#991b1b">Stopフックは無限ループ防止が必須</text>

  <!-- Pillar 3: MCP -->
  <rect x="604" y="192" width="266" height="270" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <rect x="620" y="208" width="234" height="32" rx="6" fill="#dbeafe"/>
  <text x="737" y="229" text-anchor="middle" class="h" fill="#1e40af">③ MCP（mcp-guide）</text>
  <text x="620" y="262" class="h" fill="#1e3a8a" font-size="13.5">例え：外付け機器をつなぐ「USB-C 規格」</text>
  <text x="620" y="286" class="b">・正体：外部とつなぐ <tspan font-weight="700">共通通信プロトコル</tspan></text>
  <text x="620" y="309" class="b">・誰が呼ぶ：AI が外部道具を使いたいとき</text>
  <rect x="620" y="324" width="234" height="72" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="632" y="345" font-weight="700" font-size="12.5" fill="#1e40af">いつ使う？</text>
  <text x="632" y="365" class="b">・Figma / Notion / Sentry 等の外部連携</text>
  <text x="632" y="384" class="b">・ブラウザ自動操作や社内DBの安全検索</text>
  <rect x="620" y="406" width="234" height="42" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="632" y="424" class="s" fill="#991b1b">注意：サーバーを入れすぎると道具の</text>
  <text x="632" y="440" class="s" fill="#991b1b">説明書だけでコンテキストを圧迫する</text>

  <!-- Bottom takeaway bar -->
  <rect x="30" y="480" width="748" height="62" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="48" y="504" class="h" fill="#92400e" font-size="14">迷ったときの選び方（3秒判断）</text>
  <text x="48" y="527" class="b">・「別室で調べさせたい」→ ① サブエージェント　／　「100%自動で強制したい」→ ② フック　／　「外部ツール・データに繋ぎたい」→ ③ MCP</text>

  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 494) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
