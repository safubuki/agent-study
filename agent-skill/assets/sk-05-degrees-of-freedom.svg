<title id="title">自然言語とスクリプトの使い分け：「自由度」のものさし</title><desc id="desc">崖に挟まれた細い橋（間違えると事故）ほどスクリプトで固定し、見晴らしのよい野原（やり方が何通りもある）ほど文章で方針だけ渡す。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="576" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">自然言語とスクリプトの使い分け：「自由度」のものさし</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">崖に挟まれた細い橋（間違えると事故）ほどスクリプトで固定し、見晴らしのよい野原（やり方が何通りもある）ほど文章で方針だけ渡す。</text>
<rect x="28" y="132" width="380" height="46" rx="12" fill="#2563eb" stroke="none"/>
<text x="218" y="162" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">自由度：高い</text>
<rect x="410" y="132" width="380" height="46" rx="12" fill="#7c3aed" stroke="none"/>
<text x="600" y="162" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">自由度：中くらい</text>
<rect x="792" y="132" width="380" height="46" rx="12" fill="#059669" stroke="none"/>
<text x="982" y="162" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">自由度：低い</text>
<text x="28" y="208" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="start">← 見晴らしのよい野原：AI に任せる</text>
<text x="1172" y="208" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="end">崖の間の細い橋：決めた通りに →</text>
<rect x="28" y="232" width="380" height="214" rx="12" fill="#fff" stroke="none"/>
<path d="M28 278 V244 Q28 232 40 232 H396 Q408 232 408 244 V278 Z" fill="#eff6ff" stroke="none"/>
<path d="M28 278 H408" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="232" width="380" height="214" rx="12" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="46" y="261.5" font-size="17.5" font-weight="700" fill="#1e40af" text-anchor="start">文章で方針を書く</text>
<text x="46" y="308" font-size="14" font-weight="400" fill="#334155" text-anchor="start">書き方：目的・制約・観点を文章で</text>
<text x="46" y="331" font-size="14" font-weight="400" fill="#334155" text-anchor="start">例：「構造・不具合・読みやすさの</text>
<text x="46" y="354" font-size="14" font-weight="400" fill="#334155" text-anchor="start">　　順にレビューし、根拠を添える」</text>
<text x="46" y="383" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">向く：判断が主・やり方が複数ある</text>
<text x="46" y="406" font-size="14" font-weight="400" fill="#334155" text-anchor="start">設計レビュー・文章の推敲・調査</text>
<rect x="410" y="232" width="380" height="214" rx="12" fill="#fff" stroke="none"/>
<path d="M410 278 V244 Q410 232 422 232 H778 Q790 232 790 244 V278 Z" fill="#f5f3ff" stroke="none"/>
<path d="M410 278 H790" fill="none" stroke="#ddd6fe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="410" y="232" width="380" height="214" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
<text x="428" y="261.5" font-size="17.5" font-weight="700" fill="#5b21b6" text-anchor="start">型や引数つきで渡す</text>
<text x="428" y="308" font-size="14" font-weight="400" fill="#334155" text-anchor="start">書き方：雛形・疑似コード・引数つき</text>
<text x="428" y="331" font-size="14" font-weight="400" fill="#334155" text-anchor="start">例：「template.md を使い、</text>
<text x="428" y="354" font-size="14" font-weight="400" fill="#334155" text-anchor="start">　　必要に応じて節を足してよい」</text>
<text x="428" y="383" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="start">向く：好ましい型はあるが揺れてよい</text>
<text x="428" y="406" font-size="14" font-weight="400" fill="#334155" text-anchor="start">報告書・設定ファイルの生成</text>
<rect x="792" y="232" width="380" height="214" rx="12" fill="#fff" stroke="none"/>
<path d="M792 278 V244 Q792 232 804 232 H1160 Q1172 232 1172 244 V278 Z" fill="#ecfdf5" stroke="none"/>
<path d="M792 278 H1172" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="792" y="232" width="380" height="214" rx="12" fill="none" stroke="#059669" stroke-width="1.6"/>
<text x="810" y="261.5" font-size="17.5" font-weight="700" fill="#065f46" text-anchor="start">スクリプトをそのまま実行</text>
<text x="810" y="308" font-size="14" font-weight="400" fill="#334155" text-anchor="start">書き方：コマンドを 1 行で固定</text>
<text x="810" y="331" font-size="14" font-weight="400" fill="#334155" text-anchor="start">例：「python scripts/migrate.py</text>
<text x="810" y="354" font-size="14" font-weight="400" fill="#334155" text-anchor="start">　　--verify を、引数を変えずに実行」</text>
<text x="810" y="383" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">向く：壊れやすい・毎回同じ結果が要る</text>
<text x="810" y="406" font-size="14" font-weight="400" fill="#334155" text-anchor="start">移行・集計・形式チェック・変換</text>
<rect x="28" y="476" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="504" font-size="16" font-weight="400" fill="#475569" text-anchor="start">この「自由度（degrees of freedom）」と橋・野原のたとえは、Anthropic 公式「Skill authoring best practices」による。</text>
<text x="44" y="531" font-size="16" font-weight="400" fill="#475569" text-anchor="start">1 つのスキルの中で混ぜるのが普通：判断は文章（高）、出力は型紙（中）、集計と検証はスクリプト（低）。</text>
</svg>
