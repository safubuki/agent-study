<text x="1036" y="196" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">指示から案・返答を考える</text>
<text x="1036" y="223" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">必要な道具の利用を提案</text>
