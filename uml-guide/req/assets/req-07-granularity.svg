<text x="76" y="671.5" font-size="17.5" font-weight="700" fill="#3730a3" text-anchor="start">主語を揃える</text>
<text x="46" y="716" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">兄弟の要求は同じ対象</text>
<text x="46" y="739" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">（本機・ポンプ…）を</text>
<text x="46" y="762" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">主語にする</text>
