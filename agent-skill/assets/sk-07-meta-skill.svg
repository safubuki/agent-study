<text x="44" y="766" font-size="16" font-weight="400" fill="#475569" text-anchor="start">二段構造にすると、メタスキル自体も「判断は文章・定型はスクリプト」の見本になり、生成物にも同じ分け方が引き継がれる。</text>
<text x="44" y="793" font-size="16" font-weight="400" fill="#475569" text-anchor="start">公式の評価手順でも「どの試行でも似た補助スクリプトを書いていたら、scripts/ に同梱する合図」とされている（agentskills.io）。</text>
