<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">旧 Local：エディタの拡張を動かす側に、AI の実行管理がある</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">外側の枠で「どこに結び付くか」、内側の緑の枠で「AI の作業を進める機能」を区別する。</text>
