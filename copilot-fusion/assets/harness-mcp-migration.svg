<title id="title">見えないときの対処：設定 → 認証 → 動作確認</title><desc id="desc">上から下へ進める。②は設定の届け方、③は認証方式の選択。teamDocs は② B → ③ 固定トークンへ。</desc><defs>
<marker id="arrow-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
<marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
<marker id="arrow-harness" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker>
<marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker>
<marker id="arrow-review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker>
<marker id="arrow-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0e7490"/></marker>
<marker id="arrow-process" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="arrow-sdk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="1470" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">見えないときの対処：設定 → 認証 → 動作確認</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">上から下へ進める。②は設定の届け方、③は認証方式の選択。teamDocs は② B → ③ 固定トークンへ。</text>
<circle cx="66" cy="164" r="24" fill="#64748b"/>
<text x="66" y="172" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<rect x="116" y="130" width="1056" height="132" rx="12" fill="#f8fafc" stroke="#64748b"/>
<text x="138" y="166" font-size="23" font-weight="700" fill="#64748b" text-anchor="start">対象と旧設定を確認する</text>
<text x="138" y="202" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Session Target＝Copilot、作業フォルダ、実行先の PC / リモート / コンテナを確認。</text>
<text x="138" y="231" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Chat: Open Customizations を開く。変更前に元の MCP 設定を保管する。</text>
<line x1="644" y1="262" x2="644" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-process)"/>
<circle cx="66" cy="340" r="24" fill="#2563eb"/>
<text x="66" y="348" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="116" y="336" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">まず、定義を Copilot に届ける経路を選ぶ</text>
<path d="M644 350 V366 H366 V398" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<path d="M644 350 V366 H909 V398" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="116" y="398" width="500" height="192" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<text x="138" y="434" font-size="23" font-weight="700" fill="#2563eb" text-anchor="start">A　転送条件を満たす場合</text>
<text x="138" y="470" font-size="20" font-weight="400" fill="#334155" text-anchor="start">.vscode/mcp.json は元の場所に残す。</text>
<text x="138" y="499" font-size="20" font-weight="400" fill="#334155" text-anchor="start">エディタが定義を Copilot に渡す。</text>
<text x="138" y="528" font-size="20" font-weight="400" fill="#334155" text-anchor="start">入力・コマンド変数付きは対象外。</text>
<rect x="646" y="398" width="526" height="192" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="668" y="434" font-size="23" font-weight="700" fill="#059669" text-anchor="start">B　ネイティブ設定へ移行</text>
<text x="668" y="470" font-size="20" font-weight="400" fill="#334155" text-anchor="start">入力変数付きの teamDocs はこの経路。</text>
<text x="668" y="499" font-size="20" font-weight="400" fill="#334155" text-anchor="start">.mcp.json / mcpServers へ変換する。</text>
<text x="668" y="528" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Migrations の手動確認項目も確認。</text>
<text x="668" y="557" font-size="20" font-weight="400" fill="#334155" text-anchor="start">password 入力は自動移行の対象外。</text>
<path d="M366 590 V620 H644 V660" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<path d="M909 590 V620 H644 V660" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<circle cx="66" cy="694" r="24" fill="#059669"/>
<text x="66" y="702" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="116" y="690" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">次に、サーバーが要求する認証方法を選ぶ</text>
<rect x="116" y="752" width="500" height="168" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="138" y="788" font-size="23" font-weight="700" fill="#059669" text-anchor="start">OAuth 対応のサーバー</text>
<text x="138" y="824" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Copilot 側の対応する認証操作を行う。</text>
<text x="138" y="853" font-size="20" font-weight="400" fill="#334155" text-anchor="start">例：ブラウザーでサインインして許可。</text>
<text x="138" y="882" font-size="20" font-weight="400" fill="#334155" text-anchor="start">旧 API キーの転送とは別の認証方式。</text>
<rect x="646" y="752" width="526" height="168" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="668" y="788" font-size="23" font-weight="700" fill="#059669" text-anchor="start">固定トークンを使うサーバー</text>
<text x="668" y="824" font-size="20" font-weight="400" fill="#334155" text-anchor="start">環境変数を使える場合の例：</text>
<text x="668" y="853" font-size="20" font-weight="400" fill="#334155" text-anchor="start">設定は ${DOCS_API_KEY} の参照にする。</text>
<text x="668" y="882" font-size="20" font-weight="400" fill="#334155" text-anchor="start">実行先へキーを注入 → 起動環境に反映。</text>
<path d="M644 704 V720 H366 V752" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<path d="M644 704 V720 H909 V752" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<path d="M366 920 V950 H644 V990" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<path d="M909 920 V950 H644 V990" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<circle cx="66" cy="1024" r="24" fill="#0e7490"/>
<text x="66" y="1032" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<rect x="116" y="990" width="1056" height="166" rx="12" fill="#ecfeff" stroke="#0e7490"/>
<text x="138" y="1026" font-size="23" font-weight="700" fill="#0e7490" text-anchor="start">新しい Copilot セッションで、3段階を確認する</text>
<text x="138" y="1062" font-size="20" font-weight="400" fill="#334155" text-anchor="start">発見：Customizations に対象のサーバーが表示される。</text>
<text x="138" y="1091" font-size="20" font-weight="400" fill="#334155" text-anchor="start">接続・認証：サーバーへ接続でき、認証エラーが出ない。</text>
<text x="138" y="1120" font-size="20" font-weight="400" fill="#334155" text-anchor="start">実行：検索ツールを呼び、期待する文書が結果として返る。</text>
<line x1="644" y1="1156" x2="644" y2="1200" stroke="#0e7490" stroke-width="2" marker-end="url(#arrow-tool)"/>
<circle cx="66" cy="1234" r="24" fill="#64748b"/>
<text x="66" y="1242" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<rect x="116" y="1200" width="1056" height="132" rx="12" fill="#f8fafc" stroke="#64748b"/>
<text x="138" y="1236" font-size="23" font-weight="700" fill="#64748b" text-anchor="start">動いたことを確認してから、旧設定の重複を整理する</text>
<text x="138" y="1272" font-size="20" font-weight="400" fill="#334155" text-anchor="start">表示だけで完了としない。失敗したら、その段階の設定・認証・ツールを見直す。</text>
<text x="138" y="1301" font-size="20" font-weight="400" fill="#334155" text-anchor="start">Migrate は変換済みの旧エントリを削除する場合があるため、保管した原本も確認。</text>
<rect x="28" y="1370" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="1398" font-size="16" font-weight="400" fill="#475569" text-anchor="start">認証が不要なサーバーは③を省略。固定トークンが必要で環境変数を使えない場合は、本文の制約を確認する。</text>
<text x="44" y="1425" font-size="16" font-weight="400" fill="#475569" text-anchor="start">設定ファイルのコピーだけでは inputs は使えない。環境変数の反映順序と具体例は、次の図で確認する。</text>
</svg>
