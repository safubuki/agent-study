<text x="330" y="213.5" font-size="15.5" font-weight="700" fill="#9f1239" text-anchor="middle">コードを考えて書く</text>
<text x="330" y="234.5" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">← 出力トークン</text>
<path d="M420 219 L434 219" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M425 224 L434 219 L425 214.1 Z" fill="#2563eb" stroke="none"/>
<rect x="436" y="180" width="176" height="78" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.7"/>
<text x="524" y="213.5" font-size="15.5" font-weight="700" fill="#9f1239" text-anchor="middle">実行して</text>
<text x="524" y="234.5" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">失敗したら直す</text>
<path d="M614 219 L628 219" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
