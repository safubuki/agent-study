<circle cx="602" cy="244" r="13" fill="#b45309"/>
<text x="602" y="248.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="620" y="250.5" font-size="16" font-weight="700" fill="#92400e" text-anchor="start">L1 に「変えてよい点」を書く</text>
<text x="590" y="288" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">文体・様式・通信方式など。表に無いことは下で変えない</text>
<rect x="572" y="320" width="600" height="84" rx="12" fill="#fff" stroke="none"/>
<path d="M572 360 V332 Q572 320 584 320 H1160 Q1172 320 1172 332 V360 Z" fill="#fff7ed" stroke="none"/>
<path d="M572 360 H1172" fill="none" stroke="#fed7aa" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
