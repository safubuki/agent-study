<title id="title">こんなときは、このファイルを作る（GitHub Copilot の早見表）</title><desc id="desc">左の「こんなとき」に当てはまる行を探し、右のファイルを作る。例は事例 3（制御ユニット開発）から。全部を最初から作る必要はない。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="884" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">こんなときは、このファイルを作る（GitHub Copilot の早見表）</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">左の「こんなとき」に当てはまる行を探し、右のファイルを作る。例は事例 3（制御ユニット開発）から。全部を最初から作る必要はない。</text>
<rect x="28" y="124" width="1144" height="40" rx="10" fill="#475569" stroke="none"/>
<text x="44" y="150" font-size="14" font-weight="700" fill="#fff" text-anchor="start">こんなとき（例）</text>
<text x="432" y="150" font-size="14" font-weight="700" fill="#fff" text-anchor="start">階層</text>
<text x="548" y="150" font-size="14" font-weight="700" fill="#fff" text-anchor="start">作るファイル</text>
<text x="958" y="150" font-size="14" font-weight="700" fill="#fff" text-anchor="start">どう効くか</text>
<rect x="28" y="172" width="1144" height="78" rx="8" fill="#f8fafc" stroke="none"/>
<text x="44" y="204" font-size="15" font-weight="700" fill="#334155" text-anchor="start">どこでも必ず守らせたい</text>
<text x="44" y="228" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">例：安全停止を直さない・社外秘を扱わない</text>
<rect x="432" y="199" width="32" height="24" rx="6" fill="#4f46e5" stroke="none"/>
<text x="448" y="215.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L1</text>
<rect x="548" y="184" width="88" height="26" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="557" y="201.5" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="start">AGENTS.md</text>
<rect x="642" y="184" width="196" height="26" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="651" y="201.5" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="start">copilot-instructions.md</text>
<rect x="548" y="216" width="157" height="26" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="557" y="233.5" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="start">policies/l1-*.json</text>
<rect x="711" y="216" width="65" height="26" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="720" y="233.5" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="start">hooks/</text>
<text x="958" y="204" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">毎回読む</text>
<text x="958" y="226" font-size="13" font-weight="400" fill="#92400e" text-anchor="start">＋書き込みを止める</text>
<text x="44" y="288" font-size="15" font-weight="700" fill="#334155" text-anchor="start">部署ごとに書き方・道具が違う</text>
<text x="44" y="312" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">例：電気設計部は回路図を表で書く</text>
<rect x="432" y="283" width="88" height="24" rx="6" fill="#c2410c" stroke="none"/>
<text x="476" y="299.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L2 ドメイン</text>
<rect x="548" y="268" width="226" height="26" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="557" y="285.5" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="start">l2-domain-*.instructions.md</text>
<rect x="548" y="300" width="180" height="26" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="557" y="317.5" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="start">skills/&lt;部署のスキル&gt;/</text>
<text x="958" y="288" font-size="13" font-weight="700" fill="#1e40af" text-anchor="start">担当フォルダの</text>
<text x="958" y="310" font-size="13" font-weight="400" fill="#1e40af" text-anchor="start">ファイルで自動</text>
<rect x="28" y="340" width="1144" height="78" rx="8" fill="#f8fafc" stroke="none"/>
<text x="44" y="372" font-size="15" font-weight="700" fill="#334155" text-anchor="start">製品・部品ごとに仕様値が違う</text>
<text x="44" y="396" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">例：電源ユニットの入力は 24 V</text>
<rect x="432" y="367" width="63" height="24" rx="6" fill="#4d7c0f" stroke="none"/>
<text x="463.5" y="383.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L2 部品</text>
<rect x="548" y="352" width="185" height="26" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="557" y="369.5" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="start">parts/&lt;部品&gt;/part.json</text>
<rect x="548" y="384" width="211" height="26" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="557" y="401.5" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="start">l2-part-*.instructions.md</text>
<rect x="765" y="384" width="157" height="26" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="774" y="401.5" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="start">product-rules.json</text>
<text x="958" y="372" font-size="13" font-weight="700" fill="#065f46" text-anchor="start">値はファイルから</text>
<text x="958" y="394" font-size="13" font-weight="400" fill="#065f46" text-anchor="start">スクリプトで検査</text>
<text x="44" y="456" font-size="15" font-weight="700" fill="#334155" text-anchor="start">部署 × 部品の交わりだけの手順</text>
<text x="44" y="480" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">例：電源係は部品を選ぶたび 70% を確認</text>
<rect x="432" y="451" width="32" height="24" rx="6" fill="#0f766e" stroke="none"/>
<text x="448" y="467.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L3</text>
<rect x="548" y="436" width="211" height="26" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="557" y="453.5" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="start">l3-team-*.instructions.md</text>
<rect x="548" y="468" width="234" height="26" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="557" y="485.5" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="start">skills/power-derating-check/</text>
<text x="958" y="456" font-size="13" font-weight="700" fill="#1e40af" text-anchor="start">交わりのフォルダ</text>
<text x="958" y="478" font-size="13" font-weight="400" fill="#1e40af" text-anchor="start">で自動</text>
<rect x="28" y="508" width="1144" height="78" rx="8" fill="#f8fafc" stroke="none"/>
<text x="44" y="540" font-size="15" font-weight="700" fill="#334155" text-anchor="start">顧客・案件ごとの一時的な対応</text>
<text x="44" y="564" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">例：ACME 社向けに 48 V（期限つき）</text>
<rect x="432" y="535" width="32" height="24" rx="6" fill="#be185d" stroke="none"/>
<text x="448" y="551.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L4</text>
<rect x="548" y="520" width="170" height="26" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="557" y="537.5" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="start">cases/&lt;番号&gt;/CASE.md</text>
<rect x="724" y="520" width="88" height="26" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="733" y="537.5" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="start">case.json</text>
<rect x="548" y="552" width="173" height="26" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="557" y="569.5" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="start">skills/case-context/</text>
<text x="958" y="540" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="start">人が案件を</text>
<text x="958" y="562" font-size="13" font-weight="400" fill="#5b21b6" text-anchor="start">指定したときだけ</text>
<text x="44" y="624" font-size="15" font-weight="700" fill="#334155" text-anchor="start">書き換えられたくない資料がある</text>
<text x="44" y="648" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">例：リリース済み図面・認証書類・契約書</text>
<rect x="432" y="619" width="55" height="24" rx="6" fill="#475569" stroke="none"/>
<text x="459.5" y="635.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">各階層</text>
<rect x="548" y="604" width="240" height="26" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
<text x="557" y="621.5" font-size="12.5" font-weight="700" fill="#9f1239" text-anchor="start">policies/l*-*.json の protect</text>
<text x="958" y="624" font-size="13" font-weight="700" fill="#9f1239" text-anchor="start">書き込みのたびに</text>
<text x="958" y="646" font-size="13" font-weight="400" fill="#9f1239" text-anchor="start">フックが止める</text>
<rect x="28" y="676" width="1144" height="78" rx="8" fill="#f8fafc" stroke="none"/>
<text x="44" y="708" font-size="15" font-weight="700" fill="#334155" text-anchor="start">ルールを変えてよい人を決めたい</text>
<text x="44" y="732" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">例：電源の値は部品の責任者がレビュー</text>
<rect x="432" y="703" width="43" height="24" rx="6" fill="#475569" stroke="none"/>
<text x="453.5" y="719.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">共通</text>
<rect x="548" y="688" width="96" height="26" rx="7" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
<text x="557" y="705.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">CODEOWNERS</text>
<rect x="650" y="688" width="215" height="26" rx="7" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
<text x="659" y="705.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">ルールセット（レビュー必須）</text>
<text x="958" y="708" font-size="13" font-weight="700" fill="#334155" text-anchor="start">PR を出したとき</text>
<rect x="28" y="784" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="812" font-size="16" font-weight="400" fill="#475569" text-anchor="start">上から順に増やしていけばよい。まず L1 と「守る場所」、次に違いが出てきた所だけ L2 → L3 を足す。案件（L4）は必要になってから。</text>
<text x="44" y="839" font-size="16" font-weight="400" fill="#475569" text-anchor="start">チップの色は仕組みの種類：黄＝常に読む指示、青＝パス別の指示、緑＝値、紫＝手動で読む、赤＝強制、灰＝変更の関所。</text>
</svg>
