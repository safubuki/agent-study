<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 205" role="img" aria-label="UML・要求図のイラスト：ぼんやりした要望を要求・要件・仕様・設計へと階段状に整理する">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="360" height="205" rx="18" fill="url(#bg5)"/>

  <text x="180" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">あいまいな想いを「作れる設計」まで 5 段階で整理</text>

  <!-- 5ステップの階段カード（y=40〜154の範囲に収める） -->
  <rect x="16" y="108" width="56" height="44" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="44" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">要望</text>
  <text x="44" y="143" text-anchor="middle" font-size="8.5" fill="#78350f" font-family="BIZ UDPGothic, sans-serif">こうしたい</text>

  <path d="M 73 122 L 83 112" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="86" y="92" width="56" height="44" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="114" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">要求</text>
  <text x="114" y="127" text-anchor="middle" font-size="8.5" fill="#78350f" font-family="BIZ UDPGothic, sans-serif">満たす目標</text>

  <path d="M 143 106 L 153 96" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="156" y="76" width="56" height="44" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2.2"/>
  <text x="184" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">要件</text>
  <text x="184" y="111" text-anchor="middle" font-size="8.5" fill="#78350f" font-family="BIZ UDPGothic, sans-serif">合意した条件</text>

  <path d="M 213 90 L 223 80" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="226" y="60" width="56" height="44" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2.2"/>
  <text x="254" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f" font-family="BIZ UDPGothic, sans-serif">仕様</text>
  <text x="254" y="95" text-anchor="middle" font-size="8.5" fill="#78350f" font-family="BIZ UDPGothic, sans-serif">数値と基準</text>

  <path d="M 283 74 L 293 64" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="296" y="42" width="50" height="48" rx="10" fill="#d97706"/>
  <text x="321" y="63" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">設計</text>
  <text x="321" y="79" text-anchor="middle" font-size="8.5" fill="#fef3c7" font-family="BIZ UDPGothic, sans-serif">図面完成</text>

  <!-- 下部キャプション専用帯（カードと絶対に被らない） -->
  <rect x="20" y="168" width="320" height="24" rx="12" fill="#ffffff" opacity="0.85"/>
  <text x="180" y="184" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">🔗 なぜこの設計か、要求図の矢印でいつでも遡れる</text>
</svg>
