<text x="494" y="151.5" font-size="16.5" font-weight="700" fill="#5b21b6" text-anchor="start">SKILL.md ─ 目次と手順（必須）</text>
<text x="494" y="190" font-size="14" font-weight="400" fill="#334155" text-anchor="start">先頭に name と description（いつ使うか）。本文に手順・判断基準と</text>
<text x="494" y="212" font-size="14" font-weight="400" fill="#334155" text-anchor="start">「この場合は references/〇〇 を読む」「scripts/〇〇 を実行」の道案内。</text>
<path d="M392 255 L446 255 L446 145 L474 145" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M465 150 L474 145 L465 140.1 Z" fill="#7c3aed" stroke="none"/>
<rect x="476" y="242" width="696" height="106" rx="12" fill="#fff" stroke="none"/>
<path d="M476 284 V254 Q476 242 488 242 H1160 Q1172 242 1172 254 V284 Z" fill="#ecfeff" stroke="none"/>
<path d="M476 284 H1172" fill="none" stroke="#a5f3fc" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="476" y="242" width="696" height="106" rx="12" fill="none" stroke="#0e7490" stroke-width="1.6"/>
<text x="494" y="269.5" font-size="16.5" font-weight="700" fill="#155e75" text-anchor="start">references/ ─ 必要なときだけ読む資料</text>
<text x="494" y="308" font-size="14" font-weight="400" fill="#334155" text-anchor="start">規約・API 仕様・用語集など、長くてもよい知識。</text>
<text x="494" y="330" font-size="14" font-weight="400" fill="#334155" text-anchor="start">読むまでは文脈（コンテキスト）を消費しない。</text>
<path d="M392 289 L446 289 L446 263 L474 263" fill="none" stroke="#0e7490" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M465 268 L474 263 L465 258.1 Z" fill="#0e7490" stroke="none"/>
<rect x="476" y="360" width="696" height="106" rx="12" fill="#fff" stroke="none"/>
<path d="M476 402 V372 Q476 360 488 360 H1160 Q1172 360 1172 372 V402 Z" fill="#ecfdf5" stroke="none"/>
<path d="M476 402 H1172" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="476" y="360" width="696" height="106" rx="12" fill="none" stroke="#059669" stroke-width="1.6"/>
<text x="494" y="387.5" font-size="16.5" font-weight="700" fill="#065f46" text-anchor="start">scripts/ ─ 読まずに実行する道具</text>
<text x="494" y="426" font-size="14" font-weight="400" fill="#334155" text-anchor="start">集計・変換・検証など決まった処理。AI は中身を読まずに実行し、</text>
<text x="494" y="448" font-size="14" font-weight="400" fill="#334155" text-anchor="start">出力（結果）だけを受け取る。毎回同じ結果になり、トークンも節約。</text>
<path d="M392 357 L446 357 L446 381 L474 381" fill="none" stroke="#059669" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M465 386 L474 381 L465 376.1 Z" fill="#059669" stroke="none"/>
