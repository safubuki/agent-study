<text x="44" y="1019" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Standard は各タスクを1モデルで処理。High / Max は必要に応じて追加のモデル呼出しを使う。</text>
<text x="44" y="1046" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Critique は完成案の勝者選びではなく、初稿への批評と修正。判定の閾値やモデルの固定リストは公開仕様と区別する。</text>
