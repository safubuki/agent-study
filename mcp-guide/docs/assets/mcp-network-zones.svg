<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif" role="img" aria-label="MCPの構成要素がどこで動き、どこでデータが社外に出るかの図：自分のPC、社内ネットワーク、インターネットの3つの区域">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .b{font-size:12px;fill:#374151}
      .s{font-size:11px;fill:#6b7280}
      .z{font-size:14px;font-weight:700}
      .bd{font-size:11px;font-weight:700;fill:#ffffff}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="659" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">どこで動き、どこでデータが外に出るか</text>
  <text x="30" y="64" class="s" font-size="12.5">ローカルの MCP サーバーでも、道具の結果は LLM に渡る。社外に出る線（赤）を押さえておく</text>

  <!-- 区域 -->
  <rect x="24" y="84" width="276" height="356" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="40" y="108" class="z" fill="#1e3a8a">💻 自分の PC</text>
  <rect x="312" y="84" width="276" height="356" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="328" y="108" class="z" fill="#166534">🏢 社内ネットワーク</text>
  <rect x="600" y="84" width="276" height="356" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="616" y="108" class="z" fill="#991b1b">🌐 インターネット（社外）</text>

  <!-- PC の中 -->
  <rect x="44" y="120" width="236" height="76" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="162" y="148" text-anchor="middle" class="h" fill="#1e3a8a">AI アプリ（ホスト）</text>
  <text x="162" y="170" text-anchor="middle" class="s">Claude Code・VS Code・自作アプリ</text>

  <rect x="44" y="246" width="116" height="64" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="102" y="272" text-anchor="middle" class="b" font-weight="700" fill="#065f46">ローカル MCP</text>
  <text x="102" y="292" text-anchor="middle" class="s">stdio で起動</text>
  <rect x="170" y="246" width="110" height="64" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="225" y="272" text-anchor="middle" class="b" font-weight="700" fill="#334155">PC 内のアプリ</text>
  <text x="225" y="292" text-anchor="middle" class="s">CAD・Excel など</text>
  <rect x="44" y="352" width="236" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="162" y="378" text-anchor="middle" class="b" font-weight="700" fill="#92400e">ファイル・認証情報</text>
  <text x="162" y="398" text-anchor="middle" class="s">作業フォルダ・~/.ssh・トークン など</text>

  <line x1="102" y1="196" x2="102" y2="244" stroke="#16a34a" stroke-width="2" marker-end="url(#ahg)"/>
  <line x1="160" y1="278" x2="168" y2="278" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="102" y1="310" x2="102" y2="350" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="112" y="336" font-size="10.5" font-weight="700" fill="#b45309">③ 触れられる</text>

  <!-- 社内 -->
  <rect x="332" y="246" width="236" height="64" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="450" y="272" text-anchor="middle" class="b" font-weight="700" fill="#166534">社内の MCP サーバー（HTTP）</text>
  <text x="450" y="292" text-anchor="middle" class="s">チームで共有・認証は必須</text>
  <rect x="332" y="352" width="236" height="66" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="450" y="378" text-anchor="middle" class="b" font-weight="700" fill="#166534">社内 DB・ファイルサーバー</text>
  <text x="450" y="398" text-anchor="middle" class="s">社外には出ない</text>
  <line x1="450" y1="310" x2="450" y2="350" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- 社外 -->
  <rect x="620" y="120" width="236" height="76" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="738" y="148" text-anchor="middle" class="h" fill="#991b1b">LLM の API</text>
  <text x="738" y="170" text-anchor="middle" class="s">Anthropic・クラウドの AI サービス</text>
  <rect x="620" y="212" width="236" height="64" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="738" y="238" text-anchor="middle" class="b" font-weight="700" fill="#991b1b">公開されたリモート MCP</text>
  <text x="738" y="258" text-anchor="middle" class="s">GitHub・Notion などの MCP</text>
  <rect x="620" y="318" width="236" height="64" rx="10" fill="#ffffff" stroke="#fca5a5"/>
  <text x="738" y="344" text-anchor="middle" class="b" font-weight="700" fill="#991b1b">SaaS・Web サイト</text>
  <text x="738" y="364" text-anchor="middle" class="s">サービス本体のデータ</text>
  <line x1="738" y1="276" x2="738" y2="316" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- 区域をまたぐ線 -->
  <line x1="280" y1="146" x2="618" y2="146" stroke="#dc2626" stroke-width="2.6" marker-end="url(#ahr)"/>
  <circle cx="450" cy="146" r="11" fill="#dc2626"/>
  <text x="450" y="150" text-anchor="middle" class="bd">①</text>
  <line x1="280" y1="178" x2="618" y2="236" stroke="#dc2626" stroke-width="2.6" marker-end="url(#ahr)"/>
  <circle cx="500" cy="216" r="11" fill="#dc2626"/>
  <text x="500" y="220" text-anchor="middle" class="bd">②</text>
  <path d="M 270 196 L 270 222 L 332 270" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ahg)"/>
  <circle cx="300" cy="245" r="11" fill="#16a34a"/>
  <text x="300" y="249" text-anchor="middle" class="bd">④</text>

  <!-- 凡例 -->
  <rect x="24" y="456" width="852" height="132" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="482" class="b"><tspan font-weight="700" fill="#dc2626">① LLM の API へ</tspan>：会話・道具の説明・道具の結果が送られる</text>
  <text x="58" y="500" class="s">ローカル MCP だけを使っていても同じ → 「LLM に送ってよい情報」を社内ルールで決める</text>
  <text x="40" y="526" class="b"><tspan font-weight="700" fill="#dc2626">② 公開リモート MCP へ</tspan>：道具に渡した引数と、サーバーが扱うデータ</text>
  <text x="58" y="544" class="s">→ 公式・社内で承認されたサーバーだけにする</text>
  <text x="466" y="526" class="b"><tspan font-weight="700" fill="#b45309">③ ローカル MCP</tspan>：PC の中で完結するが、自分の権限で動く</text>
  <text x="484" y="544" class="s">ファイルや認証情報に触れられる → 出所を確認・隔離して試す</text>
  <text x="40" y="570" class="b"><tspan font-weight="700" fill="#16a34a">④ 社内の MCP</tspan>：社外に出さずにチームで共有できる → 認証と権限の絞り込みは必須</text>

  <text x="30" y="616" class="s">出典：Model Context Protocol 公式仕様（Transports・Security Best Practices, 2026-11 取得）をもとに筆者作成</text>
  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 594) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
