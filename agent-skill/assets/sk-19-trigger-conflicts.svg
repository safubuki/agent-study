<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スキルをバラバラに置くと、似た説明文が同じ依頼に反応する。置き場所・名前空間・呼び方・入口・測定の 5 つで防ぐ。</text>
