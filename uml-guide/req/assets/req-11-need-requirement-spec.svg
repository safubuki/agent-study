<title id="title">要望 → 要求 → 要件 → 仕様：同じ話を、だんだん具体的に書き換える</title><desc id="desc">顧客の言葉（要望）を、利用者が求める成果（要求）、本機が守る条件（要件）にし、さらに作り方の取り決め（仕様）まで決める。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="824" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">要望 → 要求 → 要件 → 仕様：同じ話を、だんだん具体的に書き換える</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">顧客の言葉（要望）を、利用者が求める成果（要求）、本機が守る条件（要件）にし、さらに作り方の取り決め（仕様）まで決める。</text>
<rect x="28" y="124" width="268" height="360" rx="12" fill="#fff" stroke="none"/>
<path d="M28 186 V136 Q28 124 40 124 H284 Q296 124 296 136 V186 Z" fill="#fff1f2" stroke="none"/>
<path d="M28 186 H296" fill="none" stroke="#fecdd3" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="124" width="268" height="360" rx="12" fill="none" stroke="#be123c" stroke-width="1.6"/>
<text x="46" y="152" font-size="17.5" font-weight="700" fill="#9f1239" text-anchor="start">要望</text>
<text x="46" y="174" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">顧客の言葉そのまま</text>
<rect x="234" y="140" width="47" height="24" rx="6" fill="#be123c" stroke="none"/>
<text x="257.5" y="156.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">要望</text>
<text x="46" y="222" font-size="16.5" font-weight="700" fill="#9f1239" text-anchor="start">「旅行中も植物に</text>
<text x="46" y="250" font-size="16.5" font-weight="700" fill="#9f1239" text-anchor="start">水をあげたい」</text>
<rect x="46" y="379" width="177" height="26" rx="13" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="134.5" y="396.5" font-size="12.5" font-weight="700" fill="#9f1239" text-anchor="middle">だれが・どれだけ？が不明</text>
<rect x="45.6" y="413" width="114" height="26" rx="13" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="102.6" y="430.5" font-size="12.5" font-weight="700" fill="#9f1239" text-anchor="middle">確かめ方がない</text>
<rect x="46" y="447" width="177" height="26" rx="13" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="134.5" y="464.5" font-size="12.5" font-weight="700" fill="#9f1239" text-anchor="middle">思いつきの解決策がまざる</text>
<rect x="320" y="124" width="268" height="360" rx="12" fill="#fff" stroke="none"/>
<path d="M320 186 V136 Q320 124 332 124 H576 Q588 124 588 136 V186 Z" fill="#f5f3ff" stroke="none"/>
<path d="M320 186 H588" fill="none" stroke="#ddd6fe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="320" y="124" width="268" height="360" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
<text x="338" y="152" font-size="17.5" font-weight="700" fill="#5b21b6" text-anchor="start">要求（REQ-1）</text>
<text x="338" y="174" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">利用者が求める成果</text>
<rect x="526" y="140" width="47" height="24" rx="6" fill="#7c3aed" stroke="none"/>
<text x="549.5" y="156.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">要求</text>
<text x="338" y="222" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="start">本機は、利用者が最大</text>
<text x="338" y="247" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="start">7日間留守にしても、</text>
<text x="338" y="272" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="start">鉢植えの植物を水不足で</text>
<text x="338" y="297" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="start">枯らさないこと。</text>
<rect x="337.9" y="379" width="102" height="26" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="388.9" y="396.5" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">主語 ＝ 本機</text>
<rect x="337.9" y="413" width="197" height="26" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="436.4" y="430.5" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">「7日間」「枯れない」で確認</text>
<rect x="337.9" y="447" width="190" height="26" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="432.9" y="464.5" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">「なぜ？」で目的を確かめた</text>
<rect x="612" y="124" width="268" height="360" rx="12" fill="#fff" stroke="none"/>
<path d="M612 186 V136 Q612 124 624 124 H868 Q880 124 880 136 V186 Z" fill="#eff6ff" stroke="none"/>
<path d="M612 186 H880" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="612" y="124" width="268" height="360" rx="12" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="630" y="152" font-size="17.5" font-weight="700" fill="#1e40af" text-anchor="start">要件（REQ-1.2）</text>
<text x="630" y="174" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">本機が守る条件</text>
<rect x="818" y="140" width="47" height="24" rx="6" fill="#2563eb" stroke="none"/>
<text x="841.5" y="156.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">要件</text>
<text x="630" y="222" font-size="15" font-weight="700" fill="#1e40af" text-anchor="start">本機は、土の水分量が</text>
<text x="630" y="247" font-size="15" font-weight="700" fill="#1e40af" text-anchor="start">30%未満になってから</text>
<text x="630" y="272" font-size="15" font-weight="700" fill="#1e40af" text-anchor="start">10分以内に、鉢への</text>
<text x="630" y="297" font-size="15" font-weight="700" fill="#1e40af" text-anchor="start">給水を始めること。</text>
<rect x="629.9" y="379" width="139" height="26" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="699.4" y="396.5" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">条件と時間を数値に</text>
<rect x="629.9" y="413" width="139" height="26" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="699.4" y="430.5" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">システム試験で確認</text>
<rect x="629.8" y="447" width="152" height="26" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="705.8" y="464.5" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">作り方はまだ決めない</text>
<rect x="904" y="124" width="268" height="360" rx="12" fill="#fff" stroke="none"/>
<path d="M904 186 V136 Q904 124 916 124 H1160 Q1172 124 1172 136 V186 Z" fill="#eef2ff" stroke="none"/>
<path d="M904 186 H1172" fill="none" stroke="#c7d2fe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="904" y="124" width="268" height="360" rx="12" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
<text x="922" y="152" font-size="17.5" font-weight="700" fill="#3730a3" text-anchor="start">仕様（S-1〜S-5）</text>
<text x="922" y="174" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">作り方の取り決め</text>
<rect x="1110" y="140" width="47" height="24" rx="6" fill="#4f46e5" stroke="none"/>
<text x="1133.5" y="156.7" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">仕様</text>
<text x="922" y="218" font-size="13" font-weight="400" fill="#334155" text-anchor="start">S-1 5分ごとに水分量を測る</text>
<text x="922" y="240" font-size="13" font-weight="400" fill="#334155" text-anchor="start">S-2 30%未満かつ水があれば</text>
<text x="922" y="262" font-size="13" font-weight="400" fill="#334155" text-anchor="start">　　ポンプを10秒動かす</text>
<text x="922" y="284" font-size="13" font-weight="400" fill="#334155" text-anchor="start">S-3 給水後30分は再給水しない</text>
<text x="922" y="306" font-size="13" font-weight="400" fill="#334155" text-anchor="start">S-4 残量20%以下でスマホへ通知</text>
<text x="922" y="328" font-size="13" font-weight="400" fill="#334155" text-anchor="start">S-5 しきい値と給水時間は変更可</text>
<rect x="922" y="379" width="177" height="26" rx="13" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="1010.5" y="396.5" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">方式・数値・例外を決める</text>
<rect x="921.6" y="413" width="165" height="26" rx="13" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="1004.1" y="430.5" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">要件を満たすか計算する</text>
<path d="M300 284 L315 304 L300 324 Z" fill="#475569" stroke="none"/>
<path d="M592 284 L607 304 L592 324 Z" fill="#475569" stroke="none"/>
<path d="M884 284 L899 304 L884 324 Z" fill="#475569" stroke="none"/>
<rect x="28" y="508" width="562" height="186" rx="12" fill="#fff" stroke="none"/>
<path d="M28 554 V520 Q28 508 40 508 H578 Q590 508 590 520 V554 Z" fill="#eff6ff" stroke="none"/>
<path d="M28 554 H590" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="508" width="562" height="186" rx="12" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="46" y="537.5" font-size="17.5" font-weight="700" fill="#1e40af" text-anchor="start">要望 → 要求 → 要件：確かめられる形にする</text>
<text x="46" y="582" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">● 「なぜ？」で目的を確かめ、利用者の成果にする（要求）</text>
<text x="46" y="612" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">● 主語を本機にし、あいまい語を数値に（乾いたら → 30%未満）</text>
<text x="46" y="642" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">● 時間・量の上限を書く（10分以内）（要件）</text>
<text x="46" y="672" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">● 確かめ方を決める（受入れ確認・システム試験）</text>
<rect x="610" y="508" width="562" height="186" rx="12" fill="#fff" stroke="none"/>
<path d="M610 554 V520 Q610 508 622 508 H1160 Q1172 508 1172 520 V554 Z" fill="#eef2ff" stroke="none"/>
<path d="M610 554 H1172" fill="none" stroke="#c7d2fe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="610" y="508" width="562" height="186" rx="12" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
<text x="628" y="537.5" font-size="17.5" font-weight="700" fill="#3730a3" text-anchor="start">要件 → 仕様：作り方を決める</text>
<text x="628" y="582" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">● 方式を決める（5分ごとに測定・10秒給水）</text>
<text x="628" y="612" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">● 例外を決める（水がない・給水した直後）</text>
<text x="628" y="642" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">● 要件を満たすか計算する（5分周期 → 最悪5分遅れ）</text>
<text x="628" y="672" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">● 文の名詞と動詞が、次のクラス図・シーケンス図の材料</text>
<rect x="28" y="724" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="752" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「土の水分量」は体積含水率（土の体積に占める水の割合）。1 つの要件から複数の仕様が生まれることもある。</text>
<text x="44" y="779" font-size="16" font-weight="400" fill="#475569" text-anchor="start">SysML では、仕様の側から要件へ «refine»（詳細化）で結べる。数値はすべて説明用の想定値。</text>
</svg>
