<text x="326" y="176" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">常時の指示</text>
<rect x="452" y="126" width="236" height="62" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.6"/>
<text x="570" y="154" font-size="16.5" font-weight="700" fill="#9f1239" text-anchor="middle">必ず止める</text>
<text x="570" y="176" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">権限・フック</text>
<rect x="696" y="126" width="236" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="814" y="154" font-size="16.5" font-weight="700" fill="#5b21b6" text-anchor="middle">手順を渡す</text>
<text x="814" y="176" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">スキル</text>
<rect x="940" y="126" width="236" height="62" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="1058" y="154" font-size="16.5" font-weight="700" fill="#334155" text-anchor="middle">配る方法</text>
<text x="1058" y="176" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">誰がどう置くか</text>
<rect x="28" y="200" width="170" height="132" rx="12" fill="#4f46e5" stroke="none"/>
<text x="113" y="258" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">ベース</text>
<text x="113" y="286" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">全社・製品の絶対</text>
<rect x="208" y="200" width="236" height="132" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/>
<text x="222" y="236" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">管理 CLAUDE.md（Windows）</text>
<text x="222" y="266" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">C:\Program Files\ClaudeCode\</text>
<text x="222" y="296" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">製品リポジトリの CLAUDE.md</text>
<rect x="452" y="200" width="236" height="132" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/>
<text x="466" y="236" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">managed-settings.json の</text>
<text x="466" y="266" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">permissions.deny</text>
<text x="466" y="296" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">管理フック（上書き不可）</text>
<rect x="696" y="200" width="236" height="132" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/>
<text x="710" y="236" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">管理スキル（同名で最優先）</text>
<text x="710" y="266" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">必須プラグイン</text>
<text x="710" y="296" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">手動専用の必須手順</text>
<rect x="940" y="200" width="236" height="132" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.6"/>
<text x="954" y="236" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">IT が MDM・管理設定で配布</text>
<text x="954" y="266" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">リポジトリは全員が clone</text>
<text x="954" y="296" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">利用者は外せない</text>
<rect x="28" y="342" width="170" height="132" rx="12" fill="#c2410c" stroke="none"/>
<text x="113" y="400" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">部署</text>
<text x="113" y="428" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">ドメイン・担当領域</text>
<rect x="208" y="342" width="236" height="132" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="222" y="378" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">担当フォルダの CLAUDE.md</text>
<text x="222" y="408" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">.claude/rules/*.md（paths）</text>
<text x="222" y="438" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">→ 触ったときだけ読まれる</text>
<rect x="452" y="342" width="236" height="132" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="466" y="378" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">リポジトリの</text>
<text x="466" y="408" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">.claude/settings.json の</text>
<text x="466" y="438" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">フック（そのリポジトリだけ）</text>
<rect x="696" y="342" width="236" height="132" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="710" y="378" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">部署プラグイン</text>
<text x="710" y="408" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">（/部署名:スキル名）</text>
<text x="710" y="438" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">paths 付きスキル</text>
<rect x="940" y="342" width="236" height="132" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="954" y="378" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">部署のマーケットプレイス</text>
<text x="954" y="408" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">リポジトリ設定で有効化</text>
<text x="954" y="438" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">部署ごとに管理設定を分ける</text>
<rect x="28" y="484" width="170" height="132" rx="12" fill="#0f766e" stroke="none"/>
<text x="113" y="542" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">個人</text>
<text x="113" y="570" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">係・自分だけ</text>
<rect x="208" y="484" width="236" height="132" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<text x="222" y="520" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">~/.claude/CLAUDE.md</text>
<text x="222" y="550" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">CLAUDE.local.md</text>
<text x="222" y="580" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">（Git に入れない）</text>
<rect x="452" y="484" width="236" height="132" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<text x="466" y="520" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">~/.claude/settings.json</text>
<text x="466" y="550" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">（自分の環境だけ）</text>
<text x="466" y="580" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start"></text>
<rect x="696" y="484" width="236" height="132" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<text x="710" y="520" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">~/.claude/skills/</text>
<text x="710" y="550" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">同名なら製品のスキルより</text>
<text x="710" y="580" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">個人が優先される点に注意</text>
<rect x="940" y="484" width="236" height="132" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<text x="954" y="520" font-size="13.5" font-weight="700" fill="#334155" text-anchor="start">自分で置く</text>
<text x="954" y="550" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">良ければ試験置き場へ</text>
<text x="954" y="580" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">（昇格の入口）</text>
<rect x="28" y="646" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="674" font-size="16" font-weight="400" fill="#475569" text-anchor="start">同じ名前のスキルは「管理 ＞ 個人 ＞ プロジェクト」で上書きされる。製品の必須手順は、個人の同名スキルに隠されない名前にする。</text>
<text x="44" y="701" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Copilot 版は copilot/ のガイド（cp-01）を参照。パスと設定キーは Claude Code 公式ドキュメント（2026-11-18 確認）による。</text>
</svg>
