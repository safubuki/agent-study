<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="ローカルAIの実行結果をGitHubへライトに蓄積し分析してスキルへ還元する改善ループの全体像">
  <defs>
    <linearGradient id="ksBg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <marker id="ksArrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="ksArrRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9d174d"/>
    </marker>
  </defs>

  <rect width="960" height="430" rx="18" fill="url(#ksBg1)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- タイトル -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, Yu Gothic UI, sans-serif">小規模チーム向け「AI ナレッジ蓄積 → 分析 → スキル還元」全体ループ</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#475569" font-family="BIZ UDPGothic, Yu Gothic UI, sans-serif">専用クラウド DB を立てず、ボタン 1 つで実行記録を GitHub に溜め、どこで失敗したかを数えて AI を育てる</text>

  <!-- Step 1 -->
  <rect x="24" y="88" width="206" height="214" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="24" y="88" width="206" height="34" rx="14" fill="#0284c7"/>
  <rect x="24" y="108" width="206" height="14" fill="#0284c7"/>
  <text x="127" y="110" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">① ローカル AI を実行</text>
  <text x="127" y="144" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0c4a6e" font-family="BIZ UDPGothic, sans-serif">毎回の実行を自動で記録</text>
  <text x="127" y="168" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">・メンバー各自の PC で実行</text>
  <text x="127" y="186" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">・AI が CAD を操作した</text>
  <text x="127" y="203" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">　手順と結果を 1 行ずつ</text>
  <rect x="38" y="222" width="178" height="64" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="127" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1" font-family="BIZ UDPGothic, sans-serif">成功も失敗も全部残す</text>
  <text x="127" y="259" text-anchor="middle" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">失敗率の分母になる</text>
  <text x="127" y="274" text-anchor="middle" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">「止まった手順」も分かる</text>

  <line x1="230" y1="195" x2="254" y2="195" stroke="#475569" stroke-width="2.4" marker-end="url(#ksArrDark)"/>

  <!-- Step 2 -->
  <rect x="258" y="88" width="206" height="214" rx="14" fill="#ffffff" stroke="#9d174d" stroke-width="2.2"/>
  <rect x="258" y="88" width="206" height="34" rx="14" fill="#9d174d"/>
  <rect x="258" y="108" width="206" height="14" fill="#9d174d"/>
  <text x="361" y="110" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">② GitHub へ自動で蓄積</text>
  <text x="361" y="144" text-anchor="middle" font-size="11.5" font-weight="800" fill="#831843" font-family="BIZ UDPGothic, sans-serif">ボタン 1 つで送る</text>
  <text x="361" y="168" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">・結果＋途中ログを</text>
  <text x="361" y="186" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">　1 実行 1 フォルダで</text>
  <text x="361" y="203" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">・API で直接書き込み</text>
  <rect x="272" y="222" width="178" height="64" rx="8" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="361" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#9d174d" font-family="BIZ UDPGothic, sans-serif">専用 DB・追加費用ゼロ</text>
  <text x="361" y="259" text-anchor="middle" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">送る前に伏せ字＋確認</text>
  <text x="361" y="274" text-anchor="middle" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">CAD 実体は Box へ</text>

  <line x1="464" y1="195" x2="488" y2="195" stroke="#475569" stroke-width="2.4" marker-end="url(#ksArrDark)"/>

  <!-- Step 3 -->
  <rect x="492" y="88" width="206" height="214" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="492" y="88" width="206" height="34" rx="14" fill="#d97706"/>
  <rect x="492" y="108" width="206" height="14" fill="#d97706"/>
  <text x="595" y="110" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">③ 数えて、読む</text>
  <text x="595" y="144" text-anchor="middle" font-size="11.5" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">どこで・何回・なぜ</text>
  <text x="595" y="168" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">・20〜50 件で傾向が</text>
  <text x="595" y="186" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">　見え始める</text>
  <text x="595" y="203" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">・集計スクリプトで表に</text>
  <rect x="506" y="222" width="178" height="64" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="595" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309" font-family="BIZ UDPGothic, sans-serif">上位の失敗は生ログを読む</text>
  <text x="595" y="259" text-anchor="middle" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">多い失敗から</text>
  <text x="595" y="274" text-anchor="middle" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">優先的に対策を立案</text>

  <line x1="698" y1="195" x2="722" y2="195" stroke="#475569" stroke-width="2.4" marker-end="url(#ksArrDark)"/>

  <!-- Step 4 -->
  <rect x="726" y="88" width="210" height="214" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="726" y="88" width="210" height="34" rx="14" fill="#059669"/>
  <rect x="726" y="108" width="210" height="14" fill="#059669"/>
  <text x="831" y="110" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">④ スキル・ルールへ還元</text>
  <text x="831" y="144" text-anchor="middle" font-size="11.5" font-weight="800" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">人が確認して 1 項目ずつ追記</text>
  <text x="831" y="168" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">・落とし穴（Gotchas）を</text>
  <text x="831" y="186" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">　SKILL.md やルールへ追記</text>
  <text x="831" y="203" text-anchor="middle" font-size="10.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">・失敗例を評価ケース化</text>
  <rect x="740" y="222" width="182" height="64" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="831" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#047857" font-family="BIZ UDPGothic, sans-serif">PR レビューで品質を担保</text>
  <text x="831" y="259" text-anchor="middle" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">AI の提案をそのまま入れず</text>
  <text x="831" y="274" text-anchor="middle" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">人が確かめて全員へ配布</text>

  <!-- 還元ループ矢印 -->
  <path d="M 831 302 L 831 344 L 127 344 L 127 306" fill="none" stroke="#9d174d" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ksArrRose)"/>
  <rect x="290" y="331" width="380" height="26" rx="13" fill="#fdf2f8" stroke="#9d174d" stroke-width="1.3"/>
  <text x="480" y="348" text-anchor="middle" font-size="11" font-weight="800" fill="#831843" font-family="BIZ UDPGothic, sans-serif">🔁 更新されたスキルを全員のローカル AI へ反映（ミス減少＆高速化）</text>

  <!-- 下部まとめ -->
  <rect x="24" y="378" width="912" height="34" rx="10" fill="#0f172a"/>
  <text x="480" y="399" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">💡 自動にするのは「記録・送信・集計・改善案の下書き」まで。スキルへの採用は人が PR で決める</text>
</svg>
