<text x="404" y="1830" font-size="17" font-weight="500" fill="#7c3aed" text-anchor="middle">返答内容を返す</text>
<line x1="502" y1="1849" x2="306" y2="1849" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-model)"/>
<rect x="118" y="1872" width="180" height="31" rx="4" fill="#fff" stroke="none"/>
<text x="208" y="1895" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">変更内容を表示する</text>
<line x1="306" y1="1914" x2="110" y2="1914" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-host)"/>
