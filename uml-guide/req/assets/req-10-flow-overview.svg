<text x="58" y="195.9" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="76" y="197.5" font-size="17.5" font-weight="700" fill="#9f1239" text-anchor="start">声を集める</text>
<text x="46" y="242" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">だれが何に困る？</text>
<text x="46" y="270" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">成果物</text>
<text x="46" y="290" font-size="14" font-weight="400" fill="#334155" text-anchor="start">ニーズ・要望</text>
<text x="46" y="311" font-size="14" font-weight="400" fill="#334155" text-anchor="start">（ふつうの言葉）</text>
<text x="46" y="342" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">例</text>
<text x="46" y="362" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">「旅行中も植物に</text>
<text x="46" y="383" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">水をあげたい」</text>
