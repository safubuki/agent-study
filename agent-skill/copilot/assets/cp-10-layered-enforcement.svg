<title id="title">階層つきの強制：1 つのフックが全階層のポリシーを読む</title><desc id="desc">編集しようとしたファイルの場所から、範囲に入るポリシー（L1・L2・L3）を集め、どれか 1 つでも禁止なら止める。許可するキーは無い。</desc><defs>
</defs>
