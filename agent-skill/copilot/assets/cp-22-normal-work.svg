<text x="130" y="482" font-size="16" font-weight="700" fill="#334155" text-anchor="start">C1 の使用率は 24 ÷ 63 ＝ 約 38%。基準の 70% 以下なので、このままで大丈夫。</text>
<rect x="130" y="506" width="263" height="26" rx="7" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
<text x="139" y="523.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">入力 24 V ← part.json（L2 部品）</text>
<rect x="399" y="506" width="192" height="26" rx="7" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
<text x="408" y="523.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">基準 70% ← 電源係（L3）</text>
<rect x="597" y="506" width="157" height="26" rx="7" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
<text x="606" y="523.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">定格 63 V ← 回路図</text>
<rect x="760" y="506" width="267" height="26" rx="7" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
<text x="769" y="523.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">表の形 ← 電気設計部（L2 ドメイン）</text>
<rect x="28" y="594" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="622" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ポイント：数値（24 V）・判定基準（70%）・書き方（表）がそれぞれ別の階層から来ている。だから、どれか 1 つが変わっても他はそのまま使える。</text>
<text x="44" y="649" font-size="16" font-weight="400" fill="#475569" text-anchor="start">L1 の「試験を付ける」「released/ は直さない」も同時に効いている（書き込みの関所は図 ④）。</text>
