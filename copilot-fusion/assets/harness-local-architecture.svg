<text x="44" y="800" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Extension Host は「拡張機能を動かす場所」、Local ハーネスは「その側で行われる AI の実行管理」。別の用語。</text>
<text x="44" y="827" font-size="16" font-weight="400" fill="#475569" text-anchor="start">この図は構成の要点を示す。AI モデル自体がこの枠内で推論する、またはオフラインで動くという意味ではない。</text>
