<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Meiryo, 'Yu Gothic UI', 'Noto Sans JP', sans-serif" role="img" aria-label="職場でMCPを使うまでの流れ：承認済みリストの確認、申請、審査、承認と配布、運用と見直し、申請票に書くこと、やってはいけないこと">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <style>
      .t{font-size:13px;font-weight:700}
      .b{font-size:12px;fill:#374151}
      .s{font-size:11px;fill:#6b7280}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="599" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">職場で MCP を使うまでの流れ</text>
  <text x="30" y="64" class="s" font-size="12.5">「個人の判断で入れない」と「承認済みの道を用意する」をセットにすると、ルールが守られやすい</text>

  <!-- 流れ -->
  <rect x="24" y="88" width="128" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="88" y="114" text-anchor="middle" class="t" fill="#1e3a8a">① 使いたい</text>
  <text x="88" y="138" text-anchor="middle" class="s">何に使うか・</text>
  <text x="88" y="156" text-anchor="middle" class="s">扱うデータを</text>
  <text x="88" y="174" text-anchor="middle" class="s">書き出す</text>

  <rect x="168" y="88" width="128" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="232" y="114" text-anchor="middle" class="t" fill="#1e3a8a">② リストを確認</text>
  <text x="232" y="138" text-anchor="middle" class="s">社内の承認済み</text>
  <text x="232" y="156" text-anchor="middle" class="s">カタログに</text>
  <text x="232" y="174" text-anchor="middle" class="s">あるか</text>

  <rect x="312" y="88" width="128" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="376" y="114" text-anchor="middle" class="t" fill="#92400e">③ 申請する</text>
  <text x="376" y="138" text-anchor="middle" class="s">申請票に記入</text>
  <text x="376" y="156" text-anchor="middle" class="s">点検結果を</text>
  <text x="376" y="174" text-anchor="middle" class="s">添える</text>

  <rect x="456" y="88" width="128" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="114" text-anchor="middle" class="t" fill="#92400e">④ 審査</text>
  <text x="520" y="138" text-anchor="middle" class="s">情報システム・</text>
  <text x="520" y="156" text-anchor="middle" class="s">セキュリティ担当が</text>
  <text x="520" y="174" text-anchor="middle" class="s">リスク 8 つを確認</text>

  <rect x="600" y="88" width="128" height="96" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="664" y="114" text-anchor="middle" class="t" fill="#065f46">⑤ 承認・配布</text>
  <text x="664" y="138" text-anchor="middle" class="s">バージョン固定</text>
  <text x="664" y="156" text-anchor="middle" class="s">管理設定で配る</text>
  <text x="664" y="174" text-anchor="middle" class="s">カタログに登録</text>

  <rect x="744" y="88" width="132" height="96" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="810" y="114" text-anchor="middle" class="t" fill="#065f46">⑥ 運用・見直し</text>
  <text x="810" y="138" text-anchor="middle" class="s">利用ログ・更新時の</text>
  <text x="810" y="156" text-anchor="middle" class="s">再審査・定期的な</text>
  <text x="810" y="174" text-anchor="middle" class="s">棚卸し</text>

  <line x1="152" y1="136" x2="166" y2="136" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="296" y1="136" x2="310" y2="136" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="440" y1="136" x2="454" y2="136" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="584" y1="136" x2="598" y2="136" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="728" y1="136" x2="742" y2="136" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 232 184 L 232 206 L 664 206 L 664 186" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="352" y="196" width="196" height="20" rx="10" fill="#ffffff"/>
  <text x="450" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">リストにあれば、そのまま使える</text>

  <!-- 申請票 -->
  <rect x="24" y="232" width="420" height="270" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="40" y="258" class="t" fill="#111827">📝 申請票に書くこと（審査で見るところ）</text>
  <text x="40" y="284" class="b">1. 目的と、使う人・扱うデータの種類</text>
  <text x="40" y="310" class="b">2. サーバーの出所（公式か）とバージョン</text>
  <text x="40" y="336" class="b">3. ツールの一覧と説明文（点検スクリプトの結果）</text>
  <text x="40" y="362" class="b">4. 必要な権限・スコープ（読み取りだけで足りるか）</text>
  <text x="40" y="388" class="b">5. データの行き先と保存場所（社外に出るか）</text>
  <text x="40" y="414" class="b">6. 認証のしかたとトークンの管理方法</text>
  <text x="40" y="440" class="b">7. 書き込み・削除・外部送信ができるか</text>
  <text x="40" y="466" class="b">8. 保守する人と、止め方（無効化・トークン失効）</text>
  <text x="40" y="490" class="s">※ 個人の試しも、業務データを使うなら申請の対象</text>

  <!-- やってはいけない -->
  <rect x="456" y="232" width="420" height="270" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="472" y="258" class="t" fill="#991b1b">🚫 やってはいけないこと</text>
  <text x="472" y="284" class="b">・個人の判断で、業務 PC に MCP サーバーを入れる</text>
  <text x="472" y="310" class="b">・業務データを、未承認の MCP や LLM に流す</text>
  <text x="472" y="336" class="b">・承認画面を、いつも自動で許可する設定にする</text>
  <text x="472" y="362" class="b">・設定ファイルに API キーやパスワードを直書きする</text>
  <text x="472" y="388" class="b">・@latest のまま、更新の中身を見ずに使い続ける</text>
  <text x="472" y="414" class="b">・SNS や個人ブログで見つけたサーバーをそのまま使う</text>
  <text x="472" y="440" class="b">・おかしな動きに気づいても、黙って使い続ける</text>
  <text x="472" y="490" class="s">※ 迷ったら、使う前に窓口に聞く</text>

  <rect x="24" y="516" width="760" height="30" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="404" y="536" text-anchor="middle" class="b" font-weight="700" fill="#9a3412">💡 ルールは「禁止」だけでなく、使ってよいサーバーを社内カタログで見える化する</text>

  <text x="30" y="574" class="s">出典：Claude Code・GitHub Copilot の組織向け MCP 管理機能、OWASP MCP Top 10 をもとに筆者作成</text>
  <!-- 作者サイン：右下から図を見上げる亀（横向き） -->
  <g transform="translate(794 534) scale(0.78)">
  <g id="kame-mark" opacity="0.94">
    <defs>
      <linearGradient id="kameShell" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#c9f1e0"/>
        <stop offset="1" stop-color="#86d3b4"/>
      </linearGradient>
      <linearGradient id="kameScute" x1="0.3" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#ecfbf4"/>
        <stop offset="1" stop-color="#b3e6d0"/>
      </linearGradient>
      <radialGradient id="kameSkin" cx="0.38" cy="0.32" r="0.8">
        <stop offset="0" stop-color="#e6f7c2"/>
        <stop offset="1" stop-color="#b3df86"/>
      </radialGradient>
      <linearGradient id="kameRim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1cf"/>
        <stop offset="1" stop-color="#fbd79b"/>
      </linearGradient>
      <filter id="kameSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="kameGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <clipPath id="kameDome"><path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z"/></clipPath>
    </defs>
    <ellipse cx="68" cy="73" rx="44" ry="3.6" fill="#5b8f7b" opacity="0.22" filter="url(#kameSoft)"/>
    <ellipse cx="56" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <ellipse cx="84" cy="66" rx="5.5" ry="6.5" fill="#a4d47a"/>
    <path d="M106 57 C112 57 116 60 116 63 C112 64.5 107 63.5 104 61 Z" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M42 60 C36 58 30 54 26 47" fill="none" stroke="url(#kameSkin)" stroke-width="13" stroke-linecap="round"/>
    <rect x="37" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <rect x="91" y="57" width="13" height="15" rx="6.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <path d="M34 58 C34 31 51 17 71 17 C92 17 108 32 108 58 Z" fill="url(#kameShell)" stroke="#7fcaa9" stroke-width="1.4"/>
    <g clip-path="url(#kameDome)" fill="url(#kameScute)" stroke="#a9e0c8" stroke-width="5" stroke-linejoin="round">
      <path d="M60 27 L82 27 L88 38 L82 48 L60 48 L54 38 Z"/>
      <path d="M31 60 L38 40 L49 34 L54 38 L60 48 L56 60 Z"/>
      <path d="M111 60 L104 40 L93 34 L88 38 L82 48 L86 60 Z"/>
      <path d="M60 48 L82 48 L86 60 L56 60 Z"/>
    </g>
    <ellipse cx="54" cy="29" rx="10" ry="4.5" fill="#ffffff" opacity="0.7" transform="rotate(-28 54 29)" filter="url(#kameGlow)"/>
    <rect x="30" y="54" width="82" height="9.5" rx="4.75" fill="url(#kameRim)" stroke="#f3c57e" stroke-width="1.2"/>
    <g fill="#f6cf8f" opacity="0.8">
      <circle cx="45" cy="58.8" r="1.2"/><circle cx="58" cy="58.8" r="1.2"/><circle cx="71" cy="58.8" r="1.2"/>
      <circle cx="84" cy="58.8" r="1.2"/><circle cx="97" cy="58.8" r="1.2"/>
    </g>
    <circle cx="23" cy="40" r="15.5" fill="url(#kameSkin)" stroke="#a2d27a" stroke-width="1.2"/>
    <ellipse cx="20" cy="31" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 20 31)" filter="url(#kameGlow)"/>
    <ellipse cx="16.2" cy="38.5" rx="2.9" ry="3.6" fill="#3d3a4a"/>
    <circle cx="15.3" cy="37.2" r="1.25" fill="#ffffff"/>
    <circle cx="17" cy="40" r="0.55" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="24" cy="46" rx="4" ry="2.6" fill="#ffb3c1" opacity="0.75" filter="url(#kameGlow)"/>
    <path d="M9.5 44.5 Q12.5 47.8 16 46" fill="none" stroke="#6f8f56" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="40.5" cy="69.6" r="1.1"/><circle cx="44" cy="70.2" r="1.1"/>
      <circle cx="94.5" cy="69.6" r="1.1"/><circle cx="98" cy="70.2" r="1.1"/>
    </g>
  </g>
  </g>
</svg>
