<text x="110" y="1205" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">ユーザー</text>
<rect x="216" y="1181" width="180" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="306" y="1205" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">AI アプリ</text>
<rect x="412" y="1181" width="180" height="34" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="502" y="1205" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">AI モデル</text>
<rect x="608" y="1181" width="180" height="34" rx="6" fill="#ecfdf5" stroke="#059669"/>
<text x="698" y="1205" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">フック</text>
<rect x="804" y="1181" width="180" height="34" rx="6" fill="#ecfeff" stroke="#0e7490"/>
<text x="894" y="1205" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">作業・検査ツール</text>
<rect x="1000" y="1181" width="180" height="34" rx="6" fill="#fffbeb" stroke="#b45309"/>
<text x="1090" y="1205" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">通知先アプリ</text>
<rect x="314" y="1238" width="376" height="58" rx="4" fill="#fff" stroke="none"/>
<text x="502" y="1261" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">Claude: Stop</text>
<text x="502" y="1288" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">Copilot: agentStop</text>
<line x1="306" y1="1307" x2="698" y2="1307" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-host)"/>
<rect x="706" y="1330" width="180" height="31" rx="4" fill="#fff" stroke="none"/>
<text x="796" y="1353" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">テストを実行</text>
<line x1="698" y1="1372" x2="894" y2="1372" stroke="#059669" stroke-width="2" marker-end="url(#arrow-hook)"/>
<rect x="706" y="1395" width="180" height="31" rx="4" fill="#fff" stroke="none"/>
<text x="796" y="1418" font-size="17" font-weight="500" fill="#0e7490" text-anchor="middle">合否と詳細を返す</text>
<line x1="894" y1="1437" x2="698" y2="1437" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-tool)"/>
<rect x="24" y="1461" width="1152" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="1486" font-size="17" font-weight="700" fill="#334155" text-anchor="start">分岐 A：不合格で、差し戻し回数の上限内</text>
<rect x="314" y="1522" width="376" height="58" rx="4" fill="#fff" stroke="none"/>
<text x="502" y="1545" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">decision: block</text>
<text x="502" y="1572" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">reason: 修正すべき内容</text>
<line x1="698" y1="1591" x2="306" y2="1591" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-hook)"/>
<rect x="314" y="1614" width="180" height="58" rx="4" fill="#fff" stroke="none"/>
<text x="404" y="1637" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">理由を渡す</text>
<text x="404" y="1664" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">修正を依頼</text>
<line x1="306" y1="1683" x2="502" y2="1683" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-host)"/>
<rect x="414" y="1707" width="176" height="47" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="502" y="1735" font-size="16" font-weight="500" fill="#7c3aed" text-anchor="middle">修正内容を考える</text>
<rect x="34" y="1776" width="1132" height="72" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="48" y="1803" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ユーザーの再依頼を待たずに、②の作業の流れへ戻る。</text>
<text x="48" y="1830" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ツールで修正し、返答を作り直した後、再び③の停止イベントで検査する。</text>
<rect x="24" y="1872" width="1152" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="1897" font-size="17" font-weight="700" fill="#334155" text-anchor="start">分岐 B：合格した場合</text>
<rect x="314" y="1933" width="376" height="31" rx="4" fill="#fff" stroke="none"/>
<text x="502" y="1956" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">停止を許可する</text>
<line x1="698" y1="1975" x2="306" y2="1975" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-hook)"/>
<rect x="118" y="1998" width="180" height="31" rx="4" fill="#fff" stroke="none"/>
<text x="208" y="2021" font-size="17" font-weight="500" fill="#2563eb" text-anchor="middle">このターンは停止</text>
<line x1="306" y1="2040" x2="110" y2="2040" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-host)"/>
<rect x="22" y="2064" width="176" height="74" rx="8" fill="#f8fafc" stroke="#475569"/>
<text x="110" y="2092" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">返答と成果物を確認</text>
<text x="110" y="2119" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">必要なら次を依頼</text>
<rect x="34" y="2166" width="1132" height="99" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="48" y="2193" font-size="16" font-weight="400" fill="#475569" text-anchor="start">A と B は合否の分岐。返答表示と検査のタイミングは区別し、返答が得られただけで成功と判定しない。</text>
<text x="48" y="2220" font-size="16" font-weight="400" fill="#475569" text-anchor="start">stop_hook_active や回数の上限で、終わらない差し戻しを避ける。上限で通した場合も「検査合格」と扱わない。</text>
<text x="48" y="2247" font-size="16" font-weight="400" fill="#475569" text-anchor="start">通知先アプリも使う場合は、検査結果を決めてから通知する。別の停止フックによる差し戻しにも注意する。</text>
</svg>
