<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" role="img" aria-label="視線誘導とアフォーダンス：悪い配置と良い配置のビフォーアフター比較図">
  <defs>
    <marker id="vArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="840" height="310" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="32" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">視線誘導とアフォーダンス：「選ぶ」と「動かす」を分けるだけで迷わなくなる</text>

  <!-- 左：悪いUI -->
  <rect x="22" y="48" width="376" height="242" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <rect x="22" y="48" width="376" height="30" rx="14" fill="#be123c"/>
  <rect x="22" y="64" width="376" height="14" fill="#be123c"/>
  <text x="40" y="68" font-size="11.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">❌ 悪い例：ボタンと表示が同じ見た目で混在</text>

  <rect x="38" y="92" width="344" height="136" rx="10" fill="#ffffff" stroke="#fecdd3"/>
  <!-- ごちゃごちゃ配置 -->
  <rect x="50" y="106" width="76" height="26" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="88" y="123" text-anchor="middle" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">設定A</text>
  <rect x="134" y="106" width="76" height="26" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="172" y="123" text-anchor="middle" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">実行</text>
  <rect x="218" y="106" width="76" height="26" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="256" y="123" text-anchor="middle" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">状態:OK</text>
  <rect x="302" y="106" width="68" height="26" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="336" y="123" text-anchor="middle" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">設定B</text>

  <rect x="50" y="144" width="320" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="164" font-size="9.5" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">□ 項目1   □ 項目2   □ 項目3（説明なし）</text>
  <text x="62" y="184" font-size="9.5" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">[箱A]    [箱B]    [箱C]  （矢印なし・向き不明）</text>
  <text x="62" y="204" font-size="9.5" fill="#be123c" font-weight="700" font-family="BIZ UDPGothic, sans-serif">😵 どれが押せて、どの順で操作するか分からない！</text>

  <text x="40" y="252" font-size="10" font-weight="700" fill="#9f1239" font-family="BIZ UDPGothic, sans-serif">・設定・実行・ただのステータスが全部同じ見た目</text>
  <text x="40" y="272" font-size="10" font-weight="700" fill="#9f1239" font-family="BIZ UDPGothic, sans-serif">・視線が左右に迷い、図の方向性も伝わらない</text>

  <!-- 右：良いUI -->
  <rect x="420" y="48" width="398" height="242" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <rect x="420" y="48" width="398" height="30" rx="14" fill="#0f766e"/>
  <rect x="420" y="64" width="398" height="14" fill="#0f766e"/>
  <text x="438" y="68" font-size="11.5" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">✅ 良い例：上から下への 1 本道（選ぶ → 動かす → 見る）</text>

  <!-- Step 1 選ぶ帯 -->
  <rect x="436" y="88" width="366" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="448" y="104" font-size="9.5" font-weight="800" fill="#475569" font-family="BIZ UDPGothic, sans-serif">① 条件を 1 つ選ぶ（白枠カード＝選ぶ専用）</text>
  <rect x="448" y="112" width="164" height="22" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="530" y="127" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0f766e" font-family="BIZ UDPGothic, sans-serif">● パターン A（選択中）</text>
  <rect x="622" y="112" width="166" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="705" y="127" text-anchor="middle" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">○ パターン B</text>

  <path d="M 619 144 L 619 156" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#vArr)"/>

  <!-- Step 2 動かす帯 -->
  <rect x="436" y="159" width="366" height="44" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="448" y="185" font-size="9.5" font-weight="800" fill="#115e59" font-family="BIZ UDPGothic, sans-serif">② ボタンを押して実行！</text>
  <rect x="650" y="168" width="140" height="26" rx="8" fill="#0f766e"/>
  <text x="720" y="185" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">▶ テストを実行する</text>

  <path d="M 619 205 L 619 217" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#vArr)"/>

  <!-- Step 3 見る帯（方向矢印つき） -->
  <rect x="436" y="220" width="366" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="448" y="236" font-size="9.5" font-weight="800" fill="#475569" font-family="BIZ UDPGothic, sans-serif">③ 結果を見る（送り手→受け手の方向矢印つき）</text>
  <rect x="448" y="244" width="90" height="24" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="493" y="260" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af" font-family="BIZ UDPGothic, sans-serif">📤 送り手</text>
  <text x="580" y="260" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0f766e" font-family="BIZ UDPGothic, sans-serif">──検査へ──▶</text>
  <rect x="626" y="244" width="162" height="24" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="707" y="260" text-anchor="middle" font-size="9" font-weight="700" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">📥 受け手（✅ 合格）</text>
</svg>
