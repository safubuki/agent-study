<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 205" role="img" aria-label="サブエージェントのイラスト：親AIが専門AIへ分担して集約する">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <marker id="arr1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr1g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="360" height="205" rx="18" fill="url(#bg1)"/>
  <rect x="18" y="56" width="96" height="66" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="66" cy="77" r="13" fill="#dbeafe"/>
  <text x="66" y="82" text-anchor="middle" font-size="14" font-family="sans-serif">🧭</text>
  <text x="66" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a" font-family="BIZ UDPGothic, sans-serif">親 AI</text>
  <text x="66" y="116" text-anchor="middle" font-size="9.5" fill="#475569" font-family="BIZ UDPGothic, sans-serif">仕事を手分け</text>

  <path d="M 116 76 C 136 66, 142 38, 160 38" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr1)"/>
  <path d="M 116 89 L 160 89" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr1)"/>
  <path d="M 116 102 C 136 112, 142 140, 160 140" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr1)"/>

  <rect x="166" y="18" width="94" height="40" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="213" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" font-family="BIZ UDPGothic, sans-serif">🔍 調査担当</text>
  <text x="213" y="50" text-anchor="middle" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">別机でじっくり</text>

  <rect x="166" y="69" width="94" height="40" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="213" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" font-family="BIZ UDPGothic, sans-serif">🛠️ 作成担当</text>
  <text x="213" y="101" text-anchor="middle" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">専門作業に集中</text>

  <rect x="166" y="120" width="94" height="40" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="213" y="137" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" font-family="BIZ UDPGothic, sans-serif">✅ 検査担当</text>
  <text x="213" y="152" text-anchor="middle" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">ミスをチェック</text>

  <path d="M 262 38 C 276 38, 276 74, 290 82" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr1g)"/>
  <path d="M 262 89 L 288 89" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr1g)"/>
  <path d="M 262 140 C 276 140, 276 104, 290 96" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr1g)"/>

  <rect x="294" y="58" width="52" height="62" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="320" y="84" text-anchor="middle" font-size="16" font-family="sans-serif">📋</text>
  <text x="320" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">要点</text>
  <text x="320" y="114" text-anchor="middle" font-size="8.5" fill="#047857" font-family="BIZ UDPGothic, sans-serif">だけ報告</text>

  <text x="180" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af" font-family="BIZ UDPGothic, sans-serif">作業机（記憶）を散らかさず、専門チームで手分け</text>
</svg>
