<text x="466" y="662.5" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">«satisfy»</text>
<rect x="28" y="712" width="270" height="138" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<rect x="44" y="727" width="45" height="22" rx="6" fill="#4f46e5" stroke="none"/>
<text x="66.5" y="742.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">仕様</text>
<rect x="95" y="727" width="45" height="22" rx="6" fill="#059669" stroke="none"/>
<text x="117.5" y="742.3" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">設計</text>
<text x="44" y="772" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">制御部の中身（制御ソフト）</text>
<text x="44" y="792" font-size="13" font-weight="400" fill="#334155" text-anchor="start">仕様 S-1〜S-5 をもとに、</text>
<text x="44" y="812" font-size="13" font-weight="400" fill="#334155" text-anchor="start">クラス図とシーケンス図で</text>
<text x="44" y="832" font-size="13" font-weight="400" fill="#334155" text-anchor="start">設計する（03 章）</text>
<path d="M519 760 L300 760" fill="none" stroke="#c2410c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M312 753.4 L300 760 L312 766.6 Z" fill="#c2410c" stroke="none"/>
<rect x="28" y="906" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="934" font-size="16" font-weight="400" fill="#475569" text-anchor="start">仕様は «requirement» にせず、仕様書やアクティビティ図などに書いて «refine» で結ぶ。部品は本機の設計で選び «satisfy» で結ぶ。</text>
<text x="44" y="961" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ポンプの要件 PMP-1 は、本機の仕様 S-2 を「ポンプを主語」に書き直したもの。根拠は «rationale» に残す。数値は想定値。</text>
