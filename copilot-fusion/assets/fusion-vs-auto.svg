<text x="236" y="551" font-size="17" font-weight="400" fill="#475569" text-anchor="start">組み合わせを任せる</text>
<text x="572" y="520" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Single / Cascade / Critique</text>
<text x="572" y="551" font-size="17" font-weight="400" fill="#475569" text-anchor="start">最終返答は1つ</text>
<text x="900" y="520" font-size="17" font-weight="400" fill="#475569" text-anchor="start">追加の呼出しは</text>
