<text x="557" y="559.32" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">企業管理設定で無効の可能性</text>
<text x="62" y="596" font-size="14" font-weight="400" fill="#475569" text-anchor="start">VS Code 内で他社製ハーネスを使う選択肢。</text>
<text x="62" y="622" font-size="14" font-weight="400" fill="#475569" text-anchor="start">組織・企業の管理設定が適用されている環境では無効になります。</text>
