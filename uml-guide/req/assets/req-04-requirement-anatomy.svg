<title id="title">要求・要件 1 件の中身：目的・能力・条件・性能・確認</title><desc id="desc">1 つの文を「いつ・だれが・どれだけ・何をする」に分け、文の外で「なぜ（目的）」と「どう確かめる（確認）」を結ぶ。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="935" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">要求・要件 1 件の中身：目的・能力・条件・性能・確認</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">1 つの文を「いつ・だれが・どれだけ・何をする」に分け、文の外で「なぜ（目的）」と「どう確かめる（確認）」を結ぶ。</text>
<rect x="113.2" y="150" width="458.2" height="48" rx="9" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
<rect x="317.8" y="137" width="49" height="22" rx="11" fill="#fff" stroke="#0e7490" stroke-width="1.4"/>
<text x="342.3" y="152.3" font-size="12" font-weight="700" fill="#155e75" text-anchor="middle">条件</text>
<text x="342.3" y="182" font-size="18" font-weight="700" fill="#155e75" text-anchor="middle">土の水分量（体積含水率）が30%未満になったとき、</text>
<rect x="579.4" y="150" width="79.1" height="48" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<rect x="594.4" y="137" width="49" height="22" rx="11" fill="#fff" stroke="#475569" stroke-width="1.4"/>
<text x="618.9" y="152.3" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">主語</text>
<text x="618.9" y="182" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">本機は</text>
<rect x="666.5" y="150" width="117.6" height="48" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
<rect x="682.3" y="137" width="86" height="22" rx="11" fill="#fff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="725.3" y="152.3" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">性能・制約</text>
<text x="725.3" y="182" font-size="18" font-weight="700" fill="#3730a3" text-anchor="middle">10分以内に</text>
<rect x="792.1" y="150" width="207.6" height="48" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="871.4" y="137" width="49" height="22" rx="11" fill="#fff" stroke="#2563eb" stroke-width="1.4"/>
<text x="895.9" y="152.3" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">能力</text>
<text x="895.9" y="182" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle">鉢への給水を開始する</text>
<text x="1047.2" y="182" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">こと。</text>
<text x="600" y="234" font-size="14.5" font-weight="400" fill="#64748b" text-anchor="middle">↓ 文の中に書く 3 要素（条件・性能・能力）と、関係線で文の外に結ぶ 2 要素（目的・確認）</text>
<rect x="28" y="260" width="216" height="262" rx="12" fill="#fff" stroke="none"/>
<path d="M28 322 V272 Q28 260 40 260 H232 Q244 260 244 272 V322 Z" fill="#fff1f2" stroke="none"/>
<path d="M28 322 H244" fill="none" stroke="#fecdd3" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="260" width="216" height="262" rx="12" fill="none" stroke="#be123c" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="46" y="288" font-size="17.5" font-weight="700" fill="#9f1239" text-anchor="start">目的</text>
<text x="46" y="310" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Why</text>
<text x="46" y="350" font-size="15.5" font-weight="700" fill="#9f1239" text-anchor="start">なぜ必要か</text>
<text x="46" y="380" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">例</text>
<text x="46" y="401" font-size="14" font-weight="400" fill="#334155" text-anchor="start">留守中も植物を</text>
<text x="46" y="422" font-size="14" font-weight="400" fill="#334155" text-anchor="start">水不足で枯らさない</text>
<text x="46" y="455" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">コツ</text>
<text x="46" y="476" font-size="14" font-weight="400" fill="#334155" text-anchor="start">上位要求とつなぐ</text>
<text x="46" y="497" font-size="14" font-weight="400" fill="#334155" text-anchor="start">か «rationale» に書く</text>
<rect x="157.5" y="279" width="61" height="24" rx="12" fill="#fff" stroke="#be123c" stroke-width="1.4"/>
<text x="188" y="295.3" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">文の外</text>
<rect x="260" y="260" width="216" height="262" rx="12" fill="#fff" stroke="none"/>
<path d="M260 322 V272 Q260 260 272 260 H464 Q476 260 476 272 V322 Z" fill="#eff6ff" stroke="none"/>
<path d="M260 322 H476" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="260" y="260" width="216" height="262" rx="12" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="278" y="288" font-size="17.5" font-weight="700" fill="#1e40af" text-anchor="start">能力</text>
<text x="278" y="310" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">What</text>
<text x="278" y="350" font-size="15.5" font-weight="700" fill="#1e40af" text-anchor="start">何ができるか</text>
<text x="278" y="380" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">例</text>
<text x="278" y="401" font-size="14" font-weight="400" fill="#334155" text-anchor="start">鉢への給水を</text>
<text x="278" y="422" font-size="14" font-weight="400" fill="#334155" text-anchor="start">開始する</text>
<text x="278" y="455" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">コツ</text>
<text x="278" y="476" font-size="14" font-weight="400" fill="#334155" text-anchor="start">動詞＋対象で書く</text>
<text x="278" y="497" font-size="14" font-weight="400" fill="#334155" text-anchor="start">1 要求に動作は 1 つ</text>
<rect x="492" y="260" width="216" height="262" rx="12" fill="#fff" stroke="none"/>
<path d="M492 322 V272 Q492 260 504 260 H696 Q708 260 708 272 V322 Z" fill="#ecfeff" stroke="none"/>
<path d="M492 322 H708" fill="none" stroke="#a5f3fc" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="492" y="260" width="216" height="262" rx="12" fill="none" stroke="#0e7490" stroke-width="1.6"/>
<text x="510" y="288" font-size="17.5" font-weight="700" fill="#155e75" text-anchor="start">条件</text>
<text x="510" y="310" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">When</text>
<text x="510" y="350" font-size="15.5" font-weight="700" fill="#155e75" text-anchor="start">いつ・どんな時か</text>
<text x="510" y="380" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">例</text>
<text x="510" y="401" font-size="14" font-weight="400" fill="#334155" text-anchor="start">土の水分量が</text>
<text x="510" y="422" font-size="14" font-weight="400" fill="#334155" text-anchor="start">30%未満のとき</text>
<text x="510" y="455" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">コツ</text>
<text x="510" y="476" font-size="14" font-weight="400" fill="#334155" text-anchor="start">きっかけ・状態・</text>
<text x="510" y="497" font-size="14" font-weight="400" fill="#334155" text-anchor="start">使う環境を明記</text>
<rect x="724" y="260" width="216" height="262" rx="12" fill="#fff" stroke="none"/>
<path d="M724 322 V272 Q724 260 736 260 H928 Q940 260 940 272 V322 Z" fill="#eef2ff" stroke="none"/>
<path d="M724 322 H940" fill="none" stroke="#c7d2fe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="724" y="260" width="216" height="262" rx="12" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
<text x="742" y="288" font-size="17.5" font-weight="700" fill="#3730a3" text-anchor="start">性能・制約</text>
<text x="742" y="310" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">How well</text>
<text x="742" y="350" font-size="15.5" font-weight="700" fill="#3730a3" text-anchor="start">どれだけ・どの範囲</text>
<text x="742" y="380" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">例</text>
<text x="742" y="401" font-size="14" font-weight="400" fill="#334155" text-anchor="start">10分以内に開始</text>
<text x="742" y="422" font-size="14" font-weight="400" fill="#334155" text-anchor="start">（1回 約50mL）</text>
<text x="742" y="455" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">コツ</text>
<text x="742" y="476" font-size="14" font-weight="400" fill="#334155" text-anchor="start">数値と単位で書く</text>
<text x="742" y="497" font-size="14" font-weight="400" fill="#334155" text-anchor="start">「速く」「十分」は×</text>
<rect x="956" y="260" width="216" height="262" rx="12" fill="#fff" stroke="none"/>
<path d="M956 322 V272 Q956 260 968 260 H1160 Q1172 260 1172 272 V322 Z" fill="#fffbeb" stroke="none"/>
<path d="M956 322 H1172" fill="none" stroke="#fde68a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="956" y="260" width="216" height="262" rx="12" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="974" y="288" font-size="17.5" font-weight="700" fill="#92400e" text-anchor="start">確認</text>
<text x="974" y="310" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Verify</text>
<text x="974" y="350" font-size="15.5" font-weight="700" fill="#92400e" text-anchor="start">どう確かめるか</text>
<text x="974" y="380" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">例</text>
<text x="974" y="401" font-size="14" font-weight="400" fill="#334155" text-anchor="start">乾いた土で試験し</text>
<text x="974" y="422" font-size="14" font-weight="400" fill="#334155" text-anchor="start">開始までの時間を計測</text>
<text x="974" y="455" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">コツ</text>
<text x="974" y="476" font-size="14" font-weight="400" fill="#334155" text-anchor="start">検査・分析・実演・</text>
<text x="974" y="497" font-size="14" font-weight="400" fill="#334155" text-anchor="start">試験から選ぶ</text>
<rect x="1085.5" y="279" width="61" height="24" rx="12" fill="#fff" stroke="#b45309" stroke-width="1.4"/>
<text x="1116" y="295.3" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">文の外</text>
<rect x="28" y="550" width="1144" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="48" y="590" font-size="17" font-weight="700" fill="#334155" text-anchor="start">書き出しの型</text>
<text x="48" y="616" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">（EARS）</text>
<rect x="212" y="566" width="180" height="72" rx="9" fill="#fff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="224" y="592" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">いつでも</text>
<text x="224" y="618" font-size="13" font-weight="400" fill="#334155" text-anchor="start">本機は〜すること</text>
<rect x="404" y="566" width="180" height="72" rx="9" fill="#fff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="416" y="592" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">イベント</text>
<text x="416" y="618" font-size="13" font-weight="400" fill="#334155" text-anchor="start">〜したとき、本機は〜</text>
<rect x="596" y="566" width="180" height="72" rx="9" fill="#fff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="608" y="592" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">状態</text>
<text x="608" y="618" font-size="13" font-weight="400" fill="#334155" text-anchor="start">〜の間、本機は〜</text>
<rect x="788" y="566" width="180" height="72" rx="9" fill="#fff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="800" y="592" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">異常</text>
<text x="800" y="618" font-size="13" font-weight="400" fill="#334155" text-anchor="start">もし〜なら、本機は〜</text>
<rect x="980" y="566" width="180" height="72" rx="9" fill="#fff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="992" y="592" font-size="14" font-weight="700" fill="#1e40af" text-anchor="start">オプション</text>
<text x="992" y="618" font-size="13" font-weight="400" fill="#334155" text-anchor="start">〜を備える場合、本機は〜</text>
<rect x="28" y="674" width="1144" height="104" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="48" y="714" font-size="17" font-weight="700" fill="#065f46" text-anchor="start">書けたら点検</text>
<text x="48" y="740" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">（よい要求の性質）</text>
<rect x="212" y="690" width="150" height="72" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="224" y="716" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">✓ 必要</text>
<text x="224" y="742" font-size="13" font-weight="400" fill="#334155" text-anchor="start">なくて困るか</text>
<rect x="372" y="690" width="150" height="72" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="384" y="716" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">✓ 明確</text>
<text x="384" y="742" font-size="13" font-weight="400" fill="#334155" text-anchor="start">1 通りに読めるか</text>
<rect x="532" y="690" width="150" height="72" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="544" y="716" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">✓ 単一</text>
<text x="544" y="742" font-size="13" font-weight="400" fill="#334155" text-anchor="start">1 文 1 要求か</text>
<rect x="692" y="690" width="150" height="72" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="704" y="716" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">✓ 実現可能</text>
<text x="704" y="742" font-size="13" font-weight="400" fill="#334155" text-anchor="start">技術・費用で可能か</text>
<rect x="852" y="690" width="150" height="72" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="864" y="716" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">✓ 検証可能</text>
<text x="864" y="742" font-size="13" font-weight="400" fill="#334155" text-anchor="start">合否を判定できるか</text>
<rect x="1012" y="690" width="150" height="72" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="1024" y="716" font-size="14" font-weight="700" fill="#065f46" text-anchor="start">✓ 適切な抽象度</text>
<text x="1024" y="742" font-size="13" font-weight="400" fill="#334155" text-anchor="start">設計を決めすぎない</text>
<rect x="28" y="808" width="1144" height="109" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="836" font-size="16" font-weight="400" fill="#475569" text-anchor="start">文の型は ISO/IEC/IEEE 29148 の［条件］［主語］［動作］［対象］［制約］と、EARS（Mavin ほか, 2009）を初心者向けに日本語化した。</text>
<text x="44" y="863" font-size="16" font-weight="400" fill="#475569" text-anchor="start">点検項目は INCOSE「要求の書き方ガイド」の性質を抜粋。SysML 標準の要求要素が持つのは id と text で、目的は «rationale»、</text>
<text x="44" y="890" font-size="16" font-weight="400" fill="#475569" text-anchor="start">確認は «verify» 関係や拡張属性（SysML 付録の verifyMethod など）で表す。</text>
</svg>
