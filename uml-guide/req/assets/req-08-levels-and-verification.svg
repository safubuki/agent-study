<text x="916" y="714" font-size="17.5" font-weight="700" fill="#92400e" text-anchor="start">試験</text>
<text x="916" y="736" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Test</text>
<text x="916" y="776" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">計測して数値で判定</text>
<text x="916" y="799" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">例）送水量を測る</text>
<rect x="28" y="844" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="872" font-size="16" font-weight="400" fill="#475569" text-anchor="start">上の階層ほど広い範囲（システム全体・利用者の環境）で、下の階層ほど部品単位で確かめる。階層と試験段階が揃うよう粒度を決める。</text>
<text x="44" y="899" font-size="16" font-weight="400" fill="#475569" text-anchor="start">4 分類は NASA Systems Engineering Handbook などで使われる一般的なもので、SysML 付録の verifyMethod の選択肢とも同じ。</text>
