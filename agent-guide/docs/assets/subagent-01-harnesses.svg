<text x="60" y="383" font-size="19" font-weight="700" fill="#92400e" text-anchor="start">旧 Local ハーネス</text>
<text x="60" y="412" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">VS Code の Extension Host で動作</text>
<text x="60" y="438" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">会話がエディタ窓に結び付く</text>
<text x="60" y="464" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="start">委任：agent（内部名 runSubagent）</text>
<text x="60" y="490" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">本書では「VS Code 版」として対比</text>
<rect x="372" y="316" width="312" height="194" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
