<title id="title">各仕組みの制約と「取りこぼし」の起き方（2026-11 時点）</title><desc id="desc">文字数の上限そのものより、「その画面が読まない」「多すぎて守られない」「超えた分が黙って落ちる」の方が実際の取りこぼしになる。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="899" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">各仕組みの制約と「取りこぼし」の起き方（2026-11 時点）</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">文字数の上限そのものより、「その画面が読まない」「多すぎて守られない」「超えた分が黙って落ちる」の方が実際の取りこぼしになる。</text>
<rect x="236" y="126" width="300" height="44" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="386" y="155" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">上限・制約</text>
<rect x="548" y="126" width="312" height="44" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.6"/>
<text x="704" y="155" font-size="16" font-weight="700" fill="#9f1239" text-anchor="middle">取りこぼしの起き方</text>
<rect x="872" y="126" width="300" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="1022" y="155" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">対策</text>
<rect x="28" y="182" width="196" height="92" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="42" y="220" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">copilot-instructions</text>
<text x="42" y="246" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">.md と *.instructions.md</text>
<rect x="236" y="182" width="300" height="92" rx="9" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="248" y="209" font-size="13" font-weight="400" fill="#334155" text-anchor="start">code review は 4,000 字で</text>
<text x="248" y="232" font-size="13" font-weight="400" fill="#334155" text-anchor="start">打ち切り → 2026-06 撤廃</text>
<text x="248" y="255" font-size="13" font-weight="400" fill="#334155" text-anchor="start">他の画面は上限の記載なし</text>
<rect x="548" y="182" width="312" height="92" rx="9" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="560" y="209" font-size="13" font-weight="400" fill="#334155" text-anchor="start">画面ごとの対応差</text>
<text x="560" y="232" font-size="13" font-weight="400" fill="#334155" text-anchor="start">（VS Code 内の review は</text>
<text x="560" y="255" font-size="13" font-weight="400" fill="#334155" text-anchor="start">パス別の指示を読まない）</text>
<rect x="872" y="182" width="300" height="92" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="884" y="209" font-size="13" font-weight="400" fill="#334155" text-anchor="start">短く・重要事項は先頭に</text>
<text x="884" y="232" font-size="13" font-weight="400" fill="#334155" text-anchor="start">最重要は複数の場所に重ねる</text>
<text x="884" y="255" font-size="13" font-weight="400" fill="#334155" text-anchor="start">対応表で効く画面を確認</text>
<rect x="28" y="281" width="196" height="92" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="42" y="319" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">AGENTS.md</text>
<text x="42" y="345" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">（共通の形式）</text>
<rect x="236" y="281" width="300" height="92" rx="9" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="248" y="308" font-size="13" font-weight="400" fill="#334155" text-anchor="start">形式としての上限は無い</text>
<text x="248" y="331" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Codex は合計 32 KiB まで</text>
<text x="248" y="354" font-size="13" font-weight="400" fill="#334155" text-anchor="start">（既定値・変更可）</text>
<rect x="548" y="281" width="312" height="92" rx="9" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="560" y="308" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Codex は超えた分を</text>
<text x="560" y="331" font-size="13" font-weight="400" fill="#334155" text-anchor="start">警告なく落とす</text>
<text x="560" y="354" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Visual Studio は読まない</text>
<rect x="872" y="281" width="300" height="92" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="884" y="308" font-size="13" font-weight="400" fill="#334155" text-anchor="start">入れ子に分けて小さく</text>
<text x="884" y="331" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Claude Code では</text>
<text x="884" y="354" font-size="13" font-weight="400" fill="#334155" text-anchor="start">CLAUDE.md から @AGENTS.md</text>
<rect x="28" y="380" width="196" height="92" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="42" y="418" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">CLAUDE.md</text>
<text x="42" y="444" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">（Claude Code）</text>
<rect x="236" y="380" width="300" height="92" rx="9" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="248" y="407" font-size="13" font-weight="400" fill="#334155" text-anchor="start">1 ファイル 200 行が目安</text>
<text x="248" y="430" font-size="13" font-weight="400" fill="#334155" text-anchor="start">長いほど守られにくい</text>
<text x="248" y="453" font-size="13" font-weight="400" fill="#334155" text-anchor="start">大きいサブフォルダ分は先頭だけ</text>
<rect x="548" y="380" width="312" height="92" rx="9" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="560" y="407" font-size="13" font-weight="400" fill="#334155" text-anchor="start">矛盾すると AI が</text>
<text x="560" y="430" font-size="13" font-weight="400" fill="#334155" text-anchor="start">どちらかを選ぶ</text>
<text x="560" y="453" font-size="13" font-weight="400" fill="#334155" text-anchor="start">長い会話で漏れる</text>
<rect x="872" y="380" width="300" height="92" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="884" y="407" font-size="13" font-weight="400" fill="#334155" text-anchor="start">パス別ルールへ分ける</text>
<text x="884" y="430" font-size="13" font-weight="400" fill="#334155" text-anchor="start">手順はスキルへ</text>
<text x="884" y="453" font-size="13" font-weight="400" fill="#334155" text-anchor="start">必須はフックへ</text>
<rect x="28" y="479" width="196" height="92" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="42" y="517" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">組織の指示</text>
<text x="42" y="543" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">（GitHub の設定）</text>
<rect x="236" y="479" width="300" height="92" rx="9" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="248" y="506" font-size="13" font-weight="400" fill="#334155" text-anchor="start">GitHub.com 上だけ</text>
<text x="248" y="529" font-size="13" font-weight="400" fill="#334155" text-anchor="start">（Chat・cloud agent・</text>
<text x="248" y="552" font-size="13" font-weight="400" fill="#334155" text-anchor="start">code review）</text>
<rect x="548" y="479" width="312" height="92" rx="9" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="560" y="506" font-size="13" font-weight="400" fill="#334155" text-anchor="start">VS Code・CLI では</text>
<text x="560" y="529" font-size="13" font-weight="400" fill="#334155" text-anchor="start">使われない</text>
<text x="560" y="552" font-size="13" font-weight="400" fill="#334155" text-anchor="start"></text>
<rect x="872" y="479" width="300" height="92" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="884" y="506" font-size="13" font-weight="400" fill="#334155" text-anchor="start">ローカルにも効かせたい</text>
<text x="884" y="529" font-size="13" font-weight="400" fill="#334155" text-anchor="start">約束はリポジトリの</text>
<text x="884" y="552" font-size="13" font-weight="400" fill="#334155" text-anchor="start">AGENTS.md にも書く</text>
<rect x="28" y="578" width="196" height="92" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="42" y="616" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">スキル</text>
<text x="42" y="642" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">（SKILL.md）</text>
<rect x="236" y="578" width="300" height="92" rx="9" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="248" y="605" font-size="13" font-weight="400" fill="#334155" text-anchor="start">name 64・説明文 1,024 字</text>
<text x="248" y="628" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Claude Code は一覧で</text>
<text x="248" y="651" font-size="13" font-weight="400" fill="#334155" text-anchor="start">1,536 字・全体で文脈の約 1%</text>
<rect x="548" y="578" width="312" height="92" rx="9" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="560" y="605" font-size="13" font-weight="400" fill="#334155" text-anchor="start">発火は確率的</text>
<text x="560" y="628" font-size="13" font-weight="400" fill="#334155" text-anchor="start">数が多いと説明文が</text>
<text x="560" y="651" font-size="13" font-weight="400" fill="#334155" text-anchor="start">削られる（Claude Code）</text>
<rect x="872" y="578" width="300" height="92" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="884" y="605" font-size="13" font-weight="400" fill="#334155" text-anchor="start">手動専用・常時の指示に</text>
<text x="884" y="628" font-size="13" font-weight="400" fill="#334155" text-anchor="start">索引・棚卸しで減らす</text>
<text x="884" y="651" font-size="13" font-weight="400" fill="#334155" text-anchor="start">必須ならフックへ</text>
<rect x="28" y="677" width="196" height="92" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="42" y="715" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">フック</text>
<text x="42" y="741" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">（.github/hooks）</text>
<rect x="236" y="677" width="300" height="92" rx="9" fill="#fff" stroke="#fde68a" stroke-width="1.6"/>
<text x="248" y="704" font-size="13" font-weight="400" fill="#334155" text-anchor="start">preToolUse の既定は 30 秒</text>
<text x="248" y="727" font-size="13" font-weight="400" fill="#334155" text-anchor="start">タイムアウトは拒否でなく</text>
<text x="248" y="750" font-size="13" font-weight="400" fill="#334155" text-anchor="start">許可の流れへ進む</text>
<rect x="548" y="677" width="312" height="92" rx="9" fill="#fff" stroke="#fecdd3" stroke-width="1.6"/>
<text x="560" y="704" font-size="13" font-weight="400" fill="#334155" text-anchor="start">cloud agent は</text>
<text x="560" y="727" font-size="13" font-weight="400" fill="#334155" text-anchor="start">.github/hooks だけ</text>
<text x="560" y="750" font-size="13" font-weight="400" fill="#334155" text-anchor="start">VS Code はプレビュー</text>
<rect x="872" y="677" width="300" height="92" rx="9" fill="#fff" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="884" y="704" font-size="13" font-weight="400" fill="#334155" text-anchor="start">処理は軽く</text>
<text x="884" y="727" font-size="13" font-weight="400" fill="#334155" text-anchor="start">PR の必須チェックでも</text>
<text x="884" y="750" font-size="13" font-weight="400" fill="#334155" text-anchor="start">同じ検査を二重に</text>
<rect x="28" y="799" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="827" font-size="16" font-weight="400" fill="#475569" text-anchor="start">出典：GitHub Changelog（2026-06-12 上限撤廃）・GitHub Docs・OpenAI Codex Docs・Claude Code Docs（2026-11-18 確認）。</text>
<text x="44" y="854" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「上限があるからスキルにする」ではなく、「毎回要る事実は常時の指示、必要時だけの手順はスキル、必須はフック」と役割で分ける。</text>
