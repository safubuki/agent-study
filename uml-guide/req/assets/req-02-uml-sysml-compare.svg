<text x="46" y="821.5" font-size="17.5" font-weight="700" fill="#155e75" text-anchor="start">SysML でシステム全体を描く</text>
<text x="46" y="864" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">要求図 → 構造（bdd・ibd）→ 振る舞い（sd・stm・act）</text>
<text x="46" y="887" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">ソフト部分は UML のクラス図などで、さらに詳しく描く</text>
<rect x="610" y="792" width="562" height="112" rx="12" fill="#fff" stroke="none"/>
<path d="M610 838 V804 Q610 792 622 792 H1160 Q1172 792 1172 804 V838 Z" fill="#fff7ed" stroke="none"/>
<path d="M610 838 H1172" fill="none" stroke="#fed7aa" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="610" y="792" width="562" height="112" rx="12" fill="none" stroke="#c2410c" stroke-width="1.6"/>
<text x="628" y="821.5" font-size="17.5" font-weight="700" fill="#9a3412" text-anchor="start">UML で十分</text>
<text x="628" y="864" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">要求は表・ユースケース図・チケットなどで管理する</text>
<text x="628" y="887" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">クラス図・シーケンス図などで設計を描く</text>
<rect x="28" y="934" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="962" font-size="16" font-weight="400" fill="#475569" text-anchor="start">SysML 1.x のブロックは UML のクラスを拡張したもの。シーケンス図・ステートマシン図などは両者でほぼ同じ書き方になる。</text>
<text x="44" y="989" font-size="16" font-weight="400" fill="#475569" text-anchor="start">このガイドは「SysML の要求図で整理 → 仕様 → UML/SysML の構造図・振る舞い図」という組み合わせで説明する。</text>
