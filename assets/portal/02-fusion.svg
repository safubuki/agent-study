<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 205" role="img" aria-label="Copilot Fusionのイラスト：依頼に合わせて最適なAI協調方式を選ぶ">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="360" height="205" rx="18" fill="url(#bg2)"/>
  <rect x="18" y="50" width="98" height="78" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="67" y="76" text-anchor="middle" font-size="18" font-family="sans-serif">⚡</text>
  <text x="67" y="96" text-anchor="middle" font-size="11.5" font-weight="700" fill="#312e81" font-family="BIZ UDPGothic, sans-serif">Copilot</text>
  <text x="67" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4f46e5" font-family="BIZ UDPGothic, sans-serif">ハーネス</text>
  <text x="67" y="122" text-anchor="middle" font-size="8.5" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">難易度を見極め</text>

  <path d="M 118 70 L 152 38" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr2)"/>
  <path d="M 118 89 L 152 89" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr2)"/>
  <path d="M 118 108 L 152 140" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr2)"/>

  <rect x="158" y="18" width="184" height="40" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
  <text x="170" y="35" font-size="10.5" font-weight="700" fill="#1e1b4b" font-family="BIZ UDPGothic, sans-serif">🎯 Single（単一AIで素早く）</text>
  <text x="170" y="50" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">かんたんな日常作業に最適</text>

  <rect x="158" y="69" width="184" height="40" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
  <text x="170" y="86" font-size="10.5" font-weight="700" fill="#1e1b4b" font-family="BIZ UDPGothic, sans-serif">🪜 Cascade（段階的に昇格）</text>
  <text x="170" y="101" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">軽量AI → 足りなければ強いAIへ</text>

  <rect x="158" y="120" width="184" height="40" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2"/>
  <text x="170" y="137" font-size="10.5" font-weight="700" fill="#312e81" font-family="BIZ UDPGothic, sans-serif">🔍 Critique（批評＋修正）</text>
  <text x="170" y="152" font-size="9" fill="#4338ca" font-family="BIZ UDPGothic, sans-serif">複数AIが弱点を指摘→元のAIが直す</text>

  <text x="180" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#3730a3" font-family="BIZ UDPGothic, sans-serif">多数決ではなく、批評と昇格で質と速度を両立</text>
</svg>
