<text x="620" y="606.5" font-size="15.5" font-weight="700" fill="#334155" text-anchor="start">層の選び方</text>
<text x="620" y="644" font-size="14" font-weight="400" fill="#334155" text-anchor="start">全員に効かせたい → ベース　担当領域だけ → 部署　自分だけ → 個人</text>
<rect x="28" y="710" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="738" font-size="16" font-weight="400" fill="#475569" text-anchor="start">公式の目安：同じ間違いが 2 回 → CLAUDE.md、同じ手順を 3 回貼った → スキル、毎回自動でやりたい → フック（Extend Claude Code）。</text>
<text x="44" y="765" font-size="16" font-weight="400" fill="#475569" text-anchor="start">「必ず毎回このスキルを実行」は、スキルではなく「フックで必ず実行するスクリプト」か「常時の指示」で表すのが確実。</text>
