<text x="870" y="318" font-size="14.5" font-weight="700" fill="#334155" text-anchor="start">スクリプトの作成コスト</text>
<text x="870" y="343" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">1 分 39 秒・約 0.43 USD（初回だけ）</text>
<text x="870" y="368" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">→ 同じ流れの AI 版と比べて</text>
<text x="870" y="393" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start">　 1 回目で元が取れた</text>
<text x="870" y="424" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">※ API 換算の目安。条件は実験レポート参照</text>
<rect x="28" y="526" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="554" font-size="16" font-weight="400" fill="#475569" text-anchor="start">公式ベストプラクティスも、用意済みスクリプトの利点を「生成コードより確実・トークン節約・時間節約・毎回一貫」とまとめている。</text>
<text x="44" y="581" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スクリプトは「実行するもの」か「読んで参考にするもの」かを SKILL.md に明記する（ふつうは実行）。</text>
