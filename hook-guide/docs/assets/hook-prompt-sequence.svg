<text x="306" y="153" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">AI アプリ</text>
<text x="306" y="180" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">会話と実行を管理</text>
</g>
<g data-participant="model">
<line x1="502" y1="194" x2="502" y2="1586" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 6" opacity="0.7"/>
