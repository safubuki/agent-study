<title id="title">MCP が見えないときは、設定を読む経路と認証を分けて確認する</title><desc id="desc">既存定義の転送と、ネイティブ設定への移行は別の経路。Copilot 側でサーバー起動とツール呼出しを確認する。</desc><defs>
<marker id="arrow-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
<marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
<marker id="arrow-harness" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker>
<marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker>
<marker id="arrow-review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker>
<marker id="arrow-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0e7490"/></marker>
<marker id="arrow-process" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="arrow-sdk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="976" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">MCP が見えないときは、設定を読む経路と認証を分けて確認する</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">既存定義の転送と、ネイティブ設定への移行は別の経路。Copilot 側でサーバー起動とツール呼出しを確認する。</text>
<rect x="28" y="130" width="330" height="148" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="193" y="162" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">これまでの設定</text>
<text x="193" y="194" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">.vscode/mcp.json</text>
<text x="193" y="221" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">プロファイルの mcp.json</text>
<text x="193" y="248" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">最上位は servers</text>
<rect x="410" y="130" width="360" height="148" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="590" y="162" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">A：エディタが転送</text>
<text x="590" y="194" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">互換性のある定義を渡す</text>
<text x="590" y="221" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">元の設定ファイルは残る</text>
<text x="590" y="248" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">エディタへの依存も確認</text>
<line x1="358" y1="204" x2="410" y2="204" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<rect x="410" y="410" width="360" height="148" rx="11" fill="#ecfdf5" stroke="#059669"/>
<text x="590" y="442" font-size="20" font-weight="700" fill="#059669" text-anchor="middle">B：ネイティブ設定へ移行</text>
<text x="590" y="474" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">.mcp.json / mcp-config.json</text>
<text x="590" y="501" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">最上位は mcpServers</text>
<text x="590" y="528" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">実行ホストの設定として読む</text>
<path d="M358 240 H384 V484 H410" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<rect x="850" y="320" width="322" height="168" rx="11" fill="#ecfdf5" stroke="#059669"/>
<text x="1011" y="352" font-size="20" font-weight="700" fill="#059669" text-anchor="middle">Copilot ハーネス</text>
<text x="1011" y="384" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">使える定義を読み込む</text>
<text x="1011" y="411" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">認証・実行条件を確認</text>
<text x="1011" y="438" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">ツールを公開</text>
<path d="M770 204 H810 V360 H850" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<line x1="770" y1="454" x2="850" y2="454" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="850" y="562" width="322" height="104" rx="11" fill="#ecfeff" stroke="#0e7490"/>
<text x="1011" y="594" font-size="20" font-weight="700" fill="#0e7490" text-anchor="middle">MCP サーバー</text>
<text x="1011" y="626" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">接続・起動して道具を提供</text>
<line x1="1011" y1="488" x2="1011" y2="562" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="28" y="338" width="330" height="220" rx="11" fill="#fffbeb" stroke="#b45309"/>
<text x="193" y="370" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">転送されない主な例</text>
<text x="193" y="402" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">${input:...}</text>
<text x="193" y="429" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">${command:...}</text>
<text x="193" y="456" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">入力済み・キャッシュ済みでも</text>
<text x="193" y="483" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">適格な定義にはならない</text>
<rect x="410" y="310" width="360" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="590" y="349" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">転送だけでは、移行したことにならない</text>
<rect x="28" y="704" width="1144" height="144" rx="10" fill="#ecfeff" stroke="#0e7490"/>
<text x="48" y="736" font-size="21" font-weight="700" fill="#0e7490" text-anchor="start">切り分ける順序</text>
<text x="48" y="770" font-size="18" font-weight="500" fill="#334155" text-anchor="start">1 設定の場所・形式　→　2 認証・環境変数　→　3 パス・実行ホスト　→　4 道具と対応機能</text>
<text x="48" y="806" font-size="17" font-weight="400" fill="#475569" text-anchor="start">OAuth または許可された環境変数で認証を用意し、Agent Host に反映。秘密値を設定へ直書きしない。</text>
<rect x="28" y="876" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="904" font-size="16" font-weight="400" fill="#475569" text-anchor="start">移行先の標準環境変数参照は ${NAME}。${env:NAME}・inputs・envFile などをそのまま複製しない。</text>
<text x="44" y="931" font-size="16" font-weight="400" fill="#475569" text-anchor="start">移行機能は成功した元エントリを削除する場合がある。原本を保存し、接続・認証・実際のツール呼出しを確かめる。</text>
</svg>
