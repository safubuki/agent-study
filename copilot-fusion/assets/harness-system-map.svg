<text x="268" y="556" font-size="21" font-weight="700" fill="#0e7490" text-anchor="middle">標準・拡張のツール</text>
<text x="268" y="588" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">例：ファイルを読む・編集する</text>
<text x="268" y="615" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">コマンド実行・テスト・検索</text>
<text x="268" y="642" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">呼べる操作を「ツール」と呼ぶ</text>
<rect x="692" y="524" width="480" height="170" rx="11" fill="#ecfeff" stroke="#0e7490"/>
<text x="932" y="556" font-size="21" font-weight="700" fill="#0e7490" text-anchor="middle">MCP サーバーが提供するツール</text>
<text x="932" y="588" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">例：社内文書を検索・チケットを取得</text>
<text x="932" y="615" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">外部サービスの操作を共通形式で公開</text>
<text x="932" y="642" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">MCP は、この接続のための共通ルール</text>
