<text x="44" y="612" font-size="16" font-weight="400" fill="#475569" text-anchor="start">公式ドキュメントも「説明文が曖昧・重なると、違うスキルを読んだり、役立つスキルを見逃したりする」と注意している。</text>
<text x="44" y="639" font-size="16" font-weight="400" fill="#475569" text-anchor="start">4 の専用エージェントは、Claude Code では skills: で事前読み込み、Copilot では本文で「最初にこのスキルを読む」と指示する。</text>
