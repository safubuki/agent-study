<text x="477" y="347.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">推奨・後継（CLI 相当）</text>
<text x="388" y="383" font-size="19" font-weight="700" fill="#059669" text-anchor="start">Copilot ハーネス</text>
<text x="388" y="412" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Session Target → Copilot で選択</text>
<text x="388" y="438" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">Agent Host がセッションを保持</text>
<text x="388" y="464" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="start">委任：agent（内部名 task）</text>
<text x="388" y="490" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">CLI と同じ実行ランタイムを使用</text>
<rect x="44" y="528" width="640" height="116" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="62" y="562" font-size="17.5" font-weight="700" fill="#334155" text-anchor="start">Claude ハーネス ／ Codex ハーネス</text>
