<text x="46" y="144" font-size="17.5" font-weight="700" fill="#9f1239" text-anchor="start">NG：兄弟の粒度がバラバラ</text>
<text x="46" y="166" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">部品の話・あいまいな言葉・2 つの要求が混在</text>
<rect x="52" y="196" width="320" height="50" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="68" y="227" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="start">REQ-1  留守中も植物を枯らさない</text>
