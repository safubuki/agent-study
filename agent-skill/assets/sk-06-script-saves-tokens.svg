<text x="136" y="213.5" font-size="15.5" font-weight="700" fill="#1e40af" text-anchor="middle">手順を読む</text>
<text x="136" y="234.5" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">（文章の説明）</text>
<path d="M226 219 L240 219" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M231 224 L240 219 L231 214.1 Z" fill="#2563eb" stroke="none"/>
