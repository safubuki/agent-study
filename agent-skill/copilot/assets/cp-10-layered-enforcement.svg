<text x="46" y="543.5" font-size="17.5" font-weight="700" fill="#334155" text-anchor="start">なぜ「下は厳しくするだけ」になるのか</text>
<text x="46" y="586" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">ポリシーの形は scope・protect・denyExtensions だけで、「許可」を書くキーが無い。L2・L3 がどんな JSON を足しても、L1 の禁止は消えない。</text>
<text x="46" y="611" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">L3 の担当者は自分の係の禁止（署名済み・Excel）を自分で足せるが、L1 の「社外秘」を外すには L1 の CODEOWNERS（全社の管理者）のレビューが要る。</text>
<rect x="28" y="676" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="704" font-size="16" font-weight="400" fill="#475569" text-anchor="start">スクリプトは copilot/samples/03・04 の .github/hooks/scripts/layered-guard.js（両事例で同じ）。Claude Code の入力形にも対応。</text>
<text x="44" y="731" font-size="16" font-weight="400" fill="#475569" text-anchor="start">フックは「書き込みの瞬間」の関所。PR では同じポリシーを CI で確かめる、という二重の守りにするとより確実（cp-05）。</text>
