<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 205" role="img" aria-label="MCPのイラスト：AIアプリと本物のデータや計算道具をつなぐ共通コンセント">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <marker id="arr4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr4g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="360" height="205" rx="18" fill="url(#bg4)"/>

  <!-- AIアプリ -->
  <rect x="18" y="46" width="90" height="80" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.4"/>
  <text x="63" y="72" text-anchor="middle" font-size="20" font-family="sans-serif">🤖</text>
  <text x="63" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0c4a6e" font-family="BIZ UDPGothic, sans-serif">AI アプリ</text>
  <text x="63" y="110" text-anchor="middle" font-size="9" fill="#475569" font-family="BIZ UDPGothic, sans-serif">Claude / Copilot</text>

  <!-- 共通コンセント（MCP） -->
  <rect x="142" y="55" width="76" height="62" rx="14" fill="#0284c7"/>
  <text x="180" y="79" text-anchor="middle" font-size="17" font-family="sans-serif">🔌</text>
  <text x="180" y="97" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">MCP</text>
  <text x="180" y="110" text-anchor="middle" font-size="8.5" fill="#e0f2fe" font-family="BIZ UDPGothic, sans-serif">共通コンセント</text>

  <!-- 往復矢印 -->
  <path d="M 110 74 L 138 74" fill="none" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr4)"/>
  <path d="M 138 98 L 110 98" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arr4g)"/>

  <!-- 右側接続線（上部・中央・下部にゆったり配置） -->
  <path d="M 220 74 L 246 38" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr4)"/>
  <path d="M 220 86 L 246 86" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr4)"/>
  <path d="M 220 98 L 246 134" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- 外部道具3種（下端 y=152 まで） -->
  <rect x="252" y="18" width="90" height="36" rx="10" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <text x="297" y="40" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e" font-family="BIZ UDPGothic, sans-serif">🗄️ 社内DB</text>

  <rect x="252" y="68" width="90" height="36" rx="10" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <text x="297" y="90" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e" font-family="BIZ UDPGothic, sans-serif">🧮 原価計算</text>

  <rect x="252" y="118" width="90" height="36" rx="10" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <text x="297" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e" font-family="BIZ UDPGothic, sans-serif">🔎 厳密検索</text>

  <!-- 下部キャプション（y=188、上の箱から 34px の十分な余白を確保） -->
  <text x="180" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1" font-family="BIZ UDPGothic, sans-serif">暗算や推測ではなく、本物の道具を呼び出す</text>
</svg>
