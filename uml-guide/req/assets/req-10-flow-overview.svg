<text x="44" y="741" font-size="16" font-weight="400" fill="#475569" text-anchor="start">要望＝顧客の言葉、要求＝利用者が求める成果、要件＝本機が守る条件、仕様・設計＝作り方（定義は 00 章）。</text>
