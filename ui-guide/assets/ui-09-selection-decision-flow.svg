<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 448" role="img" aria-label="仕事の事実だけでYesとNoに答え、別画面の要否と最適なAI UIパターンを導く決定木フローチャート">
  <defs>
    <marker id="yArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="nArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="860" height="448" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="32" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">「仕事の事実」を はい / いいえ で答えるだけ！別画面の要否＆AI UI 決定木</text>

  <!-- Q1：別作業のちょい足し補助か、AI作業自体が目的か -->
  <rect x="24" y="50" width="340" height="50" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="38" y="69" font-size="10" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">Q1. 本業は別作業で、途中のちょい足し補助だけ？</text>
  <text x="38" y="86" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">（はい→別画面にしない ／ いいえ→専用画面を作る）</text>

  <line x1="364" y1="75" x2="474" y2="75" stroke="#059669" stroke-width="2.2" marker-end="url(#yArr)"/>
  <rect x="392" y="63" width="54" height="20" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="419" y="77" text-anchor="middle" font-size="9.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">はい</text>

  <rect x="480" y="48" width="356" height="56" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="494" y="66" font-size="9.5" font-weight="800" fill="#115e59" font-family="BIZ UDPGothic, sans-serif">【別画面なし】Q1-A. 9割以上当てられる単純な補助？</text>
  <text x="494" y="82" font-size="9.5" font-weight="800" fill="#0f766e" font-family="BIZ UDPGothic, sans-serif">・はい → ⑤ Ambient / Invisible ML（OFF切替必須）</text>
  <text x="494" y="97" font-size="9.5" font-weight="800" fill="#0284c7" font-family="BIZ UDPGothic, sans-serif">・いいえ → ③ Inline / Contextual（選択箇所で補助）</text>

  <!-- Q1 -> Q2 -->
  <line x1="194" y1="100" x2="194" y2="124" stroke="#64748b" stroke-width="2" marker-end="url(#nArr)"/>
  <rect x="202" y="103" width="144" height="17" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="274" y="115" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e40af" font-family="BIZ UDPGothic, sans-serif">いいえ（→専用画面へ）</text>

  <!-- Q2：分類・条件項目を先に選ぶ必要ありか -->
  <rect x="24" y="128" width="340" height="46" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="38" y="147" font-size="10" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">Q2. 頼む前に「分類・対象・条件」を選ぶ必要あり？</text>
  <text x="38" y="164" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">（毎回だいたい同じ分類や条件を選んでから伝える）</text>

  <line x1="364" y1="151" x2="474" y2="151" stroke="#059669" stroke-width="2.2" marker-end="url(#yArr)"/>
  <rect x="392" y="139" width="54" height="20" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="419" y="153" text-anchor="middle" font-size="9.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">はい</text>

  <rect x="480" y="128" width="356" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="494" y="147" font-size="10.5" font-weight="800" fill="#5b21b6" font-family="BIZ UDPGothic, sans-serif">④ Tuners＋Hybrid（選択UI＋一言の専用画面）</text>
  <text x="494" y="164" font-size="9.5" fill="#4c1d95" font-family="BIZ UDPGothic, sans-serif">選択UIで条件を固定＋自由な一言（右にCanvas併用◎）</text>

  <!-- Q2 -> Q3 -->
  <line x1="194" y1="174" x2="194" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#nArr)"/>
  <rect x="202" y="178" width="52" height="18" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="228" y="190" text-anchor="middle" font-size="9" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">いいえ</text>

  <!-- Q3：複数工程を続けて自動で進めるか -->
  <rect x="24" y="204" width="340" height="46" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="38" y="223" font-size="10" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">Q3. 1回の依頼で「調べる→作る→送信」まで連続？</text>
  <text x="38" y="240" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">（人が付きっきりにならず複数工程を続けて進める）</text>

  <line x1="364" y1="227" x2="474" y2="227" stroke="#059669" stroke-width="2.2" marker-end="url(#yArr)"/>
  <rect x="392" y="215" width="54" height="20" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="419" y="229" text-anchor="middle" font-size="9.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">はい</text>

  <rect x="480" y="204" width="356" height="46" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="494" y="223" font-size="10.5" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">⑦ Agentic Workspace（計画＆承認コンソール）</text>
  <text x="494" y="240" font-size="9.5" fill="#78350f" font-family="BIZ UDPGothic, sans-serif">左に計画タイムライン＋危ない操作前の人間承認ゲート</text>

  <!-- Q3 -> Q4 -->
  <line x1="194" y1="250" x2="194" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#nArr)"/>
  <rect x="202" y="254" width="52" height="18" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="228" y="266" text-anchor="middle" font-size="9" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">いいえ</text>

  <!-- Q4：1つの完成物を何度も手直しするか -->
  <rect x="24" y="280" width="340" height="46" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="38" y="299" font-size="10" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">Q4. 1つの完成物を何度も手直しして仕上げる？</text>
  <text x="38" y="316" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">（文書・POP・設計書・コードなどを少しずつ磨く）</text>

  <line x1="364" y1="303" x2="474" y2="303" stroke="#059669" stroke-width="2.2" marker-end="url(#yArr)"/>
  <rect x="392" y="291" width="54" height="20" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="419" y="305" text-anchor="middle" font-size="9.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">はい</text>

  <rect x="480" y="280" width="356" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="494" y="299" font-size="10.5" font-weight="800" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">② Canvas / Artifact（左チャット＋右成果物）</text>
  <text x="494" y="316" font-size="9.5" fill="#047857" font-family="BIZ UDPGothic, sans-serif">最新版を右に固定＋↩ Undo＋✏️ 直接編集で仕上げる</text>

  <!-- Q4 -> Q5 -->
  <line x1="194" y1="326" x2="194" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#nArr)"/>
  <rect x="202" y="329" width="52" height="17" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="228" y="341" text-anchor="middle" font-size="9" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">いいえ</text>

  <!-- Q5：数値比較や選択手続きが多いか -->
  <rect x="24" y="354" width="340" height="46" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="38" y="373" font-size="10" font-weight="800" fill="#0f172a" font-family="BIZ UDPGothic, sans-serif">Q5. 数値比較や予約選択など文章だけでは大変？</text>
  <text x="38" y="390" font-size="9" fill="#64748b" font-family="BIZ UDPGothic, sans-serif">（見比べや日時選択が多く、会話だけだと手間がかかる）</text>

  <line x1="364" y1="377" x2="474" y2="377" stroke="#059669" stroke-width="2.2" marker-end="url(#yArr)"/>
  <rect x="382" y="365" width="76" height="20" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="420" y="379" text-anchor="middle" font-size="9" font-weight="800" fill="#3730a3" font-family="BIZ UDPGothic, sans-serif">はい / いいえ</text>

  <rect x="480" y="350" width="356" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="494" y="371" font-size="10" font-weight="800" fill="#3730a3" font-family="BIZ UDPGothic, sans-serif">・はい → ⑥ Generative UI（動的UI生成＋チャット）</text>
  <text x="494" y="390" font-size="10" font-weight="800" fill="#1e40af" font-family="BIZ UDPGothic, sans-serif">・いいえ → ① Chat（会話型＋お題チップ必須）</text>

  <!-- 最下部共通チェック -->
  <rect x="24" y="414" width="812" height="24" rx="12" fill="#0f766e"/>
  <text x="430" y="430" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">🛡️ 仕上げチェック：間違えると困る処理があるなら「承認ゲート」を足す ／ 不慣れな人が多いなら「お題チップ・16px UD文字」を徹底</text>
</svg>
