<text x="646" y="588" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">通知部・電池を「部品（part）」として持つ（◆ の線）。</text>
<text x="646" y="610" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">ハードも含めた全体はブロック、ソフトの中身はクラスで描く。</text>
<rect x="28" y="706" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="734" font-size="16" font-weight="400" fill="#475569" text-anchor="start">名詞をすべてクラスにするのではなく、責任（何を知り、何をするか）を持つものだけをクラスにし、値は属性にする。</text>
<text x="44" y="761" font-size="16" font-weight="400" fill="#475569" text-anchor="start">矢印（開いた矢じり）は「どちらからどちらを呼べるか」（誘導可能性）、数字の 1 は相手の数（多重度）を表す。</text>
