<title id="title">見えないときの対処：設定 → 認証 → 動作確認</title><desc id="desc">上から下へ進める。②は設定の届け方、③は認証方式の選択。teamDocs は② B → ③ 固定トークンへ。</desc><defs>
<marker id="arrow-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
<marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
<marker id="arrow-harness" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker>
<marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker>
<marker id="arrow-review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker>
<marker id="arrow-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0e7490"/></marker>
<marker id="arrow-process" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="arrow-sdk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="1458" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">見えないときの対処：設定 → 認証 → 動作確認</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">上から下へ進める。②は設定の届け方、③は認証方式の選択。teamDocs は② B → ③ 固定トークンへ。</text>
<rect x="44" y="124" width="1112" height="128" rx="12" fill="#f8fafc" stroke="#64748b"/>
<circle cx="78" cy="154" r="16" fill="#64748b"/>
<text x="78" y="160" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="104" y="161" font-size="21" font-weight="700" fill="#64748b" text-anchor="start">対象と旧設定を確認する</text>
<text x="66" y="196" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">Session Target＝Copilot、作業フォルダ、実行先（手元 PC / リモート / コンテナ）を確認する。</text>
<text x="66" y="224" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">Chat: Open Customizations を開き、変更前に元の MCP 設定ファイルを保管しておく。</text>
<line x1="600" y1="252" x2="600" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-process)"/>
<rect x="44" y="290" width="1112" height="60" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<circle cx="80" cy="320" r="18" fill="#2563eb"/>
<text x="80" y="326" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="112" y="328" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">まず、定義を Copilot に届ける経路を選ぶ</text>
<path d="M600 350 V374" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M600 374 H312 V404" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<path d="M600 374 H888 V404" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="44" y="404" width="536" height="188" rx="12" fill="#eff6ff" stroke="#2563eb"/>
<text x="66" y="441" font-size="20.5" font-weight="700" fill="#2563eb" text-anchor="start">A　転送条件を満たす場合</text>
<text x="66" y="476" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">.vscode/mcp.json は元の場所に残す。</text>
<text x="66" y="504" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">エディタが定義を Copilot に自動転送する。</text>
<text x="66" y="532" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">※ ${input:...} やコマンド変数付きは対象外。</text>
<rect x="620" y="404" width="536" height="188" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="642" y="441" font-size="20.5" font-weight="700" fill="#059669" text-anchor="start">B　ネイティブ設定へ移行（teamDocs 例）</text>
<text x="642" y="476" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">入力変数付き定義はこの経路で直す。</text>
<text x="642" y="504" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">.mcp.json / mcpServers 形式へ書き換える。</text>
<text x="642" y="532" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">Migrations の手動確認項目（password 入力等）を解消。</text>
<path d="M312 592 V622 H600" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M888 592 V622 H600" fill="none" stroke="#059669" stroke-width="2"/>
<line x1="600" y1="622" x2="600" y2="654" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="44" y="654" width="1112" height="60" rx="12" fill="#ecfdf5" stroke="#059669"/>
<circle cx="80" cy="684" r="18" fill="#059669"/>
<text x="80" y="690" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="112" y="692" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">次に、サーバーが要求する認証方法を選ぶ</text>
<path d="M600 714 V738" fill="none" stroke="#059669" stroke-width="2"/>
<path d="M600 738 H312 V768" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<path d="M600 738 H888 V768" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-harness)"/>
<rect x="44" y="768" width="536" height="168" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="66" y="805" font-size="20.5" font-weight="700" fill="#059669" text-anchor="start">OAuth 対応のサーバー</text>
<text x="66" y="840" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">Copilot 側の対応する認証操作を行う。</text>
<text x="66" y="868" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">例：ブラウザーでサインインして許可する。</text>
<text x="66" y="896" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">旧 API キーの転送とは別の新しい認証フロー。</text>
<rect x="620" y="768" width="536" height="168" rx="12" fill="#ecfdf5" stroke="#059669"/>
<text x="642" y="805" font-size="20.5" font-weight="700" fill="#059669" text-anchor="start">固定トークンを使うサーバー</text>
<text x="642" y="840" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">環境変数を使える場合の対処例：</text>
<text x="642" y="868" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">設定には ${DOCS_API_KEY} の参照だけを書く。</text>
<text x="642" y="896" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">実行先へキーを注入し Agent Host を再起動。</text>
<path d="M312 936 V966 H888 V936" fill="none" stroke="#059669" stroke-width="2"/>
<line x1="600" y1="966" x2="600" y2="998" stroke="#0e7490" stroke-width="2" marker-end="url(#arrow-tool)"/>
<rect x="44" y="998" width="1112" height="162" rx="12" fill="#ecfeff" stroke="#0e7490"/>
<circle cx="78" cy="1028" r="16" fill="#0e7490"/>
<text x="78" y="1034" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="104" y="1035" font-size="21" font-weight="700" fill="#0e7490" text-anchor="start">新しい Copilot セッションで、3段階を確認する</text>
<text x="66" y="1070" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">発見：Customizations に対象のサーバーが表示される。</text>
<text x="66" y="1098" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">接続・認証：サーバーへ接続でき、認証エラーが出ない。</text>
<text x="66" y="1126" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">実行：検索ツールを呼び、期待する文書が結果として返る。</text>
<line x1="600" y1="1160" x2="600" y2="1200" stroke="#0e7490" stroke-width="2" marker-end="url(#arrow-tool)"/>
<rect x="44" y="1200" width="1112" height="128" rx="12" fill="#f8fafc" stroke="#64748b"/>
<circle cx="78" cy="1230" r="16" fill="#64748b"/>
<text x="78" y="1236" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="104" y="1237" font-size="21" font-weight="700" fill="#64748b" text-anchor="start">動いたことを確認してから、旧設定の重複を整理する</text>
<text x="66" y="1272" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">一覧への表示だけで完了とせず、失敗したら該当段階の設定・認証・ツール定義を見直す。</text>
<text x="66" y="1300" font-size="17.5" font-weight="400" fill="#334155" text-anchor="start">自動 Migrate は変換済み旧エントリを削除する場合があるため、保管した原本も確認する。</text>
<rect x="28" y="1358" width="1144" height="82" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="1386" font-size="16" font-weight="400" fill="#475569" text-anchor="start">認証が不要なサーバーは③を省略。固定トークンが必要で環境変数も使えない場合は、本文の制約を確認する。</text>
<text x="44" y="1413" font-size="16" font-weight="400" fill="#475569" text-anchor="start">設定ファイルのコピーだけでは inputs は使えない。環境変数の反映順序と具体例は、次の図で確認する。</text>
</svg>
