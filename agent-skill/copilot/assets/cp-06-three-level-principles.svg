<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">階層を組む 5 つの原則（GitHub Copilot）</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">範囲はフォルダで表し、上の階層が「変えてよい点」を決め、下の階層は足す・狭めるだけ。強制は 1 つのフックが全階層を読む。</text>
