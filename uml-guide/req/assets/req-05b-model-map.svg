<path d="M819 740 L819 658 L660 658 L660 577" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5"/>
<path d="M666.6 589 L660 577 L653.4 589" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
