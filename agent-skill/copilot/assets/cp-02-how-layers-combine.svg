<text x="334" y="233" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="end">勝つ</text>
<rect x="52" y="248" width="290" height="28" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
<text x="64" y="267" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">パス別 *.instructions.md</text>
<rect x="52" y="282" width="290" height="28" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.3"/>
<text x="64" y="301" font-size="13" font-weight="700" fill="#3730a3" text-anchor="start">copilot-instructions.md</text>
<rect x="52" y="316" width="290" height="28" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.3"/>
<text x="64" y="335" font-size="13" font-weight="700" fill="#3730a3" text-anchor="start">AGENTS.md など</text>
<rect x="52" y="350" width="290" height="28" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.3"/>
<text x="64" y="369" font-size="13" font-weight="700" fill="#3730a3" text-anchor="start">組織の指示</text>
<text x="334" y="369" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="end">負ける</text>
<text x="368" y="226" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">VS Code・CLI は</text>
<text x="368" y="252" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">優先順位を決めず</text>
<text x="368" y="278" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">全部を結合する</text>
<text x="368" y="304" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start"></text>
<text x="368" y="330" font-size="13.5" font-weight="700" fill="#9f1239" text-anchor="start">→ 矛盾を書かない</text>
<text x="368" y="356" font-size="13.5" font-weight="700" fill="#9f1239" text-anchor="start">（公式の勧め）</text>
