<text x="858" y="412" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">ターミナルで copilot コマンドを実行</text>
<text x="858" y="438" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">対話（/agent）や --agent で起動</text>
<text x="858" y="464" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="start">委任：task（/fleet で並列実行）</text>
<text x="858" y="490" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">モデル名は CLI 用 ID で指定</text>
