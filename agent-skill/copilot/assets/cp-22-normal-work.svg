<text x="600" y="161" font-size="15.5" font-weight="700" fill="#1e40af" text-anchor="middle">依頼：「電源ユニットの回路図の C1 は、今の入力電圧で大丈夫？　電源係の手順で確認して」</text>
<rect x="28" y="220" width="270" height="196" rx="12" fill="#f7fee7" stroke="#4d7c0f" stroke-width="1.6"/>
