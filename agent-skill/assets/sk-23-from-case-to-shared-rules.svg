<title id="title">案件を重ねて、部品・ドメイン・係の知識を育てる</title><desc id="desc">電源ユニットの例。案件で見つけた知識も、すでに仕様書や設計基準にある知識も、次に使う範囲で共有する。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="721" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">案件を重ねて、部品・ドメイン・係の知識を育てる</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">電源ユニットの例。案件で見つけた知識も、すでに仕様書や設計基準にある知識も、次に使う範囲で共有する。</text>
<rect x="28" y="120" width="1144" height="72" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.7"/>
<text x="600" y="148" font-size="20" font-weight="700" fill="#3730a3" text-anchor="middle">L1　この製品の全案件で守る約束を先に決める</text>
<text x="600" y="174" font-size="16" font-weight="400" fill="#334155" text-anchor="middle">安全停止の共通実装を保護し、変更には試験を付ける。</text>
<text x="28" y="241" font-size="21" font-weight="700" fill="#334155" text-anchor="start">知識の出どころ</text>
<text x="550" y="241" font-size="21" font-weight="700" fill="#334155" text-anchor="start">次に使う範囲に合わせて共有する</text>
<rect x="28" y="268" width="433" height="180" rx="12" fill="#fff" stroke="none"/>
<path d="M28 314 V280 Q28 268 40 268 H449 Q461 268 461 280 V314 Z" fill="#ecfeff" stroke="none"/>
<path d="M28 314 H461" fill="none" stroke="#a5f3fc" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="268" width="433" height="180" rx="12" fill="none" stroke="#0e7490" stroke-width="1.6"/>
<text x="46" y="297.5" font-size="17.5" font-weight="700" fill="#155e75" text-anchor="start">L4　担当者が案件ごとに記録する</text>
<text x="46" y="349" font-size="17" font-weight="400" fill="#334155" text-anchor="start">C1 を選び直した理由と計算を残す。</text>
<text x="46" y="381" font-size="17" font-weight="400" fill="#334155" text-anchor="start">別の案件でも使えた確認手順を共有する。</text>
<text x="46" y="413" font-size="17" font-weight="700" fill="#334155" text-anchor="start">ACME 社の 48 V 要求と期限は案件に残す。</text>
<rect x="28" y="480" width="433" height="138" rx="12" fill="#fff" stroke="none"/>
<path d="M28 526 V492 Q28 480 40 480 H449 Q461 480 461 492 V526 Z" fill="#f8fafc" stroke="none"/>
<path d="M28 526 H461" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="28" y="480" width="433" height="138" rx="12" fill="none" stroke="#475569" stroke-width="1.6"/>
<text x="46" y="509.5" font-size="17.5" font-weight="700" fill="#334155" text-anchor="start">既存の仕様書・設計基準がある場合</text>
<text x="46" y="558" font-size="17" font-weight="400" fill="#334155" text-anchor="start">対象と根拠が分かる値や手順は、</text>
<text x="46" y="587" font-size="17" font-weight="400" fill="#334155" text-anchor="start">L4 を経ずに直接 L2・L3 へ。</text>
<path d="M461 358 H502 M461 549 H502 M502 320 V566" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M502 320 L542 320" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M530 326.6 L542 320 L530 313.4 Z" fill="#64748b" stroke="none"/>
<rect x="550" y="268" width="622" height="104" rx="12" fill="#fff" stroke="none"/>
<path d="M550 314 V280 Q550 268 562 268 H1160 Q1172 268 1172 280 V314 Z" fill="#fffbeb" stroke="none"/>
<path d="M550 314 H1172" fill="none" stroke="#fde68a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="550" y="268" width="622" height="104" rx="12" fill="none" stroke="#b45309" stroke-width="1.6"/>
<text x="568" y="297.5" font-size="19" font-weight="700" fill="#92400e" text-anchor="start">同じ部品の別案件で使う → L2 部品</text>
<text x="568" y="348" font-size="17" font-weight="400" fill="#334155" text-anchor="start">電源の通常入力 24 V を部品仕様にまとめる。</text>
<path d="M502 443 L542 443" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M530 449.6 L542 443 L530 436.4 Z" fill="#64748b" stroke="none"/>
<rect x="550" y="391" width="622" height="104" rx="12" fill="#fff" stroke="none"/>
<path d="M550 437 V403 Q550 391 562 391 H1160 Q1172 391 1172 403 V437 Z" fill="#fff7ed" stroke="none"/>
<path d="M550 437 H1172" fill="none" stroke="#fed7aa" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="550" y="391" width="622" height="104" rx="12" fill="none" stroke="#c2410c" stroke-width="1.6"/>
<text x="568" y="420.5" font-size="19" font-weight="700" fill="#9a3412" text-anchor="start">別の部品の回路図でも使う → L2 ドメイン</text>
<text x="568" y="471" font-size="17" font-weight="400" fill="#334155" text-anchor="start">定格・使用値・率を並べる表を電気設計で共有する。</text>
<path d="M502 566 L542 566" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M530 572.6 L542 566 L530 559.4 Z" fill="#64748b" stroke="none"/>
<rect x="550" y="514" width="622" height="104" rx="12" fill="#fff" stroke="none"/>
<path d="M550 560 V526 Q550 514 562 514 H1160 Q1172 514 1172 526 V560 Z" fill="#f5f3ff" stroke="none"/>
<path d="M550 560 H1172" fill="none" stroke="#ddd6fe" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="550" y="514" width="622" height="104" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
<text x="568" y="543.5" font-size="19" font-weight="700" fill="#5b21b6" text-anchor="start">電源の回路で繰り返す → L3 電源係</text>
<text x="568" y="594" font-size="17" font-weight="400" fill="#334155" text-anchor="start">使用値が定格の 70% 以下かを選定時に確かめる。</text>
<rect x="28" y="648" width="1144" height="55" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="676" font-size="16" font-weight="400" fill="#475569" text-anchor="start">次の案件で共有した手順を使い、新たな指摘を記録する。繰り返す確認はスキルに、機械で判定できる禁止条件はガードにする。</text>
</svg>
