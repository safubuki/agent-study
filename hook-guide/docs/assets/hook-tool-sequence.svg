<text x="502" y="1028" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">許可・拒否を返す</text>
<text x="502" y="1055" font-size="17" font-weight="500" fill="#059669" text-anchor="middle">禁止対象なら deny</text>
