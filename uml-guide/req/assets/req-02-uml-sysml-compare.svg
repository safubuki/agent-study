<text x="472" y="153.5" font-size="17.5" font-weight="700" fill="#9a3412" text-anchor="middle">UML（統一モデリング言語）</text>
<rect x="716" y="118" width="456" height="58" rx="12" fill="#fff" stroke="none"/>
<path d="M716 176 V130 Q716 118 728 118 H1160 Q1172 118 1172 130 V176 Z" fill="#ecfeff" stroke="none"/>
