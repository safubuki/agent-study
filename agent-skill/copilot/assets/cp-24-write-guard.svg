<text x="44" y="752" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ポリシーには「許可」を書く欄が無い。だから下の階層（L2〜L4）は守る場所を足せるが、上の階層（L1）の守りは外せない。</text>
<text x="44" y="779" font-size="16" font-weight="400" fill="#475569" text-anchor="start">このフックは「書き込みの瞬間」の関所。読むのは自由なので、AI は図面や要求書を参照して新しい版を作れる。</text>
