<rect x="1" y="1" width="1198" height="952" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">シーケンスの緑の列「Copilot ハーネス」は、何をしているか</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">先に担当範囲を見る。AI モデルが判断し、ハーネスが必要な情報・道具・承認・会話の状態をつなぐ。</text>
<rect x="28" y="142" width="260" height="120" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="158" y="174" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">ユーザーと VS Code</text>
<text x="158" y="206" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">依頼を送る</text>
<text x="158" y="233" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">返答・進捗を確認する</text>
<rect x="348" y="124" width="540" height="422" rx="14" fill="#ecfdf5" stroke="#059669"/>
<text x="618" y="164" font-size="24" font-weight="700" fill="#059669" text-anchor="middle">Copilot ハーネスの担当</text>
<rect x="372" y="224" width="232" height="128" rx="9" fill="#fff" stroke="#a7f3d0"/>
<text x="488" y="253" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">① 材料をそろえる</text>
<text x="488" y="288" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">指示・会話・ファイル</text>
<text x="488" y="316" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">使える道具の説明</text>
<rect x="632" y="224" width="232" height="128" rx="9" fill="#fff" stroke="#a7f3d0"/>
<text x="748" y="253" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">② AI に処理を頼む</text>
<text x="748" y="288" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">文脈をモデルへ渡す</text>
<text x="748" y="316" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">返答・操作要求を受ける</text>
<rect x="372" y="382" width="232" height="128" rx="9" fill="#fff" stroke="#a7f3d0"/>
<text x="488" y="411" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">③ 実行と承認を管理</text>
<text x="488" y="446" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">操作を実行してよいか確認</text>
<text x="488" y="474" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">呼出しを道具へ渡す</text>
<rect x="632" y="382" width="232" height="128" rx="9" fill="#fff" stroke="#a7f3d0"/>
<text x="748" y="411" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">④ 状態を残す</text>
<text x="748" y="446" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">操作の結果を AI に戻す</text>
<text x="748" y="474" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">会話・変更・進捗を保つ</text>
<rect x="948" y="124" width="224" height="164" rx="11" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="1060" y="156" font-size="21" font-weight="700" fill="#7c3aed" text-anchor="middle">生成AIモデル</text>
<text x="1060" y="188" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">AI モデルの役割名</text>
<text x="1060" y="215" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">案・初稿・返答を作る</text>
<text x="1060" y="242" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">道具の利用も提案する</text>
<rect x="948" y="350" width="224" height="164" rx="11" fill="#fffbeb" stroke="#b45309"/>
<text x="1060" y="382" font-size="21" font-weight="700" fill="#b45309" text-anchor="middle">評価AIモデル群</text>
<text x="1060" y="414" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">こちらも AI モデル</text>
<text x="1060" y="441" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">初稿を点検・批評する</text>
<text x="1060" y="468" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Fusion 等で必要時に参加</text>
