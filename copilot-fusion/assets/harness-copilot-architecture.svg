</defs>
<rect x="1" y="1" width="1198" height="916" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">Copilot：セッションの持ち主、接続用の部品、実行の中核を分ける</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Agent Host・Copilot SDK・実行ランタイムは役割が異なる。Copilot ハーネスの実装を、部品ごとに拡大する。</text>
<rect x="28" y="206" width="260" height="150" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="158" y="238" font-size="21" font-weight="700" fill="#2563eb" text-anchor="middle">VS Code の画面</text>
<text x="158" y="270" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">依頼を送り、状態を見る</text>
<text x="158" y="297" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">画面と実行を切り離す</text>
<rect x="344" y="124" width="828" height="632" rx="14" fill="#f0fdf4" stroke="#86efac"/>
<text x="368" y="164" font-size="23" font-weight="700" fill="#059669" text-anchor="start">Copilot ハーネスを動かす側（役割の構成図）</text>
<rect x="372" y="212" width="320" height="190" rx="11" fill="#f8fafc" stroke="#64748b"/>
<text x="532" y="244" font-size="23" font-weight="700" fill="#64748b" text-anchor="middle">Agent Host</text>
<text x="532" y="276" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">専用の実行プロセス</text>
<text x="532" y="303" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">セッションを所有・管理する</text>
<text x="532" y="330" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">画面が変わっても作業を保持</text>
<text x="532" y="357" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">対応ハーネスを受け持つ</text>
<rect x="756" y="212" width="388" height="190" rx="11" fill="#eef2ff" stroke="#6366f1"/>
<text x="950" y="244" font-size="23" font-weight="700" fill="#6366f1" text-anchor="middle">Copilot SDK</text>
<text x="950" y="276" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">実行機能を呼ぶための部品・API</text>
<text x="950" y="303" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">プログラムから依頼や操作を渡す</text>
<text x="950" y="330" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Host や AI モデルそのものではない</text>
<line x1="692" y1="304" x2="756" y2="304" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-process)"/>
<text x="724" y="290" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">利用</text>
<rect x="372" y="508" width="772" height="182" rx="11" fill="#ecfdf5" stroke="#059669"/>
<text x="758" y="540" font-size="23" font-weight="700" fill="#059669" text-anchor="middle">Copilot の実行ランタイム</text>
<text x="758" y="572" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Copilot CLI などと共有する、実際の作業を進める中核</text>
<text x="758" y="599" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">文脈・AI モデル・ツール・承認・会話の進行を扱う</text>
<text x="758" y="626" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">SDK が、この実行機能への呼出し口を提供する</text>
<line x1="950" y1="402" x2="950" y2="508" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-sdk)"/>
<text x="966" y="461" font-size="16" font-weight="400" fill="#6366f1" text-anchor="start">実行機能を呼ぶ</text>
<line x1="516" y1="508" x2="516" y2="402" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-harness)"/>
<text x="504" y="461" font-size="16" font-weight="400" fill="#059669" text-anchor="end">状態・結果</text>
<line x1="288" y1="264" x2="372" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<text x="330" y="250" font-size="14" font-weight="400" fill="#2563eb" text-anchor="middle">依頼</text>
<line x1="372" y1="340" x2="288" y2="340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-process)"/>
<text x="330" y="327" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">状態</text>
<rect x="28" y="510" width="260" height="128" rx="11" fill="#eff6ff" stroke="#2563eb"/>
<text x="158" y="542" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">別の対応画面</text>
<text x="158" y="574" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">Agents window など</text>
<text x="158" y="601" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">同じセッションを表示できる</text>
<path d="M288 574 H322 V378 H372" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-ui)"/>
<rect x="28" y="789" width="1144" height="109" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="44" y="817" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Agent Host は動作中のプログラム、SDK は機能を呼ぶための部品、ランタイムは実行の中核。足し算の一語で扱わない。</text>
<text x="44" y="844" font-size="16" font-weight="400" fill="#475569" text-anchor="start">図は役割の接続を示す。SDK と実行ランタイムが常に1つの OS プロセスに入る、という配置を断定していない。</text>
<text x="44" y="871" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Host が動いている間は窓とは独立して継続できる。エディタが提供する道具には、エディタ接続が引き続き必要。</text>
</svg>
