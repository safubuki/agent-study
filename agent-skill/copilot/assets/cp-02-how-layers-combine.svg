<title id="title">層が重なったとき、どうなるか（GitHub Copilot）</title><desc id="desc">常時の指示は画面ごとに扱いが違い、同名スキルは「プロジェクトが先」。Claude Code の感覚で書くと逆になる所がある。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="856" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">層が重なったとき、どうなるか（GitHub Copilot）</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">常時の指示は画面ごとに扱いが違い、同名スキルは「プロジェクトが先」。Claude Code の感覚で書くと逆になる所がある。</text>
