<text x="590" y="192" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start">L2・L3 の指示は *.instructions.md の applyTo でフォルダを指す</text>
<rect x="572" y="224" width="600" height="84" rx="12" fill="#fff" stroke="none"/>
<path d="M572 264 V236 Q572 224 584 224 H1160 Q1172 224 1172 236 V264 Z" fill="#fffbeb" stroke="none"/>
