<title id="title">エージェントスキルは「手順書つきの道具箱フォルダ」</title><desc id="desc">SKILL.md が目次と手順。資料・スクリプト・型紙は同じフォルダに置き、SKILL.md から「いつ・どれを使うか」を指す。</desc><defs>
</defs>
