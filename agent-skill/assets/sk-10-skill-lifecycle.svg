<text x="44" y="600" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Anthropic 社内の流れ（公式ブログ 2026-06）：試験用フォルダで共有 → 使われ始めたら PR でマーケットプレイスへ。利用はフックで記録。</text>
