<title id="title">3 つの層 × 4 つの仕組み（Claude Code の場合）</title><desc id="desc">ベース（全社・製品で絶対）・部署・個人の層ごとに、「常に知らせる」「必ず止める」「手順を渡す」「配る」の置き場所が決まっている。</desc><defs>
</defs>
