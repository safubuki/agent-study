<title id="title">UML と SysML：何が違い、どう使い分けるか</title><desc id="desc">UML はソフトウェアの設計図、SysML はハードウェアや人も含むシステム全体の設計図。要求図があるのは SysML。</desc><defs>
</defs>
<rect x="1" y="1" width="1198" height="1034" rx="18" fill="#fff" stroke="#e2e8f0"/>
<text x="28" y="48" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">UML と SysML：何が違い、どう使い分けるか</text>
<text x="28" y="82" font-size="16" font-weight="400" fill="#475569" text-anchor="start">UML はソフトウェアの設計図、SysML はハードウェアや人も含むシステム全体の設計図。要求図があるのは SysML。</text>
