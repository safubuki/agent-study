  <text x="539" y="416" text-anchor="middle" font-size="9.5" font-weight="800" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">分析する人：Write</text>

  <!-- ===== 右：分析する人（ここが変わる） ===== -->
  <rect x="680" y="80" width="256" height="370" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="808" y="103" text-anchor="middle" font-size="12.5" font-weight="800" fill="#065f46" font-family="BIZ UDPGothic, sans-serif">🔍 分析する人（開発者）の PC</text>

  <rect x="696" y="118" width="224" height="82" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="708" y="138" font-size="10.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">⑥ スキルを直す</text>
  <text x="708" y="156" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">Gotchas に 1 項目足す／scripts 化</text>
  <text x="708" y="172" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">→ ① に PR → レビュー → マージ</text>
  <text x="708" y="190" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">（skill の版が上がる）</text>
  <line x1="808" y1="218" x2="808" y2="202" stroke="#64748b" stroke-width="2" marker-end="url(#ks11Gray)"/>

  <rect x="696" y="218" width="224" height="72" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="864" y="224" width="48" height="18" rx="9" fill="#f59e0b"/>
  <text x="888" y="237" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff" font-family="BIZ UDPGothic, sans-serif">変更</text>
  <text x="708" y="238" font-size="10.5" font-weight="800" fill="#92400e" font-family="BIZ UDPGothic, sans-serif">🗄️ 集計用 DB で SQL</text>
  <text x="708" y="258" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">手元：DuckDB で runs/ をそのまま</text>
  <text x="708" y="276" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">チーム：共有 DB ＋ ダッシュボード</text>
  <line x1="808" y1="308" x2="808" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#ks11Gray)"/>

  <rect x="696" y="308" width="224" height="72" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="708" y="328" font-size="10.5" font-weight="800" fill="#047857" font-family="BIZ UDPGothic, sans-serif">⑤ runs/ を DB に取り込む</text>
  <text x="708" y="348" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">② を clone／pull して読み込む</text>
  <text x="708" y="366" font-size="9.5" fill="#334155" font-family="BIZ UDPGothic, sans-serif">（定期実行で共有 DB に写してもよい）</text>

  <rect x="696" y="392" width="224" height="46" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="808" y="411" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">※ 利用者のアプリと送り方は</text>
  <text x="808" y="428" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569" font-family="BIZ UDPGothic, sans-serif">何も変わらない</text>

  <!-- ===== 列をまたぐ矢印 ===== -->
  <line x1="354" y1="150" x2="268" y2="150" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ks11Blue)"/>
  <text x="310" y="142" text-anchor="middle" font-size="10" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">① clone</text>
  <text x="310" y="168" text-anchor="middle" font-size="10" font-weight="800" fill="#1d4ed8" font-family="BIZ UDPGothic, sans-serif">⑦ pull</text>
  <line x1="264" y1="408" x2="352" y2="408" stroke="#9d174d" stroke-width="2.4" marker-end="url(#ks11Rose)"/>
  <text x="310" y="400" text-anchor="middle" font-size="10" font-weight="800" fill="#9d174d" font-family="BIZ UDPGothic, sans-serif">④ API で</text>
  <text x="310" y="426" text-anchor="middle" font-size="10" font-weight="800" fill="#9d174d" font-family="BIZ UDPGothic, sans-serif">直接書込</text>
  <line x1="604" y1="344" x2="692" y2="344" stroke="#9d174d" stroke-width="2.4" marker-end="url(#ks11Rose)"/>
  <text x="648" y="336" text-anchor="middle" font-size="10" font-weight="800" fill="#9d174d" font-family="BIZ UDPGothic, sans-serif">⑤ 取り込み</text>
